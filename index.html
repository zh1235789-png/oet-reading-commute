slexia","note":"原因か結果か判別できない（C）。Aの『真の原因の発見は不可能』は言い過ぎ（研究チームは原因を見つけたと考えている）。","doubt":null,"alt":[],"voc":[["consequence","結果・帰結"],["chicken-and-egg question","鶏が先か卵が先かの問題"],["tricky","やっかいな"],["alteration","変化"],["impossibility","不可能であること"],["consistently","一貫して"]],"past":null},{"n":18,"t":1,"p":2,"q":"Why has the study been called \"groundbreaking\"?","opts":["Because previously scientists hadn't been able to understand why brains with dyslexia are different.","Because so far scientists couldn't understand why people with dyslexia have other brain deficiencies.","Because it reveals the brain structure of people without dyslexia.","Because it makes progress in understanding the basis of dyslexia in the human brain."],"key":"D","ev":"This study makes an important step in that direction","note":"脳基盤の理解が前進した（D）。R2で誤答（A）：Aは『これまで分からなかった』という背景で、groundbreaking の理由ではない。","doubt":null,"alt":[],"voc":[["groundbreaking","画期的な"],["frankly","率直に言って"],["struggle with","〜に苦戦する"],["brain bases","脳における基盤"],["outward appearance","外見・見かけ"],["make progress","前進する"]],"past":"A"},{"n":19,"t":1,"p":5,"q":"What is the main problem with people with dyslexia according to Perrachione?","opts":["There's no neural adaptation","Their brains take much longer to adapt.","Adaptation occurs instantly.","There is no sensory adaptation."],"key":"B","ev":"In people with dyslexia, however, that adaptation seems to be hindered.","note":"適応が妨げられる＝時間がかかる（B）。R2で誤答（A）：『適応がない』は言い過ぎ（本文は much less adaptation）。","doubt":null,"alt":[],"voc":[["adapt","順応する"],["hindered","妨げられた"],["sensory input","感覚入力"],["neural","神経の"],["instantly","瞬時に"]],"past":"A"},{"n":20,"t":1,"p":6,"q":"What does the experiment in the 7th paragraph reveal?","opts":["That people with dyslexia experience difficulties when listening to multiple speakers.","That it was difficult for both people with and without dyslexia to adapt to multiple speakers.","That people with dyslexia have more difficulty processing listening than written words.","That the brains of people with dyslexia have difficulty adapting to both listening and reading."],"key":"D","ev":"The same pattern was seen when study participants viewed written words.","note":"聞く（単一話者でも適応が弱い）＋読む（同じパターン）の両方で適応困難（D）。","doubt":null,"alt":[],"voc":[["functional MRI","機能的MRI"],["capture","捉える・記録する"],["a series of","一連の"],["in contrast","対照的に"],["multiple speakers","複数の話し手"]],"past":null},{"n":21,"t":1,"p":8,"q":"When is dyslexia most apparent?","opts":["During the process of reading.","In face recognition.","In face and object recognition.","When reading is used as a tool or technology."],"key":"A","ev":"The reduced brain adaptation may only \"show up\" when it comes to reading","note":"適応の弱さが表に出るのは読むときだけ（A）。R2で誤答（C）：顔・物体の認識に明らかな問題はない（does not involve apparent problems）。","doubt":null,"alt":[],"voc":[["speculate","推測する"],["show up","表に現れる"],["when it comes to","〜のこととなると"],["dedicated area","専用の領域"],["orchestration","複数要素の統合・協調"],["apparent","明らかな・目立つ"]],"past":"C"},{"n":22,"t":1,"p":8,"q":"Which of the following is not true about reading?","opts":["It is a very complex skill.","It can be located in one center of the brain.","It requires communication among different areas in the brain.","It is an amazing achievement."],"key":"B","ev":"The brain has no dedicated \"reading\" area.","note":"NOT true。脳に読字専用領域はない→B『1か所に局在』は誤り。","doubt":null,"alt":[],"voc":[["accomplishment","成し遂げたこと・業績"],["astonishing feat","驚くべき偉業"],["take for granted","当たり前だと思う"],["be located in","〜に位置している"],["achievement","達成・功績"]],"past":null}]},{"id":"03","texts":[{"title":"","paras":["We see such studies in magazines, in the newspapers, and on websites all the time, that pets can help ease things like depression or anxiety. They also can aid in your quest for love. Guys who are dog lovers have long known that a trip to the dog park can get you a date, and one study backs this up. Another finds that positive interactions with your dog can help you make more friends and improve on the friendships you have.","Pets are even thought to help the sick and the elderly—particularly those with Alzheimer's, and patients whose prognosis is grim. The way we love our pets, like one of the family, makes us feel deep in our gut that such findings must be true. Yet, a new study finds that there is actually little evidence to support these claims.","Animal-based therapy isn't new. Sigmund Freud often had a dog present in sessions with his patients as a calming presence. Social workers today use animals as an icebreaker, particularly when working with adolescence or children. These latest findings are particularly important nowadays however, as more and more hospitals, nursing homes, universities, prisons, and other such facilities, are using animal-assisted therapy as a way to calm residents and improve their condition. According to a review published in the Journal of Clinical Psychology such initiatives may have been enacted prematurely. Though it makes sense that contact with pets would have a positive impact, the truth is, from strictly a scientific standpoint, we don't really know for sure.","Human-animal interaction has been a subject of research for decades. Even so, the evidence is a wash, according to psychologist Molly Crossman, who conducted the review. Some studies find that interacting with pets has benefits, others do not. Another problem is the quality of such studies. For instance, those that look at animal-assisted therapy have only examined the short-term impact. Also, there isn't usually a control group to compare results to in these studies.","So whether the impact is significant is in question and if so, whether or not the benefit is long-term. It is clear that human–animal interaction (HAI) has a small to medium impact in the near-term, but beyond that, we just don't know. This kind of research may be tainted for another reason. In many of these settings, a trainer brings the animal in. But what effect is the trainer having on these outcomes? The positive benefits might derive not from interacting with the animal but its handler.","Owning a pet has also been determined to have health and psychological benefits. And although we can see those who have a dog or a cat at a young age are less likely to develop allergies, with the psychological advantages, since these were observational studies, the results are indeterminable, at least for now.","There are several theoretical reasons why interacting with friendly animals on a regular basis may improve our condition. Animals and humans can share positive emotions, for instance. Say someone is terminally ill and suffering from chronic pain. They take part in animal-assisted therapy. Playing or cuddling with a cute dog or cat would improve their mood. Since mood has been proven to dampen or heighten pain, a better mood would hypothetically improve their condition. Yet, there is such a thing as the placebo effect."]},{"title":"","paras":["Ingesting a nightly Advil or Tylenol is protocol for many. The general body aches, joint inflammation, and, especially, headaches that tag along on a stressful workday seem mitigated with a few hundred milligrams of pain relief. Of course, this only masks what could be a serious underlying condition.","We all have triggers for those sharp (or for some, dull) pains that attack the inside of our skull. Within moments a bottle is popped, two pills washed down in one gulp. The mistake we may be making, however, is confusing the trigger for the cause. The headache would most likely still have occurred, says Christopher Gottschalk. The trigger merely exacerbates the pain while giving your mind a supposed 'reason' to latch onto. \"Most of the things that people have thought of as triggers—stress, weather fronts, diet—when we have studied them, we've come up empty-handed every time. It's not that they cause headaches, but that when you're getting a headache, weather changes and perfumes feel worse\".","As director of Yale Medicine's Headache and Facial Pain Center, Gottschalk has developed another approach: treat every headache as a migraine. This, he says, will offer more of an opportunity at long-term success in treating and even potentially eliminating the problem. This will take some work from a consumer standpoint, so accustomed we are to popping pills. Add to this that the cognitive distance between the freely perused aisles and the pharmacist's counter is not steep. When we can walk into our local pharmacy and pay a few dollars for a hundred pills we tend to think of those drugs as safe and practically benign.","One 2001 study shows that over 30 billion over-the-counter doses of NSAIDs (non-steroidal anti-inflammatory drugs) were purchased in the United States alone that year. Yet the safety of NSAIDs is of ongoing concern. One report states that roughly 110,000 people are injured or die due to acetaminophen (an analgesic in Tylenol, for one) each year. Given that there were 27 billion doses of that specific substance sold in 2009, that equals one complication in every quarter-million doses—not an epidemic, though nothing to gloss over either.","Since migraines are a chronic condition, Gottschalk is taking the long view on headaches. He recommends preventive options such as anti-seizure medications, low doses of tricyclic antidepressants, or higher doses of beta blockers. He's also a fan of nose sprays or injections given the tendency of certain pharmaceuticals to disrupt the digestive process. A common complaint of migraines is nausea, so feeding that intestinal fire means replacing one problem with another.","Looking into the future, Gottschalk is heading into research that helps the immune system address a protein triggered by migraines. The hopes are that an antibody infusion targeting this protein would stop common headaches before they start. Migraines have been shown to be progressively crippling with potential cardiovascular, cerebrovascular, and long-term neurologic effects. Experiencing even intermittent headaches, according to Gottschalk, could be the result of the same process that causes migraines."]}],"B":[{"n":1,"title":"Device recall: Firmware Update to Address Cybersecurity Vulnerabilities Identified in Abbott's (formerly St. Jude Medical's) Implantable Cardiac Pacemakers: FDA Safety Communication for Health professionals.","paras":["The FDA has reviewed information concerning potential cybersecurity vulnerabilities associated with St. Jude Medical's RF-enabled implantable cardiac pacemakers and has confirmed that these vulnerabilities, if exploited, could allow an unauthorized user to access a patient's device using commercially available equipment.","The FDA and Abbott do NOT recommend prophylactic removal and replacement of affected devices. Discuss the risks and benefits of the cybersecurity vulnerabilities and associated firmware update with your patients at the next regularly scheduled visit. As part of this discussion, it is important to consider each patient's circumstances, such as pacemaker dependence, age of the device, and patient preference, and provide them with Abbott's Patient Guide.","For pacing dependent patients, consider performing the cybersecurity firmware update in a facility where temporary pacing and pacemaker generators can be readily provided. Print or digitally store the programmed device settings and the diagnostic data in case of loss during the update. After the update, confirm that the device maintains its functionality, is not in backup mode, and that the programmed parameters have not changed. The firmware update process is described in Abbott's Dear Doctor Letter issued on August 28, 2017."],"q":"What course of action must a healthcare professional take after reading this device recall notice?","opts":["The health professional should contact their patient so they can discuss issues raised in the recall notice","The health professional should discuss the pros and cons resulting from the firmware update at their next routine appointment","The health professional should discuss the possible effects of the firmware update and schedule replacing the device as soon as is convenient."],"key":"B","qja":"この機器リコール通知を読んだ医療者は、どんな対応をとらなければならないか？","ja":"【機器リコール：Abbott（旧St. Jude Medical）植込み型ペースメーカーのサイバーセキュリティ脆弱性に対するファームウェア更新／医療者向けFDA安全性通知】FDAはSt. Jude Medical製の無線対応植込み型ペースメーカーの潜在的なサイバーセキュリティ脆弱性に関する情報を検討し、悪用されれば市販の機器で権限のない者が患者の機器にアクセスできうることを確認した。FDAとAbbottは、該当機器の予防的な抜去・交換は推奨しない。次回の定期受診時に、脆弱性と関連するファームウェア更新のリスクと利益を患者と話し合うこと。その際、ペースメーカー依存度、機器の使用年数、患者の希望など各患者の状況を考慮し、Abbottの患者向けガイドを渡すこと。ペーシング依存の患者では、一時的ペーシングやジェネレーターをすぐ用意できる施設で更新を行うことを検討する。更新中の消失に備え、設定と診断データを印刷または保存する。更新後は機能維持、バックアップモードでないこと、設定値が変わっていないことを確認する。","o":[["通知で挙げられた問題を話し合うため、医療者は患者に連絡すべきである","❌ わざわざ連絡する必要はなく、at the next regularly scheduled visit（次の定期受診）で話し合えばよい。"],["次の定期受診で、ファームウェア更新による利点と欠点を話し合うべきである","✅ Discuss the risks and benefits … at the next regularly scheduled visit の言い換え（pros and cons＝risks and benefits）。"],["更新の影響を話し合い、都合がつき次第できるだけ早く機器交換の予定を組むべきである","❌ do NOT recommend prophylactic removal and replacement（予防的交換は推奨しない）と大文字で否定されている。"]],"exp":"本文中の大文字 NOT は出題者が狙っている箇所。Cはこれと真逆。Aは『すぐに連絡』という緊急性を足した誤答。","pt":"→ 型：対応の『タイミング』（すぐ／次回受診時）を必ず照合。緊急性を上げ下げした選択肢は定番の誤答。","doubt":null,"voc":[["recall","回収・リコール"],["vulnerability","脆弱性"],["exploit","悪用する"],["unauthorized","権限のない"],["prophylactic","予防的な"],["dependence","依存（ペースメーカー依存）"],["readily","すぐに・容易に"],["parameter","設定値・パラメータ"],["pros and cons","利点と欠点"]],"past":null},{"n":2,"title":"Research into incidence of hospital treated Deliberate Self Harm","paras":["The incidence of hospital-treated DSH from institutional data was higher in females than males, both in Australia (148 vs 87 per 100,000) and in New Zealand (86 vs 46 per 100,000).","The incidence of hospital-treated DSH was highest among those aged 15–24 years in both Australia and New Zealand predominantly due to higher rates in adolescents (15–19 years).","However, the peak of highest incidence of hospital-treated DSH in adolescents and young adults in Australia is less marked when stratified by Aboriginal and Torres Strait Islander status in Australia; rates of DSH among Aboriginal and Torres Strait Islander people aged 25–49years (males and females) are higher than for other Australians in the same age group.","In Australia, the incidence of hospital-treated DSH among Aboriginal and Torres Strait Islander people was substantially higher than for the general population (292 vs 117 per 100,000), males (259 vs 87 per 100,000) and females (325 vs 148 per 100,000)"],"q":"According to this research report which group of the Australian population are most likely to be treated in hospital for deliberate self-harm?","opts":["Women aged 15-19 from the Aboriginal and Torres Strait Island population","Women aged 15-24 from the Aboriginal and Torres Strait Island population","Women aged 25-49 from the Aboriginal and Torres Strait Island population."],"key":"C","qja":"この研究報告によれば、意図的自傷で病院治療を受ける可能性が最も高いのは豪州人口のどの群か？","ja":"【病院で治療された意図的自傷（DSH）の発生率に関する研究】施設データによる病院治療DSHの発生率は、豪州（10万人あたり148 vs 87）でもNZ（86 vs 46）でも女性が男性より高かった。発生率は両国とも15〜24歳で最も高く、主に思春期（15〜19歳）の高さによる。しかし豪州では、アボリジニ・トレス海峡諸島民（ATSI）の区分で層別化すると、思春期・若年成人でのピークは目立たなくなる。25〜49歳のATSI（男女）のDSH率は、同年代の他の豪州人より高い。豪州では、ATSIの病院治療DSH発生率は一般人口より大幅に高かった（全体292 vs 117、男性259 vs 87、女性325 vs 148）。","o":[["ATSIの15〜19歳女性","❌ 15〜19歳の高さは一般人口の話。ATSIではこのピークは less marked（目立たない）。"],["ATSIの15〜24歳女性","❌ 同上。15〜24歳が最多なのは一般人口。"],["ATSIの25〜49歳女性","✅ However 以降：ATSIで層別化すると若年ピークは弱まり、25〜49歳の率が他の豪州人より高い。女性は男性より高い（325）。"]],"exp":"However が転換点。一般論（15〜24歳が最多）→ However → ATSIでは事情が違う、という構造。設問は Aboriginal and Torres Strait Island population に限定しているので、However 以降が根拠。","pt":"→ 型：However / but の後ろに設問の条件（特定集団）が出てきたら、そこが答え。前半の一般論は罠。","doubt":null,"voc":[["incidence","発生率"],["deliberate self harm","意図的自傷"],["predominantly","主として"],["adolescent","思春期の若者"],["marked","はっきりした・顕著な"],["stratified by","〜で層別化した"],["substantially","大幅に"]],"past":null},{"n":3,"title":"Article on clinical inertia in diabetes","paras":["The term \"clinical inertia\" implies that the provider is to blame when a patient does not receive adequate treatment intensification. In reality, multiple factors related to physicians, patients, and systems contribute to this phenomenon. Intensifying diabetes treatment can require multiple oral and injected medications, fingerstick glucose monitoring, and significant lifestyle modifications.","These patients also often have numerous comorbidities, which require additional medications. These circumstances can lead to distress and resistance to new medications, particularly to injectables (e.g. insulin, glucagon-like peptide 1 [GLP-1] receptor analogs), which many initially refuse to use. Rising out-of-pocket costs of diabetes medication can lead patients and providers to feel reluctant to initiate new medications. Patients may thus prefer to first try lifestyle modification as a response to elevated blood sugars."],"q":"What reasons does the article give for patients preferring lifestyle changes if their blood sugars are raised?","opts":["Ongoing suffering with existing illnesses, opposition to injectables and increased expense.","Lack of engagement with injectables and lack of understanding of the rationale for using them.","Pain from using injectables and a reluctance by the physician to start new treatment."],"key":"A","qja":"血糖が上昇したとき、患者が生活習慣改善を好む理由として記事は何を挙げているか？","ja":"【糖尿病における臨床的イナーシャ（治療強化の遅れ）】『臨床的イナーシャ』という言葉は、患者が適切な治療強化を受けられないのは医療者の責任であるかのような含みをもつ。実際には、医師・患者・制度に関わる多くの要因がこの現象に関与している。糖尿病治療の強化には、複数の経口薬や注射薬、指先穿刺での血糖測定、大幅な生活習慣の変更が必要になりうる。こうした患者は多くの併存疾患を抱えていることが多く、それにも追加の薬が必要となる。こうした状況は苦痛や新薬への抵抗、特に注射薬（インスリンやGLP-1受容体作動薬など）への抵抗につながり、多くの患者は当初使用を拒む。薬の自己負担額の増加も、患者と医療者が新薬の開始をためらう原因となる。そのため患者は、血糖上昇への対応としてまず生活習慣の改善を試すことを好むことがある。","o":[["既存疾患に苦しみ続けていること、注射薬への抵抗、費用の増加","✅ numerous comorbidities（併存疾患）→ distress and resistance … particularly to injectables → rising out-of-pocket costs の3点。"],["注射薬への関与の欠如と、使用理由の理解不足","❌ 『理解不足』は本文にない。"],["注射の痛みと、医師が新しい治療を始めたがらないこと","❌ 痛みは本文にない。医療者のためらいは費用の文脈で出るが、患者が生活習慣を好む理由としての『痛み』は根拠なし。"]],"exp":"最後の Patients may thus prefer … の thus（したがって）が、直前の理由群を受けている。thus の前の要素を3つ拾えば答えになる。","pt":"→ 型：thus / therefore / so で結論が出たら、その直前を遡って理由を列挙する。","doubt":null,"voc":[["clinical inertia","臨床的イナーシャ（治療強化の遅れ）"],["imply","ほのめかす・含意する"],["be to blame","責任がある"],["treatment intensification","治療の強化"],["comorbidity","併存疾患"],["distress","苦痛・つらさ"],["injectable","注射薬"],["out-of-pocket cost","自己負担額"],["reluctant","気が進まない"],["rationale","根拠・理由づけ"]],"past":null},{"n":4,"title":"Planning for subsequent antenatal visits","paras":["At all visits, opportunities should be provided for the woman to share her expectations and experiences as well as discuss any issues and/or concerns that may have arisen since her last visit, including psychosocial support and mental health issues. Women should also be offered information on aspects of health in pregnancy and early parenthood (e.g. nutrition, alcohol, smoking, symptom relief if conditions common in pregnancy are being experienced, breastfeeding, reducing the risk of sudden and unexpected death in infancy [SUDI]). A woman's confidence in her ability to labour, give birth and look after her new baby should be supported throughout antenatal care. Antenatal education should also support her in preparing for changes to her life and her relationship with her partner and understanding the physical and emotional needs of the baby. The woman's needs should dictate the type of information and support provided (e.g. while many women will benefit from written information, other forms of information such as audio or video are sometimes more suitable). The woman should also direct the type of issues and questions discussed."],"q":"What are the main topics women should be given information on during their antenatal period?","opts":["Managing their expectations, knowing which babies are at risk of SUDI, and how to be confident in their ability as a new mum.","Managing their health during and after pregnancy, life changes, partnership relationships and baby's needs.","Managing psychosocial and mental health issues, understanding labour and giving birth."],"key":"B","qja":"妊娠期間中に女性へ情報提供すべき主なトピックは何か？","ja":"【以降の妊婦健診の計画】どの健診でも、女性が自分の期待や経験を話し、前回以降に生じた問題や懸念（心理社会的支援やメンタルヘルスを含む）を話し合う機会を設けるべきである。また妊娠中・育児初期の健康面の情報（栄養、飲酒、喫煙、妊娠によくある症状の緩和、授乳、乳幼児突然死（SUDI）のリスク低減など）も提供すべきである。陣痛・出産・新生児の世話ができるという女性の自信を、妊婦ケアを通じて支える。出産前教育では、生活の変化やパートナーとの関係の変化への準備、赤ちゃんの身体的・情緒的ニーズの理解も支援すべきである。提供する情報や支援の種類は女性のニーズで決める（多くは文書が有効だが、音声や動画の方が適する場合もある）。話し合う問題や質問も女性が主導すべきである。","o":[["期待の調整、SUDIリスクの高い児の把握、新米ママとしての自信のもち方","❌ 本文は『SUDIのリスクを減らす方法』であって『リスクのある児を知る』ではない。期待は『話す機会』であり『調整』ではない。"],["妊娠中・産後の健康管理、生活の変化、パートナーとの関係、赤ちゃんのニーズ","✅ health in pregnancy and early parenthood / changes to her life / relationship with her partner / needs of the baby を網羅。"],["心理社会的・メンタルヘルスの問題の管理、陣痛と出産の理解","❌ メンタルヘルスは『話し合う機会』の対象。『陣痛の理解』ではなく『陣痛に臨む自信の支援』。部分的で不正確。"]],"exp":"情報提供（offered information / antenatal education）の対象を列挙した選択肢を選ぶ。A・Cは本文の語を拾っているが、動詞（知る・管理する・理解する）がずれている。","pt":"→ 型：名詞が一致していても、動詞（reduce ↔ know / support confidence ↔ understand）がずれていれば誤り。","doubt":null,"voc":[["antenatal","出生前の・妊娠中の"],["arise","生じる"],["psychosocial","心理社会的な"],["parenthood","親であること・育児期"],["breastfeeding","授乳"],["sudden and unexpected death in infancy","乳幼児の突然死"],["labour","陣痛・分娩"],["dictate","決定づける"]],"past":null},{"n":5,"title":"Case study on Community acquired pneumonia","paras":["Mr. Carbury's signs and symptoms suggested that he had community-acquired pneumonia (CAP). The definition of CAP varies in the literature but includes signs and symptoms related to the respiratory tract and the patient's general health (British Thoracic Society, 2009). Mr Carbury's baseline vital signs were recorded as part of a holistic assessment; his RR was at the upper end of normal – 20 breaths per minute (bpm) measured over a full 60 seconds, the depth of his breaths was shallow and the rhythm was regular, and his oxygen saturation (SpO2) was 93%. He was sitting on a chair but leaning slightly forwards, with his hands on his knees and reported chest discomfort on the right side. However, his chest movement appeared symmetrical and there was no paradoxical movement observed: in normal breathing the chest and abdomen should move in the same direction, while paradoxical breathing occurs when the chest and abdomen move in opposite directions."],"q":"Mt Carburys chest movements were","opts":["Equal and in sync with his stomach.","Unequal and out of sync with his belly.","Uneven and out of timing with his tummy."],"key":"A","qja":"Carburyさんの胸の動きはどうだったか？","ja":"【市中肺炎の症例研究】Carburyさんの徴候と症状は市中肺炎（CAP）を示唆していた。CAPの定義は文献により異なるが、気道に関する徴候・症状と患者の全身状態を含む。包括的評価の一環としてベースラインのバイタルを記録した。呼吸数は正常上限の20回/分（60秒間フルで測定）、呼吸は浅く、リズムは規則的、SpO2は93%。椅子に座り、両手を膝に置いてやや前かがみになっており、右胸部の不快感を訴えた。しかし胸の動きは左右対称に見え、奇異呼吸は見られなかった。正常な呼吸では胸と腹は同じ方向に動き、奇異呼吸では胸と腹が逆方向に動く。","o":[["左右均等で、腹部と同調していた","✅ symmetrical（左右対称＝equal）＋ no paradoxical movement（胸と腹が同方向＝in sync）。"],["左右不均等で、腹部と同調していなかった","❌ 正反対。"],["不揃いで、お腹とタイミングがずれていた","❌ Bの言い換え（uneven＝unequal, tummy＝belly）。同じ内容の選択肢が2つあれば両方誤り。"]],"exp":"奇異呼吸の定義（胸と腹が逆に動く）が本文にあるので、no paradoxical movement＝同じ方向＝in sync と変換できる。B・Cは同義の言い換えなので両方消える。","pt":"→ 型：否定＋専門用語（no paradoxical movement）は、本文中の定義を使って肯定文に変換してから選択肢と照合する。","doubt":null,"voc":[["community-acquired pneumonia","市中肺炎"],["varies in the literature","文献によって異なる"],["respiratory tract","気道"],["holistic assessment","全人的（包括的）評価"],["shallow","浅い"],["oxygen saturation","酸素飽和度"],["symmetrical","左右対称の"],["paradoxical movement","奇異性（逆方向の）動き"],["abdomen","腹部"],["in sync","同調して"]],"past":null},{"n":6,"title":"The distribution of discharge summaries","paras":["Once finalized, the Discharge Summary should be printed and given to the patient (and/or carer as appropriate) so they understand and can remember their follow-up instructions.","For patients referred to Outpatient Clinics for follow up, include the Clinic name and fax number in the CC section using the predetermined list contained within the EDS module of the Clinical Portal, and the referring doctor (if different to GP).","Electronic distribution of the Discharge Summary to the patient's nominated GP, any additional recipients noted in the CC section, and the Clinical Record Information System (CRIS), will occur automatically after \"Finalization\" within the EDS module. The method of distribution of electronic discharge summaries is determined by the details listed for each GP/ Practice in ACTPAS, and the consent (to share information with the GP) recorded for the patient in ACTPAS at the time of discharge summary finalization. If the patient has consented to participate in the Commonwealth Government My Health Record system, a copy of their Electronic Discharge Summary will also be distributed to their My Health Record at this time.","Handwritten Discharge Summaries received in the Clinical Record Service with the inpatient notes are manually faxed to the GP."],"q":"Which of the following lists correctly includes the various people or places that always receive a Discharge Summary?","opts":["Patient/carer, Outpatient clinic, patients nominated GP","Patient/carer, patient's My Health Record.","Patient/carer, patient's nominated GP"],"key":"C","qja":"退院サマリーを『必ず』受け取る人・場所を正しく含むリストはどれか？","ja":"【退院サマリーの配布】確定した退院サマリーは印刷して患者（必要に応じて介護者）に渡し、フォローアップの指示を理解・記憶できるようにする。外来でフォローする患者の場合は、臨床ポータルEDSモジュールの所定リストを使ってCC欄に外来名とFAX番号を入れ、紹介医（GPと異なる場合）も入れる。患者の指定GP、CC欄の追加受信者、臨床記録情報システム（CRIS）への電子配布は、EDSモジュールで『確定』した時点で自動的に行われる。電子退院サマリーの配布方法は、ACTPASに登録された各GP／診療所の情報と、確定時点でACTPASに記録された患者の同意（GPとの情報共有）によって決まる。患者が連邦政府のMy Health Recordへの参加に同意している場合は、その時点でMy Health Recordにも写しが配布される。手書きの退院サマリーは、入院記録とともに届いたものを診療記録サービスが手作業でGPにFAXする。","o":[["患者／介護者、外来クリニック、患者の指定GP","❌ 外来クリニックは For patients referred to Outpatient Clinics の場合だけ。『必ず』ではない。"],["患者／介護者、患者のMy Health Record","❌ My Health Record は If the patient has consented の場合だけ。"],["患者／介護者、患者の指定GP","✅ 患者には印刷して渡す（should be … given）、指定GPには自動で電子配布（またはFAX）。条件なしで届くのはこの2者。"]],"exp":"設問の always がカギ。本文の For pat "intestinal","腸の"]],"past":null},{"n":22,"t":1,"p":5,"q":"What kind of therapy is Gottschalk hoping will help prevent migraines in the future?","opts":["Immunotherapy.","Protein therapy.","Neurological therapy.","Meditation."],"key":"A","ev":"research that helps the immune system address a protein triggered by migraines","note":"免疫系に働きかける抗体療法＝免疫療法（A）。Bの protein therapy は語の寄せ集め。","doubt":null,"alt":[],"voc":[["immune system","免疫系"],["address","対処する"],["antibody infusion","抗体の点滴投与"],["target","標的とする"],["progressively","次第に"],["crippling","日常生活を損なうほどの"],["cerebrovascular","脳血管の"],["intermittent","断続的な"]],"past":null}]},{"id":"04","texts":[{"title":"Salt and T helper 2","paras":["Over the past 50 years, the frequency of allergies and autoimmune diseases has risen rapidly, but it is not clear why. In a study published today in Science Translational Medicine, researchers point to a possible culprit: salt. In lab experiments, the authors found that high concentrations of sodium chloride can influence the differentiation of T helper 2 (Th2) cells, the immune cells responsible for allergies, and that elevated levels of salt are present in the affected skin of people with atopic dermatitis, an allergic skin condition.","\"These are the sorts of studies that are really appreciated because they're so completely different, and that's what we need because really there hasn't been much progress in understanding this epidemic of allergic disease,\" says Charles Mackay, an immunologist at Monash University in Australia who did not participate in the work. In looking \"at why we get an allergy or atopic dermatitis, I try to think of the environmental factors,\" he adds. This study \"is an interesting new angle to Th2 immunity.\"","Hay fever and atopic dermatitis have seen a two-fold upsurge since the 1970s, and researchers do not attribute that to greater awareness or diagnosis. This recent rise in the incidence of allergic diseases is much too fast to be explained by genetic changes, so it's more likely to be due to an environmental or behavioural cause, according to co-author Christina Zielinski of the Technical University of Munich. \"One thing that also changed within the last fifty to sixty years is our diet. We are eating much more fast food, and this also includes much more salt, so that's how we became interested in the question of whether salt can modulate the immune system,\" she says.","Zielinski and her colleagues started by upping the levels of sodium chloride in the tissue culture medium used to grow either human CD4-positive memory T cells, which give off a complex set of chemical signals based on previous exposure to antigens, or naïve T cells, which have not been exposed to antigens before. In both cell types, the salt boosted the abundance of cytokines and transcription factors specific to Th2 cells, indicating that high salinity promotes Th2 cell differentiation. The researchers also found that the effects of the salt seemed to enhance Th2-related programs via two salt-sensitive transcription factors.","The authors next compared salt levels in the skin of adults with atopic dermatitis, an allergic condition that causes red, itchy patches of skin. Lesioned skin had sodium concentrations 30-fold higher than the patients' non-lesioned skin and skin from healthy controls. The team also investigated sodium levels in affected and unaffected skin of people with psoriasis, an autoimmune disorder characterized by red, inflamed patches of skin. While both atopic dermatitis and psoriasis are both chronic inflammatory skin conditions, psoriasis is mediated by a different type of T helper cells. They found no difference in salt concentration in psoriatic lesions and unaffected skin, which led them to rule out a role for inflammation in the differences in sodium that they observed in people with atopic dermatitis. \"We were very surprised because atopic dermatitis has been thoroughly investigated, and no one has ever considered sodium chloride to play a role,\" says Zielinski. She adds that the next steps will be to investigate the connection between salt and allergies.","According to Chuan Wu, an immunologist at the National Cancer Institute who did not participate in the work, this connection could involve nearby epidermal and dermal cells, as well as the skin microbiome. \"The skin is a big mucosal surface, colonized with a huge amount of microbes, so investigating whether . . . the Th2 response is somehow connected to the skin bacteria could be interesting,\" he says. The authors discuss in the study that people with atopic dermatitis often have an overgrowth of a salt-loving microbe (staphylococcus aureus) on their skin, which has gone unexplained until now.","Mackay points out that the gut microbiome could also be involved, as high salt diets have previously been shown to have effects on intestinal microbes. \"Is it salt from the diet somehow affecting atopic dermatitis? Or is there a gut connection here that they haven't explored yet?\" he asks. \"This connection to the diet is still very speculative. There are some correlations and associations, but the definite proof is still missing,\" says Zielinski. \"It could be that the sodium accumulation in the skin follows some autonomous skin-intrinsic rules, which are completely independent of diet.\""]},{"title":"Travel Vaccinations","paras":["Travel vaccinations are an essential part of holiday and travel planning, particularly if your journey takes you to an exotic destination or 'off the beaten track'. The risks are not restricted to tropical travel, although most travel vaccines are targeted at diseases which are more common in the tropics. This article discusses the vaccinations that are available and gives some idea of the time you need to allow to complete a full protective course of vaccination.","The rise in worldwide and adventurous tourism has seen a massive increase in people traveling to exotic destinations. This leads to exposure to diseases that are less likely to occur at home. These are sicknesses against which we have no natural immunity and against which most people are not routinely immunized. They include insect-borne conditions such as malaria, dengue, yellow fever and Zika virus. In addition, diseases could be acquired from eating and drinking, such as hepatitis A and traveler's diarrhea. Poor hygiene in some places could put you at risk from hepatitis B and Ebola virus. These are illnesses which might not only spoil your holiday but might also pose a risk to your life.","Before traveling outside your home country, it is important to check whether there are any vaccinations available which could protect you. You can do this by making a travel planning appointment at your doctor's surgery. There are also several websites which aim to offer up-to-date, country-specific advice on vaccinations and on disease patterns.","Vaccination courses need to be planned well in advance. Some vaccinations involve a course of injections at specified intervals and it can take up to six months to complete the course. Some vaccinations can't be given together. Always check with your surgery or online before traveling, particularly to unusual destinations, for local outbreaks of disease which mean other specific vaccinations are advised. If a vaccination certificate is issued keep it and update it over the years so that you have a full record. Your doctor's surgery will have a record of vaccines they have administered to you and can often issue a copy.","It is worth remembering that the protection offered by vaccination is not always 100%. Vaccination will greatly reduce your chances of acquiring the disease and in many cases the protection level offered is extremely high. The protection will also not be lifelong, so you need to seek medical advice before you travel. However, there isn't a vaccine available for every disease - for example, there is none at present against malaria. Even where a vaccine is available, vaccination should not be the only thing you rely on for protection against illness. It is important to know the risks; taking sensible steps to avoid exposing yourself to disease is by far the most useful thing you can do.","No vaccination is available against malaria. People who live permanently in malarial zones have partial protection but they lose this swiftly when they move away. Protection against malaria is through a combination of avoidance of mosquito bites and the use of anti-malarial tablets. Tablets have to be started before entering the malarial zone and continued for some days or weeks after leaving it. The recommended tablet regime varies by area. Again, your doctor will have access to up-to-date advice on recommendations for your journey.","People often at greatest risk when traveling are those visiting a country which they think of as their place of origin, where members of their family live and their roots may be. People often believe that as one-time residents who may have been born and raised there, they have a natural immunity. They feel that they are not on holiday but visiting home and that vaccinations aren't needed. Unfortunately, that is not the case. We acquire natural immunity by living in a place and being constantly exposed to the diseases that are present. When we leave the area for distant shores that protection is rapidly lost and we need the protection of vaccination, together with the other precautions listed above.","This is particularly true of malaria, where visitors 'going back home' may find their relatives puzzled and even amused that they are taking anti-malarial medication. Even so, it's very important to do so. It's only by living there all the time that you acquire your resident relatives' level of immunity. Your immune system has a short memory for this sort of partial immunity.","Remember, vaccinations have to be paid for, although some vaccinations such as hepatitis A are usually free. Some aid workers and healthcare workers are often offered free vaccinations against occupational risks but others have to pay. Anti-malarial tablets are never free and can add a substantial amount to the cost of your trip. Whilst this may seem expensive, it is usually a small sum relative to the costs of your travel. Safeguarding your health should be considered an essential part of any trip."]}],"B":[{"n":1,"title":"Use of 'StoneChecker' for Kidney Stone Evaluation","paras":["'StoneChecker' is medical imaging software used to measure key kidney stone parameters to generate a set of textual metrics. It uses an application that analyses the texture in an existing radiological scan. The aim is to help clinicians assess a stone's heterogeneity and any characteristics not visible to the naked eye. In other words, it creates a virtual 'map' of a kidney stone. The technology is designed to be used with conventional CT scans to help clinical decision making about diagnosing and treating people with kidney stones. It imports imaging data and calculates metrics based on individual pixel data points within a given region of interest. These metrics assess stone heterogeneity, including texture irregularity, not provided by conventional CT scans."],"q":"What do we learn about 'StoneChecker'?","opts":["Kidney stones can be located using this device.","Such optical equipment measures microscopic surface features of kidney stones","It is a computer program that helps clinicians visualize kidney stones."],"key":"C","qja":"『StoneChecker』について何がわかるか？","ja":"【腎結石評価への『StoneChecker』の利用】StoneCheckerは、腎結石の主要なパラメータを測定してテクスチャ指標を算出する医用画像ソフトウェアである。既存の放射線画像のテクスチャを解析するアプリケーションを用いる。目的は、結石の不均一性や肉眼では見えない特徴を臨床医が評価できるよう支援すること。言い換えれば、腎結石の仮想的な『地図』を作る。通常のCTと併用し、腎結石患者の診断・治療に関する臨床判断を助けるよう設計されている。画像データを取り込み、関心領域内の個々のピクセルデータに基づいて指標を計算する。これらの指標は、通常のCTでは得られない結石の不均一性（テクスチャの不規則さなど）を評価する。","o":[["この装置で腎結石の位置を特定できる","❌ 既存のCT画像（existing radiological scan）を解析するソフト。位置特定の装置ではない。"],["この光学機器は腎結石の微細な表面の特徴を測定する","❌ optical equipment ではなく software。表面ではなく texture/heterogeneity（内部の不均一性）。"],["臨床医が腎結石を可視化するのを助けるコンピュータープログラムである","✅ medical imaging software（＝computer program）が virtual 'map' を作り、肉眼で見えない特徴の評価を助ける（＝visualize）。"]],"exp":"R4で誤答（Bを選択）。『機器の種類』（ソフトか装置か）の取り違え。冒頭の定義文 ‘StoneChecker’ is medical imaging software で決まる。","pt":"→ 型：『〜とは何か』の設問は冒頭の定義文（X is …）の名詞カテゴリ（software / device / test）を必ず確認する。","doubt":null,"voc":[["imaging software","画像解析ソフト"],["parameter","指標・測定項目"],["metrics","指標（数値）"],["texture","質感・きめ"],["heterogeneity","不均一性"],["naked eye","肉眼"],["conventional","従来の"],["region of interest","関心領域"],["irregularity","不規則さ"],["optical","光学の"]],"past":"B"},{"n":2,"title":"Postoperative Treatment of Knee Inflammation","paras":["A middle-aged man with a history of gout was hospitalized for a surgical procedure. While in postoperative care, he experienced severe pain and swelling in his left knee. An orthopaedic surgeon was consulted, and he prescribed Colchicine to treat the acute gouty inflammation. The pharmacist overrode a high-dose alert, which indicated that the patient should be treated with a maximum dose of 4.8 mg. Instead, the patient received more than 10 mg of Colchicine before he started to show signs of renal failure. The treatment was stopped, but the patient died. In this instance, a policy concerning high drug doses had been in place. The investigation found that the pharmacist should have consulted with the prescribing physician for alerts."],"q":"In the example described in the paragraph, what went wrong?","opts":["The pharmacist ignored critical information.","The prescription was incorrectly managed by the orthopaedic surgeon.","The prescribing physician fail to initiate the 'alert' process."],"key":"A","qja":"この段落の事例では、何がまずかったのか？","ja":"【膝の炎症の術後治療】痛風の既往がある中年男性が手術のため入院した。術後ケア中に左膝の激しい痛みと腫れが出現。整形外科医が呼ばれ、急性痛風炎症の治療にコルヒチンを処方した。薬剤師は『高用量アラート』（最大4.8mgで治療すべきと示すもの）を無視した。その結果患者は10mg超のコルヒチンを投与され、腎不全の徴候が出た。投与は中止されたが患者は死亡した。この事例では高用量に関する方針が定められていた。調査の結果、薬剤師はアラートについて処方医に相談すべきだったと判明した。","o":[["薬剤師が重要な情報を無視した","✅ The pharmacist overrode a high-dose alert（アラートを無視・上書きした）＋ should have consulted with the prescribing physician。"],["整形外科医が処方を誤って管理した","❌ 処方自体（コルヒチン）は適応どおり。問題は薬剤師のアラート無視。"],["処方医が『アラート』手順を開始しなかった","❌ アラートはシステムが出しており、それを無視したのは薬剤師。"]],"exp":"R4で誤答（Bを選択）。調査の結論文 The investigation found that the pharmacist should have … が最終判定。事例問題は『結論・調査結果』の文を探す。","pt":"→ 型：事故事例は『調査で誰の責任とされたか』の最終文で決まる。途中に出てくる登場人物（外科医）に引きずられない。","doubt":null,"voc":[["gout","痛風"],["postoperative","術後の"],["swelling","腫脹・腫れ"],["orthopaedic surgeon","整形外科医"],["prescribe","処方する"],["overrode","（警告を）無視して進めた（override）"],["renal failure","腎不全"],["in place","（制度などが）整っている"],["prescribing physician","処方医"]],"past":"B"},{"n":3,"title":"Gluten: It's Not for Everyone","paras":["Removing gluten from one's diet is no easy feat. Reading labels and understanding where gluten may be hiding takes time and education. Gluten-free products are typically more expensive, and, while varieties of foods and products are expanding, there are still considerably fewer choices for gluten-sensitive consumers. While there is considerable evidence to support the benefits of a gluten-free diet, the medical community warns against it, if it is not deemed medically necessary. Removing gluten from one's diet can not only reduce the intake of essential vitamins and minerals which are found in fortified foods, but it can also reduce the amount of probiotics in the gut which boost the immune system."],"q":"What does the writer imply about gluten?","opts":["Eliminating gluten from your food intake is risky.","More people should take time to be educated about gluten.","Reducing the amount of gluten you consume is beneficial for your probiotics."],"key":"A","qja":"筆者はグルテンについて何を示唆しているか？","ja":"【グルテン：万人向けではない】食事からグルテンを除くのは容易なことではない。ラベルを読み、グルテンがどこに隠れているかを理解するには時間と知識が必要だ。グルテンフリー製品は一般に高価で、種類は増えているとはいえ、グルテン過敏の消費者の選択肢はまだかなり少ない。グルテンフリー食の利点を支持する相当な証拠がある一方で、医学的に必要と判断されない場合は、医療界はそれに警鐘を鳴らしている。グルテンを除くと、強化食品に含まれる必須ビタミン・ミネラルの摂取が減るだけでなく、免疫を高める腸内のプロバイオティクスも減りうる。","o":[["食事からグルテンを除くことにはリスクがある","✅ the medical community warns against it … reduce the intake of essential vitamins … reduce the amount of probiotics。"],["もっと多くの人がグルテンについて学ぶ時間をとるべきだ","❌ time and education は『除去が大変な理由』として出るだけで、学ぶべきという提言ではない。"],["グルテン摂取を減らすことはプロバイオティクスに有益だ","❌ 逆。除去するとプロバイオティクスが減る。"]],"exp":"タイトル It's Not for Everyone（誰にでも向くわけではない）が主旨。imply 問題でもタイトルと結論文で方向を確認できる。","pt":"→ 型：imply 問題はタイトルと最終文の方向（推奨か警告か）を先に掴む。","doubt":null,"voc":[["no easy feat","容易なことではない"],["considerably","かなり"],["gluten-sensitive","グルテンに過敏な"],["deem","〜とみなす・判断する"],["intake","摂取（量）"],["fortified food","栄養強化食品"],["probiotics","プロバイオティクス（有用菌）"],["gut","腸"],["boost","高める"],["eliminate","取り除く"]],"past":null},{"n":4,"title":"Blood Culture Policy","paras":["Any patient in a hospital setting who develops a fever or evidence of sepsis should have blood cultures sent. As sepsis is one of the leading causes of deaths, rapid identification of bloodstream infection is mandatory to perform adequate antibiotic therapy. Multiple sets of blood cultures may be required, and cultures of other sites should also be considered including urine, skin and throat. Smaller volumes are often taken from babies and children. Standard precautions must be taken when taking blood cultures. Ideally the skin should be washed with soap and rinsed with sterile water. This should be followed by the application of an iodine-based solution, which should then be washed off after 30 seconds of drying."],"q":"What does this article tell us about blood cultures?","opts":["Blood culture should always precede antibiotic therapy.","The amount of blood to be taken can vary.","The use of iodine does not interfere with correct blood culture procedures."],"key":"B","qja":"血液培養についてこの記事は何を伝えているか？","ja":"【血液培養ポリシー】病院で発熱や敗血症の兆候が出た患者は、血液培養を提出すべきである。敗血症は主要な死因の一つであり、適切な抗菌薬治療を行うには血流感染の迅速な特定が必須である。複数セットの血液培養が必要な場合があり、尿・皮膚・咽頭など他部位の培養も検討すべきである。乳児や小児からは少量を採取することが多い。血液培養採取時は標準予防策をとること。理想的には皮膚を石けんで洗い、滅菌水ですすぐ。その後ヨード系消毒液を塗布し、30秒乾燥させた後に拭き取る。","o":[["血液培養は必ず抗菌薬治療より先に行うべきである","❌ 本文は『適切な抗菌薬治療のために迅速な特定が必須』。『必ず先に』という順序の規定はない（always の付け足し）。"],["採取する血液量は変わりうる","✅ Smaller volumes are often taken from babies and children（小児は少量）＝量は一定ではない。"],["ヨードの使用は正しい血液培養手順を妨げない","❌ ヨードの使い方（塗布→30秒乾燥→拭き取り）は書いてあるが、『妨げるか』には触れていない。"]],"exp":"Aは臨床常識としては正しいが本文にない（外部知識の罠）。Part Bは医学的正しさではなく本文に書いてあるかで判定する。","pt":"→ 型：医学的に正しそうな選択肢ほど疑う。本文に根拠文がなければ誤り。","doubt":null,"voc":[["sepsis","敗血症"],["blood culture","血液培養"],["leading cause","主要な原因"],["mandatory","必須の"],["adequate","適切な"],["standard precautions","標準予防策"],["rinse","すすぐ"],["sterile","滅菌の"],["iodine-based solution","ヨード系消毒液"],["precede","〜に先立つ"],["interfere with","〜を妨げる"]],"past":null},{"n":5,"title":"Helmet Removal Procedures","paras":["With each passing year, more individuals are playing contact sports and riding motorcycles. Therefore, healthcare workers involved in emergency care should be proficient in the procedure of helmet removal. This procedure, which requires minimal training, is a safe and quick process that gives care providers access to a patient's airway and allows them to stabilize the patient's head and neck. If the airway is unstable, facemask removal is all that is necessary to intubate the patient. According to one study, face mask removal for the potential spine-injured patient is safer than helmet removal for emergent airway access. Face mask removal results in less motion in all three planes (sagittal, frontal, transverse), requires less completion time, and is easier to perform."],"q":"What do we learn from this article about helmet removal?","opts":["Intubation to stabilize the airway is not possible while a helmet is in place.","Healthcare workers should focus on the integrity of the sagittal, frontal and transverse planes.","It is not always necessary to remove a helmet."],"key":"C","qja":"ヘルメット除去について、この記事から何がわかるか？","ja":"【ヘルメット除去の手順】コンタクトスポーツやバイクに乗る人は年々増えている。したがって救急医療に携わる医療者はヘルメット除去の手技に習熟すべきである。この手技は最小限の訓練で習得でき、安全かつ迅速で、気道へのアクセスと頭頸部の安定化を可能にする。気道が不安定な場合、挿管に必要なのはフェイスマスクの除去だけである。ある研究によれば、脊髄損傷が疑われる患者では、緊急の気道確保のためにはヘルメット除去よりフェイスマスク除去の方が安全である。フェイスマスク除去は3つの面（矢状面・前額面・水平面）すべてで動きが少なく、所要時間も短く、実施も容易である。","o":[["ヘルメットを着けたままでは気道安定のための挿管はできない","❌ 逆。フェイスマスクさえ外せば挿管できる（facemask removal is all that is necessary to intubate）。"],["医療者は矢状面・前額面・水平面の完全性に注目すべきである","❌ 3つの面は『動きが少ない』比較の文脈で出るだけ。"],["ヘルメットを外すことが常に必要とは限らない","✅ フェイスマスク除去だけで挿管できる／ヘルメット除去より安全＝ヘルメットは外さなくてよい場合がある。"]],"exp":"本文前半は『ヘルメット除去に習熟せよ』、後半は『実はフェイスマスク除去で足りる』という展開。後半の転換を拾えるかが勝負。","pt":"→ 型：not always necessary 型の正解は、本文の all that is necessary / only が根拠になることが多い。","doubt":null,"voc":[["contact sports","コンタクトスポーツ（接触のある競技）"],["proficient in","〜に習熟した"],["airway","気道"],["stabilize","安定させる"],["intubate","挿管する"],["spine-injured","脊椎を損傷した"],["emergent","緊急の"],["sagittal","矢状（面）の"],["transverse","横断（面）の"],["integrity","（構造の）健全さ・保たれていること"]],"past":null},{"n":6,"title":"TYM Otoscope for Imaging the External Ear Canal","paras":["The TYM Otoscope (Cupris) uses iOS smartphones to let users capture images and videos of the external ear canal and eardrum. These can then be reviewed and shared securely with other healthcare professionals through the Cupris app. To use the device, the user places their smartphone in the case and slides the otoscope attachment over the lens of the phone camera. A speculum is then screwed onto the attachment until locked into place. Images and videos are captured using the smartphone's camera linked to the Cupris app. The Cupris app can be downloaded from the Cupris website. The images and video captured using the device are stored on a secure and encrypted cloud system and can be viewed on most phones or PC computers."],"q":"What does this article tell us about the TYM Otoscope?","opts":["Healthcare professionals can transfer data from the device to their own smartphones.","Without a smartphone, the TYM Otoscope cannot function.","Data can only be shared on iOS platforms."],"key":"B","qja":"TYM耳鏡についてこの記事は何を伝えているか？","ja":"【外耳道撮影用TYM耳鏡】TYM耳鏡（Cupris社）はiOSスマートフォンを使って、外耳道と鼓膜の画像・動画を撮影できるようにする。撮影したものはCuprisアプリを通じて他の医療者と安全に確認・共有できる。使うときは、スマートフォンをケースに入れ、耳鏡アタッチメントをカメラのレンズに被せる。次にスペキュラをアタッチメントにロックされるまでねじ込む。画像・動画はCuprisアプリと連動したスマートフォンのカメラで撮影する。アプリはCupris社のウェブサイトからダウンロードできる。撮影データは暗号化された安全なクラウドに保存され、ほとんどのスマートフォンやPCで閲覧できる。","o":[["医療者は機器から自分のスマートフォンへデータを転送できる","❌ データはクラウドに保存され、アプリ経由で『他の医療者』と共有する。自分の端末へ転送するという話ではない。"],["スマートフォンがなければTYM耳鏡は機能しない","✅ 撮影はスマホのカメラで行い、耳鏡はレンズに被せるアタッチメント＝スマホ必須。"],["データはiOSプラットフォームでしか共有できない","❌ 撮影はiOSだが、閲覧は most phones or PC computers で可能。only が誤り。"]],"exp":"撮影（iOS限定）と閲覧（ほとんどの端末）を区別できるかがポイント。only は条件の範囲を狭める定番の誤答語。","pt":"→ 型：only を含む選択肢は、本文で範囲が広がっていないか（most / other）を探す。","doubt":null,"voc":[["otoscope","耳鏡"],["external ear canal","外耳道"],["eardrum","鼓膜"],["securely","安全に"],["attachment","取り付け器具・アタッチメント"],["speculum","スペキュラ（開大器・耳鏡の先端）"],["screw onto","ねじ込む"],["encrypted","暗号化された"],["transfer","転送する"]],"past":null}],"C":[{"n":7,"t":0,"p":0,"q":"What did the study published in Science Translational Medicine find?","opts":["Th2 cells can cause allergies and autoimmune diseases","Some people with atopic dermatitis were allergic to salt","Salt may play an important role in allergies and autoimmune diseases","Sodium Chloride causes atopic allergies in skinny people"],"key":"C","ev":"researchers point to a possible culprit: salt","note":"アレルギー・自己免疫疾患の増加の『犯人候補』として塩（C）。Aは Th2 がアレルギーを担うという前提で、発見ではない。","doubt":null,"alt":[],"voc":[["autoimmune disease","自己免疫疾患"],["culprit","原因・犯人"],["concentration","濃度"],["sodium chloride","塩化ナトリウム（食塩）"],["differentiation","分化"],["elevated","上昇した"],["atopic dermatitis","アトピー性皮膚炎"]],"past":null},{"n":8,"t":0,"p":1,"q":"When diagnosing allergies or atopic dermatitis, Charles Mackay usually considers","opts":["The patient's hereditary conditions","The patient's surroundings","The patient's diet","The patient's susceptibility to skin conditions"],"key":"B","ev":"I try to think of the environmental factors","note":"environmental factors＝周囲の環境（B）。食事（C）は Zielinski 側の関心。","doubt":null,"alt":[],"voc":[["appreciated","高 ctor's surgery is usually necessary"],"key":"D","ev":"Some vaccinations involve a course of injections at specified intervals","note":"決まった間隔で複数回注射＝通院は通常1回では済まない（D）。","doubt":null,"alt":[],"voc":[["well in advance","十分前もって"],["at specified intervals","決められた間隔で"],["outbreak","（病気の）発生・流行"],["certificate","証明書"],["issue","発行する"],["surgery","（英）診療所"],["infer","推測させる・示唆する"]],"past":null},{"n":18,"t":1,"p":4,"q":"If you have been vaccinated against a disease in the past","opts":["it is not necessary to be vaccinated again","only the malaria vaccine provides lifelong protection","you need to have a new vaccination against malaria each time you travel","you should check if you need to have another immunization"],"key":"D","ev":"The protection will also not be lifelong, so you need to seek medical advice before you travel.","note":"免疫は一生続かない→追加接種が必要か確認（D）。","doubt":null,"alt":[],"voc":[["worth remembering","覚えておく価値がある"],["acquire","（病気・免疫を）獲得する"],["lifelong","生涯続く"],["seek medical advice","医療者に相談する"],["rely on","頼る"],["sensible steps","賢明な対策"],["by far","断然"],["immunization","予防接種"]],"past":null},{"n":19,"t":1,"p":5,"q":"Any immunity that a person has against malaria","opts":["is never lost","is effective if they can avoid insect bites","doesn't last a long time if he/she changes locations","is better than immunity offered by tablets"],"key":"C","ev":"People who live permanently in malarial zones have partial protection but they lose this swiftly when they move away.","note":"移住すると急速に失われる＝場所を変えると長続きしない（C）。","doubt":null,"alt":[],"voc":[["permanently","永続的に"],["partial protection","部分的な防御"],["swiftly","速やかに"],["avoidance","回避"],["mosquito bite","蚊に刺されること"],["anti-malarial","抗マラリア（薬）の"],["regime","（薬の）レジメン・方式"],["up-to-date","最新の"]],"past":null},{"n":20,"t":1,"p":6,"q":"If people are visiting their home countries","opts":["they have natural immunities to local diseases","vaccinations may depend on the distance they travel","it is necessary to take precautions","all family members should be immunized"],"key":"C","ev":"When we leave the area for distant shores that protection is rapidly lost","note":"故郷訪問でも免疫は失われている→予防措置が必要（C）。","doubt":null,"alt":[],"voc":[["place of origin","出身地"],["roots","ルーツ・出自"],["one-time resident","かつての居住者"],["that is not the case","実際はそうではない"],["constantly","絶えず"],["distant shores","遠い異国"],["precaution","予防策"]],"past":null},{"n":21,"t":1,"p":7,"q":"In paragraph eight, what does the expression 'to do so' refer to?","opts":["having treatment against malaria","being amused","living in the country","going back home"],"key":"A","ev":"Even so, it's very important to do so.","note":"do so＝taking anti-malarial medication（A）。代名詞・代動詞は直前の動詞句を指す。","doubt":null,"alt":[],"voc":[["puzzled","けげんに思う"],["amused","おもしろがる"],["even so","それでも"],["to do so","そうすること（＝直前の行為）"],["resident relatives","現地に住む親族"],["short memory","すぐ忘れる性質"]],"past":null},{"n":22,"t":1,"p":8,"q":"What does the last paragraph tell us about the cost of vaccinations?","opts":["most vaccinations are free in the UK","most people have to pay for their vaccinations","travel vaccinations are covered by travel insurance","everyone has to pay for vaccinations"],"key":"B","ev":"Remember, vaccinations have to be paid for, although some vaccinations such as hepatitis A are usually free.","note":"原則有料、一部例外のみ無料＝ほとんどの人は支払う（B）。Dの everyone は例外（A型肝炎・医療従事者）を無視。","doubt":null,"alt":[],"voc":[["aid worker","援助従事者"],["occupational risk","職業上のリスク"],["substantial amount","かなりの額"],["relative to","〜と比べると"],["safeguard","守る"],["covered by insurance","保険でまかなわれる"]],"past":null}]},{"id":"05","texts":[{"title":"Fluid Intelligence","paras":["Today, neuroscientists can determine one's intelligence through a brain scan, as sci-fi as that sounds. Not only that, it's only a matter of time before they are able to tell each individual's set of aptitudes and shortcomings, simply from scanning their brain. Researchers at Yale led the study. They interpreted intelligence in this case as abstract reasoning, also known as fluid intelligence. This is the ability to recognize patterns, solve problems, and identify relationships. Fluid intelligence is known to be a consistent predictor of academic performance. Yet, abstract reasoning is difficult to teach, and standardized tests often miss it.","Researchers in this study could accurately predict how a participant would do on a certain test by scanning their brain with an fMRI. 126 participants, all a part of the Human Connectome Project, were recruited. The Human Connectome Project is the mapping of all the connections inside the brain, to get a better understanding of how the wiring works and what it means for things like intellect, the emotions, and more. For this study, researchers at Yale put participants through a series of different tests to assess memory, intelligence, motor skills, and abstract thinking.","They were able to map the connectivity in 268 individual brain regions. Investigators could tell how strong the connections were, how active, and how activity was coordinated between regions. Each person's connectome was as unique as their fingerprint, scientists found. They could identify one participant from another with 99% accuracy, from their brain scan. Yale researchers could also tell whether the person was engaged in the assessment they were taking or if they were aloof about it.","Emily Finn was a grad student and co-author of this study. She said, \"The more certain regions are talking to one another, the better you're able to process information quickly and make inferences.\" Mostly, fluid intelligence had to do with the connections between the frontal and parietal lobes. The stronger and swifter the communication between these two regions, the better one's score in the abstract thinking test. These are some of the latest regions to have evolved in the brain. They house the higher level functions, such as memory and language, which are essentially what make us human.","Yale researchers believe that by learning more about the human connectome, they might find novel treatments for psychiatric disorders. Things like schizophrenia vary widely from one patient to the next. By finding what's unique to a particular patient, a psychiatrist can tailor treatment to suit their needs. Understanding one's connectome could give insight into how the disease progresses, and if and how the patient might respond to certain therapies or medications.","But there are other uses which we may or may not feel comfortable with. For instance, your child could have their brain scanned to track them at school, according to study author Todd Constable. It might be used to say whether or not a candidate is qualified for a job or should pursue a certain career. Brain scans could tell who might be prone to addiction, or what sort of learning environment a student might flourish in. School curriculum could even be changed on a day-to-day basis to fit student's needs. And the dreaded SAT might even be shelved too, in favor of a simple brain scan.","Peter Bandettini is the chief of functional imaging methods at the National Institute of Mental Health (NIMH). He told PBS that barring ethical issues, brain scans could someday be used by employers to tell which potential candidate possesses desirable aptitudes or personality traits, be they diligent, hardworking, or what-have-you. Richard Haier, an intelligence researcher at UC Irvine, foresees prison officials using such scans on inmates to tell who might be prone to violence.","We may even someday learn how to augment human intelligence from studies such as this. It's important to remember that intelligence research is still in its infancy. Yet, according to Yale scientists, we are moving in this direction."]},{"title":"Treating Depression and Anxiety in Cancer Patients","paras":["The largest studies to date, by arguably the most respected institutions up to this point, show that psilocybin, a compound within \"magic mushrooms,\" can be effective in treating depression and anxiety in cancer patients. The studies were carried out on 29 patients by researchers at New York University (NYU) and on 51 patients at Johns Hopkins University.","Notably, up to 40% of all cancer patients are afflicted by psychological issues related to their illness. Around 80% of the cancer patients in the studies got noticeably better after just one dose. And they sustained the psychological gains they made for up to seven months, with few minor side effects. Patients reported improvements in their quality of life, having more energy, going out more and having better relationships with family members. Interestingly, those who had a stronger trip reported the strongest gains in alleviating their depression and anxiety.","A number of authorities in psychiatry and addiction medicine expressed their support for the work. These include Dr. Jeffrey Lieberman, a former president of the American Psychiatric Association and Dr. Daniel Shalev from the New York State Psychiatric Institute, who wrote that the studies are \"a model for revisiting criminalized compounds of interest in a safe, ethical way.\"","The studies were also reviewed by regulators and were described by the New York Times as \"most meticulous\" to date. The lead author of the Johns Hopkins study, psychiatrist Dr. Roland Griffiths, was optimistic on the possibilities of the new treatment, likening it to a groundbreaking surgery rather than the painstaking work to make people feel better used by traditional psychiatric approaches. \"I really don't think we have any models in psychiatry that look like the effects demonstrated in the two trials,\" said Griffiths. \"Something occurs and it's repaired and it's better going forward… very plausibly for more than six months,\" he added. \"In that sense it's a new model\".","One of the participants in the study, Sherry Marcy, described the changes in how she felt this way: \"The cloud of doom seemed to just lift… I got back in touch with my family and kids, and my wonder at life,\" said Marcy, who has been battling cancer since 2010. \"Before, I was sitting alone at home, and I couldn't move … This study made a huge difference, and it persisted\".","The particulars of both studies involved randomly offering patients either psilocybin or a placebo at the first session, and then giving them the opposite treatment seven weeks later. This way all participants eventually took psilocybin. In both studies, the success rate of psilocybin versus the placebo was very clear, with 83% getting better on psilocybin and only 14% on the placebo in the NYU study.","Psilocybin, of course, has been banned in the U.S. for over 40 years. While they were allowed to use it for their studies, the scientists warn against self-medicating depression by taking \"magic mushrooms\". They caution that professionals are needed to control the dosage and provide a supportive environment in which to experience the drug's effects. The psilocybin therapy may also not be appropriate for people with schizophrenia or young adults.","To move forward in this field, Dr. Shalev and Dr. Lieberman see \"a need to loosen research restrictions\", because \"there is much potential for new scientific insights and clinical applications.\" Ideally, the next step would be a trial with a larger sample, perhaps across several centers with hundreds of subjects."]}],"B":[{"n":1,"title":"Testing for nystagmus","paras":["Patients with abnormal hearing on history or physical examination or with tinnitus or vertigo undergo, an audiogram. Patients with nystagmus or altered vestibular function may benefit from computerized electronystagmography (ENG), which quantifies spontaneous, gaze, or positional nystagmus that might not be visually detectable. Computerized ENG caloric testing quantifies the strength of response of the vestibular system to cool and warm irrigations in each ear, enabling the physician to discriminate against unilateral weakness. Different components of the vestibular system can be tested by varying head and body position or by presenting visual stimuli. Posturography uses computerized test equipment to quantitatively assess the patient's control of posture and balance. The patient stands on a platform containing force and motion transducers that detect the presence and amount of body sway while the patient attempts to stand upright. The testing can be done under various conditions, including with the platform stationary or moving, flat or tilted, and with the patient's eyes open or closed, which can help isolate the contribution of the vestibular system to balance."],"q":"What tests are identified in this article that determine if a person has nystagmus in one or both eyes?","opts":["High-frequency tympanometry.","Checking the effect on the person when they are on a special platform.","A Computerized ENG, Putting water of variable temperature into the auditory canals."],"key":"C","qja":"片眼または両眼の眼振の有無を判定する検査として、この記事が挙げているのはどれか？","ja":"【眼振の検査】病歴や診察で聴力の異常がある患者、耳鳴りやめまいがある患者は聴力検査を受ける。眼振や前庭機能の変化がある患者には、コンピューター化電気眼振図（ENG）が有用な場合があり、肉眼では検出できないかもしれない自発・注視・頭位眼振を定量化する。コンピューター化ENGの温度刺激検査（カロリックテスト）は、左右それぞれの耳への冷水・温水の注入に対する前庭系の反応の強さを定量化し、医師が一側性の機能低下を識別できるようにする。頭や体の位置を変えたり視覚刺激を与えたりすることで、前庭系の異なる要素を検査できる。重心動揺検査（ポスチュログラフィ）はコンピューター化装置で姿勢制御とバランスを定量評価する。患者は力・動きのセンサーを内蔵した台の上に立ち、まっすぐ立とうとする間の体の揺れの有無と量を検出する。台を固定または動かす、水平または傾ける、開眼または閉眼など様々な条件で行え、バランスへの前庭系の寄与を切り分けるのに役立つ。","o":[["高周波ティンパノメトリー","❌ 本文に出てこない。"],["特殊な台に乗ったときの反応を調べる","❌ ポスチュログラフィは『姿勢とバランス』の検査。眼振の検査ではない。"],["コンピューター化ENG、外耳道に温度の異なる水を入れる検査","✅ ENGが眼振を定量化し、カロリックテスト（cool and warm irrigations in each ear）で左右差（unilateral weakness）を識別。"]],"exp":"設問の in one or both eyes（片側か両側か）は、本文の discriminate … unilateral weakness（一側性の低下を識別）に対応。irrigations を『水を入れる』と言い換えられるかがカギ。","pt":"→ 型：選択肢の平易な言い換え（putting water into the auditory canals）を本文の専門語（caloric irrigations）に戻して照合する。","doubt":null,"voc":[["nystagmus","眼振"],["tinnitus","耳鳴り"],["vertigo","めまい（回転性）"],["audiogram","聴力検査（オージオグラム）"],["vestibular function","前庭機能"],["quantify","定量化する"],["caloric testing","温度刺激検査（カロリックテスト）"],["irrigation","洗浄・注水"],["discriminate","識別する"],["unilateral weakness","一側の機能低下"],["body sway","身体の揺れ"],["upright","まっすぐ立った"]],"past":null},{"n":2,"title":"Screening for childhood obesity and vascular conditions","paras":["The proposed study includes children aged between 9-10 years from the SCOPE (Screening for Pregnancy Endpoints) study. The SCOPE study was conducted in Adelaide during 2005-2008 and 1164 nulliparous pregnant women, their partners and babies were recruited. Detailed information was collected during pregnancy. Of the 1164 women in the study, 861 had uncomplicated pregnancies, 93 developed preeclampsia, 118 had gestational hypertension, 95 normotensive women delivered SGA babies and 69 delivered preterm.","We will invite all children of women recruited to the SCOPE study to participate at age 9-10 years. Data will be collected on diet, physical activity, height and weight. Haemodynamic measures will be done noninvasively as follows. Central blood pressure and augmentation index (an indicator of arterial stiffness) will be measured using the USCOM BP+. Cardiac output and systemic vascular resistance will be measured using the USCOM 1A. Microvascular function will be assessed by Post Occlusive Reactive Hyperaemia method using Laser Doppler. The results of children born after complicated pregnancies will be compared with those of children born after uncomplicated pregnancies."],"q":"What daily activities of the child subjects in this clinical trial will be observed?","opts":["If they had preeclampsia.","Their eating and exercise habits.","If they have siblings."],"key":"B","qja":"この臨床研究では、対象の子どものどんな日常活動が観察されるか？","ja":"【小児肥満と血管疾患のスクリーニング】本研究はSCOPE（妊娠エンドポイントのスクリーニング）研究から生まれた9〜10歳の子どもを対象とする。SCOPE研究は2005〜2008年にアデレードで行われ、1164人の初産婦とそのパートナー、赤ちゃんが登録された。妊娠中に詳細な情報が収集された。1164人中、861人は合併症のない妊娠、93人は妊娠高血圧腎症、118人は妊娠高血圧、95人の正常血圧女性がSGA児を出産し、69人が早産した。SCOPE研究に登録された女性の子ども全員を9〜10歳時点で招待する。食事、身体活動、身長、体重のデータを収集する。血行動態は非侵襲的に測定する。中心血圧とAugmentation Index（動脈硬化の指標）はUSCOM BP+で、心拍出量と全身血管抵抗はUSCOM 1Aで測定。微小血管機能はレーザードップラーによる阻血後反応性充血法で評価する。合併症妊娠後に生まれた子どもの結果を、合併症のない妊娠後に生まれた子どもと比較する。","o":[["妊娠高血圧腎症があったかどうか","❌ 妊娠高血圧腎症は『母親』の妊娠合併症。子どもの日常活動ではない。"],["食習慣と運動習慣","✅ Data will be collected on diet, physical activity の言い換え。"],["きょうだいがいるかどうか","❌ 本文に出てこない。"]],"exp":"設問の daily activities と本文の diet, physical activity を結びつける。数字が大量に出てくるが、設問に関係するのは1行だけ。","pt":"→ 型：数字の多い本文は設問キーワードで1行に絞り込む。数字は読み飛ばしてよい。","doubt":null,"voc":[["nulliparous","未産（初産）の"],["recruit","（研究に）登録する"],["uncomplicated","合併症のない"],["preeclampsia","妊娠高血圧腎症"],["gestational hypertension","妊娠高血圧"],["normotensive","血圧が正常な"],["preterm","早産（で）"],["haemodynamic","血行動態の"],["noninvasively","非侵襲的に"],["arterial stiffness","動脈の硬さ"],["cardiac output","心拍出量"],["sibling","きょうだい"]],"past":null},{"n":3,"title":"South Australia worst for children's asthma hospitalizations according to new report","paras":["A new report has revealed that more South Australian children are hospitalised because of their asthma than anywhere else in the country. Between 2011 and 2013, 361 children per 100,000 on average presented to South Australian hospitals, above the rates for NSW and Victoria. There were only 157 presentations per 100,000 people in Tasmania, which has the highest prevalence at 12.6 per cent. Asthma Australia chief executive Michele Goldman said the number of hospital cases in South Australia was unusual and finding out why was the \"magic question.\" She said the condition was often overlooked in GP appointments, which could make management of it tricky. \"There's not enough time currently in the system to provide the education that's required so that people with asthma understand the condition, understand the role of preventer medication and have the tools they need to self-manage the condition well,\" Ms Goldman said."],"q":"What reason is given in this article that explains why hospitalisation of children with asthma is worse in South Australia?","opts":["Lack of time to upskill asthma sufferers.","Lack of time to upskill GP practice staff about asthma.","Lack of time to upskill hospital staff about asthma."],"key":"A","qja":"南オーストラリア州で小児喘息の入院が多い理由として、この記事は何を挙げているか？","ja":"【南オーストラリア州、小児喘息の入院で最悪：新報告】新しい報告で、南オーストラリア州は喘息で入院する子どもが国内で最も多いことが明らかになった。2011〜2013年、南豪州の病院には10万人あたり平均361人の子どもが受診し、NSW州やビクトリア州を上回った。有病率が最も高い（12.6%）タスマニア州の受診は10万人あたり157人だけだった。Asthma Australiaの最高経営責任者Michele Goldman氏は、南豪州の入院件数は異例で、その理由を解明することが『核心の問い』だと述べた。喘息はGPの診察で見過ごされがちで、管理が難しくなりうるという。「喘息の人が病気を理解し、予防薬の役割を理解し、自己管理に必要な手段をもてるようにする教育を行う時間が、今の制度には十分にない」とGoldman氏は述べた。","o":[["喘息患者のスキルを高める時間の不足","✅ not enough time … to provide the education … so that people with asthma understand … self-manage。upskill＝教育で能力を高める。"],["GP診療所スタッフに喘息の教育をする時間の不足","❌ GPの受診で見過ごされるとは言うが、『スタッフを教育する時間』の話ではない。教育の対象は患者。"],["病院スタッフに喘息の教育をする時間の不足","❌ 病院スタッフの教育は本文にない。"]],"exp":"3択とも『教育する時間の不足』で、違いは『誰を』教育するか（対象）だけ。本文の so that people with asthma understand が対象を決める。","pt":"→ 型：選択肢が1語だけ違うときは、その1語（対象・主語）を本文で特定する。","doubt":null,"voc":[["hospitalise","入院させる"],["present to","（患者が）受診する"],["prevalence","有病率"],["chief executive","最高経営責任者"],["overlooked","見落とされる"],["tricky","やっかいな"],["preventer medication","予防薬（喘息の長期管理薬）"],["self-manage","自己管理する"],["upskill","能力・知識を高める"]],"past":null},{"n":4,"title":"Risks associated with hepatitis B in pregnancy","paras":["Mother-to-child transmission occurs frequently either in the uterus, through placenta leakage, or through exposure to blood or blood-contaminated fluids at or around the time of birth (Lee et al 2006). Perinatal transmission is believed to account for 35–50% of hepatitis B carriers (Yao 1996). The risk of perinatal transmission is associated with the hepatitis B envelope antigen (HbeAg) status of the mother. If a woman is both hepatitis surface antigen (HbsAg) and HbeAg positive, 70–90% of her children will develop hepatitis B (Stevens et al 1975; Akhter et al 1992). If the mother is HbsAg positive but HbeAg negative, the risk is reduced (Okada et al 1976; Beasley et al 1977; Beasley et al 1983; Nayak et al 1987; Aggarwal Ranjan 2004). In a cohort study of HbsAg-positive, hepatitis B DNA-positive women in Sydney (n=313) (Wiseman et al 2009), transmission rates were 3% among hepatitis B DNA-positive women overall, 7% among HbsAg-positive mothers and 9% among women with very high hepatitis B DNA levels. It has been estimated that people who are chronic carriers of HbsAg are 22 times more likely to die from hepatocellular carcinoma or cirrhosis than noncarriers (95%CI 11.5 to 43.2) (Beasley & Hwang 1984)."],"q":"Most children born will develop hepatitis B if their mother","opts":["has hepatitis B envelop antigen.","is a chronic carrier of hepatitis surface antigen.","has hepatitis B envelop and surface antigen."],"key":"C","qja":"母親がどうであれば、生まれる子どもの大半がB型肝炎を発症するか？","ja":"【妊娠中のB型肝炎に伴うリスク】母子感染は、子宮内での胎盤からの漏出、あるいは出生時前後の血液や血液汚染体液への曝露により頻繁に起こる。周産期感染がB型肝炎キャリアの35〜50%を占めると考えられている。周産期感染のリスクは母親のHBe抗原の状態と関連する。女性がHBs抗原陽性かつHBe抗原陽性なら、子どもの70〜90%がB型肝炎を発症する。HBs抗原陽性でもHBe抗原陰性なら、リスクは低くなる。シドニーのHBs抗原陽性・HBV-DNA陽性女性のコホート研究（n=313）では、感染率はHBV-DNA陽性女性全体で3%、HBs抗原陽性の母親で7%、HBV-DNAが非常に高い女性で9%だった。HBs抗原の慢性キャリアは、非キャリアに比べ肝細胞癌や肝硬変で死亡する確率が22倍高いと推定されている。","o":[["HBe抗原をもっている","❌ HBe抗原『単独』の場合のデータはない。本文の70〜90%は HBs と HBe の『両方』陽性の場合。"],["HBs抗原の慢性キャリアである","❌ 慢性キャリアの22倍は『本人の死亡リスク』の話。子どもへの感染率ではない。"],["HBe抗原とHBs抗原の両方をもっている","✅ If a woman is both HBsAg and HBeAg positive, 70–90% of her children will develop hepatitis B。most children＝70〜90%。"]],"exp":"設問の most children を70〜90%と結びつける。Bの数字（22倍）は別の人（母親本人）のアウトカムで、主語のすり替え。","pt":"→ 型：数値の根拠文は『誰の・何の』数値か（母→子の感染 / 本人の死亡）を確認してから使う。","doubt":null,"voc":[["mother-to-child transmission","母子感染"],["uterus","子宮"],["placenta","胎盤"],["perinatal","周産期の"],["account for","〜を占める"],["carrier","保有者・キャリア"],["envelope antigen","エンベロープ抗原（HBe抗原）"],["surface antigen","表面抗原（HBs抗原）"],["cohort study","コホート研究"],["hepatocellular carcinoma","肝細胞癌"],["cirrhosis","肝硬変"]],"past":null},{"n":5,"title":"Memo: Revised guidelines for managing urethral catheters in adults","paras":["The purpose of this guideline is to provide the best practice principles to be applied when inserting and managing urethral catheters for adult patients in NSW Public Health Organisations (PHOs), to reduce unnecessary catheterisation and the risk of the catheter associated urinary tract infection.","This document is intended to support all trained and credentialed healthcare clinicians who are competent in urinary catheter practice for acute care settings. It is the responsibility of the PHO to ensure clinicians whose role involves the insertion, maintenance or removal of urethral catheters are trained and credentialed.","This guideline addresses the insertion, care and removal of urethral catheters in adults during acute care. This guideline does not address suprapubic catheterisation, acute paediatric catheterisation or care and use of chronic or long term catheters for adult patients. This document provides limited advice for maternity and birth settings however these units should refer to local procedures for further clarification."],"q":"Which health care professionals is this guideline NOT targeted at?","opts":["Medical officers, acute care nurses and gynaecologists.","Emergency department nurses, theatre staff and surgical ward staff.","Aged care sector nurses, midwives and paediatricians."],"key":"C","qja":"このガイドラインの対象に『含まれない』医療者はどれか？","ja":"【メモ：成人の尿道カテーテル管理ガイドライン改訂】本ガイドラインの目的は、NSW州公的医療機関で成人患者に尿道カテーテルを挿入・管理する際のベストプラクティスの原則を示し、不要なカテーテル留置とカテーテル関連尿路感染のリスクを減らすことである。本文書は、急性期医療の場で尿道カテーテルの手技に習熟した、訓練・認定済みのすべての医療者を支援することを目的とする。挿入・維持・抜去に関わる臨床家が訓練・認定を受けていることを保証するのは各医療機関の責任である。本ガイドラインは急性期における成人の尿道カテーテルの挿入・ケア・抜去を扱う。恥骨上カテーテル、急性期の小児カテーテル、成人の慢性・長期カテーテルのケアと使用は扱わない。産科・分娩の場については限られた助言しか示さないため、これらの部署は詳細を各施設の手順で確認すること。","o":[["医師、急性期看護師、婦人科医","❌ いずれも急性期で成人の尿道カテーテルに関わりうる＝対象に含まれる。"],["救急外来看護師、手術室スタッフ、外科病棟スタッフ","❌ いずれも急性期医療の現場＝対象に含まれる。"],["高齢者介護部門の看護師、助産師、小児科医","✅ 高齢者介護（長期カテーテル・非急性期）、助産（産科は限定的・各施設手順へ）、小児（acute paediatric catheterisation は対象外）。"]],"exp":"NOT targeted 型。本文の does not address（対象外）と limited advice（限定的）に該当する職種を並べたのがC。acute care が対象範囲のキーワード。","pt":"→ 型：対象範囲の問題は『対象（intended to support …）』と『対象外（does not address …）』の2文を先に探す。","doubt":null,"voc":[["urethral catheter","尿道カテーテル"],["best practice principles","最良とされる実践原則"],["catheterisation","カテーテル留置"],["credentialed","認定を受けた"],["competent","技能を備えた"],["acute care setting","急性期医療の場"],["maintenance","維持・管理"],["suprapubic","恥骨上の"],["paediatric","小児の"],["maternity","産科・出産"],["clarification","明確化・確認"],["midwives","助産師（midwife の複数）"]],"past":null},{"n":6,"title":"Hearing Loss","paras":["Sensorineural hearing loss is caused by lesions of either the inner ear (sensory) or the auditory (8th) nerve. This distinction is important because sensory hearing loss is sometimes reversible and is seldom life threatening. A neural hearing loss is rarely recoverable and may be due to a potentially life-threatening brain tumor—commonly a cerebellopontine angle tumor. An additional type of sensorineural loss is termed auditory neuropathy spectrum disorder, when sound can be detected but the signal is not sent correctly to the brain, and is thought to be due to an abnormality of the inner hair cells or the neurons that innervate them within the cochlea.","By Lawrence R. Lustig, MD, Howard W. Smith Professor and Chair, Department of Otolaryngology–Head and Neck Surgery, Columbia University Medical Center and New York Presbyterian Hospital."],"q":"Why is it important to diagnose what type of hearing loss they have?","opts":["Sensory hearing loss may improve.","Neural hearing loss does not improve.","Sensory hearing loss is caused by brain tumor."],"key":"A","qja":"難聴の種類を診断することがなぜ重要なのか？","ja":"【難聴】感音難聴は、内耳（感覚性）または聴神経（第8脳神経・神経性）の病変によって起こる。この区別が重要なのは、感覚性難聴は時に回復可能で、生命を脅かすことはまれだからである。神経性難聴は回復することがまれで、生命を脅かしうる脳腫瘍（一般には小脳橋角部腫瘍）が原因のことがある。感音難聴のもう一つの型にauditory neuropathy spectrum disorderがあり、音は検出されるが信号が脳に正しく送られない状態で、蝸牛内の内有毛細胞またはそれを支配する神経の異常によると考えられている。","o":[["感覚性難聴は改善する可能性がある","✅ sensory hearing loss is sometimes reversible（時に回復可能）＝may improve。"],["神経性難聴は改善しない","❌ 本文は rarely recoverable（まれにしか回復しない）。does not improve は断定しすぎ。"],["感覚性難聴は脳腫瘍が原因である","❌ 脳腫瘍が原因になりうるのは『神経性』。感覚性と神経性の取り違え。"]],"exp":"ヘッジの強さの一致が決め手。sometimes reversible ≒ may improve（一致）／ rarely recoverable ≠ does not improve（断定化）。","pt":"→ 型：rarely / sometimes / may を『never / always / does not』に変えた選択肢は誤り。ヘッジの強さをそろえて照合する。","doubt":null,"voc":[["sensorineural hearing loss","感音難聴"],["lesion","病変"],["inner ear","内耳"],["auditory nerve","聴神経"],["distinction","区別"],["reversible","回復しうる・可逆性の"],["seldom","めったに〜ない"],["life threatening","生命を脅かす"],["recoverable","回復可能な"],["innervate","支配する（神経が）"],["cochlea","蝸牛"]],"past":null}],"C":[{"n":7,"t":0,"p":0,"q":"Through a brain scan, neuroscientists today can determine an individual's","opts":["abstract reasoning.","abilities.","weaknesses.","academic performance."],"key":"A","ev":"They interpreted intelligence in this case as abstract reasoning, also known as fluid intelligence.","note":"今日できるのは知能（＝抽象的推論）の判定（A）。長所・短所（B・C）の判定は『時間の問題』＝将来の話。","doubt":null,"alt":[],"voc":[["neuroscientist","神経科学者"],["a matter of time","時間の問題"],["aptitude","適性・能力"],["shortcoming","弱点・短所"],["abstract reasoning","抽象的推論"],["fluid intelligence","流動性知能"],["consistent predictor","一貫した予測因子"],["standardized test","標準化されたテスト"]],"past":"C"},{"n":8,"t":0,"p":1,"q":"Which of the following does the Human Connectome Project NOT involve?","opts":["Mapping networks inside the brain.","Understanding how connections in the brain function.","Understanding intellect and emotions.","Assessing researchers."],"key":"D","ev":"researchers at Yale put participants through a series of different tests","note":"NOT。テストを受けたのは参加者で、研究者を評価してはいない（D）。","doubt":null,"alt":[],"voc":[["accurately","正確に"],["connectome","コネクトーム（脳の結合地図）"],["mapping","地図化すること"],["wiring","配線・つながり方"],["intellect","知性"],["motor skills","運動機能"],["assess","評価する"]],"past":null},{"n":9,"t":0,"p":2,"q":"In what way is a connectom
