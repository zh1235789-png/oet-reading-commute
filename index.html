ge would benefit most from this prosthetic?","opts":["Alzheimer's patients","People with memory problems","People with dementia","People who have had strokes"],"key":"B","ev":"a brain prosthetic for people with memory problems","note":"記憶障害のある人全般（B）。A・C・Dはその具体例の一部。","doubt":null,"alt":[],"voc":[["envision","思い描く"],["stimulate","刺激する"],["responsible for","〜を担う"],["dementia","認知症"],["stroke victim","脳卒中を起こした人"],["envisage","想定する"]],"oja":["アルツハイマー病の患者","記憶に問題がある人","認知症の人","脳卒中を起こした人"],"past":null},{"n":22,"t":1,"p":8,"q":"How are human's brains different from those of rats and monkeys?","opts":["They are not yet adapted to accept the prosthetic.","They are far more comprehensive.","They contain a greater number of neurons.","They are able to process different amounts of data."],"key":"C","ev":"Rat brains have about 200 million neurons; humans have 86 billion.","note":"ニューロン数が桁違いに多い（C）。","doubt":null,"alt":[],"voc":[["rhesus monkey","アカゲザル"],["prefrontal cortex","前頭前皮質"],["grapple","取り組む・立ち向かう"],["comprehensive view","全体像"],["biased","偏った"],["broader swaths of data","より広い範囲のデータ"],["anticipated","見込まれる"],["pack into","詰め込む"]],"oja":["人工装置を受け入れられるようにまだ適応していない。","はるかに包括的である。","神経細胞の数がはるかに多い。","処理できるデータ量が異なる。"],"past":null}]},{"id":"07","texts":[{"title":"","paras":["In an aging world the rampant destruction of families and emotions due to Alzheimer's disease is increasing. Around the planet forty-seven million people are living with the disease at an annual cost of $236 billion (when other forms of dementia are factored in). The estimated 5.4 million Americans suffering from this disease require 18.1 billion hours of unpaid care each year—an especially daunting reality during a time when Medicare and Social Security are under attack, as many other costs exist. By 2050 Alzheimer's treatment and care is expected to top $1 trillion, bumping Medicare costs up by 360 percent.","Eli Lilly's recent attempt at a cure has set the company back hundreds of millions of dollars and may result in thousands of layoffs. High hopes for its drug, solanezumab, were quashed after a recent failed late-stage clinical trial; the company's stock has fallen 11.6 percent in the last two weeks.","Solanezumab targeted beta amyloid deposits in the brain. For the last twenty-five years researchers have speculated that deposits of the amyloid-peptide \"initiates a sequence of events that ultimately lead to AD dementia.\" Thus far companies like Eli Lilly and Biogen have failed to produce potential remedies using this hypothesis. This has not stopped research, however. Earlier this week neuroscience professor Li-Huei Tsai, who is also the director of MIT's Picower Institute for Learning and Memory, announced the results of a potentially game-changing early-stage trial.","In a forthcoming Nature article Tsai and her co-authors report LED lights flickering at a frequency that stimulates gamma oscillations at 40 hertz substantially reduces beta amyloid plaques in mice. Targeting the brain's hippocampus, a critical region in memory formation and retention, researchers temporarily suppressed these proteins. As with all such trials the researchers remain cautiously hopeful. Tsai says, \"It's a big 'if,' because so many things have been shown to work in mice, only to fail in humans. But if humans behave similarly to mice in response to this treatment, I would say the potential is just enormous, because it's so noninvasive, and it's so accessible.\"","Forty hertz is the typical gamma oscillation in human brains; these waves range from twenty-five to a hundred hertz. (Trials in Tsai's lab at other levels were not effective.) Since 2009 researchers have been able to induce gamma waves in mice using optogenetics, a technique first dreamed up by Francis Crick in the late nineties that utilizes light in order to influence cellular activity in living tissues. It is now considered a breakthrough method for changing neuronal behavioral patterns.","Tsai and her team found that an hour of stimulation at forty hertz resulted in a 40-50 percent reduction in plaques while enhancing gamma oscillations. The proteins returned to their original levels within a day, leaving researchers to wonder if longer courses of treatment will more effectively, or even permanently, reduce protein growth. While the rush for a cure continues, preventive measures are becoming increasingly important. Meditation has been shown to influence gamma activity, while listening to binaural beats might yield positive results.","Movement is among the most important facets of memory control and retention. One of exercise's main benefits is neurogenesis, which includes the production of IGF-1 and BDNF, proteins that are protective against dementia. Keeping active significantly increases your brain's hippocampal volume, resulting in improved memory. One of our age's most damaging effects is the outsourcing of memory that instant access to technology offers. Studies have shown using GPS reduces hippocampal volume; checking the internet for every question instead of thinking through ideas and seeking alternate means is another memory-draining habit that has become commonplace.","Perhaps most interestingly is the importance of cognitive variety, flexibility, and cultivating an ability to consider opposing beliefs. As with bones, our brains operate best when met with resistance. Social interactions and daydreaming are essential for memory retention as well. Engaging in creative pursuits and flow states are ways to strengthen your memory system, as are learning new languages and instruments—basically, anything that challenges your current skill set."]},{"title":"","paras":["There is an old saying in education that girls cry tears while boys cry bullets. In other words, females are allowed in our society to express their vulnerability and less pleasant emotions such as sadness. While boys must remain stoic and shoulder the burden quietly or else get angry, and express their pain not through outbursts of emotion, but instead through action. Might there be a biological phenomenon behind these culture-based roles? A study published online in the journal Depression and Anxiety suggests so. It found that boy's brains react differently than girls in the aftermath of a highly stressful event.","Researchers at Stanford University discovered this by scanning the insula, or insular cortex, of boys and girls who had PTSD (Post-traumatic Stress Disorder) and comparing them to those who didn't. This is a region deep within our brain responsible for integrating emotions. Feelings and the sensation of pain are processed here. It is also where empathy emanates from. The insula takes in data from other parts of the body and related areas of the brain, and incorporates it all into emotions and actions.","This is the first study to denote a gender difference in how the brain reacts to PTSD. In girls, the insula developed or aged rapidly. The same process was not observed in boys. Victor Carrion, MD was the study's author. He is a professor of psychiatry and behavioral sciences at the university. Dr. Carrion told the Stanford Medicine News Center that this particular region played a key role in PTSD's development. \"The difference we saw between the brains of boys and girls who have experienced psychological trauma is important because it may help explain differences in trauma symptoms between sexes,\" he said.","This is a substantial breakthrough, as it could help neurologists develop personalized treatment options for PTSD sufferers depending on gender. With children and teens, while some who are exposed to a serious trauma do develop PTSD, others don't. Researchers still aren't sure why that is. They do know that girls are more likely to develop it than boys.","In this study, the brains of 59 participants, each between the ages of 9 and 17, underwent MRI brain scans. 30 of them had PTSD. Another 29 took part as a control group. 16 boys and 14 girls had suffered trauma, while another 14 boys and 15 girls had not. Normal participants showed no differences in insula structure, regardless of gender. Of those who were traumatized, 5 participants experienced one episode of severe trauma, while 25 had been exposed to two or more episodes. Researchers tried to match up participants and controls, comparing those of a similar age and IQ.","The area within the insula that changes due to severe trauma is known as the anterior circular sulcus. Researchers discovered that while in traumatized boys this area grows larger than normal, with girls it shrinks. Another way to look at it is that its development accelerates. These changes in structure are thought to be integral to PTSD's development. The shrinkage seen in female brains may be the reason why girls are more prone to PTSD.","Dr. Megan Klabunde was the study's lead author. She told the BBC, \"Our findings suggest it is possible that boys and girls could exhibit different trauma symptoms and that they might benefit from different approaches to treatment.\" She added that high levels of stress might lead to early puberty in girls, as some previous studies suggest. This breakthrough may also help neuroscientists understand how each gender processes emotions."]}],"B":[{"n":1,"title":"Cost of gastroenteritis in Australia: A healthcare perspective","paras":["Using 2016 prices, the estimated annual direct per capita cost of acute gastroenteritis illness was AUD$14.87 (USD$10.71), equating to AUD$20.27 (USD$14.59) per case. The estimated overall economic burden in Australia was AUD$359 million (USD$258 million; AUD$1.5 million per 100,000 people).","The major contributors to this cost were hospital admissions (57.1%), emergency department visits (17.7%), and general practitioner consultations (14.0%). Children under five years of age have the highest per capita rates of acute gastroenteritis illness; however, service utilisation rates vary by age group and both young children and older adults accounted for a substantial proportion of the overall economic burden attributable to acute gastroenteritis illness.","Conclusions: Although chronic diseases comprise a large cost burden on the healthcare system, acute illnesses, including acute gastroenteritis illness, also impose substantial direct healthcare system costs. Providing data on current cost estimates is useful for prioritizing public health interventions, with our findings suggesting that it would be ideal if targeted interventions to reduce hospitalisation rates among young children and older adults were available."],"q":"In which group of the Australian population is acute gastroenteritis most prevalent?","opts":["It affects all groups equally","Adults aged 57 or over","Children aged 5 years or less"],"key":"C","qja":"豪州人口のどの群で急性胃腸炎が最も多いか？","ja":"【豪州における胃腸炎のコスト：医療の視点から】2016年価格で、急性胃腸炎の年間直接費用は1人あたり14.87豪ドル（10.71米ドル）、1症例あたり20.27豪ドル（14.59米ドル）と推定された。豪州全体の経済的負担は3億5900万豪ドル（2億5800万米ドル、10万人あたり150万豪ドル）と推定された。コストの主な内訳は入院（57.1%）、救急外来受診（17.7%）、GP受診（14.0%）だった。急性胃腸炎の人口あたり罹患率が最も高いのは5歳未満の小児である。ただし医療サービスの利用率は年齢層で異なり、幼い子どもと高齢者の両方が、急性胃腸炎による経済的負担の大部分を占めていた。結論：慢性疾患は医療制度に大きなコスト負担をもたらすが、急性胃腸炎を含む急性疾患も相当な直接医療費を生じさせる。現在のコスト推計を示すことは公衆衛生介入の優先順位付けに有用であり、本結果は、幼い子どもと高齢者の入院率を下げる的を絞った介入があれば理想的であることを示唆している。","o":[["すべての群に等しく影響する","❌ 年齢層で差がある（vary by age group）。"],["57歳以上の成人","❌ 57という数字は入院費の割合（57.1%）の流用。高齢者は『経済的負担』の文脈で出るだけ。"],["5歳以下の子ども","✅ Children under five years of age have the highest per capita rates of acute gastroenteritis illness。prevalent＝罹患率が高い。"]],"exp":"『罹患率（rates of illness）』と『経済的負担（economic burden）』を区別する。高齢者は負担側に出てくるので、設問（prevalent）とは別軸。Bの57は数字の流用。","pt":"→ 型：選択肢の数字が本文の別の数字（57.1%）と一致したら疑う。単位・意味が違えば誤答。","doubt":null,"voc":[["per capita","1人あたりの"],["equating to","〜に相当する"],["economic burden","経済的負担"],["contributor","（費用を）構成する要素"],["hospital admission","入院"],["utilisation rate","利用率"],["account for","占める"],["substantial proportion","かなりの割合"],["attributable to","〜に起因する"],["comprise","構成する・占める"],["impose","課す・もたらす"],["prioritize","優先順位をつける"],["prevalent","多く見られる"]],"past":null},{"n":2,"title":"Millions of Australians suffering from combined physical, mental ill health, new report finds","paras":["A report compiled by the Australian Health Policy Collaboration (AHPC) at Victoria University, found 2.5 million people are living with both mental and physical conditions. It found clear links between the two — people living with chronic physical health issues are at a higher risk of developing mental health conditions, while those suffering ill mental health were also more likely to develop physical illness.","A chart showing that 28 percent of men with back problems, and 27 per cent of women, also suffer mental health issues. It said the combined health conditions affected welfare and education, health services and costs, productivity, employment, and social participation. The research revealed men with mental health conditions were 52 per cent more likely to report having a circulatory system disease than the general population, while women with ill mental health were 41 per cent more likely.","Men with mental health conditions were 28 per more likely to report having back pain, and women were 68 per cent more likely.","\"Improving the physical health of people living with mental health conditions, and conversely, the mental health of people living with physical health conditions, must become a priority to improve the health of all Australians,\" the report said."],"q":"According to this report were women with mental illness more prone to back pain or were men with back pain more prone to mental illness?","opts":["It is more likely that a man with back pain will have a mental illness than it is for a woman with mental illness to develop back pain","It was more likely that a woman with mental illness would develop back pain than it was for a man with back pain to have a mental illness.","It is more likely that a woman with back pain will have a mental illness than it is for a man with mental illness to have back pain"],"key":"B","qja":"この報告によれば、精神疾患のある女性が腰痛になりやすいのと、腰痛のある男性が精神疾患になりやすいのと、どちらがより当てはまるか？","ja":"【数百万人の豪州人が身体・精神の不調を併せもつ：新報告】ビクトリア大学の豪州保健政策共同体（AHPC）がまとめた報告で、250万人が精神と身体の両方の疾患を抱えて生活していることが分かった。両者には明確な関連があり、慢性の身体疾患をもつ人は精神疾患を発症するリスクが高く、精神的不調のある人も身体疾患を発症しやすかった。図によれば、腰の問題を抱える男性の28%、女性の27%が精神的な問題も抱えている。これらの併存疾患は福祉・教育、医療サービスと費用、生産性、雇用、社会参加に影響していた。精神疾患のある男性は循環器疾患を報告する可能性が一般人口より52%高く、女性では41%高かった。精神疾患のある男性は腰痛を報告する可能性が28%高く、女性は68%高かった。報告は「精神疾患のある人の身体的健康、逆に身体疾患のある人の精神的健康を改善することを、全豪州人の健康向上のための優先課題とすべきだ」と述べた。","o":[["腰痛のある男性が精神疾患をもつ可能性は、精神疾患のある女性が腰痛になる可能性より高い","❌ 腰痛男性→精神疾患は28%、精神疾患女性→腰痛は68%高い。女性の方が高い。"],["精神疾患のある女性が腰痛になる可能性は、腰痛のある男性が精神疾患をもつ可能性より高い","✅ women were 68 per cent more likely（精神疾患女性→腰痛）＞ 28 percent of men with back problems（腰痛男性→精神）。"],["腰痛のある女性が精神疾患をもつ可能性は、精神疾患のある男性が腰痛をもつ可能性より高い","❌ 設問と組み合わせが違う（腰痛女性27% vs 精神疾患男性28%）。しかも27＜28で結論も逆。"]],"exp":"『AのうちBの人の割合』と『AはB になりやすい（more likely）』の方向を1つずつ対応させる。28という数字が2回（男性の腰痛→精神／精神→腰痛）出てくるのも罠。","pt":"→ 型：because/with の方向（X with Y と Y with X）を図式化する。『原因→結果』の向きを逆にした選択肢が必ず混ざる。","doubt":null,"voc":[["compile","取りまとめる"],["collaboration","共同事業体・連携組織"],["chronic physical health issue","慢性の身体疾患"],["circulatory system disease","循環器疾患"],["welfare","福祉"],["productivity","生産性"],["social participation","社会参加"],["conversely","逆に"],["prone to","〜になりやすい"]],"past":null},{"n":3,"title":"Incontinence management using an electronic continence pad.","paras":["Urinary incontinence is an embarrassing and disabling problem, and a major determining factor for nursing home placement. It affects 2 million Australians at a cost of $1 billion per annum. In residential aged-care facilities, incontinence detection and documentation and accurate assessment of voiding patterns are necessary to implement effective best practice continence management.","However, current processes are labour and time intensive. Current practices also frequently breach infection control standards for staff and threaten the dignity and privacy of the incontinent person. There is a lack of valid instrumentation to assess incontinence and monitor continence care.","The AEGIS Continence Management System comprises a sensor inserted in a pad liner which detects and monitors wetness. It then transmits the information, via radio link, to a nurse's pager and to a tailored software application that creates continence assessment charts. The project will include AEGIS I which is the existing prototype detecting wetness, the AEGIS II that monitors degree and volume of wetness and the AEGIS III that detects chemical markers of infection or other clinical conditions."],"q":"What is a key problem facing staff trying to assess and manage incontinence?","opts":["There are no effective equipment available to monitor levels of incontinence","Radio links break so nurses do not know a patient has pressed their call bell","Patients always have a urine infection"],"key":"A","qja":"失禁の評価・管理をしようとするスタッフが直面する主な問題は何か？","ja":"【電子式失禁パッドによる失禁管理】尿失禁は恥ずかしく生活に支障をきたす問題で、介護施設入所の主要な決定要因である。豪州で200万人が罹患し、年間10億ドルの費用がかかっている。入所型高齢者介護施設では、効果的なベストプラクティスの失禁管理を行うには、失禁の検出と記録、排尿パターンの正確な評価が必要である。しかし現行の手順は労力と時間がかかる。また現行の方法は、スタッフの感染対策基準に違反することが多く、失禁のある人の尊厳とプライバシーを脅かす。失禁を評価し、失禁ケアをモニターする妥当な機器がない。AEGIS失禁管理システムは、パッドライナーに挿入したセンサーで湿りを検出・監視する。その情報を無線で看護師のポケットベルと専用ソフトに送り、失禁評価表を作成する。本プロジェクトには、湿りを検出する既存の試作機AEGIS I、湿りの程度と量を監視するAEGIS II、感染などの化学マーカーを検出するAEGIS IIIが含まれる。","o":[["失禁の程度をモニターできる有効な機器がない","✅ There is a lack of valid instrumentation to assess incontinence and monitor continence care の言い換え。"],["無線が途切れるため、患者がナースコールを押しても看護師が気づかない","❌ radio link は新システムの仕組みとして出るだけ。ナースコールも途切れる話もない。"],["患者は常に尿路感染症をもっている","❌ 感染は AEGIS III が検出する対象の一つにすぎない。always は根拠なし。"]],"exp":"However 以降が『現状の問題点』。後半の新システムの説明（radio link, infection）から語を借りた選択肢は問題点ではない。","pt":"→ 型：problem を問われたら However / current practices の段落に限定する。解決策の段落の語を使った選択肢は誤り。","doubt":null,"voc":[["urinary incontinence","尿失禁"],["disabling","生活に支障をきたす"],["determining factor","決定的な要因"],["placement","（施設への）入所"],["per annum","1年あたり"],["voiding pattern","排尿のパターン"],["labour intensive","手間のかかる"],["breach","違反する"],["dignity","尊厳"],["instrumentation","計測機器"],["comprise","〜から成る"],["pad liner","パッドの内張り"],["transmit","送信する"],["prototype","試作機"]],"past":null},{"n":4,"title":"Quality of Life in the Elderly - Health related quality of Life: influences","paras":["Some of the factors that influence health-related quality of life (eg, institutionalization, reduced life expectancy, cognitive impairment, disability, chronic pain, social isolation, functional status) may be obvious to health care practitioners. Practitioners may need to ask about others, especially social determinants of health (ie, the social, economic, and political conditions that people experience from birth to death and the systems put in place to prevent illness and treat it when it occurs).","Other important factors include the nature and quality of close relationships, cultural influences, religion, personal values, and previous experiences with health care. However, how factors affect quality of life cannot necessarily be predicted, and some factors that cannot be anticipated may have effects. Also, perspectives on quality of life can change. For example, after a stroke that caused severe disability, patients may choose treatment (eg, life-saving surgery) to sustain a quality of life that they would have considered poor or even unacceptable before the stroke."],"q":"There are many factors that affect a person's quality of life. Which particular features of a person's life are most apparent to a physician?","opts":["Friendship, spirituality and employment history","Changing attitudes to quality of life, effect of a stroke and effects of surgery","Limited life span ongoing pain and loneliness"],"key":"C","qja":"QOLに影響する要因は多い。医師にとって最も明白なのは、その人の生活のどの特徴か？","ja":"【高齢者のQOL：健康関連QOLへの影響因子】健康関連QOLに影響する要因の一部（施設入所、余命の短縮、認知障害、障害、慢性疼痛、社会的孤立、機能状態など）は、医療者にとって明白かもしれない。それ以外、特に健康の社会的決定要因（生まれてから死ぬまでに経験する社会的・経済的・政治的条件と、病気の予防・治療のための仕組み）については尋ねる必要があるかもしれない。その他の重要な要因には、親密な関係の性質と質、文化的影響、宗教、個人の価値観、過去の医療経験がある。ただし、要因がQOLにどう影響するかは必ずしも予測できず、予期しない要因が影響することもある。また、QOLの捉え方は変わりうる。例えば重い障害を残した脳卒中の後、以前なら低い・受け入れがたいと考えたQOLを維持するために、患者が治療（救命手術など）を選ぶことがある。","o":[["友人関係、信仰、職歴","❌ 関係・宗教は『尋ねる必要がある』側の要因で、明白なものではない。"],["QOLに対する態度の変化、脳卒中の影響、手術の影響","❌ 脳卒中・手術は『捉え方が変わる』ことの例。明白な要因のリストではない。"],["限られた余命、続く痛み、孤独","✅ may be obvious to health care practitioners のリスト中の reduced life expectancy / chronic pain / social isolation の言い換え。"]],"exp":"設問の most apparent to a physician ＝ 本文の may be obvious to health care practitioners。この1文の括弧内リストだけが対象。","pt":"→ 型：設問の形容詞（apparent）の同義語（obvious）を本文で探し、その文の括弧内リストと照合する。","doubt":null,"voc":[["institutionalization","施設入所"],["life expectancy","余命"],["cognitive impairment","認知機能障害"],["social isolation","社会的孤立"],["functional status","生活機能の状態"],["social determinants of health","健康の社会的決定要因"],["anticipate","予測する"],["perspective","見方・捉え方"],["sustain","保つ・維持する"],["unacceptable","受け入れがたい"],["apparent","明らかな"],["spirituality","信仰心・精神性"]],"past":null},{"n":5,"title":"Chronic kidney disease","paras":["Chronic kidney disease (CKD) refers to all conditions of the kidney, lasting at least 3 months, where a person has had evidence of kidney damage and/or reduced kidney function, regardless of the specific diagnosis of disease or condition causing the disease. Evidence of kidney damage manifests as either urinary protein or albumin (a type of protein that is a more sensitive and specific marker of kidney disease), blood in the urine, or scarring detected by imaging tests.","CKD is categorised into 5 stages according to the level of reduced kidney function and evidence of kidney damage. Stages of CKD are measured by the glomerular filtration rate, which is the amount of blood the kidneys clear of waste products in one minute. Because this rate cannot easily be measured directly, current practice is to estimate it by applying a formula based on age, gender and creatinine (a breakdown product of a molecule found in muscle that is important for energy storage) in the blood. An individual can move up and down through the first four stages of severity, but once they reach stage 5, their kidney function does not usually improve."],"q":"The severity of kidney disease is diagnosed by checking what?","opts":["The amount of blood that passes through the kidneys","The amount of waste in the blood that is cleared by the kidneys","The amount of urine that passes through the kidneys"],"key":"B","qja":"腎臓病の重症度は何を調べて診断されるか？","ja":"【慢性腎臓病】慢性腎臓病（CKD）とは、原因となる疾患・病態の具体的診断にかかわらず、腎障害の所見や腎機能低下が少なくとも3か月続く腎臓のあらゆる状態を指す。腎障害の所見は、尿蛋白またはアルブミン（腎臓病のより感度・特異度の高い蛋白マーカー）、血尿、画像検査での瘢痕として現れる。CKDは腎機能低下の程度と腎障害の所見により5つのステージに分類される。ステージは糸球体濾過量（1分間に腎臓が老廃物を除去する血液の量）で測定される。この値は直接測るのが難しいため、現在は年齢・性別・血中クレアチニン（エネルギー貯蔵に重要な筋肉中の分子の分解産物）に基づく式で推定する。人は最初の4ステージの間は重症度が上下しうるが、ステージ5に達すると腎機能は通常改善しない。","o":[["腎臓を通過する血液の量","❌ GFRは『通過』ではなく『老廃物を除去（clear of waste products）』した血液の量。"],["腎臓によって除去される血中の老廃物の量","✅ 公式キーB。the amount of blood the kidneys clear of waste products（老廃物を除去する働き）を指す選択肢。"],["腎臓を通過する尿の量","❌ 尿量ではない。"]],"exp":"GFRの定義文（the amount of blood the kidneys clear of waste products in one minute）を読み取る。Aは『血液の量』という語だけ一致させて clear of waste を落としている。","pt":"→ 型：定義文の動詞（clear / pass through）まで一致しているか確認。名詞だけの一致は罠。","doubt":"⚠️ 厳密にはGFRは『老廃物を除去された血液の量』でBの言い方（老廃物の量）とも少しずれる。キーはB。","voc":[["regardless of","〜にかかわらず"],["manifest as","〜として現れる"],["albumin","アルブミン"],["scarring","瘢痕化"],["categorised into","〜に分類される"],["glomerular filtration rate","糸球体濾過量"],["clear of waste products","老廃物を除去する"],["applying a formula","計算式を当てはめること"],["creatinine","クレアチニン"],["breakdown product","分解産物"],["severity","重症度"]],"past":null},{"n":6,"title":"Memo: Caspofungin 70mg powder for concentrate for solution for infusion","paras":["Cadiasun Pharma GmBH has informed us that there is an error on the patient information leaflet for the above product. The error is on the portion of the leaflet which is intended for Healthcare Professionals, in the sections providing instructions for preparation of both 70mg/m2 and 50mg/m2 infusion for paediatric patients >3 months of age.","In the incorrect version of the leaflet, the final concentration of the solution is given as 5.2mg/ml for both dilutions. The correct final concentration is 7.2mg/ml, however in addition to the error on the Patient Information Leaflet, there is also an error on the Summary of Product Characteristics for the product.","The heading for preparation of the 70mg/m2 infusion for paediatric patients > 3 months and the heading for preparation of the 50mg/m2 infusion for paediatric patients > 3 months incorrectly state in brackets 'using a 50-mg vial'. The headings should read as follows:","Preparation of the 70 mg/m2 infusion for paediatric patients > 3months of age (using a 70-mg vial)","Preparation of the 50 mg/m2 infusion for paediatric patients > 3months of age (using a 70-mg vial)","Steps have already been taken to correct the errors on both the patient information leaflet and the Summary of Product Characteristics.","Please note, the patient information leaflet and Summary of Product Characteristics for the 50mg presentation of the product are correct."],"q":"What is the issue being raised in this memo?","opts":["There are errors in one part of the patient information leaflet","There are errors in two parts of the patient information leaflet","There are errors in three parts of the patient information leaflet"],"key":"B","qja":"このメモで提起されている問題は何か？","ja":"【メモ：カスポファンギン70mg 点滴静注用粉末】Cadiasun Pharma社から、上記製品の添付文書（患者向け情報リーフレット）に誤りがあるとの連絡を受けた。誤りはリーフレットの医療者向け部分にあり、3か月超の小児に対する70mg/m2と50mg/m2の両方の点滴調製手順の項である。誤った版では、両方の希釈で最終濃度が5.2mg/mLとされている。正しい最終濃度は7.2mg/mLである。なお添付文書の誤りに加え、製品概要（SmPC）にも誤りがある。3か月超の小児向け70mg/m2点滴調製と50mg/m2点滴調製の見出しに、括弧書きで誤って『50mgバイアル使用』とある。見出しは以下が正しい：『3か月超の小児向け70mg/m2点滴の調製（70mgバイアル使用）』『3か月超の小児向け50mg/m2点滴の調製（70mgバイアル使用）』。添付文書とSmPCの誤りはすでに訂正の措置がとられている。なお50mg製剤の添付文書とSmPCは正しい。","o":[["患者向け情報リーフレットの1か所に誤りがある","❌ 誤りは70mg/m2と50mg/m2の『両方』の項にある。"],["患者向け情報リーフレットの2か所に誤りがある","✅ in the sections providing instructions for preparation of both 70mg/m2 and 50mg/m2 ＝ 2つの項。"],["患者向け情報リーフレットの3か所に誤りがある","❌ 見出しの誤りはSmPC側の話として追加で述べられており、リーフレットの3か所目ではない。"]],"exp":"リーフレット（PIL）とSmPCという2つの文書が出てくるので、どちらの誤りかを分けて数える。both 70 and 50 の both が決め手。","pt":"→ 型：数を問う設問は、本文の both / each / all を拾って数え、別の文書・対象の分を混ぜない。","doubt":null,"voc":[["leaflet","添付文書・説明書"],["intended for","〜向けの"],["preparation","調製"],["infusion","点滴（静注）"],["paediatric","小児の"],["concentration","濃度"],["dilution","希釈（液）"],["Summary of Product Characteristics","製品概要書"],["in brackets","かっこ内に"],["vial","バイアル（薬瓶）"],["presentation","（薬の）剤形・規格"]],"past":null}],"C":[{"n":7,"t":0,"p":0,"q":"What's the author's concern in the first paragraph?","opts":["That Alzheimer's disease is on the rise.","That the costs for the treatment for Alzheimer's disease are on the rise.","That the unpaid care for Alzheimer's disease is on the rise.","That families are being destroyed by Alzheimer's disease."],"key":"B","ev":"By 2050 Alzheimer's treatment and care is expected to top $1 trillion","note":"公式キーB：治療費の増大。第1段落は数字（236 billion, 18.1 billion hours, $1 trillion, 360%）の大半がコストの話。","doubt":null,"alt":[],"voc":[["rampant","歯止めが効かない・猛威を振るう"],["factored in","計算に入れた"],["unpaid care","無償の介護"],["daunting","気の遠くなるような"],["under attack","攻撃にさらされて"],["top","〜を超える"],["bump up","押し上げる"],["on the rise","増加している"]],"oja":["アルツハイマー病が増えていること。","アルツハイマー病の治療費が増えていること。","アルツハイマー病への無償の介護が増えていること。","アルツハイマー病によって家族が壊されていること。"],"past":null},{"n":8,"t":0,"p":1,"q":"What brought about the financial difficulties of Eli Lilly?","opts":["The competition from another company.","Lack of funding.","Their effort to introduce a cure for Alzheimer's.","The fact that their stocks plummeted by 11.6%."],"key":"C","ev":"Eli Lilly's recent attempt at a cure has set the company back hundreds of millions of dollars","note":"治療薬開発の試み（失敗）が数億ドルの損失に（C）。株価下落（D）は結果であって原因ではない。","doubt":null,"alt":[],"voc":[["attempt at a cure","治療法開発の試み"],["set back","（金銭的に）損をさせる"],["layoff","解雇"],["quashed","打ち砕かれた"],["late-stage clinical tria episode of severe trauma."],"key":"C","ev":"while another 14 boys and 15 girls had not","note":"対照群29人はトラウマ経験なし（C）。16人の男子はトラウマ群。","doubt":null,"alt":[],"voc":[["underwent","（検査を）受けた（undergo）"],["control group","対照群"],["regardless of gender","性別を問わず"],["traumatized","心的外傷を受けた"],["episode","（出来事の）一回・エピソード"],["match up","条件をそろえる"]],"oja":["男子16人がトラウマを経験していた。","男子14人がトラウマを経験していた。","男女とも誰もトラウマを経験していなかった。","5人が重度のトラウマを1回経験していた。"],"past":null},{"n":20,"t":1,"p":4,"q":"Which of these factors was not considered in the study?","opts":["Gender","Age","IQ","Background"],"key":"D","ev":"comparing those of a similar age and IQ","note":"NOT。考慮したのは性別・年齢・IQ。生い立ち（D）は出てこない。","doubt":null,"alt":[],"voc":[["participant","参加者"],["similar age and IQ","同程度の年齢とIQ"],["factor","要素・条件"],["background","生い立ち・背景"]],"oja":["性別","年齢","IQ","生い立ち"],"past":null},{"n":21,"t":1,"p":5,"q":"The changes in the structure of the insula suggest","opts":["That the traumas are very severe.","That traumatized boys develop PTSD.","That girls are more prone to have psychological issues than boys.","Why girls are more likely than boys to develop PTSD."],"key":"D","ev":"The shrinkage seen in female brains may be the reason why girls are more prone to PTSD.","note":"なぜ女子の方がPTSDになりやすいか（D）。Cは『心理的問題全般』に拡大しすぎ。","doubt":null,"alt":[],"voc":[["anterior circular sulcus","前方の輪状溝"],["shrink","縮む"],["accelerate","加速する"],["integral to","〜に不可欠な"],["shrinkage","萎縮・縮小"],["prone to","〜になりやすい"]],"oja":["トラウマが非常に重いということ。","トラウマを受けた男子がPTSDを発症するということ。","女子は男子より心理的な問題を抱えやすいということ。","なぜ女子の方が男子よりPTSDになりやすいのかということ。"],"past":null},{"n":22,"t":1,"p":6,"q":"What could be the outcomes of the study as suggested in paragraph 7?","opts":["Development of different preventative medicine towards boys and girls.","Development of different treatment methods for boys and girls.","Development of new techniques to treat trauma symptoms.","Development of new treatments to prevent trauma."],"key":"B","ev":"they might benefit from different approaches to treatment","note":"男女で異なる治療法（B）。A・Dの『予防』は本文にない。","doubt":null,"alt":[],"voc":[["lead author","筆頭著者"],["exhibit","示す"],["benefit from","〜から恩恵を受ける"],["approach to treatment","治療のやり方"],["puberty","思春期（第二次性徴）"],["processes emotions","感情を処理する"],["preventative","予防の"]],"oja":["男女で異なる予防薬の開発。","男女で異なる治療法の開発。","トラウマ症状を治す新しい技術の開発。","トラウマを予防する新しい治療法の開発。"],"past":null}]},{"id":"08","texts":[{"title":"","paras":["Cancer, of course, is not new. Throughout the ages societies have defined and dealt with it variously. Ancient Greeks employed the term to describe tumors: mass, burden. It is an apt translation of what cancer does inside of our bodies. In Emperor of All Maladies Siddhartha Mukherjee travels to the root of onkos.","Nek is an Indo-European term that represents an active form of \"load.\" It means to carry, to move the burden from one place to the next, to bear something across a long distance and bring it to a new place. It is an image that captures not just the cancer cell's capacity to travel—metastasis—but also Atossa's journey, the long arc of scientific discovery—and embedded in that journey, the animus, so inextricably linked with human, to outwit, to outlive and survive. As Atul Gawande recently expressed in conversation with musician Andrew Bird—Bird asked the doctor how cancer forms, given a severe bout his wife had recently undergone—we all grow cancer cells every day. Fortunately, our bodies are designed to not let them metastasize. Then a mutant gets through, our body under attack.","Certain cancers are genetic—my testicular cancer two years ago is one such case, given a childhood condition that predisposed me to it. Yet many are environmental. More importantly, where genetics and environment meet is either a breeding ground or defense system for cancer. Cigarettes have always been the former, like letting streptococcal bacteria loose in a sauna.","A recent study published in Science reminds us just how dangerous cigarettes are. It turns out that hundreds of DNA cells are in danger of mutation in what scientists believe is impactful enough to leave an \"archaeological record.Smoking a pack a day leads to the following number of potential mutations every single year 150 in the lungs; 97 in the larynx or voice box; 23 in the mouth; 18 in the bladder; six in the liver. Each mutation increases the risk of cells becoming cancerous.","Every cigarette contains at least 60 carcinogens, which is why six million people die because of cigarette-related (and thus avoidable) cancers every year. Tobacco has been implicated in 17 types of cancer. While the researchers remind us that smoking is \"mechanistically complex,\" and there are multiple factors when considering cancer, they conclude: Although we cannot exclude roles for covariate behaviors of smokers or differences in the biology of cancers arising in smokers compared with nonsmokers, smoking itself is most plausibly the cause of these differences.","Forty-five percent of American adults puffed tobacco 60 years ago. This is partly the result of the hundreds of millions of dollars manufacturers were pouring into advertising. The 1955 introduction of the Marlboro Man increased sales by a whopping 5,000 percent over eight months. Peak consumption hit in the early sixties, with sales of nearly $5 billion in America alone.","It's been a long, slow withdrawal. In 1956, Richard Doll and Bradford Hill began questioning the role of cigarettes in lung cancer. Today we view the Mad Men-esque nonchalance of lighting up as a romantic throwback to a better time. Yet since January 1, 1971, cigarette ads have been banned on television. That decade marked a profound turn in our understanding of just how dangerous cigarettes are.","Still, addictions persist. While Utah is just over 12 percent smokers, and California in second at 15 percent, Kentucky leads the charge with 30.2 percent of its population. West Virginia and Mississippi follow closely behind. That means over 1.3 million people still smoke in Kentucky. Even though that state doubles the percentage of California smokers, around 5.8 million people still light up on the west coast.","Mukherjee, whose brilliant book on cancer is lucid and frightening, has spent a lot of time in cancer wards around the world. In one passage he describes a fraction of the devastation: \"An ebullient, immaculately dressed young advertising executive who first started smoking to calm his nerves had to have his jawbone sliced off to remove an invasive tongue cancer. A grandmother who taught her grandchildren to smoke and then shared cigarettes with them was diagnosed with esophageal cancer. A priest with terminal lung cancer swore that smoking was the only vice that he had never been able to overcome. He then describes that even while going through this, many patients refuse to surrender their vice: \"I could smell the acrid whiff of tobacco on their clothes as they signed the consent forms for chemotherapy.\""]},{"title":"","paras":["According to the National Institutes of Health, we spend about 26 years of our life asleep, one-third of the total. The latest research states that between 6.4 and 7.5 hours of sleep per night is ideal for most people. But some need more and others less. A contingent out there, mostly women, who do surprisingly well on just six hours.There is even some data to suggest that a slim minority, around three percent of the population, thrive on just three hours sleep per night, with no ill effects. Of course, most people need much more. Even though in general, Americans are getting far less sleep today than in the past.","Cutting out needful rest could damage your health, long-term. A recent study showed that sleep is essential to clearing the brain of toxins that build up over the course of the day. It also helps in memory formation and allows other organs to repair themselves. Our professional lives and our natural cycles don't always mesh. Often, they are at odds. What if you are insanely busy, like ten times the norm? Say you are going to medical school, earning your PhD, or are trying to get a business off the ground. There may not be enough hours in the day for what you have to do. One thing you can do is rearrange your sleep cycle to give yourself more time.","Paleoanthropologists claim that our ancestors probably didn't sleep for seven hours at a clip, as it would make them easy prey. Instead, they probably slept at different periods throughout the day and night, and you can too. What we consider a \"normal\" sleep cycle is called monophasic. This is sleeping for one long period throughout the night. In some Southern European and Latin American countries, the style is biphasic. They sleep five to six hours per night, with a 60-90 minute siesta during midday. There is a historical precedent too. Before the advent of artificial light, most people slept in two chunks each night of four hours each, with an hour of wakefulness in-between. That's also a biphasic system.","Then there is polyphasic sleep. This is sleeping for different periods and amounts of time throughout the day. Certain paragons of history slept this way including Leonardo Da Vinci, Nikola Tesla, Franz Kafka, Winston Churchill, and Thomas Edison, among others. The idea gained popularity in the 1970's and 80's among the scientific community. Buckminster Fuller, a famous American inventor, architect, and philosopher of the 1900's, championed this kind of slumber. So what's the science behind this radical system? Unfortunately, no long-term research has been conducted, yet. One 2007 study, published in the Journal of Sleep Research, found that most animals sleep on a polyphasic schedule, rather getting their sleep all at once. This also begs the question, how much sleep does the human brain need to function properly? The answer is unknown.","Sleep is broken into three cycles. There is light sleep, deep sleep, and rapid eye movement (REM) sleep. The last one is considered the most important and restful of phases. We don't stay in any one phase for long. Instead, we cycle through these constantly throughout the night. So with polyphasic sleep, the idea is to experience these three phases in shorter amounts of time, and wake up rested.","We don't know the exact purpose of these phases. Sleep is still something of a mystery. Without a good understanding, it's difficult to quantify the impact a polyphasic schedule has. One question is whether such a schedule allows for enough REM sleep. Polyphasic practitioners say they are able to enter the REM phase quickly, more so than with a monophasic style. Jost, for example, claimed he could enter REM sleep immediately. This quick entry into the REM state is known as \"repartitioning.\" The deprivation of sleep may help the body enter REM quickly, as an adaptation."]}],"B":[{"n":1,"title":"Focus: wound/infection control. New solutions for wound healing","paras":["Treating skin tissue damaged by burns and other trauma, diabetes or vascular disease is a major challenge and a burden on healthcare systems. Several advanced skin graft treatments exist but they are costly, come with risks such as host rejection, excessive scarring and potentially disease transmission, and are limited to treating shallow wounds where formation of blood vessels is less important.","The emergence of 3D printing tools and techniques, biofabrication of tissue materials from biologically compatible materials offers the possibility of not only reducing availability and cost of treatment issues, but also the prospect of treating deep wounds comprising several tissue layers. The layered fabrication method could also accommodate the use of wound healing proteins, stem cells and anti-inflammatory drugs during the printing process, as well as creating more complex tissue structures that could eventually include vascular networks that facilitate oxygen and nutrient exchange to hair follicles and sweat glands. Even though the biological complexities of human skin are relatively well understood, appropriate repair mechanisms are scarce and often costly."],"q":"In this article what might eventually be made on a 3D printer?","opts":["Skin with its various layers, components and blood supply.","Skin including nerve cells, stem cells and sweat follicles.","Skin, with muscles, tendon and blood vessels."],"key":"A","qja":"この記事によれば、将来3Dプリンターで作れるかもしれないものは何か？","ja":"【焦点：創傷／感染管理。創傷治癒の新たな解決策】熱傷やその他の外傷、糖尿病、血管疾患で損傷した皮膚組織の治療は大きな課題であり、医療制度の負担となっている。高度な皮膚移植治療はいくつかあるが、高価で、拒絶反応、過剰な瘢痕、感染症伝播の可能性といったリスクがあり、血管形成があまり重要でない浅い創傷の治療に限られる。3Dプリンティングの道具と技術の登場、生体適合材料による組織材料のバイオファブリケーションは、治療の入手性や費用の問題を減らすだけでなく、複数の組織層からなる深い創傷を治療できる見込みも与える。積層造形法では、プリント過程で創傷治癒タンパク質、幹細胞、抗炎症薬を組み込むこともでき、将来的には毛包や汗腺への酸素・栄養交換を担う血管網を含む、より複雑な組織構造を作れる可能性がある。ヒトの皮膚の生物学的な複雑さは比較的よく理解されているが、適切な修復手段は乏しく、高価であることが多い。","o":[["様々な層・構成要素・血液供給を備えた皮膚","✅ several tissue layers（層）＋ hair follicles and sweat glands（構成要素）＋ vascular networks（血液供給）。eventually に対応するのは could eventually include vascular networks。"],["神経細胞・幹細胞・汗の毛包を含む皮膚","❌ 神経細胞は本文にない。幹細胞はプリント時に『加える材料』で作るものではない。sweat follicles という組み合わせも本文にない。"],["筋肉・腱・血管を備えた皮膚","❌ 筋肉・腱は本文にない。"]],"exp":"設問の eventually が本文の could eventually include … と対応。正解はその文の内容を抽象化（components, blood supply）している。","pt":"→ 型：設問の時間語（eventually / currently）を本文で探すと、該当文が一発で見つかる。","doubt":null,"voc":[["vascular disease","血管疾患"],["burden","負担"],["skin graft","皮膚移植"],["host rejection","拒絶反応"],["excessive scarring","過剰な瘢痕形成"],["disease transmission","病気の伝播"],["shallow wound","浅い創傷"],["emergence","登場・出現"],["biofabrication","生体材料による作製"],["compatible","適合する"],["prospect","見込み"],["accommodate","受け入れる・組み込む"],["stem cell","幹細胞"],["anti-inflammatory","抗炎症の"],["facilitate","促す"],["hair follicle","毛包"],["sweat gland","汗腺"],["scarce","乏しい"]],"past":null},{"n":2,"title":"Therapeutic Objectives in the Elderly","paras":["When treatments are very likely to achieve benefits and very unlikely to have adverse effects, decisions are relatively easy. However, assessing the relative importance of these quality of life factors to each patient is important when treatments may have discordant effects. For example, aggressive cancer therapy may prolong life but have severe adverse effects (e.g., chronic nausea and vomiting, mouth ulcers) that greatly reduce quality of life.","In this case, the patient's preference for quality vs duration of life and tolerance for risk and uncertainty help guide the decision whether to attempt cure, prolongation of life, or palliation. The patient's perspective on quality of life may also affect treatment decisions when different treatments (e.g., surgical vs drug treatment of severe angina or osteoarthritis) may have different efficacies, toxicities, or both. Practitioners can help patients understand the expected consequences of various treatments, enabling patients to make more informed decisions."],"q":"What three options are generally available for discussion when a person is faced with making a decision about what treatment pathway to take for their illness?","opts":["Modifying their lifestyle to deal with the illness, accepting that they cannot be cured, taking all treatment options available.","Managing the side effects of treatment, consider declining treatment, revising their expectations of whether they will be cured.","Extending life-expectancy, treating the symptoms to lessen their effect, understanding how different treatments affect the body."],"key":"C","qja":"病気の治療方針を決める際、一般に話し合う3つの選択肢は何か？","ja":"【高齢者の治療目標】治療が利益をもたらす可能性が非常に高く、有害事象の可能性が非常に低い場合、判断は比較的容易である。しかし治療の効果が相反する場合には、こうしたQOL要因が各患者にとってどれほど重要かを評価することが大切である。例えば積極的ながん治療は寿命を延ばしうるが、QOLを大きく下げる重い副作用（慢性の悪心・嘔吐、口内炎など）を伴うことがある。この場合、QOLと生存期間のどちらを重視するか、リスクと不確実性をどこまで許容するかという患者の希望が、治癒を目指すか、延命か、緩和かという判断の指針となる。異なる治療（重症狭心症や変形性関節症の手術治療と薬物治療など）で有効性や毒性が異なる場合も、患者のQOLに対する考え方が治療判断に影響しうる。医療者は、様々な治療から予想される結果を患者が理解できるよう助け、より情報に基づいた決定をできるようにする。","o":[["病気に対処するため生活習慣を変える、治らないと受け入れる、あらゆる治療を受ける","❌ 生活習慣の話はない。"],["副作用を管理する、治療を断ることを検討する、治癒への期待を見直す","❌ 治療拒否・期待の見直しは本文の3択（cure / prolongation / palliation）に対応しない。"],["余命を延ばす、症状を和らげて影響を減らす、治療が体にどう影響するかを理解する","✅ 公式キーC。prolongation of life（延命）＋ palliation（緩和）＋ understand the expected consequences of various treatments。"]],"exp":"本文の3択は cure / prolongation of life / palliation。Cは延命・緩和の2つを含み、3つ目を『治療の影響を理解する』（最終文）に置き換えている。","pt":"→ 型：専門語（palliation）を平易な言い換え（treating the symptoms to lessen their effect）に変換できるかが勝負。","doubt":"⚠️ 本文の3択（治癒・延命・緩和）と完全には一致しない設問。最も多く対応するCがキー。","voc":[["adverse effect","有害作用"],["discordant","相反する"],["aggressive therapy","積極的な治療"],["prolong","延ばす"],["nausea","吐き気"],["mouth ulcer","口内炎"],["preference","希望・選好"],["tolerance for risk","リスクの許容度"],["palliation","緩和（症状の軽減）"],["angina","狭心症"],["osteoarthritis","変形性関節症"],["efficacy","有効性"],["toxicity","毒性"],["informed decision","十分に理解した上での決定"],["decline treatment","治療を断る"]],"past":null},{"n":3,"title":"Treatment or management of chronic kidney disease","paras":["Early CKD is usually asymptomatic and must be actively sought to be recognised. Kidney function is measured by the glomerular filtration rate (GFR), which is the amount of blood the kidneys clear of waste products in one minute. As GFR cannot be measured directly, current practice is to estimate GFR (eGFR) by applying a formula that includes age, gender and creatinine levels in the blood. Kidney function can also be tested by measuring the levels of albuminuria (type of protein) in the urine, but this testing requires follow-up, as CKD is diagnosed where albuminuria is seen to be persistent in the urine for at least three months.","General practitioners (GPs) are the usual source of initial assessment and diagnosis of CKD and have a variety of options available for treating the condition, including the ordering of imaging and pathology tests, prescribing of medications and, where necessary, referral to a specialist. Best practice management of CKD utilizes a collaborative effort, involving at least the individual and their GP, but also including practice nurses and/or allied health professionals as appropriate."],"q":"Why does a urine test to check for Chronic Kidney Disease have to be followed up on?","opts":["The urine test has to be compared with the blood test results so a formula can be applied to confirm CKD.","The urine is tested for a protein that has to be present for 90 days to confirm CKD.","The urine test has to be repeated to ensure the results are accurate before CKD can be confirmed."],"key":"B","qja":"CKDを調べる尿検査は、なぜフォローアップが必要なのか？","ja":"【慢性腎臓病の治療・管理】早期CKDは通常無症状で、積極的に探さないと見つからない。腎機能は糸球体濾過量（GFR）＝1分間に腎臓が老廃物を除去する血液の量で測る。GFRは直接測定できないため、現在は年齢・性別・血中クレアチニン値を含む式でGFRを推定する（eGFR）。腎機能は尿中のアルブミン（蛋白の一種）の量でも評価できるが、この検査はフォローアップが必要である。CKDは、尿中アルブミンが少なくとも3か月持続して認められた場合に診断されるからだ。GPはCKDの初期評価と診断を担うのが通常で、画像・検体検査のオーダー、薬の処方、必要に応じた専門医紹介など様々な選択肢をもつ。CKDの最善の管理は、少なくとも本人とGP、必要に応じて診療所看護師や他の医療専門職が関わる協働によって行われる。","o":[["CKDを確定するため、尿検査を血液検査の結果と比べて式を当てはめる必要がある","❌ 式を使うのは血液（クレアチニン）によるeGFR。尿検査とは別の方法。"],["尿中の蛋白が90日間存在することを確認してCKDを確定する","✅ albuminuria is seen to be persistent … for at least three months（3か月≒90日）。"],["CKDを確定する前に結果が正確か確かめるため、尿検査を繰り返す必要がある","❌ 繰り返す理由は『正確さの確認』ではなく『持続の確認』。理由のすり替え。"]],"exp":"as CKD is diagnosed where … の as が理由を示す接続詞。Cは『繰り返す』という事実は合っているが理由が違う。","pt":"→ 型：why 問題は because / as / since の後ろを取る。行為が合っていても理由がずれた選択肢は誤り。","doubt":null,"voc":[["asymptomatic","無症状の"],["actively sought","積極的に探される"],["estimate","推定する"],["albuminuria","アルブミン尿"],["persistent","持続する"],["initial assessment","初期評価"],["pathology test","検体検査"],["referral","紹介"],["collaborative effort","協働"],["allied health professional","コメディカル（他職種の医療専門職）"],["as appropriate","必要に応じて"]],"past":null},{"n":4,"title":"Position Statement on Medicinal Cannabis","paras":["It is the position of the NSW Nurses and Midwives' Association that:","Access to cannabis for therapeutic purposes should be supported where patients, in consultation with their treating health professionals, receive some benefit or symptoms are alleviated. Clinical trials should be conducted to develop the evidence base. Approved pharmaceutical cannabis products should be accessible and affordable. A legal framework must be established so that patients or their carers who are in possession of cannabis for personal, therapeutic purposes should have a complete legal defence from arrest or prosecution. A legal framework must be established so that approved cannabis products can be developed and sold for the purposes of therapeutic use. Cannabis misuse should be approached primarily as a health issue rather than a criminal issue and we support an appropriate harm-reduction response."],"q":"What is the NSW Nurses and Midwives Association stance regarding carers found in possession of cannabis?","opts":["Carers, assessed by health professionals, should be protected from legal action against them.","Carers should be arrested and prosecuted.","Carers should be referred to health professionals."],"key":"A","qja":"大麻を所持している介護者について、NSW看護師・助産師協会の立場は？","ja":"【医療用大麻に関する方針声明】NSW看護師・助産師協会の立場は以下のとおり。患者が治療担当の医療者と相談したうえで利益を得る、または症状が緩和される場合には、治療目的の大麻へのアクセスを支持すべきである。エビデンスを構築するため臨床試験を行うべきである。承認された医薬品としての大麻製品は入手しやすく手頃な価格であるべきだ。個人的な治療目的で大麻を所持する患者やその介護者が、逮捕・起訴から完全に法的に保護されるよう、法的枠組みを整備しなければならない。承認された大麻製品が治療目的で開発・販売できるよう、法的枠組みを整備しなければならない。大麻の乱用は、犯罪の問題としてではなく主に健康の問題として扱うべきであり、適切なハームリダクションの対応を支持する。","o":[["医療者の評価を受けた介護者は、法的措置から保護されるべきだ","✅ patients or their carers who are in possession of cannabis for personal, therapeutic purposes should have a complete legal defence from arrest or prosecution。"],["介護者は逮捕・起訴されるべきだ","❌ 真逆。"],["介護者は医療者に紹介されるべきだ","❌ 『健康問題として扱う』は大麻の乱用（misuse）についての記述。介護者の所持の話ではない。"]],"exp":"carers という語は本文に1回だけ。その文の legal defence from arrest or prosecution が答え。Cは別の文（misuse → health issue）と混ぜている。","pt":"→ 型：設問の人物（carers）が本文に1回しか出ないなら、その1文だけで答えが決まる。","doubt":null,"voc":[["position statement","方針声明"],["medicinal cannabis","医療用大麻"],["therapeutic purposes","治療目的"],["in consultation with","〜と相談のうえ"],["alleviate","和らげる"],["evidence base","エビデンスの土台"],["affordable","手の届く価格の"],["legal framework","法的枠組み"],["in possession of","〜を所持している"],["legal defence","法的な保護・抗弁"],["prosecution","起訴"],["misuse","乱用・誤用"],["harm-reduction","被害を減らす（ハームリダクション）"],["stance","立場"]],"past":null},{"n":5,"title":"Memo to all staff re: Mandatory FONT requirements bulletin","paras":["Completion of all components of the FONT program is mandatory for all NSW Health maternity clinicians (including Obstetricians, General Practitioner Obstetricians, Trainees in Obstetric Medicine, Registered Midwives and midwifery students).","This is to occur in three yearly cycles and will consist of:","16 hours to complete the online K2MS Perinatal Training Programs (once every three years) which includes:","Fetal Monitoring Training System (including 15 Cardiotocograph (CTG) 'Training Simulator' cases)","2½ hours to complete two K2MS - Fetal Monitoring Training System 'Training Simulator' CTG case studies (every year within the cycle where the entire Fetal Monitoring Training System is not completed)","Fetal Welfare Assessment ('F')","Obstetric emergencies and Neonatal resuscitation Training (ONT').","Chief Executives of Local Health Districts – are responsible for:","Supporting:","FONT Facilitators to provide the face-to-face sessions","Maternity clinicians to complete the mandatory FONT requirements","Monitoring FONT completion compliance."],"q":"How much cardiotocography training must be completed to complete the FONT programme?","opts":["Two face to face training sessions and fifteen case studies every three years.","Two CTG's studies and fifteen welfare assessments every three years.","Sixteen hours online training every three years and two and half hours annually."],"key":"C","qja":"FONTプログラムを修了するには、どれだけのCTG（胎児心拍陣痛図）研修が必要か？","ja":"【全スタッフ宛メモ：FONT必須要件のお知らせ】FONTプログラムの全構成要素の修了は、NSW州保健局のすべての産科臨床家（産科医、GP産科医、産科研修医、登録助産師、助産学生を含む）に義務づけられている。3年周期で行い、内容は以下のとおり：オンラインのK2MS周産期研修プログラムを16時間（3年に1回）。これには胎児モニタリング研修システム（15件のCTG『トレーニング・シミュレーター』症例を含む）が含まれる。2.5時間でK2MS胎児モニタリング研修システムの『トレーニング・シミュレーター』CTG症例2件を修了（周期内で研修システム全体を修了しない年は毎年）。胎児健康評価（F）。産科救急と新生児蘇生の研修（ONT）。地域保健区の最高責任者の責務：FONTファシリテーターによる対面研修の実施支援、産科臨床家の必須要件修了の支援、修了状況の監視。","o":[["3年ごとに対面研修2回と症例15件","❌ 対面研修の回数は書かれていない。15件はオンライン研修内の症例数。"],["3年ごとにCTG研究2件と胎児健康評価15件","❌ 数字（2・15）の組み合わせを入れ替えた誤答。"],["3年ごとにオンライン研修16時間、毎年2時間半","✅ 16 hours … (once every three years) ＋ 2½ hours … (every year within the cycle …)。"]],"exp":"数字（16・15・2・2½）が入り乱れる本文。選択肢の『数字＋単位＋頻度』の3点セットで照合する。","pt":"→ 型：数字問題は数字だけでなく『単位（時間・件）』と『頻度（3年ごと・毎年）』もセットで照合する。","doubt":null,"voc":[["mandatory","必須の"],["completion","修了"],["maternity clinician","産科にかかわる医療者"],["obstetrician","産科医"],["trainee","研修医"],["midwifery student","助産学生"],["cycle","周期"],["perinatal","周産期の"],["fetal monitoring","胎児モニタリング"],["cardiotocograph","胎児心拍陣痛図（CTG）"],["neonatal resuscitation","新生児蘇生"],["compliance","遵守"]],"past":null},{"n":6,"title":"Choice of meter for the individual with diabetes","paras":["The choice of a blood glucose meter for the person with diabetes will depend on a variety of factors including ease of use, size and portability, type of strip (e.g. canister, individual foil-wrapped strip or strip-free), amount of blood required, suitability for alternate site testing and other additional features such as memory and download capability, alarms and back lights.","Individuals with sight or dexterity problems will need a meter that accommodates these issues.","Many people with type 1 diabetes use more than one blood glucose meter, and may require a meter to measure blood ketone levels, a smart meter that assists in insulin bolus calculations or a meter that relays blood glucose levels to their insulin pump. Capillary blood samples are best taken from the side of the finger, but avoiding close proximity to the nail bed, particularly when blood glucose levels are changing rapidly. Some blood glucose meters allow the measurement of glucose levels from small samples of blood from the forearm and other sites."],"q":"Where is the best place to take blood from to monitor blood glucose levels?","opts":["Near the nail bed.","The si  night","一晩あたり"],["schedule","スケジュール・取り方"]],"oja":["午後の長い睡眠。","60〜90分の午後の睡眠。","通常の5〜6時間の睡眠の後にとる20分の睡眠。","ラテンアメリカの二相性睡眠の一部。"],"past":null},{"n":20,"t":1,"p":3,"q":"What do scientists suggest about sleep in the fourth paragraph?","opts":["That in order to be successful you need to have polyphasic sleep.","They can't explain why many animals have polyphasic sleep.","They have no answers about what proper sleep is as no studies have been carried out.","They have no specific answers about the amount of sleep we require."],"key":"D","ev":"This also begs the question, how much sleep does the human brain need to function properly? The answer is unknown.","note":"必要な睡眠量は分かっていない（D）。Cの『研究が一切ない』は no long-term research の拡大解釈。","doubt":null,"alt":[],"voc":[["polyphasic","多相性の（細切れに眠る）"],["paragon","模範的な人物"],["gain popularity","広まる・人気を得る"],["champion","支持する・提唱する"],["slumber","眠り"],["radical","型破りな"],["begs the question","〜という疑問を投げかける"],["function properly","正常に働く"]],"oja":["成功するには多相性睡眠が必要だということ。","多くの動物が多相性睡眠をとる理由を説明できないということ。","研究が行われていないので、適切な睡眠が何かについて答えがないということ。","必要な睡眠量について具体的な答えがないということ。"],"past":null},{"n":21,"t":1,"p":4,"q":"What does the author say about the way we sleep in the fifth paragraph?","opts":["That we all experience polyphasic sleep.","That we all sleep in cycles.","We cycle when we go to sleep.","That polyphasic sleep makes us feel rested."],"key":"B","ev":"we cycle through these constantly throughout the night","note":"誰もが周期を繰り返して眠る（B）。","doubt":null,"alt":[],"voc":[["broken into","〜に分けられる"],["light sleep","浅い眠り"],["rapid eye movement sleep","レム睡眠"],["restful","休息になる"],["phase","段階・相"],["cycle through","順に巡る"],["rested","休まった"]],"oja":["私たちは皆、多相性睡眠を経験しているということ。","私たちは皆、周期を繰り返して眠っているということ。","眠りにつくときに周期を回るということ。","多相性睡眠は休息感をもたらすということ。"],"past":null},{"n":22,"t":1,"p":5,"q":"Why are some scientists skeptical about the success of polyphasic sleep?","opts":["Because they believe that it is a myth.","Because they believe that it allows people to enter the REM phase more quickly.","They suspect that it may not allow for enough REM sleep.","They don't believe that the repartitioning phase can be achieved."],"key":"C","ev":"One question is whether such a schedule allows for enough REM sleep.","note":"十分なレム睡眠がとれるかという疑問（C）。","doubt":null,"alt":[],"voc":[["quantify","数値で捉える"],["allow for","〜を可能にする・見込む"],["practitioner","実践している人"],["repartitioning","（睡眠段階の）再配分"],["deprivation","欠乏・はく奪"],["adaptation","適応"],["myth","俗説・作り話"],["suspect","疑う・〜ではないかと思う"]],"oja":["それが俗説だと考えているから。","レム睡眠に早く入れるようになると考えているから。","十分なレム睡眠がとれないのではないかと疑っているから。","再配分の段階に到達できるとは思っていないから。"],"past":null}]},{"id":"09","texts":[{"title":"","paras":["Heart failure patients have weakened hearts, but researchers say an experimental drug used for the first time in humans may repair heart cells and improve heart function. According to the results of a small phase 1 trial, a single intravenous infusion of the drug cimaglermin was safe and, at high doses, improved heart function for at least three months.","\"Right now we have many therapies that we use for heart failure, and these patients [in the study] were on all of those therapies and still had significant heart dysfunction,\" said lead researcher Dr. Daniel Lenihan. He's a professor of medicine and director of Vanderbilt University's heart clinical research program in Nashville.","People with heart failure often take a combination of drugs, Lenihan said. These include medications to lower blood pressure and diuretics to help remove excess fluid that builds up as a result of the heart's labored pumping ability. In addition, some people have implanted defibrillators or pacemakers. Even with all these options, the death rate among these patients is \"unacceptably high,\" Lenihan said.","Heart failure, a condition where the heart can't pump enough blood to meet the body's needs, is among the leading causes of death worldwide. A significant number of heart failure patients don't respond well to current treatments, particularly those patients whose left lower heart chamber, which pumps blood into the arteries, is weak, Lenihan said.","Cimaglermin acts as a growth factor for the heart, helping it repair itself following injury, Lenihan said. Specifically, it binds to the HER2 and HER4 receptors on the surface of heart cells that are important for cellular repair and survival, he explained.","Researchers have tried using stem cells to repair heart muscle in much the same way, he said, but these efforts have not been effective. \"You don't see any sustained effect,\" he added.","A phase 1 trial like this one is designed to see if a new drug is safe, not to test its effectiveness. Before cimaglermin could be used to treat patients, it must prove its worth in a series of progressively larger and challenging trials and then be approved by the U.S. Food and Drug Administration. The process can take several years. Based on these preliminary findings, larger trials are being planned, Lenihan said. \"This drug, although still in an experimental phase, might be an important way to improve heart function in patients with heart failure,\" he said.","For the study, Lenihan and his colleagues randomly assigned 40 patients to get an infusion of cimaglermin or a placebo. Compared with patients who received a placebo, patients given a high dose of cimaglermin had a sustained increase in the heart's ability to pump blood. The improvement lasted 90 days, with the maximum increase in heart function reached in 28 days, the researchers found. The most common side effects were headache and nausea directly after receiving the drug. One patient who received the highest dose of cimaglermin developed abnormal liver function, which cleared up over a two-week period, Lenihan said.","Despite the encouraging results of this first trial, a lot more testing will be needed before cimaglermin can be considered a standard treatment for heart failure, Bishopric said. \"These findings need to be replicated in larger trials, and you have to be able to predict whether improved heart function from cimaglermin will help people live longer and feel better,\" she noted."]},{"title":"","paras":["After years of studies that seemed to swing between dire warnings and cheery promises about what our favorite caffeinated beverages do and don't do, much of the recent science regarding coffee and tea is generally positive.","The WHO's International Agency for Research on Cancer recently took coffee off its list of suspected carcinogens, and some research suggests it could help keep colon cancer from coming back after treatment. Other studies suggest drinking coffee might stave off Alzheimer's and Parkinson's diseases. Various studies have pointed to tea drinkers having lower odds of skin, breast, and prostate cancers.","Researchers are still trying to pinpoint the exact ways that happens. But tea, particularly green tea, is rich in compounds like antioxidants, which can limit cell damage and boost the immune system; and polyphenols, which have been shown to lower blood pressure and cholesterol. It also may help stave off Alzheimer's disease through a polyphenol known as EGCG which prevents the formation of plaques that are linked to that brain-damaging illness.","Is one better for you than the other? Experts say that's hard to say. That's because it's difficult to separate out their different ingredients, their role in your diet, and their effects on different body systems. \"I think people are looking at both coffee and tea and how they affect everything, including cancer and GI disease and cardiovascular diseases,\" says Elliott Miller, MD, a critical care medicine specialist at the National Institutes of Health.","Miller and his colleagues recently looked at signs of heart disease in more than 6,800 people from different backgrounds across the country. About 75% drank coffee, while about 40% reported drinking tea. Drinking more than one cup of tea regularly was linked to less buildup of calcium in arteries that supply blood to the heart, a development that can lead to heart disease. Coffee didn't have an effect either way on heart disease, but that was significant in itself, Miller says. \"Very often patients will ask their doctors, 'Hey, doc, I've got coronary artery disease, or I've got risk factors like high blood pressure or cholesterol. Is it safe for me to drink coffee?' Because everyone thinks drinking coffee makes your heart excited and is potentially bad,\" Miller says. \"So finding that it's neutral, I think, is pretty important.\"","Researchers say it's hard to pinpoint exactly how both drinks affect health. Both coffee and tea are \"complex beverages\" that contain a variety of ingredients. They include caffeine, polyphenols, and antioxidants, compounds researchers are studying for their potential cancer-fighting properties, says Lisa Cimperman, a clinical dietitian at University Hospital Case Medical Center. \"It's more of a dynamic interaction than one single compound,\" Cimperman says.","Some people have tried to isolate one element in tea or coffee that they think is the secret to one effect or another, \"and then they realize that it doesn't have the same effect.\" Cimperman said drinking tea has been linked to lower risks of cancer and heart disease, improved weight loss, and a stronger immune system. Meanwhile, studies point to coffee as a potential way to head off not just Parkinson's but type 2 diabetes, liver disease, and heart problems, Cimperman says.","Another recent study, led by Charles Fuchs, MD, director of the Gastrointestinal Cancer Center at Boston's Dana-Farber Cancer Institute, found regular coffee drinking may help prevent colon cancer from coming back after treatment. In his study of nearly 1,000 patients, Fuchs says, there was a \"significant and linear\" association between drinking coffee and lower risk of colon cancer returning in those who drank four or more cups a day. \"The more coffee they drank, the lower risk of recurrence.\" But the researchers aren't clear on which element of the drink contributed to that result, and there didn't seem to be any effect from drinking tea, he says. \"I think you can have two or more cups a day without any concern, and certainly that may benefit you,\" Fuchs says. But what about for those who don't drink coffee? \"If it was somebody who hates the stuff and asks, 'Should I drink it?' I'd say no. I'd counsel them about diet and exercise and avoiding obesity as measures I think would have a similar benefit.\"","Other researchers are asking questions about what role genetics and lifestyle play into the effects drinking coffee or tea. For instance, coffee and cigarettes once went together like ... well, like coffee and cigarettes, which cause cancer and heart disease. Some people's bodies process coffee differently than others, says Martha Gulati, MD, head of cardiology at the University of Arizona College of Medicine in Phoenix. Meanwhile, a preference for tea over coffee might reflect other healthier behaviors, she says. \"Does someone who drinks tea do yoga or meditation more?\" Gulati says. \"I'm not necessarily saying they're associated, but do they exercise more? Are they drinking things like green tea to maintain their weight better than other types of drinks?\""]}],"B":[{"n":1,"title":"Developing diagnostic tests for respiratory disease using sound measurement and machine learning techniques – clinical trial","paras":["This study is designed to develop accurate digital diagnostic tests, used on a smart device, for common respiratory illnesses in children and adults including asthma, croup, bronchiolitis, COPD and pneumonia. These tests can then be used in resource-poor communities, emergency departments or via telehealth applications.","The aim is to develop tests that are as accurate as an expert clinical assessment but do not need a clinical examination or other investigations such as x-rays to be performed. Patients with a history of a chronic respiratory condition or who have symptoms of an acute respiratory disease are included.","Patients will be excluded if they: have an inability to provide a cough either spontaneously or voluntarily; are unable to provide informed consent or assent; have severe respiratory distress including the use of CPAP or BiPAP or have had abdominal or eye surgery within 3 months."],"q":"The clinical trial is","opts":["open to people with severe respiratory symptoms.","exploring new ways to confirm a person has a respiratory disorder.","aimed at checking that expert clinical assessments are accurate."],"key":"B","qja":"この臨床試験は…","ja":"【音響測定と機械学習を用いた呼吸器疾患の診断検査の開発：臨床試験】本研究は、小児と成人によくある呼吸器疾患（喘息、クループ、細気管支炎、COPD、肺炎など）について、スマートデバイスで使える正確なデジタル診断検査を開発するためのものである。これらの検査は、資源の乏しい地域、救急外来、遠隔医療アプリで使える。目標は、専門家の臨床評価と同等に正確でありながら、診察やX線などの検査を必要としない検査を開発することである。慢性呼吸器疾患の既往がある患者、または急性呼吸器疾患の症状がある患者が対象となる。自発的にも随意的にも咳ができない、インフォームド・コンセントやアセントができない、CPAPやBiPAPを使うなどの重度の呼吸窮迫がある、3か月以内に腹部や眼の手術を受けた場合は除外される。","o":[["重度の呼吸器症状がある人も参加できる","❌ severe respiratory distress は除外基準。"],["呼吸器疾患があることを確認する新しい方法を探っている","✅ develop accurate digital diagnostic tests（新しい診断方法の開発）の言い換え。confirm a person has a respiratory disorder＝診断。"],["専門家の臨床評価が正確であるかを確認することを目的とする","❌ 専門家の評価は『同等の正確さを目指す基準』。評価そのものを検証する試験ではない。"]],"exp":"Cは本文の as accurate as an expert clinical assessment を『専門家の評価を検証する』にすり替えた誤答。比較の基準と研究対象を取り違えさせる。","pt":"→ 型：as accurate as X の X は『基準』であって研究対象ではない。比較構文の役割を確認。","doubt":null,"voc":[["respiratory disease","呼吸器疾患"],["croup","クループ"],["bronchiolitis","細気管支炎"],["resource-poor","資源の乏しい"],["telehealth","遠隔医療"],["clinical assessment","臨床的な評価"],["investigation","検査"],["spontaneously","自発的に"],["voluntarily","意識的に・自分の意思で"],["assent","（小児の）同意・了承"],["respiratory distress","呼吸窮迫"],["abdominal","腹部の"],["disorder","疾患・障害"]],"past":null},{"n":2,"title":"Pregnancy care guideline 2018: Involving an interpreter","paras":["It is the responsibility of the health professional to make sure that communication is clear. Accredited healthcare interpreters assist by translating the discussion between the health professional and the woman, communicating with the woman in her preferred language either in person or through a telephone service. Involving an accredited interpreter, preferably with training in medical terminology, is recommended for all antenatal appointments if the health professional and the woman have difficulty communicating.","Interpreters accredited by NAATI (National Association of Accreditation for Translators and Interpreters) have been assessed as having a high level of technical competence in both English and one or more other languages and are bound by a code of ethics including strict confidentiality. However, there is a shortage of accredited interpreters, particularly for languages of new and emerging communities. While involvement of female interpreters is preferable in antenatal care, their availability may also be limited."],"q":"The guideline highlights","opts":["the need for accredited interpreters at all appointments if there is a language barrier.","that an accredited interpreter is recommended for all antenatal visits.","that health professionals are responsible for translating discussions."],"key":"A","qja":"このガイドラインが強調しているのは…","ja":"【妊娠ケアガイドライン2018：通訳の関与】意思疎通を明確にするのは医療者の責任である。認定医療通訳者は、医療者と女性の会話を通訳し、対面または電話サービスで女性の希望する言語でやりとりする。医療者と女性の間で意思疎通が難しい場合、すべての妊婦健診で、できれば医学用語の研修を受けた認定通訳者の関与が推奨される。NAATI（全国翻訳者・通訳者認定機構）認定の通訳者は、英語と1つ以上の他言語で高い技術的能力を有すると評価されており、厳格な守秘義務を含む倫理規定に拘束される。ただし認定通訳者は不足しており、特に新しい移民コミュニティの言語で顕著である。妊婦ケアでは女性通訳者の関与が望ましいが、その確保も限られる場合がある。","o":[["言語の壁がある場合、すべての受診に認定通訳者が必要である","✅ recommended for all antenatal appointments if the health professional and the woman have difficulty communicating の言い換え（if there is a language barrier）。"],["すべての妊婦健診に認定通訳者が推奨される","❌ 条件（意思疎通が難しい場合）が抜けている。条件の削除。"],["通訳するのは医療者の責任である","❌ 医療者の責任は『意思疎通を明確にすること』。通訳するのは通訳者。"]],"exp":"AとBの違いは if 条件の有無だけ。本文の推奨には if … difficulty communicating という条件がついているので、条件を残しているAが正解。","pt":"→ 型：if 条件を削った選択肢は、本文より範囲が広がる＝誤り。条件節の有無を必ず比較する。","doubt":null,"voc":[["interpreter","通訳者"],["accredited","認定された"],["preferred language","希望する言語"],["in person","対面で"],["medical terminology","医学用語"],["antenatal appointment","妊婦健診"],["competence","能力・技能"],["bound by","〜に拘束される"],["code of ethics","倫理綱領"],["confidentiality","守秘義務"],["shortage","不足"],["emerging community","新しく形成されつつある地域社会"],["availability","確保できること"],["language barrier","言葉の壁"]],"past":null},{"n":3,"title":"Patient safety advice : medication","paras":["It's important you keep track of your medicines – taking the right medicine at the right time will help you get well. Using medicines in the wrong way may cause unwanted side effects. At the hospital you need to tell staff if you have had an allergic or bad reaction to any medicines or if you have trouble swallowing medicines. You should tell staff straight away if you feel unwell after taking any medicine. Let staff know if you think you should have received some medicines, or the medicines appear different. It is important that all medicines are explained to you before you leave the hospital to go home or to another care provider. Always ask your doctor, nurse, or pharmacist if you don't understand your medicine instructions. Questions you should ask about your medicines in hospital are \"What is this medicine for?\", \"Are there any possible side effects?\" and \"Can they be taken safely with other medicines?\""],"q":"The patient safety leaflet encourages patients to","opts":["check the nurse understands the medicine guidelines.","ask staff to clarify the directions to follow about taking their medications.","be sure the doctors ask questions about your medicines."],"key":"B","qja":"患者安全リーフレットが患者に勧めていることは…","ja":"【患者安全のための助言：薬】自分の薬を把握しておくことは大切です。正しい薬を正しいタイミングで飲むことが回復につながります。薬を誤った方法で使うと、望ましくない副作用が起こることがあります。病院では、薬でアレルギーや悪い反応が出たことがある場合、薬を飲み込みにくい場合はスタッフに伝えてください。薬を飲んだ後に気分が悪くなったら、すぐにスタッフに伝えてください。受け取るべき薬を受け取っていないと思う場合や、薬がいつもと違って見える場合も知らせてください。帰宅または他のケア提供者のもとへ移る前に、すべての薬について説明を受けることが大切です。薬の指示が分からない場合は、必ず医師、看護師、薬剤師に尋ねてください。入院中に薬について尋ねるべき質問は『この薬は何のためか』『副作用はあるか』『他の薬と一緒に安全に飲めるか』です。","o":[["看護師が薬のガイドラインを理解しているか確認する","❌ 確認するのは『自分が指示を理解しているか』。看護師の理解度を確認しろとは言っていない。"],["薬の飲み方の指示をスタッフに明確にしてもらう","✅ Always ask your doctor, nurse, or pharmacist if you don't understand your medicine instructions の言い換え（clarify the directions）。"],["医師が薬について質問するよう確認する","❌ 質問するのは患者の方（Questions you should ask）。主語の入れ替え。"]],"exp":"A・Cは『誰が理解する／誰が質問する』の主語を入れ替えた誤答。患者向けリーフレットなので、行動の主語は常に患者。","pt":"→ 型：主語（患者か医療者か）を入れ替えた選択肢は定番。誰の行動かを確認する。","doubt":null,"voc":[["keep track of","把握し続ける"],["get well","回復する"],["side effect","副作用"],["allergic reaction","アレルギー反応"],["swallow","飲み込む"],["straight away","すぐに"],["care provider","ケアを提供する側（施設・担当者）"],["instruction","指示・使い方"],["clarify","はっきりさせる"],["direction","指示・用法"]],"past":null},{"n":4,"title":"Memo to staff re: Escalation process for dispute resolution","paras":["If, on review, the inpatient team disagrees that a patient requires admission to the respective specialty, the inpatient team shall make the onward referral to the alternate specialty. The senior inpatient MO shall provide the alternate specialty with a clinical handover and advice of the time frame in which the patient must be reviewed.","In the event of a dispute regarding inpatient team acceptance of the patient, a Consultant level case conference shall be convened. The case conference shall include the ED, original inpatient and alternative inpatient Consultants. The three Consultants shall make a timely clinical decision regarding the patient's admission.","If the matter remains unresolved, then the case shall be escalated to the Executive Director of Medical Services (EDMS) for a clinical and time urgent decision."],"q":"If the inpatient team cannot agree on accepting a patient who has to attend a case conference?","opts":["The senior MO from the alternative specialty, the ED consultant and the original inpatient team representative.","The patient, the senior patient medical officer and the Executive director of Medical services.","The patient's first consultant, a consultant from the ED and a consultant from the alternative speciality that the inpatient team suggests."],"key":"C","qja":"入院チームが患者の受け入れに合意できない場合、症例検討会に出席しなければならないのは誰か？","ja":"【スタッフ宛メモ：紛争解決のエスカレーション手順】入院チームが検討の結果、患者がその診療科への入院を要しないと判断した場合、入院チームが別の診療科へ紹介する。入院チームの上級医は、別の診療科に臨床引き継ぎを行い、患者を診察すべき期限を伝える。入院チームの受け入れをめぐって争いがある場合は、コンサルタント（指導医）レベルの症例検討会を開く。検討会には救急部（ED）、元の入院チーム、別の入院チームのコンサルタントが参加する。3人のコンサルタントが患者の入院について適時に臨床判断を下す。それでも解決しない場合は、医療サービス担当役員（EDMS）に上げ、臨床的かつ緊急の判断を仰ぐ。","o":[["別の診療科の上級医、EDのコンサルタント、元の入院チームの代表者","❌ 参加者はすべて Consultant レベル。『上級医（senior MO）』『代表者』は職位が違う。"],["患者、上級医、医療サービス担当役員","❌ 患者は参加しない。EDMSは検討会で解決しない場合のエスカレーション先。"],["患者の元の担当コンサルタント、EDのコンサルタント、入院チームが提案する別の診療科のコンサルタント","✅ ED, original inpatient and alternative inpatient Consultants の3人。"]],"exp":"段階が3つある（①別科へ紹介→②コンサルタント検討会→③EDMS）。設問は②の段階。senior MO は①、EDMS は③に出てくる人物で、段階の取り違えを狙っている。","pt":"→ 型：手順が段階的な本文では、設問がどの段階の話かを先に特定する。別段階の人物を混ぜた選択肢は誤り。","doubt":null,"voc":[["escalation process","上位へ引き上げる手順"],["dispute resolution","紛争の解決"],["inpatient team","入院担当チーム"],["admission","入院"],["respective specialty","当該の診療科"],["onward referral","次の科への紹介"],["alternate specialty","別の診療科"],["clinical handover","臨床上の引き継ぎ"],["time frame","期限・時間枠"],["convene","招集する"],["timely","時機を逸しない"],["unresolved","解決しないままの"],["executive director","担当役員"]],"past":null},{"n":5,"title":"Taking a blood pressure reading manually","paras":["Wrap the cuff around the patient's arm and use the INDEX line to determine if the patient's arm circumference falls within the RANGE area. Otherwise, choose the appropriate smaller or larger cuff.","Palpate/locate the brachial artery and position the BP cuff so that the ARTERY marker points to the brachial artery. Wrap the BP cuff snugly around the arm. Ensure the cuff is located about 2.5 cm above the antecubital fossa (crease of the arm).","Perform a preliminary palpatory systolic blood pressure. To achieve this, palpate the arm at the antecubital fossa to locate the brachial artery with your non-dominant hand and ensure the pressure valve is closed. Inflate the bladder until no blood is flowing through the artery and no pulse is palpated. The pressure reading on the sphygmomanometer at this stage is an estimate of the maximum pressure required to measure the systolic pressure. Deflate the cuff and rest the arm for one to two minutes to allow the blood to be released and recirculate."],"q":"How is a preliminary palpatory systolic blood pressure check performed?","opts":["Feeling for a pulse in the crook of the elbow, inflating the sphygmomanometer cuff until the pulse stops and noting the reading after a minute or two.","Feeling for a pulse in the crook of the elbow, inflating the sphygmomanometer cuff until the pulse stops in the non-dominant hand.","Feeling for a pulse in the crook of the elbow, inflating the sphygmomanometer cuff until the pulse stops and noting the reading."],"key":"C","qja":"触診による予備的な収縮期血圧チェックはどのように行うか？","ja":"【手動での血圧測定】カフを患者の腕に巻き、INDEX線で腕周囲長がRANGEの範囲内か確認する。範囲外なら、より小さいまたは大きいカフを選ぶ。上腕動脈を触知して位置を確認し、ARTERYマーカーが上腕動脈を指すようにカフを配置する。カフを腕にぴったり巻く。カフが肘窩（腕の曲がり目）の約2.5cm上にあることを確認する。触診による予備的収縮期血圧測定を行う。そのためには、利き手でない方の手で肘窩を触診して上腕動脈を確認し、圧力バルブが閉じていることを確認する。血流が止まり脈が触れなくなるまでカフを膨らませる。この時点の血圧計の値が、収縮期血圧の測定に必要な最大圧の推定値となる。カフの空気を抜き、血液が戻って再循環するよう1〜2分腕を休ませる。","o":[["肘の内側で脈を触れ、脈が止まるまでカフを膨らませ、1〜2分後に値を読む","❌ 1〜2分は値を読んだ『後』、カフを抜いて腕を休ませる時間。時間の位置のすり替え。"],["肘の内側で脈を触れ、利き手でない方の手で脈が止まるまでカフを膨らませる","❌ 利き手でない手は『触診』に使う手。しかも『非利き手で脈が止まる』という意味不明な文になっている。値を読む工程も抜けている。"],["肘の内側で脈を触れ、脈が止まるまでカフを膨らませ、値を読む","✅ 触診→加圧→脈が消えた時点の値が推定値（The pressure reading … at this stage is an estimate）。"]],"exp":"3択は途中まで同じで、最後の数語だけ違う。違う部分（after a minute or two / in the non-dominant hand）を本文と照合するだけで解ける。","pt":"→ 型：選択肢の前半が同一なら、違う末尾だけを比較する。時間・手・順番の位置ずらしに注意。","doubt":null,"voc":[["cuff","（血圧計の）カフ・腕帯"],["circumference","周囲径"],["palpate","触診する"],["brachial artery","上腕動脈"],["snugly","ぴったりと"],["antecubital fossa","肘窩（ひじの内側のくぼみ）"],["crease","しわ・折れ目"],["preliminary","予備の"],["systolic blood pressure","収縮期血圧"],["non-dominant hand","利き手でない方の手"],["inflate","膨らませる"],["bladder","（カフの）空気袋"],["sphygmomanometer","血圧計"],["deflate","空気を抜く"],["recirculate","再び巡る"],["crook of the elbow","ひじの内側のくぼみ"]],"past":null},{"n":6,"title":"GP Notify guidance for GPs","paras":["GP Notify is an automated notification system that informs GPs about: patient admission; patient discharge; patient death. When a patient is admitted, discharged or dies, the automated computer system will inform the patients nominated GP by email or fax of the update. GPs will receive an enrollment confirmation the first time such an event occurs. The form needs to be completed and faxed for automated notifications to continue. To receive notification via fax or email: you will receive an enrolment confirmation form the first time an event occurs on one of your patients. Once the form is completed and returned via fax, automated notifications will commence. If your contact details change, notify the GP Notify Coordinator. Please note that GPs are responsible for ensuring their details are correct and ensuring fax machines or computer systems provide adequate privacy after transmission."],"q":"When a GPs patients are entered into the GP Notify system, the GP","opts":["Needs to complete and return a confirmation form by fax to confirm they have received the information.","Gets notification via email or fax, unless it is the first time one of their patients has been entered into the GP notify system.","Faxes or emails the GP Notify Coordinator to confirm they have received the message."],"key":"B","qja":"GPの患者がGP Notifyシステムに登録されると、そのGPは…","ja":"【GP向けGP Notifyガイダンス】GP Notifyは、患者の入院・退院・死亡をGPに知らせる自動通知システムである。患者が入院・退院・死亡すると、自動システムがその患者の指定GPにメールまたはFAXで知らせる。GPは初めてこうした出来事が起きたときに登録確認を受け取る。自動通知を続けるには、その用紙に記入してFAXで返送する必要がある。FAXまたはメールで通知を受け取るには：あなたの患者に初めて出来事が起きたときに登録確認用紙が届きます。用紙に記入しFAXで返送すると、自動通知が開始されます。連絡先が変わった場合はGP Notifyコーディネーターに知らせてください。GPは自分の情報が正しいこと、送信後もFAXやコンピューターのプライバシーが適切に保たれる
