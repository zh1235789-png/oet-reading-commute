considered to be a biological phenomenon.","sustained a belief considered to be a cultural concept.","provided biological grounds for something considered to be a cultural concept."],"key":"D","ev":"Might there be a biological phenomenon behind these culture-based roles?","note":"文化的とされてきた役割に生物学的根拠を与えた（D）。","doubt":null,"alt":[],"voc":[["vulnerability","弱さ・もろさ"],["stoic","感情を表に出さない"],["shoulder the burden","重荷を背負う"],["outburst","感情の爆発"],["phenomenon","現象"],["in the aftermath of","〜の後に"],["sustain a belief","考えを裏づける"],["grounds","根拠"]],"past":null},{"n":16,"t":1,"p":1,"q":"Which of the following is not a characteristic of the insula?","opts":["It integrates emotions.","It processes feelings of pain.","Empathy originates there.","It relates areas of the brain."],"key":"D","ev":"The insula takes in data from other parts of the body and related areas of the brain","note":"NOT。島は関連領域から情報を『受け取る』のであって、脳の領域同士を『関連づける』（D）とは言っていない。","doubt":null,"alt":[],"voc":[["insula","島皮質"],["insular cortex","島皮質"],["Post-traumatic Stress Disorder","心的外傷後ストレス障害"],["integrate","統合する"],["sensation","感覚"],["empathy","共感"],["emanate from","〜から生じる"],["take in","取り込む"],["incorporate","組み入れる"],["originate","生じる"]],"past":null},{"n":17,"t":1,"p":2,"q":"Why is this study significant?","opts":["Because it defines gender differences.","Because it may lead to an explanation of gender differences.","Because it may lead to an explanation of traumatic experiences.","Because it may lead to an explanation of variations in trauma symptoms between boys and girls."],"key":"D","ev":"it may help explain differences in trauma symptoms between sexes","note":"男女のトラウマ症状の違いの説明につながりうる（D）。Bは範囲が広すぎる（性差全般）。","doubt":null,"alt":[],"voc":[["denote","示す"],["gender difference","性差"],["aged rapidly","急速に成熟した"],["play a key role","重要な役割を果たす"],["psychological trauma","心的外傷"],["symptom","症状"],["between sexes","男女間で"],["significant","重要な・有意な"]],"past":null},{"n":18,"t":1,"p":3,"q":"What are girls more likely to develop than boys according to the information in paragraph 4?","opts":["Serious traumas","PTSD","Treatment options","Personalized treatment options"],"key":"B","ev":"They do know that girls are more likely to develop it than boys.","note":"it＝PTSD（B）。","doubt":null,"alt":[],"voc":[["substantial breakthrough","大きな前進"],["neurologist","神経内科医"],["personalized treatment option","個別化された治療の選択肢"],["sufferer","患者・苦しんでいる人"],["exposed to","〜にさらされた"]],"past":null},{"n":19,"t":1,"p":4,"q":"In the control group","opts":["16 boys had suffered trauma.","14 boys had suffered trauma.","Neither the boys or girls had suffered trauma.","Five participants experienced one episode of severe trauma."],"key":"C","ev":"while another 14 boys and 15 girls had not","note":"対照群29人はトラウマ経験なし（C）。16人の男子はトラウマ群。","doubt":null,"alt":[],"voc":[["underwent","（検査を）受けた（undergo）"],["control group","対照群"],["regardless of gender","性別を問わず"],["traumatized","心的外傷を受けた"],["episode","（出来事の）一回・エピソード"],["match up","条件をそろえる"]],"past":null},{"n":20,"t":1,"p":4,"q":"Which of these factors was not considered in the study?","opts":["Gender","Age","IQ","Background"],"key":"D","ev":"comparing those of a similar age and IQ","note":"NOT。考慮したのは性別・年齢・IQ。生い立ち（D）は出てこない。","doubt":null,"alt":[],"voc":[["participant","参加者"],["similar age and IQ","同程度の年齢とIQ"],["factor","要素・条件"],["background","生い立ち・背景"]],"past":null},{"n":21,"t":1,"p":5,"q":"The changes in the structure of the insula suggest","opts":["That the traumas are very severe.","That traumatized boys develop PTSD.","That girls are more prone to have psychological issues than boys.","Why girls are more likely than boys to develop PTSD."],"key":"D","ev":"The shrinkage seen in female brains may be the reason why girls are more prone to PTSD.","note":"なぜ女子の方がPTSDになりやすいか（D）。Cは『心理的問題全般』に拡大しすぎ。","doubt":null,"alt":[],"voc":[["anterior circular sulcus","前方の輪状溝"],["shrink","縮む"],["accelerate","加速する"],["integral to","〜に不可欠な"],["shrinkage","萎縮・縮小"],["prone to","〜になりやすい"]],"past":null},{"n":22,"t":1,"p":6,"q":"What could be the outcomes of the study as suggested in paragraph 7?","opts":["Development of different preventative medicine towards boys and girls.","Development of different treatment methods for boys and girls.","Development of new techniques to treat trauma symptoms.","Development of new treatments to prevent trauma."],"key":"B","ev":"they might benefit from different approaches to treatment","note":"男女で異なる治療法（B）。A・Dの『予防』は本文にない。","doubt":null,"alt":[],"voc":[["lead author","筆頭著者"],["exhibit","示す"],["benefit from","〜から恩恵を受ける"],["approach to treatment","治療のやり方"],["puberty","思春期（第二次性徴）"],["processes emotions","感情を処理する"],["preventative","予防の"]],"past":null}]},{"id":"08","texts":[{"title":"","paras":["Cancer, of course, is not new. Throughout the ages societies have defined and dealt with it variously. Ancient Greeks employed the term to describe tumors: mass, burden. It is an apt translation of what cancer does inside of our bodies. In Emperor of All Maladies Siddhartha Mukherjee travels to the root of onkos.","Nek is an Indo-European term that represents an active form of \"load.\" It means to carry, to move the burden from one place to the next, to bear something across a long distance and bring it to a new place. It is an image that captures not just the cancer cell's capacity to travel—metastasis—but also Atossa's journey, the long arc of scientific discovery—and embedded in that journey, the animus, so inextricably linked with human, to outwit, to outlive and survive. As Atul Gawande recently expressed in conversation with musician Andrew Bird—Bird asked the doctor how cancer forms, given a severe bout his wife had recently undergone—we all grow cancer cells every day. Fortunately, our bodies are designed to not let them metastasize. Then a mutant gets through, our body under attack.","Certain cancers are genetic—my testicular cancer two years ago is one such case, given a childhood condition that predisposed me to it. Yet many are environmental. More importantly, where genetics and environment meet is either a breeding ground or defense system for cancer. Cigarettes have always been the former, like letting streptococcal bacteria loose in a sauna.","A recent study published in Science reminds us just how dangerous cigarettes are. It turns out that hundreds of DNA cells are in danger of mutation in what scientists believe is impactful enough to leave an \"archaeological record.Smoking a pack a day leads to the following number of potential mutations every single year 150 in the lungs; 97 in the larynx or voice box; 23 in the mouth; 18 in the bladder; six in the liver. Each mutation increases the risk of cells becoming cancerous.","Every cigarette contains at least 60 carcinogens, which is why six million people die because of cigarette-related (and thus avoidable) cancers every year. Tobacco has been implicated in 17 types of cancer. While the researchers remind us that smoking is \"mechanistically complex,\" and there are multiple factors when considering cancer, they conclude: Although we cannot exclude roles for covariate behaviors of smokers or differences in the biology of cancers arising in smokers compared with nonsmokers, smoking itself is most plausibly the cause of these differences.","Forty-five percent of American adults puffed tobacco 60 years ago. This is partly the result of the hundreds of millions of dollars manufacturers were pouring into advertising. The 1955 introduction of the Marlboro Man increased sales by a whopping 5,000 percent over eight months. Peak consumption hit in the early sixties, with sales of nearly $5 billion in America alone.","It's been a long, slow withdrawal. In 1956, Richard Doll and Bradford Hill began questioning the role of cigarettes in lung cancer. Today we view the Mad Men-esque nonchalance of lighting up as a romantic throwback to a better time. Yet since January 1, 1971, cigarette ads have been banned on television. That decade marked a profound turn in our understanding of just how dangerous cigarettes are.","Still, addictions persist. While Utah is just over 12 percent smokers, and California in second at 15 percent, Kentucky leads the charge with 30.2 percent of its population. West Virginia and Mississippi follow closely behind. That means over 1.3 million people still smoke in Kentucky. Even though that state doubles the percentage of California smokers, around 5.8 million people still light up on the west coast.","Mukherjee, whose brilliant book on cancer is lucid and frightening, has spent a lot of time in cancer wards around the world. In one passage he describes a fraction of the devastation: \"An ebullient, immaculately dressed young advertising executive who first started smoking to calm his nerves had to have his jawbone sliced off to remove an invasive tongue cancer. A grandmother who taught her grandchildren to smoke and then shared cigarettes with them was diagnosed with esophageal cancer. A priest with terminal lung cancer swore that smoking was the only vice that he had never been able to overcome. He then describes that even while going through this, many patients refuse to surrender their vice: \"I could smell the acrid whiff of tobacco on their clothes as they signed the consent forms for chemotherapy.\""]},{"title":"","paras":["According to the National Institutes of Health, we spend about 26 years of our life asleep, one-third of the total. The latest research states that between 6.4 and 7.5 hours of sleep per night is ideal for most people. But some need more and others less. A contingent out there, mostly women, who do surprisingly well on just six hours.There is even some data to suggest that a slim minority, around three percent of the population, thrive on just three hours sleep per night, with no ill effects. Of course, most people need much more. Even though in general, Americans are getting far less sleep today than in the past.","Cutting out needful rest could damage your health, long-term. A recent study showed that sleep is essential to clearing the brain of toxins that build up over the course of the day. It also helps in memory formation and allows other organs to repair themselves. Our professional lives and our natural cycles don't always mesh. Often, they are at odds. What if you are insanely busy, like ten times the norm? Say you are going to medical school, earning your PhD, or are trying to get a business off the ground. There may not be enough hours in the day for what you have to do. One thing you can do is rearrange your sleep cycle to give yourself more time.","Paleoanthropologists claim that our ancestors probably didn't sleep for seven hours at a clip, as it would make them easy prey. Instead, they probably slept at different periods throughout the day and night, and you can too. What we consider a \"normal\" sleep cycle is called monophasic. This is sleeping for one long period throughout the night. In some Southern European and Latin American countries, the style is biphasic. They sleep five to six hours per night, with a 60-90 minute siesta during midday. There is a historical precedent too. Before the advent of artificial light, most people slept in two chunks each night of four hours each, with an hour of wakefulness in-between. That's also a biphasic system.","Then there is polyphasic sleep. This is sleeping for different periods and amounts of time throughout the day. Certain paragons of history slept this way including Leonardo Da Vinci, Nikola Tesla, Franz Kafka, Winston Churchill, and Thomas Edison, among others. The idea gained popularity in the 1970's and 80's among the scientific community. Buckminster Fuller, a famous American inventor, architect, and philosopher of the 1900's, championed this kind of slumber. So what's the science behind this radical system? Unfortunately, no long-term research has been conducted, yet. One 2007 study, published in the Journal of Sleep Research, found that most animals sleep on a polyphasic schedule, rather getting their sleep all at once. This also begs the question, how much sleep does the human brain need to function properly? The answer is unknown.","Sleep is broken into three cycles. There is light sleep, deep sleep, and rapid eye movement (REM) sleep. The last one is considered the most important and restful of phases. We don't stay in any one phase for long. Instead, we cycle through these constantly throughout the night. So with polyphasic sleep, the idea is to experience these three phases in shorter amounts of time, and wake up rested.","We don't know the exact purpose of these phases. Sleep is still something of a mystery. Without a good understanding, it's difficult to quantify the impact a polyphasic schedule has. One question is whether such a schedule allows for enough REM sleep. Polyphasic practitioners say they are able to enter the REM phase quickly, more so than with a monophasic style. Jost, for example, claimed he could enter REM sleep immediately. This quick entry into the REM state is known as \"repartitioning.\" The deprivation of sleep may help the body enter REM quickly, as an adaptation."]}],"B":[{"n":1,"title":"Focus: wound/infection control. New solutions for wound healing","paras":["Treating skin tissue damaged by burns and other trauma, diabetes or vascular disease is a major challenge and a burden on healthcare systems. Several advanced skin graft treatments exist but they are costly, come with risks such as host rejection, excessive scarring and potentially disease transmission, and are limited to treating shallow wounds where formation of blood vessels is less important.","The emergence of 3D printing tools and techniques, biofabrication of tissue materials from biologically compatible materials offers the possibility of not only reducing availability and cost of treatment issues, but also the prospect of treating deep wounds comprising several tissue layers. The layered fabrication method could also accommodate the use of wound healing proteins, stem cells and anti-inflammatory drugs during the printing process, as well as creating more complex tissue structures that could eventually include vascular networks that facilitate oxygen and nutrient exchange to hair follicles and sweat glands. Even though the biological complexities of human skin are relatively well understood, appropriate repair mechanisms are scarce and often costly."],"q":"In this article what might eventually be made on a 3D printer?","opts":["Skin with its various layers, components and blood supply.","Skin including nerve cells, stem cells and sweat follicles.","Skin, with muscles, tendon and blood vessels."],"key":"A","qja":"この記事によれば、将来3Dプリンターで作れるかもしれないものは何か？","ja":"【焦点：創傷／感染管理。創傷治癒の新たな解決策】熱傷やその他の外傷、糖尿病、血管疾患で損傷した皮膚組織の治療は大きな課題であり、医療制度の負担となっている。高度な皮膚移植治療はいくつかあるが、高価で、拒絶反応、過剰な瘢痕、感染症伝播の可能性といったリスクがあり、血管形成があまり重要でない浅い創傷の治療に限られる。3Dプリンティングの道具と技術の登場、生体適合材料による組織材料のバイオファブリケーションは、治療の入手性や費用の問題を減らすだけでなく、複数の組織層からなる深い創傷を治療できる見込みも与える。積層造形法では、プリント過程で創傷治癒タンパク質、幹細胞、抗炎症薬を組み込むこともでき、将来的には毛包や汗腺への酸素・栄養交換を担う血管網を含む、より複雑な組織構造を作れる可能性がある。ヒトの皮膚の生物学的な複雑さは比較的よく理解されているが、適切な修復手段は乏しく、高価であることが多い。","o":[["様々な層・構成要素・血液供給を備えた皮膚","✅ several tissue layers（層）＋ hair follicles and sweat glands（構成要素）＋ vascular networks（血液供給）。eventually に対応するのは could eventually include vascular networks。"],["神経細胞・幹細胞・汗の毛包を含む皮膚","❌ 神経細胞は本文にない。幹細胞はプリント時に『加える材料』で作るものではない。sweat follicles という組み合わせも本文にない。"],["筋肉・腱・血管を備えた皮膚","❌ 筋肉・腱は本文にない。"]],"exp":"設問の eventually が本文の could eventually include … と対応。正解はその文の内容を抽象化（components, blood supply）している。","pt":"→ 型：設問の時間語（eventually / currently）を本文で探すと、該当文が一発で見つかる。","doubt":null,"voc":[["vascular disease","血管疾患"],["burden","負担"],["skin graft","皮膚移植"],["host rejection","拒絶反応"],["excessive scarring","過剰な瘢痕形成"],["disease transmission","病気の伝播"],["shallow wound","浅い創傷"],["emergence","登場・出現"],["biofabrication","生体材料による作製"],["compatible","適合する"],["prospect","見込み"],["accommodate","受け入れる・組み込む"],["stem cell","幹細胞"],["anti-inflammatory","抗炎症の"],["facilitate","促す"],["hair follicle","毛包"],["sweat gland","汗腺"],["scarce","乏しい"]],"past":null},{"n":2,"title":"Therapeutic Objectives in the Elderly","paras":["When treatments are very likely to achieve benefits and very unlikely to have adverse effects, decisions are relatively easy. However, assessing the relative importance of these quality of life factors to each patient is important when treatments may have discordant effects. For example, aggressive cancer therapy may prolong life but have severe adverse effects (e.g., chronic nausea and vomiting, mouth ulcers) that greatly reduce quality of life.","In this case, the patient's preference for quality vs duration of life and tolerance for risk and uncertainty help guide the decision whether to attempt cure, prolongation of life, or palliation. The patient's perspective on quality of life may also affect treatment decisions when different treatments (e.g., surgical vs drug treatment of severe angina or osteoarthritis) may have different efficacies, toxicities, or both. Practitioners can help patients understand the expected consequences of various treatments, enabling patients to make more informed decisions."],"q":"What three options are generally available for discussion when a person is faced with making a decision about what treatment pathway to take for their illness?","opts":["Modifying their lifestyle to deal with the illness, accepting that they cannot be cured, taking all treatment options available.","Managing the side effects of treatment, consider declining treatment, revising their expectations of whether they will be cured.","Extending life-expectancy, treating the symptoms to lessen their effect, understanding how different treatments affect the body."],"key":"C","qja":"病気の治療方針を決める際、一般に話し合う3つの選択肢は何か？","ja":"【高齢者の治療目標】治療が利益をもたらす可能性が非常に高く、有害事象の可能性が非常に低い場合、判断は比較的容易である。しかし治療の効果が相反する場合には、こうしたQOL要因が各患者にとってどれほど重要かを評価することが大切である。例えば積極的ながん治療は寿命を延ばしうるが、QOLを大きく下げる重い副作用（慢性の悪心・嘔吐、口内炎など）を伴うことがある。この場合、QOLと生存期間のどちらを重視するか、リスクと不確実性をどこまで許容するかという患者の希望が、治癒を目指すか、延命か、緩和かという判断の指針となる。異なる治療（重症狭心症や変形性関節症の手術治療と薬物治療など）で有効性や毒性が異なる場合も、患者のQOLに対する考え方が治療判断に影響しうる。医療者は、様々な治療から予想される結果を患者が理解できるよう助け、より情報に基づいた決定をできるようにする。","o":[["病気に対処するため生活習慣を変える、治らないと受け入れる、あらゆる治療を受ける","❌ 生活習慣の話はない。"],["副作用を管理する、治療を断ることを検討する、治癒への期待を見直す","❌ 治療拒否・期待の見直しは本文の3択（cure / prolongation / palliation）に対応しない。"],["余命を延ばす、症状を和らげて影響を減らす、治療が体にどう影響するかを理解する","✅ 公式キーC。prolongation of life（延命）＋ palliation（緩和）＋ understand the expected consequences of various treatments。"]],"exp":"本文の3択は cure / prolongation of life / palliation。Cは延命・緩和の2つを含み、3つ目を『治療の影響を理解する』（最終文）に置き換えている。","pt":"→ 型：専門語（palliation）を平易な言い換え（treating the symptoms to lessen their effect）に変換できるかが勝負。","doubt":"⚠️ 本文の3択（治癒・延命・緩和）と完全には一致しない設問。最も多く対応するCがキー。","voc":[["adverse effect","有害作用"],["discordant","相反する"],["aggressive therapy","積極的な治療"],["prolong","延ばす"],["nausea","吐き気"],["mouth ulcer","口内炎"],["preference","希望・選好"],["tolerance for risk","リスクの許容度"],["palliation","緩和（症状の軽減）"],["angina","狭心症"],["osteoarthritis","変形性関節症"],["efficacy","有効性"],["toxicity","毒性"],["informed decision","十分に理解した上での決定"],["decline treatment","治療を断る"]],"past":null},{"n":3,"title":"Treatment or management of chronic kidney disease","paras":["Early CKD is usually asymptomatic and must be actively sought to be recognised. Kidney function is measured by the glomerular filtration rate (GFR), which is the amount of blood the kidneys clear of waste products in one minute. As GFR cannot be measured directly, current practice is to estimate GFR (eGFR) by applying a formula that includes age, gender and creatinine levels in the blood. Kidney function can also be tested by measuring the levels of albuminuria (type of protein) in the urine, but this testing requires follow-up, as CKD is diagnosed where albuminuria is seen to be persistent in the urine for at least three months.","General practitioners (GPs) are the usual source of initial assessment and diagnosis of CKD and have a variety of options available for treating the condition, including the ordering of imaging and pathology tests, prescribing of medications and, where necessary, referral to a specialist. Best practice management of CKD utilizes a collaborative effort, involving at least the individual and their GP, but also including practice nurses and/or allied health professionals as appropriate."],"q":"Why does a urine test to check for Chronic Kidney Disease have to be followed up on?","opts":["The urine test has to be compared with the blood test results so a formula can be applied to confirm CKD.","The urine is tested for a protein that has to be present for 90 days to confirm CKD.","The urine test has to be repeated to ensure the results are accurate before CKD can be confirmed."],"key":"B","qja":"CKDを調べる尿検査は、なぜフォローアップが必要なのか？","ja":"【慢性腎臓病の治療・管理】早期CKDは通常無症状で、積極的に探さないと見つからない。腎機能は糸球体濾過量（GFR）＝1分間に腎臓が老廃物を除去する血液の量で測る。GFRは直接測定できないため、現在は年齢・性別・血中クレアチニン値を含む式でGFRを推定する（eGFR）。腎機能は尿中のアルブミン（蛋白の一種）の量でも評価できるが、この検査はフォローアップが必要である。CKDは、尿中アルブミンが少なくとも3か月持続して認められた場合に診断されるからだ。GPはCKDの初期評価と診断を担うのが通常で、画像・検体検査のオーダー、薬の処方、必要に応じた専門医紹介など様々な選択肢をもつ。CKDの最善の管理は、少なくとも本人とGP、必要に応じて診療所看護師や他の医療専門職が関わる協働によって行われる。","o":[["CKDを確定するため、尿検査を血液検査の結果と比べて式を当てはめる必要がある","❌ 式を使うのは血液（クレアチニン）によるeGFR。尿検査とは別の方法。"],["尿中の蛋白が90日間存在することを確認してCKDを確定する","✅ albuminuria is seen to be persistent … for at least three months（3か月≒90日）。"],["CKDを確定する前に結果が正確か確かめるため、尿検査を繰り返す必要がある","❌ 繰り返す理由は『正確さの確認』ではなく『持続の確認』。理由のすり替え。"]],"exp":"as CKD is diagnosed where … の as が理由を示す接続詞。Cは『繰り返す』という事実は合っているが理由が違う。","pt":"→ 型：why 問題は because / as / since の後ろを取る。行為が合っていても理由がずれた選択肢は誤り。","doubt":null,"voc":[["asymptomatic","無症状の"],["actively sought","積極的に探される"],["estimate","推定する"],["albuminuria","アルブミン尿"],["persistent","持続する"],["initial assessment","初期評価"],["pathology test","検体検査"],["referral","紹介"],["collaborative effort","協働"],["allied health professional","コメディカル（他職種の医療専門職）"],["as appropriate","必要に応じて"]],"past":null},{"n":4,"title":"Position Statement on Medicinal Cannabis","paras":["It is the position of the NSW Nurses and Midwives' Association that:","Access to cannabis for therapeutic purposes should be supported where patients, in consultation with their treating health professionals, receive some benefit or symptoms are alleviated. Clinical trials should be conducted to develop the evidence base. Approved pharmaceutical cannabis products should be accessible and affordable. A legal framework must be established so that patients or their carers who are in possession of cannabis for personal, therapeutic purposes should have a complete legal defence from arrest or prosecution. A legal framework must be established so that approved cannabis products can be developed and sold for the purposes of therapeutic use. Cannabis misuse should be approached primarily as a health issue rather than a criminal issue and we support an appropriate harm-reduction response."],"q":"What is the NSW Nurses and Midwives Association stance regarding carers found in possession of cannabis?","opts":["Carers, assessed by health professionals, should be protected from legal action against them.","Carers should be arrested and prosecuted.","Carers should be referred to health professionals."],"key":"A","qja":"大麻を所持している介護者について、NSW看護師・助産師協会の立場は？","ja":"【医療用大麻に関する方針声明】NSW看護師・助産師協会の立場は以下のとおり。患者が治療担当の医療者と相談したうえで利益を得る、または症状が緩和される場合には、治療目的の大麻へのアクセスを支持すべきである。エビデンスを構築するため臨床試験を行うべきである。承認された医薬品としての大麻製品は入手しやすく手頃な価格であるべきだ。個人的な治療目的で大麻を所持する患者やその介護者が、逮捕・起訴から完全に法的に保護されるよう、法的枠組みを整備しなければならない。承認された大麻製品が治療目的で開発・販売できるよう、法的枠組みを整備しなければならない。大麻の乱用は、犯罪の問題としてではなく主に健康の問題として扱うべきであり、適切なハームリダクションの対応を支持する。","o":[["医療者の評価を受けた介護者は、法的措置から保護されるべきだ","✅ patients or their carers who are in possession of cannabis for personal, therapeutic purposes should have a complete legal defence from arrest or prosecution。"],["介護者は逮捕・起訴されるべきだ","❌ 真逆。"],["介護者は医療者に紹介されるべきだ","❌ 『健康問題として扱う』は大麻の乱用（misuse）についての記述。介護者の所持の話ではない。"]],"exp":"carers という語は本文に1回だけ。その文の legal defence from arrest or prosecution が答え。Cは別の文（misuse → health issue）と混ぜている。","pt":"→ 型：設問の人物（carers）が本文に1回しか出ないなら、その1文だけで答えが決まる。","doubt":null,"voc":[["position statement","方針声明"],["medicinal cannabis","医療用大麻"],["therapeutic purposes","治療目的"],["in consultation with","〜と相談のうえ"],["alleviate","和らげる"],["evidence base","エビデンスの土台"],["affordable","手の届く価格の"],["legal framework","法的枠組み"],["in possession of","〜を所持している"],["legal defence","法的な保護・抗弁"],["prosecution","起訴"],["misuse","乱用・誤用"],["harm-reduction","被害を減らす（ハームリダクション）"],["stance","立場"]],"past":null},{"n":5,"title":"Memo to all staff re: Mandatory FONT requirements bulletin","paras":["Completion of all components of the FONT program is mandatory for all NSW Health maternity clinicians (including Obstetricians, General Practitioner Obstetricians, Trainees in Obstetric Medicine, Registered Midwives and midwifery students).","This is to occur in three yearly cycles and will consist of:","16 hours to complete the online K2MS Perinatal Training Programs (once every three years) which includes:","Fetal Monitoring Training System (including 15 Cardiotocograph (CTG) 'Training Simulator' cases)","2½ hours to complete two K2MS - Fetal Monitoring Training System 'Training Simulator' CTG case studies (every year within the cycle where the entire Fetal Monitoring Training System is not completed)","Fetal Welfare Assessment ('F')","Obstetric emergencies and Neonatal resuscitation Training (ONT').","Chief Executives of Local Health Districts – are responsible for:","Supporting:","FONT Facilitators to provide the face-to-face sessions","Maternity clinicians to complete the mandatory FONT requirements","Monitoring FONT completion compliance."],"q":"How much cardiotocography training must be completed to complete the FONT programme?","opts":["Two face to face training sessions and fifteen case studies every three years.","Two CTG's studies and fifteen welfare assessments every three years.","Sixteen hours online training every three years and two and half hours annually."],"key":"C","qja":"FONTプログラムを修了するには、どれだけのCTG（胎児心拍陣痛図）研修が必要か？","ja":"【全スタッフ宛メモ：FONT必須要件のお知らせ】FONTプログラムの全構成要素の修了は、NSW州保健局のすべての産科臨床家（産科医、GP産科医、産科研修医、登録助産師、助産学生を含む）に義務づけられている。3年周期で行い、内容は以下のとおり：オンラインのK2MS周産期研修プログラムを16時間（3年に1回）。これには胎児モニタリング研修システム（15件のCTG『トレーニング・シミュレーター』症例を含む）が含まれる。2.5時間でK2MS胎児モニタリング研修システムの『トレーニング・シミュレーター』CTG症例2件を修了（周期内で研修システム全体を修了しない年は毎年）。胎児健康評価（F）。産科救急と新生児蘇生の研修（ONT）。地域保健区の最高責任者の責務：FONTファシリテーターによる対面研修の実施支援、産科臨床家の必須要件修了の支援、修了状況の監視。","o":[["3年ごとに対面研修2回と症例15件","❌ 対面研修の回数は書かれていない。15件はオンライン研修内の症例数。"],["3年ごとにCTG研究2件と胎児健康評価15件","❌ 数字（2・15）の組み合わせを入れ替えた誤答。"],["3年ごとにオンライン研修16時間、毎年2時間半","✅ 16 hours … (once every three years) ＋ 2½ hours … (every year within the cycle …)。"]],"exp":"数字（16・15・2・2½）が入り乱れる本文。選択肢の『数字＋単位＋頻度』の3点セットで照合する。","pt":"→ 型：数字問題は数字だけでなく『単位（時間・件）』と『頻度（3年ごと・毎年）』もセットで照合する。","doubt":null,"voc":[["mandatory","必須の"],["completion","修了"],["maternity clinician","産科にかかわる医療者"],["obstetrician","産科医"],["trainee","研修医"],["midwifery student","助産学生"],["cycle","周期"],["perinatal","周産期の"],["fetal monitoring","胎児モニタリング"],["cardiotocograph","胎児心拍陣痛図（CTG）"],["neonatal resuscitation","新生児蘇生"],["compliance","遵守"]],"past":null},{"n":6,"title":"Choice of meter for the individual with diabetes","paras":["The choice of a blood glucose meter for the person with diabetes will depend on a variety of factors including ease of use, size and portability, type of strip (e.g. canister, individual foil-wrapped strip or strip-free), amount of blood required, suitability for alternate site testing and other additional features such as memory and download capability, alarms and back lights.","Individuals with sight or dexterity problems will need a meter that accommodates these issues.","Many people with type 1 diabetes use more than one blood glucose meter, and may require a meter to measure blood ketone levels, a smart meter that assists in insulin bolus calculations or a meter that relays blood glucose levels to their insulin pump. Capillary blood samples are best taken from the side of the finger, but avoiding close proximity to the nail bed, particularly when blood glucose levels are changing rapidly. Some blood glucose meters allow the measurement of glucose levels from small samples of blood from the forearm and other sites."],"q":"Where is the best place to take blood from to monitor blood glucose levels?","opts":["Near the nail bed.","The side of the finger.","The forearm."],"key":"B","qja":"血糖値をモニターするための採血部位として最適なのはどこか？","ja":"【糖尿病患者の血糖測定器の選び方】血糖測定器の選択は、使いやすさ、大きさと携帯性、試験紙の種類（容器入り、個包装、試験紙不要）、必要な血液量、代替部位での測定への適合性、メモリやダウンロード機能・アラーム・バックライトなどの付加機能を含む様々な要因で決まる。視力や手先の器用さに問題がある人には、それに対応した測定器が必要である。1型糖尿病の人の多くは複数の測定器を使い、血中ケトン測定器、インスリンのボーラス計算を助けるスマート測定器、インスリンポンプに血糖値を送る測定器が必要なこともある。毛細血管血の採取は指の側面から行うのが最適だが、特に血糖値が急速に変動しているときは爪床の近くを避ける。測定器によっては、前腕などの部位から少量の血液で測定できるものもある。","o":[["爪床の近く","❌ avoiding close proximity to the nail bed（爪床の近くは避ける）。"],["指の側面","✅ Capillary blood samples are best taken from the side of the finger。"],["前腕","❌ 前腕は『一部の測定器で可能』な代替部位で、best ではない。"]],"exp":"best が本文にそのまま出てくる。Cは『可能』（some meters allow）と『最適』（best）の混同を狙った誤答。","pt":"→ 型：best / most を問う設問では、本文の best / ideally を探す。『〜もできる（allow / can）』は最適ではない。","doubt":null,"voc":[["blood glucose meter","血糖測定器"],["portability","携帯性"],["foil-wrapped","アルミ包装の"],["suitability","適合性"],["alternate site testing","代替部位での測定"],["dexterity","手先の器用さ"],["accommodate","対応する"],["ketone","ケトン体"],["bolus calculation","ボーラス（追加インスリン）の計算"],["relay","送信する"],["capillary blood","毛細血管血"],["proximity","近さ"],["nail bed","爪床"],["forearm","前腕"]],"past":null}],"C":[{"n":7,"t":0,"p":0,"q":"What point does the writer make about the term the Ancient Greeks used for cancer?","opts":["That it is a suitable translation that reflects the way in which cancer behaves.","That it is an appropriate description of the outcomes of cancer.","That it describes precisely the root of the disease.","That the word cannot describe the disease properly."],"key":"A","ev":"It is an apt translation of what cancer does inside of our bodies.","note":"apt translation＝体内でのがんの振る舞いを表す適切な訳（A）。","doubt":null," 』は no long-term research の拡大解釈。","doubt":null,"alt":[],"voc":[["polyphasic","多相性の（細切れに眠る）"],["paragon","模範的な人物"],["gain popularity","広まる・人気を得る"],["champion","支持する・提唱する"],["slumber","眠り"],["radical","型破りな"],["begs the question","〜という疑問を投げかける"],["function properly","正常に働く"]],"past":null},{"n":21,"t":1,"p":4,"q":"What does the author say about the way we sleep in the fifth paragraph?","opts":["That we all experience polyphasic sleep.","That we all sleep in cycles.","We cycle when we go to sleep.","That polyphasic sleep makes us feel rested."],"key":"B","ev":"we cycle through these constantly throughout the night","note":"誰もが周期を繰り返して眠る（B）。","doubt":null,"alt":[],"voc":[["broken into","〜に分けられる"],["light sleep","浅い眠り"],["rapid eye movement sleep","レム睡眠"],["restful","休息になる"],["phase","段階・相"],["cycle through","順に巡る"],["rested","休まった"]],"past":null},{"n":22,"t":1,"p":5,"q":"Why are some scientists skeptical about the success of polyphasic sleep?","opts":["Because they believe that it is a myth.","Because they believe that it allows people to enter the REM phase more quickly.","They suspect that it may not allow for enough REM sleep.","They don't believe that the repartitioning phase can be achieved."],"key":"C","ev":"One question is whether such a schedule allows for enough REM sleep.","note":"十分なレム睡眠がとれるかという疑問（C）。","doubt":null,"alt":[],"voc":[["quantify","数値で捉える"],["allow for","〜を可能にする・見込む"],["practitioner","実践している人"],["repartitioning","（睡眠段階の）再配分"],["deprivation","欠乏・はく奪"],["adaptation","適応"],["myth","俗説・作り話"],["suspect","疑う・〜ではないかと思う"]],"past":null}]},{"id":"09","texts":[{"title":"","paras":["Heart failure patients have weakened hearts, but researchers say an experimental drug used for the first time in humans may repair heart cells and improve heart function. According to the results of a small phase 1 trial, a single intravenous infusion of the drug cimaglermin was safe and, at high doses, improved heart function for at least three months.","\"Right now we have many therapies that we use for heart failure, and these patients [in the study] were on all of those therapies and still had significant heart dysfunction,\" said lead researcher Dr. Daniel Lenihan. He's a professor of medicine and director of Vanderbilt University's heart clinical research program in Nashville.","People with heart failure often take a combination of drugs, Lenihan said. These include medications to lower blood pressure and diuretics to help remove excess fluid that builds up as a result of the heart's labored pumping ability. In addition, some people have implanted defibrillators or pacemakers. Even with all these options, the death rate among these patients is \"unacceptably high,\" Lenihan said.","Heart failure, a condition where the heart can't pump enough blood to meet the body's needs, is among the leading causes of death worldwide. A significant number of heart failure patients don't respond well to current treatments, particularly those patients whose left lower heart chamber, which pumps blood into the arteries, is weak, Lenihan said.","Cimaglermin acts as a growth factor for the heart, helping it repair itself following injury, Lenihan said. Specifically, it binds to the HER2 and HER4 receptors on the surface of heart cells that are important for cellular repair and survival, he explained.","Researchers have tried using stem cells to repair heart muscle in much the same way, he said, but these efforts have not been effective. \"You don't see any sustained effect,\" he added.","A phase 1 trial like this one is designed to see if a new drug is safe, not to test its effectiveness. Before cimaglermin could be used to treat patients, it must prove its worth in a series of progressively larger and challenging trials and then be approved by the U.S. Food and Drug Administration. The process can take several years. Based on these preliminary findings, larger trials are being planned, Lenihan said. \"This drug, although still in an experimental phase, might be an important way to improve heart function in patients with heart failure,\" he said.","For the study, Lenihan and his colleagues randomly assigned 40 patients to get an infusion of cimaglermin or a placebo. Compared with patients who received a placebo, patients given a high dose of cimaglermin had a sustained increase in the heart's ability to pump blood. The improvement lasted 90 days, with the maximum increase in heart function reached in 28 days, the researchers found. The most common side effects were headache and nausea directly after receiving the drug. One patient who received the highest dose of cimaglermin developed abnormal liver function, which cleared up over a two-week period, Lenihan said.","Despite the encouraging results of this first trial, a lot more testing will be needed before cimaglermin can be considered a standard treatment for heart failure, Bishopric said. \"These findings need to be replicated in larger trials, and you have to be able to predict whether improved heart function from cimaglermin will help people live longer and feel better,\" she noted."]},{"title":"","paras":["After years of studies that seemed to swing between dire warnings and cheery promises about what our favorite caffeinated beverages do and don't do, much of the recent science regarding coffee and tea is generally positive.","The WHO's International Agency for Research on Cancer recently took coffee off its list of suspected carcinogens, and some research suggests it could help keep colon cancer from coming back after treatment. Other studies suggest drinking coffee might stave off Alzheimer's and Parkinson's diseases. Various studies have pointed to tea drinkers having lower odds of skin, breast, and prostate cancers.","Researchers are still trying to pinpoint the exact ways that happens. But tea, particularly green tea, is rich in compounds like antioxidants, which can limit cell damage and boost the immune system; and polyphenols, which have been shown to lower blood pressure and cholesterol. It also may help stave off Alzheimer's disease through a polyphenol known as EGCG which prevents the formation of plaques that are linked to that brain-damaging illness.","Is one better for you than the other? Experts say that's hard to say. That's because it's difficult to separate out their different ingredients, their role in your diet, and their effects on different body systems. \"I think people are looking at both coffee and tea and how they affect everything, including cancer and GI disease and cardiovascular diseases,\" says Elliott Miller, MD, a critical care medicine specialist at the National Institutes of Health.","Miller and his colleagues recently looked at signs of heart disease in more than 6,800 people from different backgrounds across the country. About 75% drank coffee, while about 40% reported drinking tea. Drinking more than one cup of tea regularly was linked to less buildup of calcium in arteries that supply blood to the heart, a development that can lead to heart disease. Coffee didn't have an effect either way on heart disease, but that was significant in itself, Miller says. \"Very often patients will ask their doctors, 'Hey, doc, I've got coronary artery disease, or I've got risk factors like high blood pressure or cholesterol. Is it safe for me to drink coffee?' Because everyone thinks drinking coffee makes your heart excited and is potentially bad,\" Miller says. \"So finding that it's neutral, I think, is pretty important.\"","Researchers say it's hard to pinpoint exactly how both drinks affect health. Both coffee and tea are \"complex beverages\" that contain a variety of ingredients. They include caffeine, polyphenols, and antioxidants, compounds researchers are studying for their potential cancer-fighting properties, says Lisa Cimperman, a clinical dietitian at University Hospital Case Medical Center. \"It's more of a dynamic interaction than one single compound,\" Cimperman says.","Some people have tried to isolate one element in tea or coffee that they think is the secret to one effect or another, \"and then they realize that it doesn't have the same effect.\" Cimperman said drinking tea has been linked to lower risks of cancer and heart disease, improved weight loss, and a stronger immune system. Meanwhile, studies point to coffee as a potential way to head off not just Parkinson's but type 2 diabetes, liver disease, and heart problems, Cimperman says.","Another recent study, led by Charles Fuchs, MD, director of the Gastrointestinal Cancer Center at Boston's Dana-Farber Cancer Institute, found regular coffee drinking may help prevent colon cancer from coming back after treatment. In his study of nearly 1,000 patients, Fuchs says, there was a \"significant and linear\" association between drinking coffee and lower risk of colon cancer returning in those who drank four or more cups a day. \"The more coffee they drank, the lower risk of recurrence.\" But the researchers aren't clear on which element of the drink contributed to that result, and there didn't seem to be any effect from drinking tea, he says. \"I think you can have two or more cups a day without any concern, and certainly that may benefit you,\" Fuchs says. But what about for those who don't drink coffee? \"If it was somebody who hates the stuff and asks, 'Should I drink it?' I'd say no. I'd counsel them about diet and exercise and avoiding obesity as measures I think would have a similar benefit.\"","Other researchers are asking questions about what role genetics and lifestyle play into the effects drinking coffee or tea. For instance, coffee and cigarettes once went together like ... well, like coffee and cigarettes, which cause cancer and heart disease. Some people's bodies process coffee differently than others, says Martha Gulati, MD, head of cardiology at the University of Arizona College of Medicine in Phoenix. Meanwhile, a preference for tea over coffee might reflect other healthier behaviors, she says. \"Does someone who drinks tea do yoga or meditation more?\" Gulati says. \"I'm not necessarily saying they're associated, but do they exercise more? Are they drinking things like green tea to maintain their weight better than other types of drinks?\""]}],"B":[{"n":1,"title":"Developing diagnostic tests for respiratory disease using sound measurement and machine learning techniques – clinical trial","paras":["This study is designed to develop accurate digital diagnostic tests, used on a smart device, for common respiratory illnesses in children and adults including asthma, croup, bronchiolitis, COPD and pneumonia. These tests can then be used in resource-poor communities, emergency departments or via telehealth applications.","The aim is to develop tests that are as accurate as an expert clinical assessment but do not need a clinical examination or other investigations such as x-rays to be performed. Patients with a history of a chronic respiratory condition or who have symptoms of an acute respiratory disease are included.","Patients will be excluded if they: have an inability to provide a cough either spontaneously or voluntarily; are unable to provide informed consent or assent; have severe respiratory distress including the use of CPAP or BiPAP or have had abdominal or eye surgery within 3 months."],"q":"The clinical trial is","opts":["open to people with severe respiratory symptoms.","exploring new ways to confirm a person has a respiratory disorder.","aimed at checking that expert clinical assessments are accurate."],"key":"B","qja":"この臨床試験は…","ja":"【音響測定と機械学習を用いた呼吸器疾患の診断検査の開発：臨床試験】本研究は、小児と成人によくある呼吸器疾患（喘息、クループ、細気管支炎、COPD、肺炎など）について、スマートデバイスで使える正確なデジタル診断検査を開発するためのものである。これらの検査は、資源の乏しい地域、救急外来、遠隔医療アプリで使える。目標は、専門家の臨床評価と同等に正確でありながら、診察やX線などの検査を必要としない検査を開発することである。慢性呼吸器疾患の既往がある患者、または急性呼吸器疾患の症状がある患者が対象となる。自発的にも随意的にも咳ができない、インフォームド・コンセントやアセントができない、CPAPやBiPAPを使うなどの重度の呼吸窮迫がある、3か月以内に腹部や眼の手術を受けた場合は除外される。","o":[["重度の呼吸器症状がある人も参加できる","❌ severe respiratory distress は除外基準。"],["呼吸器疾患があることを確認する新しい方法を探っている","✅ develop accurate digital diagnostic tests（新しい診断方法の開発）の言い換え。confirm a person has a respiratory disorder＝診断。"],["専門家の臨床評価が正確であるかを確認することを目的とする","❌ 専門家の評価は『同等の正確さを目指す基準』。評価そのものを検証する試験ではない。"]],"exp":"Cは本文の as accurate as an expert clinical assessment を『専門家の評価を検証する』にすり替えた誤答。比較の基準と研究対象を取り違えさせる。","pt":"→ 型：as accurate as X の X は『基準』であって研究対象ではない。比較構文の役割を確認。","doubt":null,"voc":[["respiratory disease","呼吸器疾患"],["croup","クループ"],["bronchiolitis","細気管支炎"],["resource-poor","資源の乏しい"],["telehealth","遠隔医療"],["clinical assessment","臨床的な評価"],["investigation","検査"],["spontaneously","自発的に"],["voluntarily","意識的に・自分の意思で"],["assent","（小児の）同意・了承"],["respiratory distress","呼吸窮迫"],["abdominal","腹部の"],["disorder","疾患・障害"]],"past":null},{"n":2,"title":"Pregnancy care guideline 2018: Involving an interpreter","paras":["It is the responsibility of the health professional to make sure that communication is clear. Accredited healthcare interpreters assist by translating the discussion between the health professional and the woman, communicating with the woman in her preferred language either in person or through a telephone service. Involving an accredited interpreter, preferably with training in medical terminology, is recommended for all antenatal appointments if the health professional and the woman have difficulty communicating.","Interpreters accredited by NAATI (National Association of Accreditation for Translators and Interpreters) have been assessed as having a high level of technical competence in both English and one or more other languages and are bound by a code of ethics including strict confidentiality. However, there is a shortage of accredited interpreters, particularly for languages of new and emerging communities. While involvement of female interpreters is preferable in antenatal care, their availability may also be limited."],"q":"The guideline highlights","opts":["the need for accredited interpreters at all appointments if there is a language barrier.","that an accredited interpreter is recommended for all antenatal visits.","that health professionals are responsible for translating discussions."],"key":"A","qja":"このガイドラインが強調しているのは…","ja":"【妊娠ケアガイドライン2018：通訳の関与】意思疎通を明確にするのは医療者の責任である。認定医療通訳者は、医療者と女性の会話を通訳し、対面または電話サービスで女性の希望する言語でやりとりする。医療者と女性の間で意思疎通が難しい場合、すべての妊婦健診で、できれば医学用語の研修を受けた認定通訳者の関与が推奨される。NAATI（全国翻訳者・通訳者認定機構）認定の通訳者は、英語と1つ以上の他言語で高い技術的能力を有すると評価されており、厳格な守秘義務を含む倫理規定に拘束される。ただし認定通訳者は不足しており、特に新しい移民コミュニティの言語で顕著である。妊婦ケアでは女性通訳者の関与が望ましいが、その確保も限られる場合がある。","o":[["言語の壁がある場合、すべての受診に認定通訳者が必要である","✅ recommended for all antenatal appointments if the health professional and the woman have difficulty communicating の言い換え（if there is a language barrier）。"],["すべての妊婦健診に認定通訳者が推奨される","❌ 条件（意思疎通が難しい場合）が抜けている。条件の削除。"],["通訳するのは医療者の責任である","❌ 医療者の責任は『意思疎通を明確にすること』。通訳するのは通訳者。"]],"exp":"AとBの違いは if 条件の有無だけ。本文の推奨には if … difficulty communicating という条件がついているので、条件を残しているAが正解。","pt":"→ 型：if 条件を削った選択肢は、本文より範囲が広がる＝誤り。条件節の有無を必ず比較する。","doubt":null,"voc":[["interpreter","通訳者"],["accredited","認定された"],["preferred language","希望する言語"],["in person","対面で"],["medical terminology","医学用語"],["antenatal appointment","妊婦健診"],["competence","能力・技能"],["bound by","〜に拘束される"],["code of ethics","倫理綱領"],["confidentiality","守秘義務"],["shortage","不足"],["emerging community","新しく形成されつつある地域社会"],["availability","確保できること"],["language barrier","言葉の壁"]],"past":null},{"n":3,"title":"Patient safety advice : medication","paras":["It's important you keep track of your medicines – taking the right medicine at the right time will help you get well. Using medicines in the wrong way may cause unwanted side effects. At the hospital you need to tell staff if you have had an allergic or bad reaction to any medicines or if you have trouble swallowing medicines. You should tell staff straight away if you feel unwell after taking any medicine. Let staff know if you think you should have received some medicines, or the medicines appear different. It is important that all medicines are explained to you before you leave the hospital to go home or to another care provider. Always ask your doctor, nurse, or pharmacist if you don't understand your medicine instructions. Questions you should ask about your medicines in hospital are \"What is this medicine for?\", \"Are there any possible side effects?\" and \"Can they be taken safely with other medicines?\""],"q":"The patient safety leaflet encourages patients to","opts":["check the nurse understands the medicine guidelines.","ask staff to clarify the directions to follow about taking their medications.","be sure the doctors ask questions about your medicines."],"key":"B","qja":"患者安全リーフレットが患者に勧めていることは…","ja":"【患者安全のための助言：薬】自分の薬を把握しておくことは大切です。正しい薬を正しいタイミングで飲むことが回復につながります。薬を誤った方法で使うと、望ましくない副作用が起こることがあります。病院では、薬でアレルギーや悪い反応が出たことがある場合、薬を飲み込みにくい場合はスタッフに伝えてください。薬を飲んだ後に気分が悪くなったら、すぐにスタッフに伝えてください。受け取るべき薬を受け取っていないと思う場合や、薬がいつもと違って見える場合も知らせてください。帰宅または他のケア提供者のもとへ移る前に、すべての薬について説明を受けることが大切です。薬の指示が分からない場合は、必ず医師、看護師、薬剤師に尋ねてください。入院中に薬について尋ねるべき質問は『この薬は何のためか』『副作用はあるか』『他の薬と一緒に安全に飲めるか』です。","o":[["看護師が薬のガイドラインを理解しているか確認する","❌ 確認するのは『自分が指示を理解しているか』。看護師の理解度を確認しろとは言っていない。"],["薬の飲み方の指示をスタッフに明確にしてもらう","✅ Always ask your doctor, nurse, or pharmacist if you don't understand your medicine instructions の言い換え（clarify the directions）。"],["医師が薬について質問するよう確認する","❌ 質問するのは患者の方（Questions you should ask）。主語の入れ替え。"]],"exp":"A・Cは『誰が理解する／誰が質問する』の主語を入れ替えた誤答。患者向けリーフレットなので、行動の主語は常に患者。","pt":"→ 型：主語（患者か医療者か）を入れ替えた選択肢は定番。誰の行動かを確認する。","doubt":null,"voc":[["keep track of","把握し続ける"],["get well","回復する"],["side effect","副作用"],["allergic reaction","アレルギー反応"],["swallow","飲み込む"],["straight away","すぐに"],["care provider","ケアを提供する側（施設・担当者）"],["instruction","指示・使い方"],["clarify","はっきりさせる"],["direction","指示・用法"]],"past":null},{"n":4,"title":"Memo to staff re: Escalation process for dispute resolution","paras":["If, on review, the inpatient team disagrees that a patient requires admission to the respective specialty, the inpatient team shall make the onward referral to the alternate specialty. The senior inpatient MO shall provide the alternate specialty with a clinical handover and advice of the time frame in which the patient must be reviewed.","In the event of a dispute regarding inpatient team acceptance of the patient, a Consultant level case conference shall be convened. The case conference shall include the ED, original inpatient and alternative inpatient Consultants. The three Consultants shall make a timely clinical decision regarding the patient's admission.","If the matter remains unresolved, then the case shall be escalated to the Executive Director of Medical Services (EDMS) for a clinical and time urgent decision."],"q":"If the inpatient team cannot agree on accepting a patient who has to attend a case conference?","opts":["The senior MO from the alternative specialty, the ED consultant and the original inpatient team representative.","The patient, the senior patient medical officer and the Executive director of Medical services.","The patient's first consultant, a consultant from the ED and a consultant from the alternative speciality that the inpatient team suggests."],"key":"C","qja":"入院チームが患者の受け入れに合意できない場合、症例検討会に出席しなければならないのは誰か？","ja":"【スタッフ宛メモ：紛争解決のエスカレーション手順】入院チームが検討の結果、患者がその診療科への入院を要しないと判断した場合、入院チームが別の診療科へ紹介する。入院チームの上級医は、別の診療科に臨床引き継ぎを行い、患者を診察すべき期限を伝える。入院チームの受け入れをめぐって争いがある場合は、コンサルタント（指導医）レベルの症例検討会を開く。検討会には救急部（ED）、元の入院チーム、別の入院チームのコンサルタントが参加する。3人のコンサルタントが患者の入院について適時に臨床判断を下す。それでも解決しない場合は、医療サービス担当役員（EDMS）に上げ、臨床的かつ緊急の判断を仰ぐ。","o":[["別の診療科の上級医、EDのコンサルタント、元の入院チームの代表者","❌ 参加者はすべて Consultant レベル。『上級医（senior MO）』『代表者』は職位が違う。"],["患者、上級医、医療サービス担当役員","❌ 患者は参加しない。EDMSは検討会で解決しない場合のエスカレーション先。"],["患者の元の担当コンサルタント、EDのコンサルタント、入院チームが提案する別の診療科のコンサルタント","✅ ED, original inpatient and alternative inpatient Consultants の3人。"]],"exp":"段階が3つある（①別科へ紹介→②コンサルタント検討会→③EDMS）。設問は②の段階。senior MO は①、EDMS は③に出てくる人物で、段階の取り違えを狙っている。","pt":"→ 型：手順が段階的な本文では、設問がどの段階の話かを先に特定する。別段階の人物を混ぜた選択肢は誤り。","doubt":null,"voc":[["escalation process","上位へ引き上げる手順"],["dispute resolution","紛争の解決"],["inpatient team","入院担当チーム"],["admission","入院"],["respective specialty","当該の診療科"],["onward referral","次の科への紹介"],["alternate specialty","別の診療科"],["clinical handover","臨床上の引き継ぎ"],["time frame","期限・時間枠"],["convene","招集する"],["timely","時機を逸しない"],["unresolved","解決しないままの"],["executive director","担当役員"]],"past":null},{"n":5,"title":"Taking a blood pressure reading manually","paras":["Wrap the cuff around the patient's arm and use the INDEX line to determine if the patient's arm circumference falls within the RANGE area. Otherwise, choose the appropriate smaller or larger cuff.","Palpate/locate the brachial artery and position the BP cuff so that the ARTERY marker points to the brachial artery. Wrap the BP cuff snugly around the arm. Ensure the cuff is located about 2.5 cm above the antecubital fossa (crease of the arm).","Perform a preliminary palpatory systolic blood pressure. To achieve this, palpate the arm at the antecubital fossa to locate the brachial artery with your non-dominant hand and ensure the pressure valve is closed. Inflate the bladder until no blood is flowing through the artery and no pulse is palpated. The pressure reading on the sphygmomanometer at this stage is an estimate of the maximum pressure required to measure the systolic pressure. Deflate the cuff and rest the arm for one to two minutes to allow the blood to be released and recirculate."],"q":"How is a preliminary palpatory systolic blood pressure check performed?","opts":["Feeling for a pulse in the crook of the elbow, inflating the sphygmomanometer cuff until the pulse stops and noting the reading after a minute or two.","Feeling for a pulse in the crook of the elbow, inflating the sphygmomanometer cuff until the pulse stops in the non-dominant hand.","Feeling for a pulse in the crook of the elbow, inflating the sphygmomanometer cuff until the pulse stops and noting the reading."],"key":"C","qja":"触診による予備的な収縮期血圧チェックはどのように行うか？","ja":"【手動での血圧測定】カフを患者の腕に巻き、INDEX線で腕周囲長がRANGEの範囲内か確認する。範囲外なら、より小さいまたは大きいカフを選ぶ。上腕動脈を触知して位置を確認し、ARTERYマーカーが上腕動脈を指すようにカフを配置する。カフを腕にぴったり巻く。カフが肘窩（腕の曲がり目）の約2.5cm上にあることを確認する。触診による予備的収縮期血圧測定を行う。そのためには、利き手でない方の手で肘窩を触診して上腕動脈を確認し、圧力バルブが閉じていることを確認する。血流が止まり脈が触れなくなるまでカフを膨らませる。この時点の血圧計の値が、収縮期血圧の測定に必要な最大圧の推定値となる。カフの空気を抜き、血液が戻って再循環するよう1〜2分腕を休ませる。","o":[["肘の内側で脈を触れ、脈が止まるまでカフを膨らませ、1〜2分後に値を読む","❌ 1〜2分は値を読んだ『後』、カフを抜いて腕を休ませる時間。時間の位置のすり替え。"],["肘の内側で脈を触れ、利き手でない方の手で脈が止まるまでカフを膨らませる","❌ 利き手でない手は『触診』に使う手。しかも『非利き手で脈が止まる』という意味不明な文になっている。値を読む工程も抜けている。"],["肘の内側で脈を触れ、脈が止まるまでカフを膨らませ、値を読む","✅ 触診→加圧→脈が消えた時点の値が推定値（The pressure reading … at this stage is an estimate）。"]],"exp":"3択は途中まで同じで、最後の数語だけ違う。違う部分（after a minute or two / in the non-dominant hand）を本文と照合するだけで解ける。","pt":"→ 型：選択肢の前半が同一なら、違う末尾だけを比較する。時間・手・順番の位置ずらしに注意。","doubt":null,"voc":[["cuff","（血圧計の）カフ・腕帯"],["circumference","周囲径"],["palpate","触診する"],["brachial artery","上腕動脈"],["snugly","ぴったりと"],["antecubital fossa","肘窩（ひじの内側のくぼみ）"],["crease","しわ・折れ目"],["preliminary","予備の"],["systolic blood pressure","収縮期血圧"],["non-dominant hand","利き手でない方の手"],["inflate","膨らませる"],["bladder","（カフの）空気袋"],["sphygmomanometer","血圧計"],["deflate","空気を抜く"],["recirculate","再び巡る"],["crook of the elbow","ひじの内側のくぼみ"]],"past":null},{"n":6,"title":"GP Notify guidance for GPs","paras":["GP Notify is an automated notification system that informs GPs about: patient admission; patient discharge; patient death. When a patient is admitted, discharged or dies, the automated computer system will inform the patients nominated GP by email or fax of the update. GPs will receive an enrollment confirmation the first time such an event occurs. The form needs to be completed and faxed for automated notifications to continue. To receive notification via fax or email: you will receive an enrolment confirmation form the first time an event occurs on one of your patients. Once the form is completed and returned via fax, automated notifications will commence. If your contact details change, notify the GP Notify Coordinator. Please note that GPs are responsible for ensuring their details are correct and ensuring fax machines or computer systems provide adequate privacy after transmission."],"q":"When a GPs patients are entered into the GP Notify system, the GP","opts":["Needs to complete and return a confirmation form by fax to confirm they have received the information.","Gets notification via email or fax, unless it is the first time one of their patients has been entered into the GP notify system.","Faxes or emails the GP Notify Coordinator to confirm they have received the message."],"key":"B","qja":"GPの患者がGP Notifyシステムに登録されると、そのGPは…","ja":"【GP向けGP Notifyガイダンス】GP Notifyは、患者の入院・退院・死亡をGPに知らせる自動通知システムである。患者が入院・退院・死亡すると、自動システムがその患者の指定GPにメールまたはFAXで知らせる。GPは初めてこうした出来事が起きたときに登録確認を受け取る。自動通知を続けるには、その用紙に記入してFAXで返送する必要がある。FAXまたはメールで通知を受け取るには：あなたの患者に初めて出来事が起きたときに登録確認用紙が届きます。用紙に記入しFAXで返送すると、自動通知が開始されます。連絡先が変わった場合はGP Notifyコーディネーターに知らせてください。GPは自分の情報が正しいこと、送信後もFAXやコンピューターのプライバシーが適切に保たれることに責任を負います。","o":[["情報を受け取ったことを確認するため、確認用紙に記入してFAXで返送する必要がある","❌ 用紙は『登録（enrolment）』のためで、毎回の受領確認ではない。"],["メールかFAXで通知を受け取る。ただし自分の患者が初めて登録された場合は除く","✅ 公式キーB。初回は通知ではなく登録確認用紙が届き、返送後に自動通知が始まる。"],["メッセージを受け取ったことをFAXかメールでGP Notifyコーディネーターに確認する","❌ コーディネーターに知らせるのは連絡先が変わったとき。"]],"exp":"初回（enrolment confirmation form）と2回目以降（automated notifications）で流れが違うことを押さえる。Aは初回の用紙を『毎回の受領確認』にすり替えている。","pt":"→ 型：the first time … という条件が出たら、初回とそれ以降で手順を分けて整理する。","doubt":null,"voc":[["automated","自動の"],["notification","通知"],["admitted","入院した"],["discharged","退院した"],["nominated GP","指定のかかりつけ医"],["enrollment confirmation","登録確認"],["commence","開始する"],["contact details","連絡先"],["adequate privacy","十分なプライバシー保護"],["transmission","送信"]],"past":null}],"C":[{"n":7,"t":0,"p":0,"q":"According to the first paragraph, cimaglermin","opts":["is safe when used in high doses.","improves heart function indefinitely.","is undergoing trials.","is used in high doses."],"key":"C","ev":"According to the results of a small phase 1 trial","note":"小規模な第1相試験の結果＝試験中（C）。Aは『安全』と『高用
