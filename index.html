<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>OET Reading 通勤ドリル</title>
<meta name="theme-color" content="#0f172a">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Reading">

<link rel="manifest" href="manifest.json">
<style>
:root{
  --bg:#0f172a; --card:#1e293b; --card2:#273548; --line:#334155;
  --txt:#e2e8f0; --dim:#94a3b8; --faint:#64748b;
  --acc:#a78bfa; --acc2:#7c3aed; --C:#38bdf8;
  --ok:#22c55e; --okbg:#0f2e1c; --bad:#ef4444; --badbg:#3b1717; --warn:#f59e0b; --warnbg:#3a2a0c;
  --mark:#facc15; --markbg:rgba(250,204,21,.22);
  --fs:16px;
}
@media (prefers-color-scheme: light){
  :root{--bg:#f8fafc;--card:#ffffff;--card2:#f1f5f9;--line:#e2e8f0;--txt:#0f172a;--dim:#475569;--faint:#94a3b8;
    --acc:#7c3aed;--acc2:#6d28d9;--C:#0284c7;--okbg:#e8f8ee;--badbg:#fdecec;--warnbg:#fff6e0;--markbg:rgba(250,204,21,.45)}
}
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html{-webkit-text-size-adjust:100%}
body{margin:0;background:var(--bg);color:var(--txt);
  font-family:-apple-system,BlinkMacSystemFont,"Hiragino Sans","Segoe UI",sans-serif;
  padding:env(safe-area-inset-top) 0 calc(env(safe-area-inset-bottom) + 76px);line-height:1.55}
header{position:sticky;top:0;z-index:10;background:color-mix(in srgb,var(--bg) 92%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);padding:10px 16px 8px;border-bottom:1px solid var(--line)}
.hrow{display:flex;align-items:center;gap:8px}
h1{font-size:16px;margin:0;flex:1}
.fsbtn{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:8px;height:30px;min-width:34px;font-size:13px;font-weight:700}
main{padding:14px 16px;max-width:640px;margin:0 auto}
nav{position:fixed;left:0;right:0;bottom:0;z-index:10;display:flex;background:color-mix(in srgb,var(--bg) 94%,transparent);
  backdrop-filter:blur(8px);-webkit-backdrop-filter:blur(8px);border-top:1px solid var(--line);padding:6px 8px calc(env(safe-area-inset-bottom) + 6px)}
nav button{flex:1;background:none;border:none;color:var(--faint);font-size:11px;font-weight:600;padding:6px 0;display:flex;flex-direction:column;align-items:center;gap:2px}
nav button .ic{font-size:20px;line-height:1}
nav button.on{color:var(--txt)}
.card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
.muted{color:var(--dim);font-size:13px}
.tiny{color:var(--faint);font-size:12px}
.pill{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:99px;background:var(--card2);color:var(--dim);border:1px solid var(--line)}
.pill.b{color:var(--acc);border-color:color-mix(in srgb,var(--acc) 45%,transparent)}
.pill.c{color:var(--C);border-color:color-mix(in srgb,var(--C) 45%,transparent)}
.pill.past{color:var(--bad);border-color:color-mix(in srgb,var(--bad) 45%,transparent)}
.pill.due{color:var(--warn);border-color:color-mix(in srgb,var(--warn) 45%,transparent)}
.pill.okp{color:var(--ok);border-color:color-mix(in srgb,var(--ok) 45%,transparent)}
.meta{display:flex;flex-wrap:wrap;gap:6px;align-items:center;margin-bottom:10px}
.today h2{font-size:15px;margin:0 0 4px}
.bigbtn{display:block;width:100%;border:none;border-radius:12px;padding:14px;font-size:15px;font-weight:700;color:#fff;margin-top:10px}
.bigbtn.b{background:var(--acc2)} .bigbtn.c{background:#0369a1}
.bigbtn.ghost{background:var(--card2);color:var(--txt);border:1px solid var(--line)}
.stats{display:flex;gap:10px}
.stat{flex:1;background:var(--card2);border-radius:10px;padding:10px;text-align:center}
.stat b{display:block;font-size:20px}
.stat span{font-size:11px;color:var(--dim)}
/* item */
.passage{font-size:var(--fs);line-height:1.7;font-family:Georgia,"Times New Roman","Hiragino Mincho ProN",serif}
.passage h3{font-family:-apple-system,BlinkMacSystemFont,sans-serif;font-size:calc(var(--fs) - 1px);margin:0 0 8px}
.passage p{margin:0 0 10px}
.passage p:last-child{margin-bottom:0}
mark{background:var(--markbg);color:inherit;border-bottom:2px solid var(--mark);padding:0 1px;border-radius:2px}
.qbox{font-size:var(--fs);font-weight:700;margin:0 0 4px}
.qja{font-size:13px;color:var(--dim);margin:0 0 10px}
.opt{display:flex;gap:10px;width:100%;text-align:left;background:var(--card2);border:1.5px solid var(--line);color:var(--txt);
  border-radius:12px;padding:12px;margin-bottom:8px;font-size:calc(var(--fs) - 1px);line-height:1.45}
.opt .lt{flex:none;width:24px;height:24px;border-radius:7px;background:var(--line);display:flex;align-items:center;justify-content:center;font-weight:800;font-size:13px}
.opt .ob{flex:1}
.opt .why{display:block;font-size:13px;color:var(--dim);margin-top:6px;line-height:1.55}
.opt .oja{display:block;font-size:13px;color:var(--txt);opacity:.85;margin-top:4px}
.opt.right{border-color:var(--ok);background:var(--okbg)} .opt.right .lt{background:var(--ok);color:#fff}
.opt.wrong{border-color:var(--bad);background:var(--badbg)} .opt.wrong .lt{background:var(--bad);color:#fff}
.opt:disabled{opacity:1}
.result{font-weight:800;font-size:16px;margin:4px 0 10px}
.result.ok{color:var(--ok)} .result.ng{color:var(--bad)}
.sec{margin-top:12px}
.sec h4{font-size:12px;letter-spacing:.06em;color:var(--dim);margin:0 0 6px}
.sec .body{font-size:14px;line-height:1.7}
.voc{border:1px solid var(--line);border-radius:12px;overflow:hidden}
.voc .vrow{display:flex;gap:10px;padding:7px 10px;font-size:13.5px;line-height:1.5;border-top:1px solid var(--line)}
.voc .vrow:first-child{border-top:none}
.voc .vrow:nth-child(odd){background:var(--card2)}
.voc .w{flex:0 0 42%;font-weight:700}
.voc .m{flex:1;color:var(--dim)}
.point{background:color-mix(in srgb,var(--acc) 14%,var(--card));border:1px solid color-mix(in srgb,var(--acc) 40%,transparent);border-radius:12px;padding:12px;font-size:14px;line-height:1.65}
.doubt{background:var(--warnbg);border:1px solid color-mix(in srgb,var(--warn) 50%,transparent);border-radius:12px;padding:10px 12px;font-size:13px;margin-top:10px}
.pastnote{background:var(--badbg);border:1px solid color-mix(in srgb,var(--bad) 45%,transparent);border-radius:12px;padding:8px 12px;font-size:13px;margin-bottom:10px}
details{background:var(--card2);border-radius:12px;padding:10px 12px;margin-top:10px}
details summary{font-size:13px;font-weight:700;color:var(--dim);cursor:pointer;list-style:none}
details summary::-webkit-details-marker{display:none}
details summary::before{content:"▸ "} details[open] summary::before{content:"▾ "}
details .body{font-size:14px;line-height:1.75;margin-top:8px}
.navrow{display:flex;gap:8px;margin-top:14px}
#after{scroll-margin-top:64px}
.navrow button{flex:1}
/* list */
.chips{display:flex;gap:6px;overflow-x:auto;margin:0 -16px 12px;padding:0 16px;scrollbar-width:none}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;background:var(--card2);border:1px solid var(--line);color:var(--dim);border-radius:99px;padding:6px 12px;font-size:13px;font-weight:600}
.chip.on{background:var(--txt);color:var(--bg);border-color:var(--txt)}
.setblk{margin-bottom:16px}
.setblk h3{font-size:13px;color:var(--dim);margin:0 0 8px;display:flex;justify-content:space-between}
.row{display:flex;align-items:center;gap:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:10px 12px;margin-bottom:6px;width:100%;text-align:left;color:var(--txt);font-size:14px}
.row .num{flex:none;width:34px;font-weight:800;color:var(--dim);font-size:13px}
.row .tt{flex:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.dot{flex:none;width:10px;height:10px;border-radius:50%;background:var(--line)}
.dot.ok{background:var(--ok)} .dot.ng{background:var(--bad)}
.grid{display:grid;grid-template-columns:repeat(11,1fr);gap:3px}
.cell{aspect-ratio:1;border-radius:3px;background:var(--line)}
.cell.ok{background:var(--ok)} .cell.ng{background:var(--bad)} .cell.fix{background:#15803d;outline:1px solid var(--bad)}
.legend{display:flex;gap:12px;flex-wrap:wrap;font-size:11px;color:var(--dim);margin-top:8px}
.legend i{display:inline-block;width:9px;height:9px;border-radius:2px;margin-right:4px;vertical-align:-1px}
.heat{display:grid;grid-template-columns:repeat(14,1fr);gap:3px;margin-top:6px}
.heat div{aspect-ratio:1;border-radius:3px;background:var(--line)}
.heat .l1{background:color-mix(in srgb,var(--acc) 40%,var(--line))} .heat .l2{background:color-mix(in srgb,var(--acc) 70%,var(--line))} .heat .l3{background:var(--acc)}
.small-btns{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
.small-btns button{background:var(--card2);border:1px solid var(--line);color:var(--txt);border-radius:10px;padding:8px 12px;font-size:13px}
.empty{text-align:center;color:var(--dim);font-size:14px;padding:30px 10px}
</style>
</head>
<body>
<header>
  <div class="hrow">
    <h1 id="htitle">OET Reading 通勤ドリル</h1>
    <button class="fsbtn" id="fsm" aria-label="文字を小さく">A−</button>
    <button class="fsbtn" id="fsp" aria-label="文字を大きく">A+</button>
  </div>
</header>
<main id="main"></main>
<nav>
  <button data-tab="today" class="on"><span class="ic">☀️</span>今日</button>
  <button data-tab="B"><span class="ic">📄</span>Part B</button>
  <button data-tab="C"><span class="ic">📖</span>Part C</button>
  <button data-tab="log"><span class="ic">📊</span>記録</button>
</nav>
<script>
const SETS = [{"id":"01","texts":[{"title":"Measles","paras":["The ongoing measles outbreaks across the United States and Europe prove definitively that our personal choices affect everybody around us. Although you have a right to your own body, your choice to wilfully be sick ends where another's right to be healthy begins. For that reason, people who \"opt out\" of vaccines should be opted out of American society. This is America, the Land of the Free. That freedom, however, doesn't mean \"I can do whatever I want, whenever I want.\" When we choose to live in a society, there are certain obligations—both moral and legal—to which we are bound. You cannot inflict harm or infringe on the rights and liberties of those around you.","Those obligations extend even to your constitutional rights. Although we have a First Amendment, you are not allowed to play music as loudly as you want in your apartment. Your neighbors have a legal right to peace and quiet. Even though we have a Second Amendment, you are not allowed to shoot a gun for sport in the middle of a city or town. Stray bullets are not only scary, they're hazardous, and often inadvertently kill people. Finally, your moral and legal obligations to the safety of others can even curtail combinations of your rights. Even though consuming alcohol and driving are both legal activities, they are not legal when performed together. Nearly 11,000 people die every year because people choose to exercise their \"rights\" inappropriately.","The exact same reasoning applies to vaccination. There is no moral difference between a drunk driver and a wilfully unvaccinated person. Both are selfishly, recklessly and knowingly putting the lives of everyone they encounter at risk. Their behavior endangers the health, safety and livelihood of the innocent bystanders who happen to have the misfortune of being in their path.","The reasons why are simple and straightforward. Vaccines aren't perfect (e.g., they can wear off over time) and not everyone can be vaccinated. There is one and only one legitimate reason to skip a vaccine: being immune-compromised. Some individuals, because of genetic deficiencies or diseases like cancer, cannot receive vaccines. Other people are too young. Vaccines such as MMR (measles, mumps, rubella) cannot be administered before 12 months of age. These vulnerable people rely on the responsible actions of everyone else in society to protect them, a concept known as \"herd immunity.\"","For their sake, we have a moral—and there should also be a legal—obligation to protect them. Everyone who can be vaccinated must be vaccinated in order to prevent the spread of disease. This is a protection we demand even for our animals: kennels will turn your pet away if they aren't properly vaccinated and on an accepted flea treatment. There are rules we all have to play by and responsibilities we have to live up to if we want to live in a society together.","If this isn't enough to convince a person to become fully vaccinated, then perhaps there is a solution that maintains everybody's freedom: Anti-vaxxers (as people who object to vaccinations call themselves) can opt out of American society. No public or private school, workplace or other institution should allow a non-exempt, unvaccinated person through their doors. A basic concern for the health and safety of others is the price it costs to participate. Is that too harsh? We don't think so. If a person wants to blast their music loudly, shoot guns aimlessly, and drink and drive, they should be allowed to do exactly as they please: so long as it's on their own property, sufficiently isolated from everyone else. Similarly, if you don't want to be vaccinated, perhaps that should be allowed too, so long as you agree to permanently live out in the middle of nowhere.","It is inexcusable that society has reached this point. Many of the deadliest diseases known to mankind are due to bacteria and viruses, and dozens of them are now entirely preventable thanks to the sciences of microbiology and immunology. People falsely believe that diseases like measles have \"gone away,\" but they have not. They're always there, waiting to strike as soon as our collective guard goes down. Not so long ago, smallpox ran the risk of obliterating entire cities, while polio paralyzed large fractions of a generation. We have forgotten this morbid history because public health has been a victim of its own success.","But misinformation abounds. The internet, both a blessing and a curse, has allowed devilish lies, propaganda and a discredited fraud masquerading as science to infect the minds of millions of people. Unfortunately, there's no vaccine that can inoculate someone against a counterfactual, unscientific mindset. There are, however, vaccines that can prevent dozens of harmful diseases. Those who refuse, and recklessly endanger others, should be put in quarantine."]},{"title":"Fracture","paras":["Although sports injuries to the knee, ankle, and shoulder have been well documented, injuries to the pelvis, hip, and thigh get little attention because of their low prevalence. Unfortunately, severe consequences may result if these injuries are improperly managed.","Femoral neck stress fractures were mainly seen in military recruits due to a triad of activity that is new, strenuous, and highly repetitive. However, as a result of self-imposed fitness regimens of recreational athletes, over the last 20 years the number of these injuries has been increasing in non-military populations. In contrast, contact sports such as football, rugby, and soccer are usually the cause of most fractures of the hip. Stress fractures occur in normal bones undergoing repeated submaximal stress. As the bone attempts to remodel, osteoclastic activity occurs at a greater rate than osteoblastic activity. When these cumulative forces exceed the structural strength of bone, stress fractures occur. Stress fractures occur mainly at the femoral neck and are classified as either tension (at the superior aspect of the femoral neck) or compression (at the inferior aspect of the femoral neck).","Hip fractures are classified as intracapsular, which includes femoral head and neck fractures, or extracapsular, which includes trochanteric, intertrochanteric, and subtrochanteric fractures. The location of the fracture and the amount of angulation and comminution play integral roles in the overall morbidity of the patient, as does the pre-existing physical condition of the individual. Fractures of the proximal femur are extremely rare in young athletes and are usually caused by high-energy motor vehicle accidents or significant trauma during athletic activity. Other causes may be an underlying disease process such as Gaucher disease, fibrous dysplasia, or bone cysts.","Identification and initiation of treatment is imperative in attempts to avoid complications, such as avascular necrosis (AVN). AVN is more common in patients in the paediatric and adolescent age groups. This outcome is due to the precarious nature of the blood supply to the subchondral region of the femoral head, which does not stabilize until years after skeletal maturity, after which collateral flow develops.","The blood supply to the femoral head has been studied extensively and has been found to change substantially during development. Until the cartilaginous growth plate forms a barrier at age 4 years, the major blood supply comes from the medial and lateral circumflex arteries (metaphyseal arteries), which arise from the deep femoral artery. After age 4 years, the posterosuperior and posteroinferior arterial branches of the medial femoral circumflex bypass the growth plate and form the main blood supply to the femoral head. During adolescence, the growth plate fuses and the metaphyseal vessels again become significant, traveling along the femoral neck. Fractures in this area can disrupt this delicate blood supply, leading to AVN, the most severe complication of this fracture.","An estimated 340,000 hip fractures occur each year. Estimates indicate that in 2040, approximately 500,000 hip fractures will occur. Nine of 10 hip fractures occur in patients aged 65 years and older, and 3 of 4 occur in women. White females have been reported to be twice as likely to fracture their hips than black and Hispanic females. This frequency has been associated with a metropolitan setting, increased caffeine use, alcohol use, sedentary lifestyle, psychotropic drug use, and senile dementia.","Patients with hip fractures may present in a variety of ways, ranging from an 80-year-old woman reporting hip pain after a trivial fall to a 30-year-old man in hemorrhagic shock after a high-speed motor vehicle accident. Stress fractures usually manifest more insidiously, with an otherwise healthy person reporting pain related to activity and not healing with the conservative treatments suggested by their primary care doctor. Although the classic presentation of a hip fracture is an elderly patient who is in extreme pain, a young, healthy athlete usually has the same presentation. The affected leg is externally rotated and may be shortened. The extremity shortening occurs because the muscles acting on the hip joint depend on the continuity of the femur to act, and when this continuity is disrupted, the result is a shorter-appearing leg. Assessing peripheral pulses and checking Doppler pressures to assure vascular patency is very important.","The patient with a stress fracture may present more subtly, reporting pain in the anterior groin or thigh. This pain increases with activity and can persist for hours afterward. The pain can progress to a point of consistency, even without activity. This pain generally expresses itself in the groin; however, it can also be referred to the knee. An antalgic gait pattern is often present. Signs and symptoms usually involve a diffuse or localized aching pain in the anterior groin or thigh region during weight-bearing activities that is relieved with rest. Night pain is also common. A study by Brännström et al that included 408,000 older adults reported an association between antidepressant medications and hip fracture before and after the initiation of therapy. Further investigations are needed to study this association."]}],"B":[{"n":1,"title":"General Guidelines for Eye Drop Application","paras":["These guidelines give general advice on how to use most eye drops. However, you may be given specific instructions which may vary from the advice below. After thoroughly washing your hands, sit or stand in front of a mirror. Bend your head backwards and gently pull your lower eyelid down. Hold the dropper above one eye. Squeeze one drop into the pocket formed by gently pulling down the lower eyelid. Try not to touch your eye, eyelashes, or anything else with the dropper tip in order to keep it clean. Let go of the eyelid and keep the eye closed for as long as possible (2-3 minutes at least) after application of the eye drop, with your head tilted down towards the floor. Wipe away any liquid that falls on to your cheek with a tissue."],"q":"What does the following article say about the application of eye-drops?","opts":["there is more than one way to apply eye drops","the dropper tip should be wiped clean after each use","your eye should be closed for 2-3 minutes before applying eye drops"],"key":"A","qja":"点眼の方法について、この記事は何と言っているか？","ja":"【点眼の一般ガイドライン】このガイドラインはほとんどの点眼薬の一般的な使い方を示すものだが、以下とは異なる個別の指示を受けることもある。手をよく洗ったら鏡の前に座るか立つ。頭を後ろに傾け、下まぶたをそっと引き下げる。点眼容器を片目の上に構え、下まぶたを引いてできたくぼみに1滴落とす。容器の先端を清潔に保つため、目・まつげなど何にも触れないようにする。まぶたを離し、点眼後はできるだけ長く（少なくとも2〜3分）目を閉じ、頭を床の方へ傾けておく。頬に垂れた液はティッシュで拭き取る。","o":[["点眼のやり方は1通りではない","✅ 冒頭の However, you may be given specific instructions which may vary from the advice below＝「以下と異なる指示もありうる」→方法は複数ありうる、の言い換え。"],["容器の先端は毎回使用後に拭いて清潔にすべき","❌ 本文は「先端を何にも触れさせない（to keep it clean）」。拭くとは書いていない。clean という単語につられる罠。"],["点眼の前に2〜3分目を閉じておくべき","❌ 2〜3分閉じるのは点眼『後（after application）』。before/after の入れ替え。"]],"exp":"正解の根拠は手順の中ではなく冒頭の前置き文。Part Bは『本文の主旨・注意書き』が正解になることが多く、手順の細部（数字・順番）は時系列をずらした誤答に使われやすい。","pt":"→ 型：数字（2〜3分）が選択肢に出たら、それが『いつ』の話かを本文で必ず照合する。before/after の入れ替えは定番の誤答。","doubt":null,"voc":[["vary","異なる・まちまちである"],["thoroughly","十分に・徹底的に"],["eyelid","まぶた"],["squeeze","(絞り出すように)押し出す"],["tilted","傾けた（tilt：傾ける）"],["wipe away","拭き取る"]],"past":null},{"n":2,"title":"Cochlear Implantation Recommendations","paras":["This technology appraisal examined the currently available devices for cochlear implantation. Unilateral cochlear implantation is recommended as an option for people with severe to profound deafness who do not receive adequate benefit from acoustic hearing aids. If different cochlear implant systems are considered to be equally appropriate, the least costly should be used. Assessment of cost should take into account acquisition costs, long-term reliability and the support package offered. Simultaneous bilateral cochlear implantation is recommended as an option for children and for adults who are blind or who have other disabilities that increase their reliance on auditory stimuli as a primary sensory mechanism for spatial awareness. Patients should have severe to profound deafness with limited or no adequate benefit from acoustic hearing aids."],"q":"Which of the following statements is not mentioned?","opts":["value for money is an important factor in cochlear implantation acquisition.","both adults and children could be possible candidates for cochlear implantation.","simultaneous bilateral cochlear implantation necessitates the use of identical devices."],"key":"C","qja":"次のうち、本文で述べられていないものはどれか？","ja":"【人工内耳の推奨】本技術評価では現在入手可能な人工内耳機器を検討した。片側人工内耳は、通常の補聴器で十分な効果が得られない重度〜最重度難聴の人への選択肢として推奨される。複数の人工内耳システムが同等に適切と考えられる場合は、最も安価なものを使用すべきである。費用の評価には購入費、長期的信頼性、サポート体制を考慮する。両側同時人工内耳は、小児、および盲目やその他の障害により空間認識の主要な感覚として聴覚に頼る度合いが高い成人に対する選択肢として推奨される。患者は重度〜最重度の難聴で、補聴器の効果が限定的または不十分であることが条件。","o":[["費用対効果は人工内耳の購入における重要な要素である","❌（述べられている）the least costly should be used／acquisition costs, long-term reliability … で費用が考慮されている。"],["大人も子どもも人工内耳の候補になりうる","❌（述べられている）両側同時は for children and for adults who are blind … と明記。"],["両側同時人工内耳では同一機種を使う必要がある","✅（述べられていない）『同一機種』の話は一切ない。これが正解。"]],"exp":"NOT mentioned 型。3つの選択肢を1つずつ本文に当てて『書いてあるもの』を消していく消去法が確実。simultaneous bilateral という本文の語を使って『もっともらしい新情報』を足したのがC。","pt":"→ 型：NOT問題は『本文の語を借りて、本文にない条件を足した選択肢』が正解。本文語彙の一致だけで『書いてある』と判断しない。","doubt":null,"voc":[["appraisal","評価・査定"],["profound deafness","高度（最重度）難聴"],["acoustic hearing aid","補聴器"],["acquisition cost","取得（購入）費用"],["reliability","信頼性・耐久性"],["simultaneous bilateral","両側同時の"],["reliance","依存"],["necessitate","必要とする"]],"past":null},{"n":3,"title":"Apple Watch Detects Irregular Heartbeat In Large U.S. Study","paras":["Dr. Deepak Bhatt, one of the study's lead investigators, said \"the physician can use the information from the study, combine it with their assessment ... and then guide clinical decisions around what to do with an alert.\" The study found that 57 percent of participants who received an alert on their watch sought medical attention. For Apple, the data provides firepower as it pushes into healthcare. Its new 'Series 4 Watch' has the ability to take an electrocardiogram to detect heart problems and requires clearance from the U.S. Food and Drug Administration. Dr. Bhatt called it an important study as use of this type of wearable technology is only going to become more prevalent."],"q":"What can you infer about Dr. Bhatt's opinion?","opts":["he is doubtful that a proper diagnosis can be made","he thinks this type of technology is likely to become widespread","he is a proponent of the medical uses of wearable technology"],"key":"B","qja":"Bhatt医師の意見について何が推測できるか？","ja":"【Apple Watch、米大規模研究で不整脈を検出】研究の主任研究者の一人Deepak Bhatt医師は「医師は研究から得た情報を自身の評価と組み合わせ…アラートへの対応に関する臨床判断に役立てることができる」と述べた。研究では、時計でアラートを受けた参加者の57%が受診した。Appleにとって、このデータはヘルスケア参入を後押しする材料になる。新しい『Series 4』は心電図を測定して心臓の問題を検出でき、FDAの承認が必要となる。Bhatt医師は、この種のウェアラブル技術の利用は今後ますます広がる一方だとして、重要な研究だと述べた。","o":[["適切な診断が下せるかどうか懐疑的である","❌ 懐疑を示す表現はない。むしろ『医師の評価と組み合わせて使える』と肯定的。"],["この種の技術は広く普及する可能性が高いと考えている","✅ use of this type of wearable technology is only going to become more prevalent（ますます普及する一方）の言い換え。prevalent ≒ widespread。"],["ウェアラブル技術の医療利用の推進者（支持者）である","❌ proponent（推進者・提唱者）は言い過ぎ。『普及するだろう』は予測であって、推進の立場表明ではない。"]],"exp":"推測（infer）問題でも、正解はたいてい本文の1文の言い換え。Cは雰囲気として合っているが、proponent という『強い立場』を本文は支えていない。","pt":"→ 型：予測（will become prevalent）と態度（proponent / advocate）は別物。意見問題では選択肢の『強さ』が本文と一致するかを確認。","doubt":null,"voc":[["investigator","研究者・治験責任医師"],["sought","求めた（seek の過去形）"],["firepower","後押しとなる武器・強み"],["electrocardiogram","心電図"],["clearance","（当局の）承認"],["prevalent","広く見られる・普及した"],["proponent","支持者・推進者"]],"past":null},{"n":4,"title":"Violence in the Workplace: A Growing Problem","paras":["Workplace violence in any form comes at a high cost to the individual and institutions. It has lasting effects on our healthcare system and deeply impacts clinicians on a personal and professional level. Workplace violence can have a wide range of impacts, including effects on self-esteem, relationships with co-workers, recruitment and retention. The psychological trauma often makes individuals fearful of returning to work. As healthcare professionals, we must be advocates for not only our patients, but also for ourselves. A safe work environment is built upon a foundation of trust and respect for all. No case should go unreported and zero tolerance should be implemented to ensure that we can protect ourselves as well as deliver safe patient care."],"q":"In this article, what does the word 'advocates' indicate?","opts":["sometimes, workplace violence results in legal procedures","healthcare workers may need to support themselves as well as their patients","violent patients should be admonished"],"key":"B","qja":"この記事で『advocates』という語は何を示しているか？","ja":"【職場の暴力：深刻化する問題】職場の暴力はどのような形でも個人と組織に大きな代償をもたらす。医療制度に長期的な影響を及ぼし、臨床家の個人面・職業面に深刻な影響を与える。自尊心、同僚との関係、採用や定着にまで影響が及びうる。心理的トラウマのため、職場復帰を恐れるようになることも多い。医療専門職として、私たちは患者だけでなく自分自身の擁護者（advocates）でもなければならない。安全な職場環境は、すべての人への信頼と尊重の上に築かれる。どの事例も報告されないままにすべきではなく、自分を守りつつ安全な患者ケアを提供できるよう、ゼロ・トレランスを実施すべきである。","o":[["職場の暴力は時に法的手続きに発展する","❌ advocate を『弁護士』の意味に取らせる罠。本文に法的手続きの話はない。"],["医療者は患者だけでなく自分自身も支える必要がある","✅ we must be advocates for not only our patients, but also for ourselves の言い換え。advocate＝擁護する人・支える人。"],["暴力的な患者は叱責されるべきだ","❌ admonish（叱る）は本文にない。zero tolerance から連想させる誤答。"]],"exp":"語彙問題は、その語を含む文の構造（not only A but also B）をそのまま言い換えた選択肢が正解になる。","pt":"→ 型：語義問題は辞書的な第一義（advocate＝弁護士）ではなく、その文脈での役割で答える。","doubt":null,"voc":[["lasting","長く続く"],["self-esteem","自尊心"],["retention","（人材の）定着"],["psychological trauma","心的外傷"],["advocate","擁護する人・代弁者"],["zero tolerance","一切容認しない方針"],["admonish","叱責する"]],"past":null},{"n":5,"title":"Is It Safe to Reinfuse Blood Drawn from a CVAD Via a Syringe When Checking Line Patency or Drawing Blood?","paras":["Before withdrawing a blood aspirate from a central venous access device (CVAD), ask yourself, why am I taking this blood aspirate? Are you taking the blood aspirate to assess for device patency prior to hooking up to an intravenous infusion or do you require a blood sample for laboratory analysis? If you are simply checking CVAD patency you only need to pull blood back into the catheter until you see the liquid gold; it never needs to come as far as the catheter hub and needleless connector. The ease of aspiration can still be assessed with this small aspiration technique as you get a different feel when you are aspirating air (more resistance is felt) as opposed to the free-flowing feeling of aspirating liquid."],"q":"What does this article tell the reader about drawing blood?","opts":["the procedure of pulling blood back gives rise to more than one sensation","the catheter should be removed before taking blood samples","aspiration should be avoided in CVAD procedures"],"key":"A","qja":"採血についてこの記事は何を伝えているか？","ja":"【CVADから注射器で引いた血液を、開存確認や採血時に戻しても安全か？】中心静脈アクセスデバイス（CVAD）から血液を吸引する前に、なぜ吸引するのかを自問しよう。点滴接続前に開存性を確認するためか、検査用の検体が必要なのか。単に開存確認なら、カテーテル内に血液（liquid gold）が見えるところまで引けば十分で、カテーテルのハブや無針コネクタまで来させる必要はない。空気を吸引しているとき（抵抗が強い）と、液体を吸引しているときのスムーズな感触は異なるので、この少量吸引でも吸引のしやすさは評価できる。","o":[["血液を引き戻す手技では、複数の異なる感触が生じる","✅ you get a different feel when you are aspirating air (more resistance) as opposed to … liquid の言い換え。sensation＝feel。"],["採血の前にカテーテルを抜去すべき","❌ 抜去の話は一切ない。"],["CVAD手技では吸引を避けるべき","❌ 本文は吸引のやり方（少量でよい）を述べており、避けろとは言っていない。"]],"exp":"R1で誤答（Cを選択）。本文全体が aspirate（吸引）の話なので『吸引を避ける』は主旨と逆。Aは『感触が違う』という1文を抽象化した言い換えで、見抜きにくい。","pt":"→ 型：正解は本文の具体（空気は抵抗が強い／液体はスムーズ）を抽象語（more than one sensation）に言い換えたもの。具体→抽象の変換を疑う。","doubt":null,"voc":[["aspirate","吸引する／吸引した血液"],["patency","開存（詰まっていないこと）"],["prior to","〜の前に"],["hook up to","〜につなぐ"],["intravenous infusion","点滴静注"],["as opposed to","〜とは対照的に"],["free-flowing","滑らかに流れる"],["sensation","感覚"]],"past":"C"},{"n":6,"title":"What Should I Consider Before Participating in a Clinical Trial?","paras":["Before participating, you must be provided with an \"informed consent\" document explaining the risks and potential benefits of the trial. Be sure to read over this information carefully. It is important to fully understand the purpose of the trial and what to expect. You will want to find out if the treatment will interact with any of your current medications or affect any other medical conditions you may have. You should be informed about what tests or procedures, such as biopsies or blood draws, will be performed, and you should consider your comfort level with what will be done. Also, think about whether you are prepared for any anticipated side effects, pain, or discomfort that may be involved."],"q":"What advice is given in this article about participating in a clinical trial?","opts":["you should inform a family member of your intentions","you should give consent to possible side-effects","you should know about the reason for the trial"],"key":"C","qja":"臨床試験への参加について、この記事はどんな助言をしているか？","ja":"【臨床試験に参加する前に考えるべきこと】参加前に、試験のリスクと潜在的利益を説明した『インフォームド・コンセント』文書を受け取らなければならない。よく読むこと。試験の目的と、何が起こるかを十分に理解することが重要である。治療が現在の服薬と相互作用しないか、持病に影響しないかも確認したい。生検や採血などどんな検査・処置が行われるか説明を受け、それを受け入れられるかを考えるべきだ。また、予想される副作用・痛み・不快感への心構えができているかも考えておくこと。","o":[["家族に参加の意思を伝えるべき","❌ 家族の話はない。"],["起こりうる副作用に同意すべき","❌ 本文は副作用に『備えができているか考える（think about whether you are prepared）』。consent は文書名として出るだけで、副作用への同意ではない。"],["試験の目的を知っておくべき","✅ It is important to fully understand the purpose of the trial の言い換え。"]],"exp":"Bは本文の語（consent, side effects）を2つ組み合わせて別の意味を作った典型的な誤答。","pt":"→ 型：本文の単語が2つ以上入っている選択肢ほど疑う。単語の組み合わせで意味がすり替わっていないか確認。","doubt":null,"voc":[["informed consent","説明と同意"],["read over","ひと通り目を通す"],["interact with","〜と相互作用する"],["biopsy","生検"],["comfort level","受け入れられる範囲・抵抗感"],["anticipated","予想される"],["discomfort","不快感"]],"past":null}],"C":[{"n":7,"t":0,"p":0,"q":"In the first paragraph, what does the writer infer about freedom?","opts":["freedom has its limits.","moral and legal freedom is undesirable.","an individual's freedom is more important than others rights and liberties.","you cannot 'opt out' of the question of freedom in modern society."],"key":"A","ev":"That freedom, however, doesn't mean \"I can do whatever I want, whenever I want.\"","note":"「自由＝何をしてもいい、ではない」→自由には限界がある（A）。","doubt":null,"alt":[],"voc":[["outbreak","集団発生・流行"],["definitively","決定的に"],["wilfully","故意に"],["opt out","離脱する・参加しない"],["obligation","義務"],["be bound to","〜に縛られる"],["inflict harm","危害を加える"],["infringe on","〜を侵害する"],["liberties","自由（権利としての）"]],"oja":["自由には限界がある。","道徳的・法的な自由は望ましくない。","個人の自由は他者の権利や自由より重要である。","現代社会では自由という問題から離脱することはできない。"],"past":null},{"n":8,"t":0,"p":1,"q":"In paragraph two, which of the following are not true?","opts":["the people who live near you have a right to a certain degree of calm.","the First Amendment limits your activity in some ways.","the Second Amendment does not permit unlimited use of guns.","freedom is more important than the welfare of everyone."],"key":"D","ev":"your moral and legal obligations to the safety of others can even curtail combinations of your rights","note":"NOT true。段落は『権利は他者の安全のために制限される』と述べ、D『自由は皆の福祉より重要』は逆。","doubt":null,"alt":[],"voc":[["constitutional right","憲法上の権利"],["Amendment","（憲法の）修正条項"],["stray bullet","流れ弾"],["hazardous","危険な"],["inadvertently","うっかり・意図せず"],["curtail","制限する・削減する"],["exercise","（権利を）行使する"]],"oja":["近隣に住む人には、ある程度の静けさを得る権利がある。","憲法修正第1条はあなたの行動をある程度制限する。","憲法修正第2条は銃の無制限な使用を認めていない。","自由は皆の福祉より重要である。"],"past":null},{"n":9,"t":0,"p":2,"q":"The example of a drunk driver is given to","opts":["show that there can be terrible consequences of selfish behavior.","demonstrate that acting freely can lead to accidents.","emphasize the link between alcohol and driving.","some people are innocent of wilful misdemeanors."],"key":"A","ev":"Both are selfishly, recklessly and knowingly putting the lives of everyone they encounter at risk.","note":"飲酒運転の例＝利己的行動の恐ろしい結果を示すため（A）。","doubt":null,"alt":[],"voc":[["reasoning","論法・筋道"],["recklessly","無謀に"],["endanger","危険にさらす"],["livelihood","生計・暮らし"],["bystander","居合わせた人・傍観者"],["misfortune","不運"],["misdemeanor","軽犯罪・非行"]],"oja":["利己的な行動が恐ろしい結果を招きうることを示すため。","自由に振る舞うと事故につながりうることを示すため。","飲酒と運転の結びつきを強調するため。","故意の違反について無実の人もいる。"],"past":null},{"n":10,"t":0,"p":3,"q":"In paragraph four, which of the following would not be exceptions to the idea that everyone should be vaccinated?","opts":["people with pre-existing conditions which mean that vaccines would be ineffective.","people for whom the effects of vaccines do not wear off over time.","very young children.","anyone who has a severe problem with their immune system."],"key":"A","ev":"There is one and only one legitimate reason to skip a vaccine: being immune-compromised.","note":"公式キーA。本文は『接種できない（cannot receive）』であって『効かない（ineffective）』ではない、という言い換えのズレを突く設問。","doubt":"⚠️ Bの『効果が切れない人』も例外ではないので、Bも正解になりうる設問。キーはA。","alt":[],"voc":[["straightforward","明快な・分かりやすい"],["wear off","（効果が）次第に切れる"],["legitimate","正当な"],["immune-compromised","免疫が低下した"],["deficiency","欠損・不足"],["administer","（薬を）投与する"],["vulner して治療でなく鎮痛薬を勧めることがある","患者によっては、ねじれた脚の筋肉が疲労骨折の診断を難しくする"],"past":"C"},{"n":22,"t":1,"p":7,"q":"Which of the following is not mentioned in the last paragraph?","opts":["the location of a pain is an important factor in correct diagnosis","nocturnal pain can be symptomatic of a stress fracture","pain duration should be taken into account","antidepressant medication can relieve some symptoms of stress fractures"],"key":"D","ev":"reported an association between antidepressant medications and hip fracture","note":"NOT mentioned。抗うつ薬は骨折との『関連』が報告されただけで、症状を和らげるとは言っていない（D）。","doubt":null,"alt":[],"voc":[["subtly","かすかに・分かりにくく"],["anterior groin","前方の鼠径部"],["persist","持続する"],["referred to the knee","膝への放散痛として出る"],["antalgic gait","疼痛回避跛行"],["diffuse","びまん性の"],["weight-bearing","体重のかかる"],["relieved with rest","安静で和らぐ"],["nocturnal","夜間の"],["antidepressant","抗うつ薬"]],"oja":["痛みの部位は正しい診断のための重要な因子である","夜間の痛みは疲労骨折の症状でありうる","痛みの持続時間を考慮すべきである","抗うつ薬は疲労骨折の症状をいくらか和らげうる"],"past":null}]},{"id":"02","texts":[{"title":"","paras":["Surgery that preserves the lung, when combined with other therapies, appears to extend the lives of people with a subtype of the rare and deadly cancer mesothelioma, a new study suggests. Tracking 73 patients with advanced malignant pleural mesothelioma—which affects the lungs' protective lining in the chest cavity—researchers found that those treated with lung-sparing surgery had an average survival of nearly three years. A subset of those patients survived longer than seven years. Mesothelioma patients treated with chemotherapy alone, which is standard care, live an average of 12 to 18 months, the researchers said.","Study participants received lung-sparing surgeries and another treatment called photodynamic therapy that uses light to kill cancer cells. Ninety-two percent of the group also received chemotherapy. The study volunteers achieved far longer survival times, said study author Dr. Joseph Friedberg. \"When you take the entire lung out, it's a significant compromise in quality of life,\" said Friedberg. He's director of the University of Maryland Medical Center's Mesothelioma and Thoracic Oncology Treatment and Research Center in Baltimore.","\"For all intents and purposes, this lung-sparing surgical approach is the largest palliative operation known to man, since chances of curing mesothelioma are vanishingly small,\" said Friedberg. He completed the research while at his previous post at the University of Pennsylvania. \"Plus, most of these patients are elderly, so preserving quality of life was really the goal,\" he added.","About 3,000 Americans are diagnosed with mesothelioma each year, the American Cancer Society says. Many of these people were exposed to the mineral asbestos in industrial occupations, according to the U.S. National Cancer Institute (NCI). Used in products such as insulation, building shingles and flooring, asbestos dust fibers can be inhaled or swallowed, settling in the lungs, stomach or other body areas. Often, it takes decades after exposure for mesothelioma to develop, the NCI says.","Friedberg and his team performed the lung-sparing surgeries on study participants between 2005 and 2013. Overall average survival was 35 months, the study showed. But survival time more than doubled to 7.3 years for 19 patients whose cancer had not spread to their lymph nodes. Most of the patients in the study had stage 3 or stage 4 cancer. Typically, Friedberg said, only about 15 to 20 percent of mesothelioma patients are treated with surgery, which often removes an entire lung as well as the diaphragm and the sac surrounding the heart.","Friedberg said that between 20 and 40 percent of pleural mesothelioma patients with the epithelial subtype might be eligible for lung-sparing surgery. He explained that this surgery removes all visible traces of cancer. It typically has fewer complications and a lower risk of dying in the 90 days following the 10 to 14 hours procedure.","\"It's still relatively new that people do lung-sparing surgery for this disease, and it's not established that this is what we need to do,\" said Friedberg. \"I would say this is one of the most lethal cancers known to man. There's a pressing need for new and innovative treatments,\" he noted.","Dr. Daniel Petro, a medical oncologist/hematologist at the University of Pittsburgh Medical Center, said lung-sparing surgery for mesothelioma is also done at academic centers such as his, and he was not surprised by the study's results \"This surgical approach is a step forward with this particular terrible cancer,\" Petro said, \"and we've got to keep coming up with better options to eradicate it.\""]},{"title":"","paras":["People with the reading disability dyslexia may have brain differences that are surprisingly wide-ranging, a new study suggests. Using specialized brain imaging, scientists found that adults and children with dyslexia showed less ability to \"adapt\" to sensory information compared to people without the disorder. And the differences were seen not only in the brain's response to written words, which would be expected. People with dyslexia also showed less adaptability in response to pictures of faces and objects. That suggests they have \"deficits\" that are more general, across the whole brain, said study lead author Tyler Perrachione. He's an assistant professor of speech, hearing and language sciences at Boston University. The findings, published in the Dec. 21 issue of the journal Neuron, offer clues to the root causes of dyslexia.","Other studies have found that people with dyslexia show differences in the brain's structure and function. \"But it hasn't been clear whether those differences are a cause or consequence of dyslexia,\" Perrachione explained. The chicken-and-egg question is tricky, because years of reading, or years of reading disability, affect brain development. Perrachione said his team thinks it has discovered a cause of dyslexia—partly because the reduced adaptation was seen in young kids, and not only adults.","A researcher who was not involved in the study called it \"groundbreaking.\" \"Frankly, researchers have struggled with understanding the brain bases of dyslexia,\" said Guinevere Eden, director of the Center for the Study of Learning at Georgetown University Medical Center in Washington, D.C. Scientists have known that brain structure and function look different in people with dyslexia, Eden said, but they haven't known why. \"This study makes an important step in that direction,\" she said. \"It gets to the true characteristics of the properties of the neurons [cells] in these brain regions, not just their outward appearance.\"","People with dyslexia have consistent problems with language skills, especially reading. According to the International Dyslexia Association, as much as 15 percent to 20 percent of the population has symptoms of dyslexia—including \"slow\" reading, poor spelling and writing skills, and problems deciphering words that are similar to each other.","The new study aimed to see whether \"neural adaptation\" might play a role. Adaptation is how the brain improves its efficiency. Perrachione offered an example: When you speak to someone for the first time, the brain needs a little time to get used to that person's voice, speaking rhythms and pronunciation of words, for instance.","But then the brain adapts and stops working so hard to process the other person's speech. In people with dyslexia, however, that adaptation seems to be hindered. \"Their brains are working harder to process these sensory inputs,\" Perrachione said.","The new findings are based on functional MRI scans of adults and children with and without dyslexia. The scans were used to capture the study participants' brain activity as they performed a series of tasks. In one experiment, the participants listened to a series of words, read either by a single speaker or several different ones. Overall, the researchers found, people without dyslexia adapted to the single voice, but not to multiple speakers. In contrast, people with dyslexia showed much less adaptation in their brain activity, even when listening to a single speaker. The same pattern was seen when study participants viewed written words.","But the differences went beyond words: People with dyslexia showed less brain adaptation in response to images of faces and objects. That's \"surprising,\" Eden said, since the disorder does not involve apparent problems with recognizing faces or objects.","Perrachione speculated on a reason for the findings: The reduced brain adaptation may only \"show up\" when it comes to reading, because reading is such a complex skill. The brain has no dedicated \"reading\" area. \"Reading is a tool, or technology, that we've invented,\" Perrachione pointed out. Learning to use that technology requires a complex orchestration of different brain \"domains,\" he explained. And yet, because everyone is expected to read, most people probably do not realize what an accomplishment it is, Perrachione said. Eden agreed. \"Learning to read is an astonishing feat and one that we often take for granted,\" she said."]}],"B":[{"n":1,"title":"Risks associated with rubella infection in pregnancy","paras":["Maternal rubella infection can result in spontaneous miscarriage, fetal infection, stillbirth, or fetal growth restriction (Reef et al 2000). Congenital infection is most likely if the maternal infection occurs in the first 16 weeks of pregnancy, with congenital rubella syndrome occurring in all fetuses infected before the 11th week and in 35% of those infected at 13–16 weeks (Miller et al 1982). If infection occurs after 16 weeks of pregnancy, the risk of fetal damage is negligible. Features of congenital rubella syndrome include cardiac defects, deafness, ocular defects, thrombocytopenic purpura, haemolytic anemia, enlarged liver and spleen, and inflammation of the meninges and brain (Sanchez et al 2010). Pneumonitis, diabetes, thyroid dysfunction and progressive panencephalitis are other late expressions of the syndrome (Weil et al 1975; Cooper et al 1995)."],"q":"If a baby is born with visual problems, what stage of pregnancy was it most likely to have been infected with rubella?","opts":["As all babies infected with rubella in their first 11 weeks develop congenital rubella syndrome, the first trimester is when the infection most likely occurred.","As over a third of all fetuses infected with rubella in weeks 13-16 develop congenital rubella syndrome, the second trimester is when the infection most likely occurred.","As all babies infected with rubella after their first 16 weeks do not develop congenital rubella syndrome, the third trimester is when the infection most likely occurred."],"key":"A","qja":"視覚障害をもって生まれた赤ちゃんは、妊娠のどの時期に風疹に感染した可能性が最も高いか？","ja":"【妊娠中の風疹感染に伴うリスク】母体の風疹感染は、自然流産、胎児感染、死産、胎児発育不全を引き起こしうる。先天性感染は母体感染が妊娠16週までに起きた場合に最も起こりやすく、先天性風疹症候群（CRS）は11週より前に感染した胎児の全例、13〜16週に感染した胎児の35%に生じる。16週以降の感染では胎児障害のリスクは無視できる程度である。CRSの特徴には心疾患、難聴、眼の異常、血小板減少性紫斑病、溶血性貧血、肝脾腫、髄膜・脳の炎症がある。肺臓炎、糖尿病、甲状腺機能障害、進行性全脳炎は本症候群の遅発性の表れである。","o":[["11週より前に感染した児は全員CRSを発症するので、感染は妊娠初期（第1三半期）に起きた可能性が最も高い","✅ occurring in all fetuses infected before the 11th week＝100%。眼の異常（ocular defects）はCRSの特徴なので、確率が最も高いのは第1三半期。"],["13〜16週の感染児の3分の1超がCRSを発症するので、第2三半期が最も可能性が高い","❌ 35%は『3分の1超』で事実としては正しいが、100%の第1三半期より低い。『most likely』に答えていない。"],["16週以降に感染した児は全員CRSを発症しないので、第3三半期が最も可能性が高い","❌ 16週以降はリスクが negligible（無視できる）。むしろ最も可能性が低い時期。"]],"exp":"Bは事実として正しいが設問（最も可能性が高いのは？）に答えていない『正しいけど最適でない』誤答。数字の比較問題は、比較の軸（most likely）で並べ直す。","pt":"→ 型：選択肢の前半（理由）が正しくても、結論が設問の最上級（most）に合っているかで判定する。","doubt":null,"voc":[["spontaneous miscarriage","自然流産"],["stillbirth","死産"],["fetal growth restriction","胎児発育不全"],["congenital","先天性の"],["negligible","無視できるほど小さい"],["ocular defect","眼の異常"],["thrombocytopenic purpura","血小板減少性紫斑病"],["spleen","脾臓"],["meninges","髄膜"],["trimester","妊娠の三半期（3か月ごとの区分）"]],"past":null},{"n":2,"title":"Memo to staff re: presence of latex in Fluad trivalent influenza vaccine","paras":["During the 2018 influenza season, natural rubber latex is present in the sheath covering the needle of trivalent influenza vaccine Fluad. Fluad is available for people aged 65 years and over through the National immunization Program (NIP). While reactions to latex are rare, anyone who has a severe allergy to latex should not receive Fluad. Patients aged 65 years and over can still be safely vaccinated with the alternative trivalent influenza vaccine, Fluzone High-Dose through the NIP.","Please note there are no safety concerns regarding the Fluad vaccine itself.","The sponsor of Fluad, Seqirus, commits to update the Product Information and Consumer Medicines Information for this vaccine accordingly.","Action for vaccination providers:","If you are vaccinating patients with Fluad, please be aware of this issue and advise patients accordingly. Reassure patients that reactions to latex are rare.","Before administering Fluad, confirm with patients that they are not allergic to latex.Anyone who has a severe allergy to latex should not receive Fluad. Patients aged 65 years and over can still be safely vaccinated with the alternative trivalent influenza vaccine, Fluzone High Dose, available through the NIP (National Immunization Program) with all vaccinations, and be prepared to treat immediate allergic reactions, including potential anaphylaxis."],"q":"The statement below highlights that","opts":["latex is being found in the Fluad vaccine itself","the Fluad vaccine itself contains latex","latex is not being found in the Fluad vaccine itself"],"key":"C","qja":"下記の文面が強調しているのは何か？","ja":"【スタッフ宛メモ：Fluad三価インフルエンザワクチンのラテックス混入について】2018年のインフルエンザシーズン中、三価インフルエンザワクチンFluadの『針を覆うキャップ』に天然ゴムラテックスが含まれている。Fluadは国の予防接種プログラム（NIP）で65歳以上が対象。ラテックス反応はまれだが、重度のラテックスアレルギーがある人はFluadを接種すべきでない。65歳以上の患者は、代替の三価ワクチンFluzone High-DoseをNIPで安全に接種できる。※Fluadワクチン本体には安全上の懸念はない。販売元Seqirusは添付文書を更新予定。接種者への対応：Fluadを接種する場合はこの問題を把握し、患者に説明すること。ラテックス反応はまれだと安心させる。接種前にラテックスアレルギーがないか確認し、即時型アレルギー反応（アナフィラキシーを含む）に対応できるよう準備すること。","o":[["ワクチン本体からラテックスが検出されている","❌ ラテックスがあるのは needle sheath（針のキャップ）。本体ではない。"],["Fluadワクチン本体にラテックスが含まれている","❌ Aと同じ誤り。there are no safety concerns regarding the Fluad vaccine itself と明記。"],["Fluadワクチン本体からはラテックスは見つかっていない","✅ 本体には問題なし（no safety concerns regarding the Fluad vaccine itself）＋ラテックスは針のキャップ、の組み合わせ。"]],"exp":"AとBはほぼ同じ内容なので、両方正解はありえない＝両方消える、という選択肢構造からも解ける。『itself』という強調語が本文と選択肢の両方にあることがヒント。","pt":"→ 型：意味が同じ選択肢が2つあれば両方誤り。場所（本体か付属品か）の取り違えを狙う設問。","doubt":null,"voc":[["sheath","さや・被覆（ここでは針キャップ）"],["natural rubber latex","天然ゴムラテックス"],["reassure","安心させる"],["administer","投与する"],["anaphylaxis","アナフィラキシー"],["accordingly","それに応じて"],["sponsor","（製品の）販売元・治験依頼者"]],"past":null},{"n":3,"title":"Spray-on skin for diabetic foot ulcers: an open label randomized controlled trial","paras":["A novel intervention towards achieving these goals is the use of spray-on skin for patients with DFU. The application of 'spray-on' autologous skin grafting aids epithelial regeneration and wound healing and has been used successfully for the treatment of burns to improve healing. In this research project we will compare spray-on skin with standard care in an open label randomized controlled trial in patients presenting to hospital with DFU. We hypothesize that spray-on skin will shorten the time for the ulcer to heal completely. In doing so, this approach can be expected to prevent amputations and recurrent ulceration whilst improving quality of life.","Outpatient costs for dressings, home nursing visits and outpatient appointments are key cost drivers for DFU. If spray-on skin is effective, large cost savings to WA Health will be realized immediately through a shortened time to healing, and through a higher proportion of patients achieving complete healing. Any economic benefits are likely to be amplified across Australia and other similar demographic settings where aging populations with increased diabetes rates are considered major future challenges."],"q":"The aim of this trial is to","opts":["check if burns heal at the same rate as diabetic foot ulcers when the same dressing is used","see if a spray-on skin dressing saves money and improves patient outcomes","see if patients getting care in outpatient departments heal quicker than those having care provided in their own home"],"key":"B","qja":"この試験の目的は何か？","ja":"【糖尿病性足潰瘍へのスプレー式皮膚：非盲検ランダム化比較試験】これらの目標達成に向けた新しい介入が、糖尿病性足潰瘍（DFU）患者へのスプレー式皮膚である。自家皮膚を『スプレー』で移植する方法は上皮再生と創傷治癒を助け、熱傷の治療で治癒促進に成功してきた。本研究では、DFUで来院した患者を対象に、スプレー式皮膚と標準治療を非盲検RCTで比較する。スプレー式皮膚は潰瘍が完治するまでの期間を短縮すると仮定している。それにより切断や潰瘍再発を防ぎ、QOLを改善できると期待される。外来でのドレッシング材、訪問看護、外来受診の費用はDFUの主要なコスト要因である。スプレー式皮膚が有効なら、治癒期間の短縮と完治率の向上によって、西オーストラリア州保健局は直ちに大きな費用削減を得られる。高齢化と糖尿病増加が将来の課題とされる豪州全体や同様の人口構成の地域では、経済的利益はさらに増幅されうる。","o":[["同じドレッシングを使ったとき、熱傷が糖尿病性足潰瘍と同じ速さで治るか確認する","❌ 熱傷は『過去にうまく使われた例』として出てくるだけ。熱傷とDFUを比較する試験ではない。"],["スプレー式皮膚が費用を削減し、患者アウトカムを改善するか調べる","✅ 治癒期間短縮・切断予防・QOL改善（アウトカム）＋ large cost savings（費用）の両方が本文の柱。"],["外来で治療を受ける患者の方が在宅より早く治るか調べる","❌ 外来・訪問看護は『コスト要因』として出るだけで、比較対象ではない。"]],"exp":"研究目的の設問では『何と何を比較するか（spray-on skin vs standard care）』と『期待する効果』を拾う。本文に出る固有名詞（burns, outpatient, home nursing）を比較対象にすり替えた誤答が並ぶ。","pt":"→ 型：研究の比較対象（A vs B）を先に特定する。背景情報に出た語を比較対象にした選択肢は誤り。","doubt":null,"voc":[["novel intervention","新しい介入"],["autologous","自家の（本人由来の）"],["skin grafting","皮膚移植"],["epithelial regeneration","上皮の再生"],["hypothesize","仮説を立てる"],["amputation","切断"],["recurrent","再発性の"],["cost driver","費用を押し上げる要因"],["amplified","増幅される"]],"past":null},{"n":4,"title":"Injection technique","paras":["As the amount of subcutaneous fat varies between patients, individual patient assessment is vital before carrying out the procedure. It is important to avoid inadvertently injecting the drug into muscle, as intramuscular injection can affect drug absorption; for example, inadvertent administration of insulin into the muscle can lead to accelerated insulin absorption and lead to hypoglycemia.","A lifted skinfold technique (pinching or bunching the skin) can be used to lift the subcutaneous layer away from the underlying muscle. This method reduces the risk of inadvertent intramuscular injection when undertaken correctly; however, releasing the skin too quickly before the injection is completed or lifting it incorrectly can increase that risk.","Needles need to be long enough to inject the drug into the subcutaneous tissue. They come in lengths of 5cm, 6cm and 8cm. It is suggested the required needle length can be estimated by pinching the skin using the lifted skinfold technique and selecting a needle that is 1.5 times the width of the skinfold."],"q":"What does this information on injection technique tell us about the lifted skinfold technique","opts":["the lifted skinfold technique allows for a suitable needle choice to be made","the lifted skinfold technique ensures medication to be administered into the muscle layer","the lifted skinfold technique involves releasing the skin quickly to reduce the risk of bruising"],"key":"A","qja":"注射手技に関するこの情報は、つまみ上げ法（lifted skinfold technique）について何を教えているか？","ja":"【注射手技】皮下脂肪の量は患者ごとに異なるため、実施前の個別評価が不可欠である。薬剤を誤って筋肉内に注射しないことが重要で、筋注になると薬物吸収が変わりうる。例えばインスリンが誤って筋肉内に入ると吸収が速まり低血糖を招く。皮膚をつまみ上げる手技（pinching/bunching）で皮下層を下の筋肉から持ち上げることができる。正しく行えば誤った筋注のリスクを減らせるが、注入完了前に皮膚を早く離しすぎたり、持ち上げ方を誤るとかえってリスクが増す。針は薬剤を皮下組織に注入できる長さが必要で、5・6・8cmがある。必要な針の長さは、つまみ上げ法で皮膚をつまみ、その皮膚のひだの幅の1.5倍の針を選ぶことで見積もれる。","o":[["つまみ上げ法により適切な針を選ぶことができる","✅ the required needle length can be estimated by pinching the skin using the lifted skinfold technique and selecting a needle that is 1.5 times the width の言い換え。"],["つまみ上げ法により薬剤が確実に筋肉層へ投与される","❌ 目的は逆。皮下層を筋肉から離して『筋注を避ける』ための手技。"],["つまみ上げ法では内出血を減らすため皮膚をすばやく離す","❌ 早く離すと筋注リスクが『増す』と書かれている。内出血の話もない。"]],"exp":"R2で誤答（Bを選択）。正解の根拠は第3段落の針の選び方にあり、第2段落（手技の説明）だけ読むと見落とす。Part Bは短文でも最後まで読む。","pt":"→ 型：設問のキーワード（lifted skinfold technique）が本文に2回以上出たら、全部の出現箇所を確認する。2回目の方に正解があることが多い。","doubt":null,"voc":[["subcutaneous","皮下の"],["vital","きわめて重要な"],["inadvertently","うっかり・意図せず"],["intramuscular","筋肉内の"],["absorption","吸収"],["accelerated","速まった"],["hypoglycemia","低血糖"],["skinfold","つまみ上げた皮膚のひだ"],["underlying muscle","下にある筋肉"],["bruising","あざ・内出血"]],"past":"B"},{"n":5,"title":"Discharge medications","paras":["The Discharge Prescription must be completed by the Medical Officer with reference to the current medication chart. The discharge medications section of the Electronic Discharge Summary (EDS) should be used for this process with the prescription being printed and then forwarded to the Hospital Pharmacy.","The EDS Discharge Prescription, or the Discharge Medication form, must be forwarded to Pharmacy at least 1 hour prior (or 3 hours for complicated discharges) to the patient being discharged from hospital. If amendments or corrections are made after sending the EDS Discharge Prescription to Pharmacy, it is the responsibility of the Medical Officer who completed the EDS Discharge Prescription to make the amendments to the Discharge Summary within the EDS as soon as possible to ensure the GP receives accurate information regarding their patient's medications on discharge."],"q":"What does this article tell us about the discharge medication dispensing process?","opts":["All prescriptions have to be at the Hospital pharmacy an hour before the patient is due to go home","The prescription goes to the hospital pharmacy after being written up by the medical officer","The Medical Officer must let the Hospital Pharmacy know if there are any amendments or corrections to be made"],"key":"B","qja":"退院時処方の調剤プロセスについて、この記事は何を教えているか？","ja":"【退院時処方】退院処方は、医師（Medical Officer）が現在の投薬表を参照して記入しなければならない。電子退院サマリー（EDS）の退院処方欄を用い、処方箋を印刷してから院内薬局へ送付する。EDS退院処方または退院処方用紙は、患者の退院の少なくとも1時間前（複雑な退院では3時間前）までに薬局へ送らなければならない。薬局へ送付後に修正・訂正を行った場合は、その退院処方を作成した医師が責任をもって、できるだけ早くEDS内の退院サマリーを修正し、GPが退院時の服薬について正確な情報を受け取れるようにする。","o":[["すべての処方箋は患者の帰宅1時間前までに院内薬局に届いていなければならない","❌ 複雑な退院は3時間前。『all … an hour』は例外を無視しているので不正確。"],["処方箋は医師が記入した後に院内薬局へ送られる","✅ 医師が記入→印刷→薬局へ forward、という手順どおり。"],["修正や訂正がある場合、医師は院内薬局に知らせなければならない","❌ 医師が修正するのは『EDS内の退院サマリー』で、目的はGPに正確な情報を届けること。薬局へ知らせるとは書いていない。"]],"exp":"R2で誤答（Cを選択）。Cは『修正時の医師の責任』という本文の骨格を借りて、通知先を薬局にすり替えている。Aは all という全称で例外（3時間）を消している。","pt":"→ 型：手順・規則の設問では『誰が・何を・誰に』の3点を本文と照合。1点でもずれたら誤り。all / always は例外がないか確認。","doubt":null,"voc":[["discharge prescription","退院時処方"],["with reference to","〜を参照して"],["forward","転送する・回す"],["prior to","〜の前に"],["amendment","修正"],["dispensing","調剤"]],"past":"C"},{"n":6,"title":"Report on patients unexpected death","paras":["Staff working in the mental health ward of the Townsville Hospital have been sent a directive about the correct clinical restraint procedure after a patient died unexpectedly.","A 44-year-old man died in the high dependency unit of the acute mental health ward at about 9pm on July 7.","It is believed the man may have died from a heart attack as a male security guard and female nurse attempted to restrain him.","The staff memo said it was \"essential\" that when a restraint occurs in an inpatient setting, best practice guidelines and procedures were followed.","The memo also said it was \"essential\" that the shift co-ordinator was physically present during all restraint and provided clinical oversight to ensure the safety of the patient team.","A source said staff in the hospital had also been advised having more people to restrain a patient was best practice."],"q":"In this article what were staff on the ward directed to do?","opts":["Clinical restraint is essential in acute mental health wards.","When restraint occurs five people need to be present to assist, one of whom must be the shift coordinator.","There must be a shift coordinator available and correct processes must be followed whenever clinical restraint is needed."],"key":"C","qja":"この記事で、病棟スタッフは何をするよう指示されたか？","ja":"【患者の予期せぬ死亡に関する報告】タウンズビル病院の精神科病棟スタッフに、患者の予期せぬ死亡を受けて、正しい身体拘束手順に関する指示が送られた。7月7日午後9時ごろ、急性期精神科病棟の高度依存ユニットで44歳男性が死亡した。男性警備員と女性看護師が拘束しようとした際、心臓発作で亡くなった可能性があるとみられている。スタッフ宛メモは、入院環境で拘束を行う際にはベストプラクティスのガイドラインと手順に従うことが『不可欠』だとした。また、シフト・コーディネーターがすべての拘束の場に実際に立ち会い、患者とチームの安全を確保するため臨床的監督を行うことも『不可欠』だとした。関係者によれば、より多くの人数で拘束するのがベストプラクティスだとも助言されたという。","o":[["急性期精神科病棟では身体拘束が不可欠である","❌ essential がかかっているのは『手順に従うこと』と『コーディネーターの立ち会い』。拘束そのものが不可欠とは言っていない。"],["拘束時には5人が補助に立ち会い、そのうち1人はシフト・コーディネーターでなければならない","❌ 『5人』という数字は本文にない。本文は having more people … was best practice（多い方がよい）だけ。"],["拘束が必要なときは常にシフト・コーディネーターが立ち会い、正しい手順に従わなければならない","✅ メモの2つの essential（手順遵守＋コーディネーターの物理的立ち会い）をまとめた言い換え。"]],"exp":"R2で誤答（Aを選択）。essential という強い語がどこにかかっているか（修飾関係）の読み違え。本文の強い語が選択肢に出ても、かかり先が変わっていれば誤り。","pt":"→ 型：essential / must などの強調語は『何が』essential なのか、主語を特定してから選択肢と照合する。","doubt":null,"voc":[["directive","指示・通達"],["clinical restraint","臨床上の身体拘束"],["high dependency unit","高度依存（準集中）治療室"],["restrain","取り押さえる・拘束する"],["oversight","監督"],["inpatient setting","入院の場面"]],"past":"A"}],"C":[{"n":7,"t":0,"p":0,"q":"According to the information in first Paragraph","opts":["Mesothelioma patients have benefited from chemotherapy alone","Mesothelioma patients have benefited from lung-sparing surgery alone","Mesothelioma patients have benefited most from lung-sparing surgery and additional therapies","Only a subset of mesothelioma patients can survive"],"key":"C","ev":"Surgery that preserves the lung, when combined with other therapies, appears to extend the lives","note":"肺温存手術＋他の治療の組み合わせで延命（C）。Bの『手術単独』は combined with を落としている。","doubt":null,"alt":[],"voc":[["preserve","温存する"],["extend the lives","寿命を延ばす"],["subtype","亜型・サブタイプ"],["malignant pleural mesothelioma","悪性胸膜中皮腫"],["lining","内張り・被膜"],["chest cavity","胸腔"],["lung-sparing","肺を温存する"],["subset","一部の集団"]],"oja":["中皮腫の患者は化学療法だけで利益を得てきた","中皮腫の患者は肺温存手術だけで利益を得てきた","中皮腫の患者は肺温存手術と追加治療の併用から最も利益を得てきた","中皮腫の患者のうち一部しか生存できない"],"past":null},{"n":8,"t":0,"p":1,"q":"Why is lung-sparing surgery better than removing the entire lung?","opts":["Because patients can receive chemotherapy","Because patients survive longer","Because patients' lives are compromised","Because cancer cells are completely eradicated"],"key":"B","ev":"The study vo
