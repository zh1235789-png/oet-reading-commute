an easily change their perspective.","note":"副作用の一覧を見て不安な患者に、リスクとベネフィットの話をすれば見方が変わる＝起こる可能性を伝えるべき（D）。Aの『より良い計画』は本文に無い（モニターして対処する、とは言うが計画の改善ではない）。Bの online は話のきっかけにすぎない。","doubt":null,"alt":[],"voc":[["at this juncture","この時点で"],["perspective","見方"],["risks versus benefits","リスクと利益の比較"],["rest assured","安心する"],["monitor","経過を観察する"],["likelihood","可能性"]],"oja":["副作用が起きた場合に備え、医師はより良い計画を用意する必要がある","副作用について誤解を招く情報がネットに多すぎる","副作用への恐れから不要な診察時間が多く無駄になる","副作用が起こる可能性について患者に知らせる必要がある"],"past":"A"},{"n":19,"t":1,"p":5,"q":"In the fifth paragraph, what is the writer's reservation about the Philadelphia program?","opts":["the long-term feasibility of the central idea","the size of the financial incentives offered","the types of medication that were targeted","the particular sample chosen to participate"],"key":"A","ev":"patients will have to be taking these medications for decades","note":"the long term benefits … are likely to be minimal／one isolated study is not … real-life: patients will have to be taking these medications for decades＝長期的に成り立つか（A）。Bの金額は『最初は十分な額かも』と触れるだけで懸念の中心ではない。","doubt":null,"alt":[],"voc":[["firm belief","固い信念"],["incentive","動機づけ・報奨"],["at the outset","最初は"],["elicit","引き出す"],["isolated","単発の"],["depiction","描写"],["feasibility","実現可能性"]],"oja":["中心となる考えの長期的な実現可能性","提供される金銭的報奨の大きさ","対象とされた薬の種類","参加者として選ばれた特定の集団"],"past":null},{"n":20,"t":1,"p":6,"q":"What objection to the program does the writer make in the sixth paragraph?","opts":["It will be counter-productive.","It will place heavy demands on doctors.","It sends the wrong message to patients.","It is a simplistic idea that falls down on its details."],"key":"C","ev":"What's worse, it seems to be saying to society","note":"it seems to be saying to society … 遵守している患者にはお金を払わない＝『暗黙の罰』という誤ったメッセージ（C）。Dの『細部で破綻する』は complications abound に引かれた誤答で、段落の主張は『社会へのメッセージ』。","doubt":null,"alt":[],"voc":[["appeal","魅力"],["abound","たくさんある"],["inherent","本来備わっている"],["implied","暗に示された"],["punishment","罰"],["counter-productive","逆効果の"]],"oja":["逆効果になる","医師に大きな負担をかける","患者に誤ったメッセージを送る","細部で破綻する単純すぎる発想である"],"past":"B"},{"n":21,"t":1,"p":7,"q":"The expression 'on that score' in the seventh paragraph refers to","opts":["a complex solution to patients' problems.","a co-operative attitude amongst medical staff.","a realistic assessment of why something happens.","a recommended response to the concerns of patients."],"key":"D","ev":"'Be compassionate,' he urges doctors.","note":"He's surely right on that score の that score＝直前の Steiner の助言『思いやりを持て／患者にとって複雑な綱渡りだと理解せよ』＝患者への推奨される対応（D）。Bの多職種協力（team sport）は後ろに出てくる話で、that が指すのは前。","doubt":null,"alt":[],"voc":[["compassionate","思いやりのある"],["urges","強く勧める"],["balancing act","綱渡り・両立の難しさ"],["on that score","その点では"],["prioritizing","優先順位をつける"],["co-operative","協力的な"]],"oja":["患者の問題に対する複雑な解決策","医療スタッフ間の協力的な姿勢","ある事が起きる理由の現実的な評価","患者の不安に対する推奨される対応"],"past":"A"},{"n":22,"t":1,"p":8,"q":"The writer suggests that his grandmother","opts":["may ultimately have benefited from her non-compliance.","would have appreciated closer medical supervision.","might have underestimated how ill she was.","should have followed her doctor's advice."],"key":"A","ev":"Perhaps there was some wisdom in her 'non-compliance.'","note":"施設で要介護になるのを避けられた／Perhaps there was some wisdom in her non-compliance＝結果的に得をしたかもしれない（A）。Dの『指示に従うべきだった』は途中の Had she taken … she might have survived に引かれた誤答。筆者は But then maybe … と打ち消している。","doubt":null,"alt":[],"voc":[["thrifty","倹約家の"],["no-nonsense","現実的な・きっぱりした"],["wave me off","手で払いのける"],["ailment","病気"],["dependent","人の世話に頼る"],["by luck or design","偶然か意図してか"]],"oja":["服薬を守らなかったことで結果的に得をしたかもしれない","より綿密な医学的管理を喜んだだろう","自分の病状の重さを過小評価していたかもしれない","医師の助言に従うべきだった"],"past":null}]},{"id":"O2","texts":[{"title":"Does homeopathy ‘work’?","paras":["For many, homeopathy is simply unscientific, but regular users hold a very different view.","Homeopathy works by giving patients very dilute substances that, in larger doses, would cause the very symptoms that need curing. Taking small doses of these substances—derived from plants, animals or minerals—strengthens the body's ability to heal and increases resistance to illness or infection. Or that is the theory. The debate about its effectiveness is nothing new. Recently, Australia's National Health and Medical Research Council (NHMRC) released a paper which found there were \"no health conditions for which there was reliable evidence that homeopathy was effective.\" This echoed a report from the UK House of Commons which said that the evidence failed to show a \"credible physiological mode of action\" for homeopathic products, and that what data was available showed homeopathic products to be no better than placebo. Yet Australians spend at least $11 million per year on homeopathy.","So what's going on? If Australians—and citizens of many other nations around the world—are voting with their wallets, does this mean homeopathy must be doing something right? \"For me, the crux of the debate is a disconnect between how the scientific and medical community view homeopathy, and what many in the wider community are getting out of it,\" says Professor Alex Broom of the University of Queensland. \"The really interesting question is how can we possibly have something that people think works, when to all intents and purposes, from a scientific perspective, it doesn't?\"","Part of homeopathy's appeal may lie in the nature of the patient-practitioner consultation. In contrast to a typical 15-minute GP consultation, a first homeopathy consultation might take an hour and a half. \"We don't just look at an individual symptom in isolation. For us, that symptom is part of someone's overall health condition,\" says Greg Cope, spokesman for the Australian Homeopathic Association. \"Often we'll have a consultation with someone and find details their GP simply didn't have time to.\" Writer Johanna Ashmore is a case in point. She sees her homeopath for a one-hour monthly consultation. \"I feel, if I go and say I've got this health concern, she's going to treat my body to fight it rather than just treat the symptom.\"","Most people visit a homeopath after having received a diagnosis from a 'mainstream' practitioner, often because they want an alternative choice to medication, says Greg Cope. \"Generally speaking, for a homeopath, their preference is if someone has a diagnosis from a medical practitioner before starting homeopathic treatment, so it's rare for someone to come and see us with an undiagnosed condition and certainly if they do come undiagnosed, we'd want to refer them on and get that medical evaluation before starting a course of treatment,\" he says.","Given that homeopathic medicines are by their very nature incredibly dilute—and, some might argue, diluted beyond all hope of efficacy—they are unlikely to cause any adverse effects, so where's the harm? Professor Paul Glasziou, chair of the NHMRC's Homeopathy Working Committee, says that while financial cost is one harm, potentially more harmful are the non-financial costs associated with missing out on effective treatments. \"If it's just a cold, I'm not too worried. But if it's for a serious illness, you may not be taking disease-modifying treatments, and most worrying is things like HIV which affect not only you, but people around you,\" says Glasziou. This is a particular concern with homeopathic vaccines, he says, which jeopardise the 'herd immunity'—the immunity of a significant proportion of the population—which is crucial in containing outbreaks of vaccine-preventable diseases.","The question of a placebo effect inevitably arises, as studies repeatedly seem to suggest that whatever benefits are being derived from homeopathy are more a product of patient faith rather than of any active ingredient of the medications. However, Greg Cope dismisses this argument, pointing out that homeopathy appears to benefit even the sceptics: \"We might see kids first, then perhaps Mum and after a couple of years, Dad will follow and, even though he's only there reluctantly, we get wonderful outcomes. This cannot be explained simply by the placebo effect.\" As a patient, Johanna Ashmore is aware scientific research does little to support homeopathy but can still see its benefits. \"If seeing my homeopath each month improves my health, I'm happy. I don't care how it works, even if it's all in the mind—I just know that it does.\"","But if so many people around the world are placing their faith in homeopathy, despite the evidence against it, Broom questions why homeopathy seeks scientific validation. The problem, as he sees it, lies in the fact that \"if you're going to dance with conventional medicine and say: 'we want to be proven to be effective in dealing with discrete physiological conditions, then you indeed do have to show efficacy.' In my view this is not about broader credibility per se, it's about scientific and medical credibility—there's actually quite a lot of cultural credibility surrounding homeopathy within the community but that's not replicated in the scientific literature.\""]},{"title":"Brain-controlled prosthetics","paras":["Paralysed from the neck down by a stroke, Cathy Hutchinson stared fixedly at a drinking straw in a bottle on the table in front of her. A cable rose from the top of her head, connecting her to a robot arm, but her gaze never wavered as she mentally guided the robot arm, which was opposite her, to close its grippers around the bottle, then slowly lift the vessel towards her mouth. Only when she finally managed to take a sip did her face relax. This example illustrates the strides being taken in brain-controlled prosthetics. But Hutchinson's focused stare also illustrates the one crucial feature still missing from prosthetics. Her eyes could tell her where the arm was, but she couldn't feel what it was doing.","Prosthetics researchers are now trying to create prosthetics that can 'feel'. It's a daunting task: the researchers have managed to read signals from the brain; now they must write information into the nervous system. Touch encompasses a complicated mix of information—everything from the soft prickliness of wool to the slipping of a sweaty soft-drink can. The sensations arise from a host of receptors in the skin, which detect texture, vibration, pain, temperature and shape, as well as from receptors in the muscles, joints and tendons that contribute to 'proprioception'—the sense of where a limb is in space. Prosthetics are being outfitted with sensors that can gather many of these sensations, but the challenge is to get the resulting signals flowing to the correct part of the brain.","For people who have had limbs amputated, the obvious way to achieve that is to route the signals into the remaining nerves in the stump, the part of the limb left after amputation. Ken Horch, a neuroprosthetics researcher, has done just that by threading electrodes into the nerves in stumps then stimulating them with a tiny current, so that patients felt like their fingers were moving or being touched. The technique can even allow patients to distinguish basic features of objects: a man who had lost his lower arms was able to determine the difference between blocks made of wood or foam rubber by using a sensor-equipped prosthetic hand. He correctly identified the objects' size and softness more than twice as often as would have been expected by chance. Information about force and finger position was delivered from the prosthetic to a computer, which prompted stimulation of electrodes implanted in his upper-arm nerves.","As promising as this result was, researchers will probably need to stimulate hundreds or thousands of nerve fibres to create complex sensations, and they'll need to keep the devices working for many years if they are to minimise the number of surgeries required to replace them as they wear out. To get around this, some researchers are instead trying to give patients sensory feedback by touching their skin. The technique was discovered by accident by researcher Todd Kuiken. The idea was to rewire arm nerves that used to serve the hand, for example, to muscles in other parts of the body. When the patient thought about closing his or her hand, the newly targeted muscle would contract and generate an electric signal, driving movement of the prosthetic.","However, this technique won't work for stroke patients like Cathy Hutchinson. So some researchers are skipping directly to the brain. In principle, this should be straightforward. Because signals from specific parts of the body go to specific parts of the brain, scientists should be able to create sensations of touch or proprioception in the limb by directly activating the neurons that normally receive those signals. However, with electrical stimulation, all neurons close to the electrode's tip are activated indiscriminately, so 'even if I had the sharpest needle in the Universe, that could create unintended effects', says Arto Nurmikko, a neuroengineer. For example, an attempt to create sensation in one finger might produce sensation in other parts of the hand as well, he says.","Nurmikko and other researchers are therefore using light, in place of electricity, to activate highly specific groups of neurons and recreate a sense of touch. They trained a monkey to remove its hand from a pad when it vibrated. When the team then stimulated the part of its brain that receives tactile information from the hand with a light source implanted in its skull, the monkey lifted its hand off the pad about 90% of the time. The use of such techniques in humans is still probably 10–20 years away, but it is a promising strategy.","Even if such techniques can be made to work, it's unclear how closely they will approximate natural sensations. Tingles, pokes and vibrations are still a far cry from the complicated sensations that we feel when closing a hand over an apple, or running a finger along a table's edge. But patients don't need a perfect sense of touch, says Douglas Weber, a bioengineer. Simply having enough feedback to improve their control of grasp could help people to perform tasks such as picking up a glass of water, he explains. He goes on to say that patients who wear cochlear implants, for example, are often happy to regain enough hearing to hold a phone conversation, even if they're still unable to distinguish musical subtleties."]}],"B":[{"n":1,"title":"Post-operative dressings","paras":["Dressings are an important component of post-operative wound management. Any dressings applied during surgery have been done in sterile conditions and should ideally be left in place, as stipulated by the surgical team. It is acceptable for initial dressings to be removed prematurely in order to have the wound reviewed and, in certain situations, apply a new dressing. These situations include when the dressing is no longer serving its purpose (i.e. dressing falling off, excessive exudate soaking through the dressing and resulting in a suboptimal wound healing environment) or when a wound complication is suspected."],"q":"Nursing staff can remove a dressing if","opts":["a member of the surgical team is present.","there is severe leakage from the wound.","they believe that the wound has healed."],"key":"B","qja":"看護スタッフがドレッシングを外してよいのはどんな場合か？","ja":"【術後のドレッシング】ドレッシングは術後創傷管理の重要な要素である。手術中に貼られたドレッシングは無菌条件下で貼られたものであり、外科チームの指示どおり、なるべくそのままにしておくべきである。ただし、創を確認し、場合によっては新しいドレッシングを貼るために、最初のドレッシングを予定より早く外すことは許容される。そうした状況とは、ドレッシングが役目を果たしていないとき（剥がれかけている、過剰な滲出液がしみ出して創傷治癒に不適な環境になっている等）や、創合併症が疑われるときである。","o":[["外科チームのメンバーが立ち会っている","❌ 外科チームは『そのままにせよ』と指示する側として出るだけ。立ち会いの条件は書かれていない。"],["創部からの漏れがひどい","✅ excessive exudate soaking through the dressing（過剰な滲出液がしみ出す）の言い換え。severe leakage ≒ excessive exudate。"],["創が治ったと考えている","❌ 外してよいのは『目的を果たしていない』か『合併症が疑われる』とき。治癒したと思ったら、は無い。"]],"exp":"条件問題は i.e.（すなわち）の後の具体例が正解の根拠になりやすい。exudate（滲出液）を leakage と言い換えている。","pt":"→ 型：括弧や i.e. の中の具体例は、選択肢で別の言葉に言い換えられて正解になる。","doubt":null,"voc":[["component","構成要素"],["sterile","無菌の"],["stipulated","規定された・指示された"],["prematurely","予定より早く"],["exudate","滲出液"],["suboptimal","最適でない"],["leakage","漏れ"]],"past":null},{"n":2,"title":"Unwanted medicine: pharmacy collection protocol","paras":["A Returned Unwanted Medicine (RUM) Project approved container will be delivered by the wholesaler to the participating pharmacy.","The container is to be kept in a section of the dispensary or in a room or enclosure in the pharmacy to which the public does not have access. The container may be placed in a visible position, but out of reach of the public, as this will reinforce the message that unwanted prescription drugs can be returned to the pharmacy and that the returned medicines will not be recycled.","Needles, other sharps and liquid cytotoxic products should not be placed in the container, but in one specifically designed for such waste."],"q":"As explained in the protocol, the position of the RUM container will ideally","opts":["encourage participation in the scheme.","emphasize the value of recycling.","facilitate public access to it."],"key":"A","qja":"手順書の説明では、RUM回収容器の置き場所は、理想的には何をするべきか？","ja":"【不要医薬品：薬局での回収手順】RUM（不要医薬品返却）プロジェクト承認容器が卸業者から参加薬局に届けられる。容器は調剤室の一角、または一般の人が入れない薬局内の部屋・区画に置く。見える位置に置いてもよいが、一般の人の手の届かない所にすること。そうすることで『不要な処方薬は薬局に返却できる』『返却された薬は再利用されない』というメッセージが強まる。針などの鋭利物や液状の細胞毒性製剤はこの容器に入れず、専用の容器に入れる。","o":[["回収制度への参加を促す","✅ visible position … reinforce the message that unwanted prescription drugs can be returned＝返却できると知らせる＝参加を促す。"],["リサイクルの価値を強調する","❌ 本文は the returned medicines will not be recycled（再利用されない）。recycle の語を逆向きに使った罠。"],["一般の人が容器を利用しやすくする","❌ out of reach of the public／the public does not have access と逆。"]],"exp":"『見える位置に置く』目的は as this will reinforce the message …。メッセージの中身（返却できる）＝参加の呼びかけ。","pt":"→ 型：本文の否定（will not be recycled）を肯定にした選択肢は定番の誤答。not を必ず拾う。","doubt":null,"voc":[["wholesaler","卸売業者"],["dispensary","調剤室"],["enclosure","囲われた区画"],["out of reach","手の届かない所に"],["reinforce","強める"],["cytotoxic","細胞毒性の"],["sharps","鋭利物（針など）"]],"past":"B"},{"n":3,"title":"Memo: Report on oral anti-cancer medications","paras":["Nurse Unit Managers are directed to review their systems for the administration of oral anti-cancer drugs, and the reporting of drug errors. Serious concerns have been raised in a recent report drawing on a national survey of pharmacists.","Please note the following paragraph quoted from the report:","Incorrect doses of oral anti-cancer medicines can have fatal consequences. Over the previous four years, there were three deaths and 400 patient safety issues involving oral anti-cancer medicines. Half of the reports concerned the wrong dosage, frequency, quantity or duration of oral anti-cancer treatment. Of further concern is that errors on the part of patients may be under-reported. In light of these reports, there is clearly a need for improved systems covering the management of patients receiving oral therapies."],"q":"The report mentioned in the memo suggests that","opts":["data about patient errors may be incomplete.","errors by hospital staff can often go unreported.","errors in prescriptions pose the greatest threat to patients."],"key":"A","qja":"メモで触れられている報告書は何を示唆しているか？","ja":"【メモ：経口抗がん薬に関する報告書】看護単位管理者は、経口抗がん薬の投与システムと投薬エラーの報告体制を見直すよう指示される。薬剤師への全国調査に基づく最近の報告書で、深刻な懸念が示された。報告書の次の段落に注意すること：経口抗がん薬の用量の誤りは致命的な結果を招きうる。過去4年間で、経口抗がん薬に関連して3件の死亡と400件の患者安全上の問題があった。報告の半数は、経口抗がん治療の用量・頻度・量・期間の誤りに関するものだった。さらに懸念されるのは、患者側のエラーが過少報告されている可能性があることだ。これらの報告を踏まえ、経口療法を受ける患者の管理体制の改善が明らかに必要である。","o":[["患者のエラーに関するデータは不完全かもしれない","✅ errors on the part of patients may be under-reported（患者側のエラーは過少報告の可能性）＝データが不完全。"],["病院職員のエラーはしばしば報告されない","❌ 過少報告されているのは『患者側』のエラー。主語のすり替え。"],["処方の誤りが患者にとって最大の脅威である","❌ 半数が用量等の誤りとあるが、『処方』の誤りとも『最大の脅威』とも書いていない。"]],"exp":"under-reported をそのまま使った選択肢Bは、誰のエラーかを入れ替えている。正解Aは under-reported を incomplete data と言い換え。","pt":"→ 型：同じ語（unreported）を使う選択肢は『主語・対象』が本文と同じか確認する。","doubt":null,"voc":[["directed to","〜するよう指示される"],["administration","投与"],["fatal","致命的な"],["dosage","用量"],["on the part of","〜の側の"],["under-reported","過少報告された"],["incomplete","不完全な"]],"past":"B"},{"n":4,"title":"Anesthesia Workstations","paras":["Studies on safety in anesthesia have documented that human vigilance alone is inadequate to ensure patient safety and have underscored the importance of monitoring devices. These findings are reflected in improved standards for equipment design, guidelines for patient monitoring and reduced malpractice premiums for the use of capnography and pulse oximetry during anesthesia. Anesthesia workstations integrate ventilator technology with patient monitors and alarms to help prevent patient injury in the unlikely event of a ventilator failure.","Furthermore, since the reservoir bag is part of the circuit during mechanical ventilation, the visible movement of the reservoir bag is confirmation that the ventilator is functioning."],"q":"What point does the training manual make about anesthesia workstations?","opts":["Parts of the equipment have been shown to be vulnerable to failure.","There are several ways of ensuring that the ventilator is working effectively.","Monitoring by health professionals is a reliable way to maintain patient safety."],"key":"B","qja":"麻酔ワークステーションについて、研修マニュアルはどんな点を述べているか？","ja":"【麻酔ワークステーション】麻酔の安全性に関する研究で、人の注意だけでは患者の安全を確保するのに不十分であることが示され、監視機器の重要性が強調された。この知見は、機器設計基準の改善、患者モニタリングのガイドライン、麻酔中のカプノグラフィーとパルスオキシメトリー使用に対する医療過誤保険料の引き下げに反映されている。麻酔ワークステーションは人工呼吸器の技術と患者モニター・アラームを統合し、万一人工呼吸器が故障した場合に患者の傷害を防ぐ。さらに、機械換気中はリザーバーバッグが回路の一部なので、バッグが目に見えて動いていることが、人工呼吸器が作動している確認になる。","o":[["機器の一部が故障しやすいことが示されている","❌ in the unlikely event of a ventilator failure＝故障は『めったに起きない』。逆。"],["人工呼吸器が正常に動いていることを確かめる方法が複数ある","✅ モニター・アラームの統合に加え、Furthermore でリザーバーバッグの動きでも確認できる＝方法が複数。"],["医療者による監視は患者の安全を保つ確実な方法である","❌ human vigilance alone is inadequate（人の注意だけでは不十分）と逆。"]],"exp":"Furthermore（さらに）が『もう1つの確認方法』を足している合図。2つの段落を合わせて『複数の方法』になる。","pt":"→ 型：Furthermore / Additionally の後は『もう1つ』。『複数ある』型の選択肢はこの合図で確かめる。","doubt":null,"voc":[["vigilance","警戒・注意"],["underscored","強調した"],["malpractice premiums","医療過誤保険料"],["capnography","カプノグラフィー（呼気CO2モニター）"],["integrate","統合する"],["reservoir bag","リザーバーバッグ"],["vulnerable","弱い・影響を受けやすい"]],"past":null},{"n":5,"title":"Memo to Flying Doctor staff: Antivenoms for snakebite","paras":["Before starting treatment:","Do not wash the snakebite site.","If possible, determine the type of snake by using a 'snake-venom detection kit' to test a bite site swab or, in systemic envenoming, the person's urine. If venom detection is not available or has proved negative, seek advice from a poisons information center.","Testing blood for venom is not reliable.","Assess the degree of envenoming; not all confirmed snakebites will result in systemic envenoming; risk varies with the species of snake.","People with pre-existing renal, hepatic, cardiac or respiratory impairment and those taking anticoagulant or antiplatelet drugs may have an increased risk of serious outcome from snakebite. Children are also especially at increased risk of severe envenoming because of smaller body mass and the likelihood of physical activity immediately after a bite."],"q":"In cases of snakebite, the flying doctor should be aware of","opts":["where to access specific antivenoms.","the appropriate method for wound cleaning.","the patients most likely to suffer complications."],"key":"C","qja":"ヘビ咬傷の場合、フライングドクターは何を把握しておくべきか？","ja":"【フライングドクター職員へのメモ：ヘビ咬傷の抗毒素】治療開始前に：・咬傷部位を洗わない。・可能なら『ヘビ毒検出キット』で咬傷部位のスワブ（全身性中毒では尿）を検査し、ヘビの種類を特定する。毒検出ができない、または陰性の場合は、中毒情報センターに助言を求める。・血液での毒検査は信頼できない。・中毒の程度を評価する。確定したヘビ咬傷がすべて全身性中毒になるわけではなく、リスクはヘビの種によって異なる。・腎・肝・心・呼吸機能障害がある人、抗凝固薬・抗血小板薬を飲んでいる人は、重篤な転帰のリスクが高い可能性がある。小児も、体重が小さく咬まれた直後に動き回りやすいため、重症中毒のリスクが特に高い。","o":[["特定の抗毒素をどこで入手できるか","❌ 入手場所の話はない。中毒情報センターに聞くのはヘビの種類の判断について。"],["傷を洗う適切な方法","❌ Do not wash the snakebite site（洗うな）と逆。"],["合併症を起こしやすい患者","✅ 既往のある人・抗凝固薬服用者・小児は increased risk of serious outcome＝重症化しやすい患者。"]],"exp":"箇条書きの最後の項目が正解。increased risk of serious outcome を most likely to suffer complications と言い換え。","pt":"→ 型：箇条書きの本文は、選択肢1つずつに『どの項目か』を当てる。洗う・洗わないのような逆転を見落とさない。","doubt":null,"voc":[["antivenom","抗毒素"],["envenoming","毒の注入・中毒"],["systemic","全身性の"],["swab","スワブ・ぬぐい液"],["impairment","障害"],["anticoagulant","抗凝固薬"],["complications","合併症"]],"past":null},{"n":6,"title":"Cleaning Audits","paras":["Three rounds of environmental cleaning audits were completed in 2013-2014. Key personnel in each facility were surveyed to assess the understanding of environmental cleaning from the perspective of the nurse unit manager, environmental services manager and the director of clinical governance. Each facility received a report about their environmental cleaning audits and lessons learned from the surveys. Data from the 15 units were also provided to each facility for comparison purposes.","The knowledge and experiences from the audits were shared at the BMTEC Forum in August 2014. This forum allowed environmental services managers, cleaners, nurses and clinical governance to discuss the application of the standards and promote new and improved cleaning practice. The second day of the forum focused on auditor training and technique with the view of enhancing internal environmental cleaning auditing by the participating groups."],"q":"What was the purpose of the BMTEC forum?","opts":["to propose a new way of carrying out cleaning audits","to draw conclusions from the results of cleaning audits","to encourage more groups to undertake cleaning audits"],"key":"B","qja":"BMTECフォーラムの目的は何だったか？","ja":"【清掃監査】2013〜2014年に3回の環境清掃監査が行われた。各施設の主要な担当者に調査を行い、看護単位管理者・環境サービス管理者・臨床ガバナンス責任者の立場から環境清掃の理解度を評価した。各施設は清掃監査の報告書と調査から得られた教訓を受け取った。比較のため15部署のデータも各施設に提供された。監査から得られた知識と経験は、2014年8月のBMTECフォーラムで共有された。このフォーラムで環境サービス管理者・清掃員・看護師・臨床ガバナンス担当が基準の適用について話し合い、新しく改善された清掃方法を広めた。フォーラムの2日目は、参加グループによる内部の環境清掃監査を強化するため、監査員の研修と技法に焦点を当てた。","o":[["清掃監査の新しい実施方法を提案すること","❌ new and improved は『清掃方法（cleaning practice）』の話で、監査方法ではない。"],["清掃監査の結果から結論を導くこと","✅ knowledge and experiences from the audits were shared／discuss mising strategy＝電気刺激より可能性がある（C）。Bの『期待どおり』は書いていない（90%は結果の数字で、期待との比較はない）。Aは逆（人への応用は10〜20年先）。","doubt":null,"alt":[],"voc":[["in place of","〜の代わりに"],["specific","特定の"],["vibrated","振動した"],["tactile","触覚の"],["implanted","埋め込まれた"],["replicated","再現された"]],"oja":["人間で簡単に再現できる","期待どおりの効果があった","電気刺激より可能性があるかもしれない","以前の実験より複雑な手術を必要とした"],"past":"B"},{"n":21,"t":1,"p":6,"q":"In the final paragraph, the writer uses the phrase 'a far cry from' to underline","opts":["how much more there is to achieve.","how complex experiments have become.","the need to reduce people's expectations.","the differences between types of artificial sensation."],"key":"A","ev":"Tingles, pokes and vibrations are still a far cry from the complicated sensations","note":"a far cry from＝ほど遠い→ピリピリ・振動はリンゴを握る複雑な感覚にはまだほど遠い＝達成すべきことがまだ多い（A）。Cの『期待を下げる』は次の Weber の発言（完璧でなくてよい）に引かれた誤答。","doubt":null,"alt":[],"voc":[["approximate","近づく・近似する"],["tingles","ピリピリする感覚"],["a far cry from","〜とはほど遠い"],["complicated","複雑な"],["expectations","期待"],["artificial","人工の"]],"oja":["達成すべきことがまだどれだけ多いか","実験がどれほど複雑になったか","人々の期待を下げる必要性","人工的な感覚の種類の違い"],"past":null},{"n":22,"t":1,"p":6,"q":"Why does Weber give the example of a cochlear implant?","opts":["to underline the need for a similar breakthrough in prosthetics","to illustrate the fact that some sensation is better than none","to highlight the advances made in other areas of medicine","to demonstrate the ability of the body to relearn skills"],"key":"B","ev":"are often happy to regain enough hearing to hold a phone conversation","note":"電話ができる程度の聴力で満足する（音楽の細部は分からなくても）＝『少しでも感覚がある方がないよりよい』（B）。直前の patients don't need a perfect sense of touch を例で支えている。","doubt":null,"alt":[],"voc":[["feedback","フィードバック"],["grasp","握ること"],["cochlear implants","人工内耳"],["regain","取り戻す"],["subtleties","微妙な違い"],["breakthrough","大発見・突破口"]],"oja":["義肢でも同様の大発見が必要だと強調するため","多少でも感覚がある方がないよりよいことを示すため","医療の他分野での進歩を強調するため","体が技能を学び直す力を示すため"],"past":null}]},{"id":"O3","texts":[{"title":"Phobia pills","paras":["An irrational fear, or phobia, can cause the heart to pound and the pulse to race. It can lead to a full-blown panic attack – and yet the sufferer is not in any real peril. All it takes is a glimpse of, for example, a spider's web for the mind and body to race into panicked overdrive. These fears are difficult to conquer, largely because, although there are no treatment guidelines specifically about phobias, the traditional way of helping the sufferer is to expose them to the fear numerous times. Through the cumulative effect of these experiences, sufferers should eventually feel an increasing sense of control over their phobia. For some people, the process is too protracted, but there may be a short cut. Drugs that work to boost learning may help someone with a phobia to 'detrain' their brain, losing the fearful associations that fuel the panic.","The brain's extraordinary ability to store new memories and forge associations is so well celebrated that its dark side is often disregarded. A feeling of contentment is easily evoked when we see a photo of loved ones, though the memory may sometimes be more idealized than exact. In the case of a phobia, however, a nasty experience with, say, spiders, that once triggered a panicked reaction, leads the feelings to resurge whenever the relevant cue is seen again. The current approach is exposure therapy, which uses a process called extinction learning. This involves people being gradually exposed to whatever triggers their phobia until they feel at ease with it. As the individual becomes more comfortable with each situation, the brain automatically creates a new memory – one that links the cue with reduced feelings of anxiety, rather than the sensations that mark the onset of a panic attack.","Unfortunately, while it is relatively easy to create a fear-based memory, expunging that fear is more complicated. Each exposure trial will involve a certain degree of distress in the patient, and although the process is carefully managed throughout to limit this, some psychotherapists have concluded that the treatment is unethical. Neuroscientists have been looking for new ways to speed up extinction learning for that same reason.","One such avenue is the use of 'cognitive enhancers' such as a drug called D-cycloserine or DCS. DCS slots into part of the brain's 'NMDA receptor' and seems to modulate the neurons' ability to adjust their signalling in response to events. This tuning of a neuron's firing is thought to be one of the key ways the brain stores memories, and, at very low doses, DCS appears to boost that process, improving our ability to learn. In 2004, a team from Emory University in Atlanta, USA, tested whether DCS could also help people with phobias. A pilot trial was conducted on 28 people undergoing specific exposure therapy for acrophobia – a fear of heights. Results showed that those given a small amount of DCS alongside their regular therapy were able to reduce their phobia to a greater extent than those given a placebo. Since then, other groups have replicated the finding in further trials.","For people undergoing exposure therapy, achieving just one of the steps on the long journey to overcoming their fears requires considerable perseverance, says Cristian Sirbu, a behavioral scientist and psychologist. Thanks to improvement being so slow, patients – often already anxious – tend to feel they have failed. But Sirbu thinks that DCS may make it possible to tackle the problem in a single 3-hour session, which is enough for the patient to make real headway and to leave with a feeling of satisfaction. However, some people have misgivings about this approach, claiming that as it doesn't directly undo the fearful response which is deep-seated in the memory, there is a very real risk of relapse.","Rather than simply attempting to overlay the fearful associations with new ones, Merel Kindt at the University of Amsterdam is instead trying to alter the associations at source. Kindt's studies into anxiety disorders are based on the idea that memories are not only vulnerable to alteration when they're first laid down, but, of key importance, also at later retrieval. This allows for memories to be 'updated', and these amended memories are re-consolidated by the effect of proteins which alter synaptic responses, thereby maintaining the strength of feeling associated with the original memory. Kindt's team has produced encouraging results with arachnophobic patients by giving them propranolol, a well-known and well-tolerated beta-blocker drug, while they looked at spiders. This blocked the effects of norepinephrine in the brain, disrupting the way the memory was put back into storage after being retrieved, as part of the process of reconsolidation. Participants reported that while they still don't like spiders, they were able to approach them. Kindt reports that the benefit was still there three months after the test ended."]},{"title":"Challenging medical thinking on placebos","paras":["Dr Damien Finniss, Associate Professor at Sydney University's Pain Management and Research Institute, was previously a physiotherapist. He regularly treated football players during training sessions using therapeutic ultrasound. 'One particular session', Finniss explains, 'I treated five or six athletes. I'd treat them for five or ten minutes and they'd say, \"I feel much better\" and run back onto the field. But at the end of the session, I realized the ultrasound wasn't on.' It was a light bulb moment that set Finniss on the path to becoming a leading researcher on the placebo effect.","Used to treat depression, psoriasis and Parkinson's, to name but a few, placebos have an image problem among medics. For years, the thinking has been that a placebo is useless unless the doctor convinces the patient that it's a genuine treatment – problematic for a profession that promotes informed consent. However, a new study casts doubt on this assumption and, along with a swathe of research showing some remarkable results with placebos, raises questions about whether they should now enter the mainstream as legitimate prescription items. The study examined five trials in which participants were told they were getting a placebo, and the conclusion was that doing so honestly can work.","'If the evidence is there, I don't see the harm in openly administering a placebo,' says Ben Colagiuri, a researcher at the University of Sydney. Colagiuri recently published a meta-analysis of thirteen studies which concluded that placebo sleeping pills, whose genuine counterparts notch up nearly three million prescriptions in Australia annually, significantly improve sleep quality. The use of placebos could therefore reduce medical costs and the burden of disease in terms of adverse reactions.","But the placebo effect isn't just about fake treatments. It's about raising patients' expectations of a positive result; something which also occurs with real drugs. Finniss cites the 'open-hidden' effect, whereby an analgesic can be twice as effective if the patient knows they're getting it, compared to receiving it unknowingly. 'Treatment is always part medical and part ritual,' says Finniss. This includes the austere consulting room and even the doctor's clothing. But behind the performance of healing is some strong science. Simply believing an analgesic will work activates the same brain regions as the genuine drug. 'Part of the outcome of what we do is the way we interact with patients,' says Finniss.","That interaction is also the focus of Colagiuri's research. He's looking into the 'nocebo' effect, when a patient's pessimism about a treatment becomes self-fulfilling. 'If you give a placebo, and warn only 50% of the patients about side effects, those you warn report more side effects,' says Colagiuri. He's aiming to reverse that by exploiting the psychology of food packaging. Products are labeled '98% fat-free' rather than '2% fat' because positive reference to the word 'fat' puts consumers off. Colagiuri is deploying similar tactics. A drug with a 30% chance of causing a side effect can be reframed as having a 70% chance of not causing it. 'You're giving the same information, but framing it a way that minimizes negative expectations,' says Colagiuri.","There is also a body of research showing that a placebo can produce a genuine biological response that could affect the disease process itself. It can be traced back to a study from the 1970s, when psychologist Robert Ader was trying to condition taste-aversion in rats. He gave them a saccharine drink whilst simultaneously injecting Cytoxan, an immunosuppressant which causes nausea. The rats learned to hate the drink due to the nausea. But as Ader continued giving it to them, without Cytoxan, they began to die from infection. Their immune system had 'learned' to fail by repeated pairing of the drink with Cytoxan. Professor Andrea Evers of Leiden University is running a study that capitalizes on this conditioning effect and may benefit patients with rheumatoid arthritis, which causes the immune system to attack the joints. Evers' patients are given the immunosuppressant methotrexate, but instead of always receiving the same dose, they get a higher dose followed by a lower one. The theory is that the higher dose will cause the body to link the medication with a damped-down immune system. The lower dose will then work because the body has 'learned' to curb immunity as a placebo response to taking the drug. Evers hopes it will mean effective drug regimes that use lower doses with fewer side effects.","The medical profession, however, remains less than enthusiastic about placebos. 'I'm one of two researchers in the country who speak on placebos, and I've been invited to lecture at just one university,' says Finniss. According to Charlotte Blease, a philosopher of science, this antipathy may go to the core of what it means to be a doctor. 'Medical education is largely about biomedical facts. 'Softer' sciences, such as psychology, get marginalized because it's the hard stuff that's associated with what it means to be a doctor.' The result, says Blease, is a large, placebo-shaped hole in the medical curriculum. 'There's a great deal of medical illiteracy about the placebo effect... it's the science behind the art of medicine. Doctors need training in that.'"]}],"B":[{"n":1,"title":"Prescribing stop dates","paras":["Prescribers should write a review date or a stop date on the electronic prescribing system EPMA or the medicine chart for each antimicrobial agent prescribed. On the EPMA, there is a forced entry for stop dates on oral antimicrobials. There is not a forced stop date on EPMA for IV antimicrobial treatment – if the prescriber knows how long the course of IV should be, then the stop date can be filled in. If not known, then a review should be added to the additional information, e.g. 'review after 48 hrs'. If the prescriber decides treatment needs to continue beyond the stop date or course length indicated, then it is their responsibility to amend the chart. In critical care, it has been agreed that the routine use of review/stop dates on the charts is not always appropriate."],"q":"The policy document tells us that","opts":["stop dates aren't relevant in all circumstances.","anyone using EPMA can disregard the request for a stop date.","prescribers must know in advance of prescribing what the stop date should be."],"key":"A","qja":"この方針文書から分かることは何か？","ja":"【投与終了日の処方】処方者は、処方する各抗菌薬について、電子処方システムEPMAまたは薬剤チャートに見直し日または終了日を記入すべきである。EPMAでは経口抗菌薬の終了日は入力必須になっている。静注抗菌薬には終了日の入力必須設定はなく、静注の期間が分かっていれば終了日を記入できる。分からない場合は、追加情報欄に見直し（例：『48時間後に見直し』）を記入する。終了日や指示された期間を超えて治療を続ける必要があると処方者が判断した場合、チャートを修正するのは処方者の責任である。集中治療部門では、チャートに見直し日・終了日を日常的に記入するのは必ずしも適切ではないと合意されている。","o":[["終了日がすべての状況で当てはまるわけではない","✅ 最終文 In critical care … not always appropriate（集中治療では必ずしも適切でない）の言い換え。"],["EPMAを使う人は終了日の要請を無視してよい","❌ EPMAでは経口薬の終了日が forced entry（入力必須）。無視できない。"],["処方者は処方前に終了日を把握していなければならない","❌ 分からなければ review（見直し日）を書けばよい、とある。must know は言い過ぎ。"]],"exp":"Part B は最後の1文に『例外』が置かれることが多い。not always appropriate を not relevant in all circumstances と言い換え。","pt":"→ 型：must / all / any など強い語の選択肢は、本文の『If not known …』のような逃げ道で否定される。","doubt":null,"voc":[["antimicrobial","抗菌薬"],["forced entry","入力必須"],["review","見直し"],["course","（治療の）期間・クール"],["amend","修正する"],["critical care","集中治療"],["disregard","無視する"]],"past":"C"},{"n":2,"title":"Guidelines: Radiotherapy Simulation Planning Appointment","paras":["The initial appointment may also be referred to as the Simulation Appointment. During this appointment you will discuss your patient's medical history and treatment options, and agree on a radiotherapy treatment plan. The first step is usually to take a CT scan of the area requiring treatment. The patient will meet the radiation oncologist, their registrar and radiation therapists. A decision will be made regarding the best and most comfortable position for treatment, and this will be replicated daily for the duration of the treatment. Depending on the area of the body to be treated, personalized equipment such as a face mask may be used to stabilize the patient's position. This equipment helps keep the patient comfortable and still during the treatment and makes the treatment more accurate."],"q":"The guidelines inform us that personalized equipment for radiotherapy","opts":["is advisable for all patients.","improves precision during radiation.","needs to be tested at the first consultation."],"key":"B","qja":"ガイドラインによると、放射線治療用の個別器具はどうだと分かるか？","ja":"【ガイドライン：放射線治療シミュレーション（計画）予約】最初の予約はシミュレーション予約とも呼ばれる。この予約で患者の病歴と治療の選択肢について話し合い、放射線治療計画に合意する。最初の手順は通常、治療部位のCTスキャンである。患者は放射線腫瘍医、その研修医、放射線治療技師に会う。治療に最適で最も楽な体位が決められ、治療期間中は毎日その体位を再現する。治療する部位によっては、フェイスマスクなどの個別器具を使って患者の体位を固定することがある。この器具は治療中に患者を楽に静止させ、治療をより正確にする。","o":[["すべての患者に勧められる","❌ Depending on the area of the body to be treated … may be used＝部位によって使う。全員ではない。"],["照射中の精度を高める","✅ makes the treatment more accurate の言い換え。accurate ≒ precision。"],["初回の診察で試す必要がある","❌ 器具を試す時期の記述はない。初回予約で決めるのは『体位』。"]],"exp":"正解は段落最後の文。personalized equipment が出てくるのは最後の2文だけなので、そこを精読すれば足りる。","pt":"→ 型：設問のキーワード（personalized equipment）が本文のどこに出るか先に探し、その前後だけを読む。","doubt":null,"voc":[["simulation","シミュレーション"],["registrar","研修医（レジストラー）"],["replicated","再現された"],["duration","期間"],["personalized","個別に合わせた"],["stabilize","固定する・安定させる"],["precision","精度"]],"past":null},{"n":3,"title":"CT200CV Veterinarian Electrocardiograph User Manual","paras":["Animal connections","Good electrode connection is the most important factor in recording a high quality ECG. By following a few basic steps, consistent, clean recordings can be achieved.","Shave a patch on each forelimb of the animal at the contact site.","Clean the electrode sites with an alcohol swab or sterilising agent.","Attach clips to the ECG leads.","Place a small amount of ECG electrode gel on the metal electrode of the limb strap or adapter clip.","Pinch skin on animal and place clips on the shaved skin area of the animal being tested. The animal must be kept still.","Check the LCD display for a constant heart reading.","If there is no heart reading, you have a contact problem with one or more of the leads.","Recheck the leads and reapply the clips to the shaven skin of the animal."],"q":"The purpose of these instructions is to explain how to","opts":["monitor an ECG reading.","position electrodes correctly.","handle an animal during an ECG procedure."],"key":"B","qja":"この説明書の目的は、何のやり方を説明することか？","ja":"【CT200CV 動物用心電計 取扱説明書：動物への接続】良好な電極接続は、質の高い心電図を記録するうえで最も重要な要素である。いくつかの基本手順に従えば、安定した、ノイズの少ない記録が得られる。・動物の各前肢の接触部位の毛を剃る。・電極部位をアルコール綿か消毒剤で拭く。・心電図リードにクリップを付ける。・肢ストラップまたはアダプタークリップの金属電極に心電図用ジェルを少量塗る。・動物の皮膚をつまみ、検査する動物の剃った部分にクリップを付ける。動物は静止させておくこと。・液晶表示で心拍が安定して表示されるか確認する。・心拍が表示されなければ、1本以上のリードに接触不良がある。・リードを再確認し、動物の剃った皮膚にクリップを付け直す。","o":[["心電図の波形を監視する","❌ LCDの確認は接続できたかのチェック。波形の監視方法の説明ではない。"],["電極を正しく装着する","✅ 見出し Animal connections と冒頭 Good electrode connection is the most important factor＋手順はすべて電極の付け方。"],["心電図検査中に動物を扱う","❌ The animal must be kept still は1行だけ。説明書全体の目的ではない。"]],"exp":"目的（purpose）問題は見出しと冒頭文で決まる。手順の1行に引かれた選択肢（動物を静止させる、表示を見る）は部分にすぎない。","pt":"→ 型：purpose 問題は『全体を包む』選択肢を選ぶ。本文の1行だけに当てはまる選択肢は捨てる。","doubt":null,"voc":[["electrode","電極"],["consistent","安定した・一貫した"],["forelimb","前肢"],["sterilising agent","消毒剤"],["leads","（心電図の）誘導コード"],["constant","一定の"],["reapply","付け直す"]],"past":null},{"n":4,"title":"Medication adherence and impatient patients","paras":["A recent article addressed the behavior of people who have a 'taste for the present rather than the future'. It proposed that these so-called 'impatient patients' are unlikely to adhere to medications that require use over an extended period. The article proposes that, an 'impatience genotype' exists and that assessing these patients' view of the future while stressing the immediate advantages of adherence may improve adherence rates more than emphasizing potentially distant complications. The authors suggest that rather than attempting to change the character of those who are 'impatient', it may be wise to ascertain the patient's individual priorities, particularly as they relate to immediate gains. For example, while advising an 'impatient' patient with diabetes, stressing improvement in visual acuity rather than avoidance of retinopathy may result in greater medication adherence rates. Additionally, linking the cost of frequently changing prescription lenses when visual acuity fluctuates with glycemic levels may sometimes provide the patient with an immediate financial motivation for improving adherence."],"q":"The group known as 'impatient patients' are more likely to continue with a course of prescribed medication if","opts":["their treatment can be completed over a reduced period of time.","it is possible to link their treatment with a financial advantage.","its short-term benefits are explained to them."],"key":"C","qja":"『せっかちな患者』と呼ばれる集団は、どんな場合に処方薬の服用を続けやすいか？","ja":"【服薬アドヒアランスと『せっかちな患者』】最近の論文が『未来より現在を好む』人々の行動を取り上げた。こうしたいわゆる『せっかちな患者』は、長期間の使用が必要な薬を守りにくいという。論文は『せっかち遺伝子型』の存在を提唱し、こうした患者の将来観を評価したうえで、遠い将来の合併症を強調するより、服薬遵守の『すぐに得られる利点』を強調する方がアドヒアランス率が上がる可能性があるとする。著者らは、『せっかちな』人の性格を変えようとするより、特に目先の利益に関わる患者個人の優先事項を確かめるのが賢明だろうと述べる。たとえば『せっかちな』糖尿病患者には、網膜症の回避より視力の改善を強調する方が服薬遵守率が高まるかもしれない。さらに、血糖値で視力が変動するたびに眼鏡を作り直す費用と結びつけると、患者に目先の金銭的動機を与えられることもある。","o":[["治療をより短い期間で終えられる","❌ 治療期間を短くする話はない。use over an extended period は『守りにくい理由』として出るだけ。"],["治療を金銭的な利点と結びつけられる","❌ 金銭の話は Additionally … may sometimes provide と補足の一例。設問の『続けやすい条件』の中心ではない。"],["短期的な利点を説明される","✅ stressing the immediate advantages of adherence … may improve adherence rates の言い換え。immediate ≒ short-term。"]],"exp":"主張の中心は『遠い合併症より目先の利点を強調する』。B（金銭）は本文にあるが may sometimes の補足で、Additionally で足された周辺情報。","pt":"→ 型：本文にある情報でも、may sometimes など弱い言い方の補足は正解になりにくい。中心の主張（proposes that …）を優先する。","doubt":null,"voc":[["adhere to","（指示を）守る"],["extended period","長期間"],["genotype","遺伝子型"],["immediate","目先の・すぐの"],["ascertain","確かめる"],["retinopathy","網膜症"],["glycemic","血糖の"]],"past":"A"},{"n":5,"title":"Checking the position of a nasogastric tube","paras":["It is essential to confirm the position of the tube in the stomach by one of the following:","Testing pH of aspirate: gastric placement is indicated by a pH of less than 4, but may increase to between pH 4-6 if the patient is receiving acid-inhibiting drugs. Blue litmus paper is insufficiently sensitive to adequately distinguish between levels of acidity of aspirate.","X-rays: will only confirm position at the time the X-ray is carried out. The tube may have moved by the time the patient has returned to the ward. In the absence of a positive aspirate test, where pH readings are more than 5.5, or in a patient who is unconscious or on a ventilator, an X-ray must be obtained to confirm the initial position of the nasogastric tube."],"q":"The memo reminds nursing staff to avoid","opts":["x-raying a patient unless pH readings exceed 5.5.","the use of a particular method of testing pH levels.","reliance on pH testing in patients taking acid-inhibiting medication."],"key":"B","qja":"このメモは看護スタッフに何を避けるよう念を押しているか？","ja":"【経鼻胃管の位置確認】胃管が胃内にあることを、次のいずれかで必ず確認すること：・吸引液のpH測定：pH 4未満なら胃内留置を示すが、胃酸分泌抑制薬を使っている患者ではpH 4〜6に上がることがある。青色リトマス紙は感度が不十分で、吸引液の酸性度を十分に区別できない。・X線：撮影した時点の位置しか確認できない。患者が病棟に戻るまでに胃管が動いているかもしれない。吸引液検査で陽性が得られない場合（pHが5.5を超える場合）、または意識のない患者・人工呼吸器装着中の患者では、経鼻胃管の初回位置を確認するためにX線を撮らなければならない。","o":[["pHが5.5を超えない限り患者のX線を撮らないこと","❌ pH 5.5超はX線を『撮るべき』条件の一つ。意識のない患者などは pH に関係なく撮る。"],["特定のpH測定方法を使うこと","✅ Blue litmus paper is insufficiently sensitive（青色リトマス紙は感度不足）＝この方法は避ける。"],["胃酸抑制薬を飲む患者でpH検査に頼ること","❌ pH が4〜6に上がることがある、と注意しているだけ。『頼るな』とは書いていない。"]],"exp":"『避けるべきこと』は本文では insufficiently sensitive という否定的評価で書かれている。Cは本文の情報（acid-inhibiting）を『禁止』に強めた選択肢。","pt":"→ 型：avoid 問題は、本文の否定的評価（insufficient / not reliable）が付いたものを探す。注意書きを禁止に強めた選択肢に注意。","doubt":null,"voc":[["aspirate","吸引液"],["gastric placement","胃内留置"],["acid-inhibiting","胃酸分泌を抑える"],["litmus paper","リトマス紙"],["insufficiently","不十分に"],["in the absence of","〜がない場合"],["reliance","依存・頼ること"]],"past":"C"},{"n":6,"title":"Extract from guidelines: Oxytocin","paras":["1. Oxytocin Dosage and Administration","Parenteral drug products should be inspected visually for particulate matter and discoloration prior to administration, whenever solution and container permit. Dosage of Oxytocin is determined by the uterine response. The dosage information below is based upon various regimens and indications in general use.","1.1 Induction or Stimulation of Labor","Intravenous infusion (drip method) is the only acceptable method of administration for the induction or stimulation of labor. Accurate control of the rate of infusion flow is essential. An infusion pump or other such device and frequent monitoring of strength of contractions and foetal heart rate are necessary for the safe administration of Oxytocin for the induction or stimulation of labor. If uterine contractions become too powerful, the infusion can be abruptly stopped, and oxytocic stimulation of the uterine musculature will soon wane."],"q":"This extract informs us that","opts":["the amount of oxytocin given will depend on how the patient reacts.","the patient will go into labor as soon as oxytocin is administered.","the staff should inspect the oxytocin pump before use."],"key":"A","qja":"この抜粋から分かることは何か？","ja":"【ガイドライン抜粋：オキシトシン】1. オキシトシンの用法・用量非経口薬は、溶液と容器が許す限り、投与前に異物や変色がないか目視で確認すること。オキシトシンの用量は子宮の反応によって決まる。以下の用量情報は、一般に用いられているさまざまなレジメンと適応に基づく。1.1 分娩誘発・促進分娩の誘発・促進に認められる投与法は静脈内点滴のみである。点滴速度の正確な管理が不可欠である。分娩誘発・促進のためにオキシトシンを安全に投与するには、輸液ポンプなどの機器と、子宮収縮の強さ・胎児心拍の頻回な監視が必要である。子宮収縮が強くなりすぎた場合は点滴を急に止めることができ、子宮筋へのオキシトシン刺激はすぐに弱まる。","o":[["オキシトシンの投与量は患者の反応によって決まる","✅ Dosage of Oxytocin is determined by the uterine response の言い換え。"],["オキシトシンを投与するとすぐに陣痛が始まる","❌ 投与後すぐに分娩になるとは書いていない。"],["スタッフは使用前にオキシトシンのポンプを点検すべきだ","❌ 投与前に目視確認するのは『薬液（parenteral drug products）』で、ポンプではない。"]],"exp":"Cは inspected visually … prior to administration の対象を薬からポンプにすり替えた誤答。何を inspect するのかを照合する。","pt":"→ 型：動詞（inspect）が本文と同じでも、目的語が違えば誤答。動詞の目的語まで一致を確認する。","doubt":null,"voc":[["parenteral","非経口の"],["particulate matter","粒子状の異物"],["discoloration","変色"],["uterine","子宮の"],["induction","誘発"],["infusion","点滴"],["wane","弱まる"]],"past":null}],"C":[{"n":7,"t":0,"p":0,"q":"In the first paragraph, the writer says that conventional management of phobias can be problematic because of","opts":["the lasting psychological effects of the treatment.","the time required to identify the cause of the phobia.","the limited choice of therapies available to professionals.","the need for the phobia to be confronted repeatedly over time."],"key":"D","ev":"For some people, the process is too protracted, but there may be a short cut.","note":"伝統的な方法は expose them to the fear numerous times（何度も恐怖にさらす）→ too protracted（長すぎる）＝繰り返し時間をかけて向き合う必要（D）。Aの『治療の長期的な心理的影響』は無い。","doubt":null,"alt":[],"voc":[["irrational","不合理な"],["peril","危険"],["glimpse","ちらりと見ること"],["cumulative","累積的な"],["protracted","長引く"],["confronted","直面させられた"]],"oja":["治療が残す長期的な心理       SY.gistId = g ? g.id : (await gh('/gists', {method:'POST', body:JSON.stringify({description:GIST_DESC, public:false, files:{[GIST_FILE]:{content:JSON.stringify(syncDoc())}}})})).id;
    }
    const g = await gh('/gists/' + SY.gistId);
    const f = g.files[GIST_FILE];
    let remoteText = f ? f.content : '';
    if (f && f.truncated) remoteText = await (await fetch(f.raw_url, {cache:'no-store'})).text();
    let remote = null; try { remote = JSON.parse(remoteText); } catch(e){}
    mergeRemote(remote); save();
    const mine = JSON.stringify(syncDoc());
    if (mine !== remoteText) await gh('/gists/' + SY.gistId, {method:'PATCH', body:JSON.stringify({files:{[GIST_FILE]:{content:mine}}})});
    SY.last = Date.now(); SY.state = 'ok'; SY.err = '';
  } catch(e) {
    SY.state = 'err'; SY.err = navigator.onLine === false ? 'オフライン（次にネットにつながったとき同期します）' : e.message;
  }
  saveSY(); syncing = false;
  if (!VIEW) render(); else syncBadge();
  if (syncAgain) { syncAgain = false; syncNow(); }
}
function syncSoon(){ if (!SY.token) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 2000); }
function syncText(){
  if (!SY.token) return '';
  if (SY.state === 'syncing') return '☁️ 同期中…';
  if (SY.state === 'err') return '⚠️ 同期エラー：' + SY.err;
  if (SY.last) { const d = new Date(SY.last); return `☁️ 同期済み ${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
  return '☁️ 同期待ち';
}

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = 'ABCD';
function today(d = new Date()){ const z = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function addDays(ds, n){ const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return today(d); }
function pastLabel(it, letter){ return it.past ? `${/^\d+$/.test(it.set) ? 'R' + (+it.set) : setLabel(it.set)}で誤答` + (letter ? `（${it.past}を選択）` : '') : ''; }

/* flatten items */
const ITEMS = [], BYID = {};
function addSets(list){
  list.forEach(s => {
    if (SETS.some(x => x.id === s.id && x !== s)) return;  // 二重に開いても増やさない
    if (!SETS.includes(s)) SETS.push(s);
    s.B.forEach(b => ITEMS.push(Object.assign({part:'B', set:s.id, id:`${s.id}-B${b.n}`}, b)));
    s.C.forEach(c => ITEMS.push(Object.assign({part:'C', set:s.id, id:`${s.id}-C${c.n}`, text:s.texts[c.t]}, c)));
  });
  ITEMS.forEach(i => { BYID[i.id] = i; });
}
addSets(SETS.slice());

/* ---------- 公式問題（暗号化）の解錠 ---------- */
/* global TextEncoder, TextDecoder */
// LOCK.state: none（暗号化データなし）/ locked / open
const LOCK = {state: LOCKED ? 'locked' : 'none', err: '', busy: false};
function b64(s){ return Uint8Array.from(atob(s), c => c.charCodeAt(0)); }
async function decryptLocked(env, pass){
  const base = await crypto.subtle.importKey('raw', new TextEncoder().encode(pass), 'PBKDF2', false, ['deriveKey']);
  const key = await crypto.subtle.deriveKey({name:'PBKDF2', salt:b64(env.salt), iterations:env.iter, hash:'SHA-256'}, base, {name:'AES-GCM', length:256}, false, ['decrypt']);
  const pt = await crypto.subtle.decrypt({name:'AES-GCM', iv:b64(env.iv)}, key, b64(env.ct));
  return JSON.parse(new TextDecoder().decode(pt));
}
function lockedLabel(){ return 'OET公式 Sample Test・Kaplan'; }
async function unlock(pass, quiet){
  if (LOCK.state !== 'locked' || !pass) return LOCK.state === 'open';
  LOCK.busy = true; LOCK.err = '';
  try {
    addSets(await decryptLocked(LOCKED, pass));
    LOCK.state = 'open';
    try { localStorage.setItem(LOCK_KEY, pass); } catch(e){}
  } catch(e) {
    LOCK.err = e && e.name === 'OperationError' ? '合言葉が違います' : '開けませんでした（' + ((e && e.message) || e) + '）';
    if (quiet) { try { localStorage.removeItem(LOCK_KEY); } catch(e2){} }  // 合言葉が変わった後の古い保存は捨てる
  }
  LOCK.busy = false;
  render();
  return LOCK.state === 'open';
}
function lockNote(){
  return LOCK.state === 'locked' ? `<div class="card tiny">🔒 ${lockedLabel()} は合言葉で表示されます（記録タブで入力）</div>` : '';
}
const rec = id => S.items[id];
// 模試で未実施のセットは、ドリルで一度答えた問題だけ出す（未回答の問題は本番の模試まで取っておく）
const usable = it => !NOT_YET.has(it.set) || !!rec(it.id);
const drill = () => ITEMS.filter(usable);
function notYetNote(){
  const ids = SETS.map(s => s.id).filter(id => NOT_YET.has(id));
  return ids.length ? `<p class="tiny">🗓 模試でまだ解いていない ${ids.map(setLabel).join('・')} は、模試で解くまでドリルに出しません。</p>` : '';
}
function status(it){
  const r = rec(it.id);
  if (!r) return 'new';
  if (r.due && r.due <= today()) return 'due';
  return r.lastOk ? 'ok' : 'ng';
}
function isWeak(it){ const r = rec(it.id); return (r && (!r.lastOk || r.wrong > 0)) || !!it.past; }

/* queue: 復習期限切れ → 未回答（過去誤答を優先）→ 最も古く解いたもの */
function nextItem(part, excludeId){
  const pool = drill().filter(i => i.part === part && i.id !== excludeId);
  const t = today();
  const due = pool.filter(i => { const r = rec(i.id); return r && r.due && r.due <= t; })
                  .sort((a,b) => rec(a.id).due.localeCompare(rec(b.id).due));
  if (due.length) return due[0];
  const fresh = pool.filter(i => !rec(i.id));
  const freshPast = fresh.filter(i => i.past);
  if (freshPast.length) return freshPast[0];
  if (fresh.length) return fresh[0];
  return pool.slice().sort((a,b) => (rec(a.id).last || '').localeCompare(rec(b.id).last || ''))[0];
}

function answer(it, choice){
  const ok = choice === it.key || (it.alt || []).includes(choice);
  const t = today();
  const r = S.items[it.id] || {n:0, wrong:0, box:0, hist:[]};
  r.n++; if (!ok) r.wrong++;
  r.lastOk = ok; r.last = t; r.ts = Date.now(); r.hist.push([t, choice]); if (r.hist.length > 10) r.hist.shift();
  if (ok) {
    if (r.wrong === 0 && !it.past) { r.box = INTERVALS.length; r.due = null; }  // 初見で正解＝習得
    else { r.box = Math.min((r.box || 0) + 1, INTERVALS.length); r.due = r.box >= INTERVALS.length ? null : addDays(t, INTERVALS[r.box]); }
  } else { r.box = 0; r.due = addDays(t, INTERVALS[0]); }
  S.items[it.id] = r;
  S.days[t] = (S.days[t] || 0) + 1;
  save(); syncSoon();
  return ok;
}

function streak(){
  let n = 0, d = today();
  if (!dayCount(d)) d = addDays(d, -1);
  while (dayCount(d)) { n++; d = addDays(d, -1); }
  return n;
}

// SOLO Practice は Set01〜10、SOLO の公式模試は O1＝Official01、OET公式 Sample Test は S1、Kaplan は K1（練習）・K2（模試）
const SET_NAMES = { K1: 'Kaplan 練習', K2: 'Kaplan 模試' };
function setLabel(id){
  if (SET_NAMES[id]) return SET_NAMES[id];
  if (/^O\d+$/.test(id)) return 'Official' + id.slice(1).padStart(2, '0');
  if (/^S\d+$/.test(id)) return 'Sample Test ' + id.slice(1);
  return 'Set' + id;
}

function renderList(part){
  const nSets = new Set(drill().filter(i => i.part === part).map(i => i.set)).size;
  $('#htitle').textContent = part === 'B' ? `Part B（6問×${nSets}セット）` : `Part C（16問×${nSets}セット）`;
  const f = FILTER[part];
  const chips = [['all','すべて'],['new','未回答'],['weak','苦手'],['due','復習'],['past','過去の誤答']];
  const pass = it => f==='all' || (f==='new' && !rec(it.id)) || (f==='weak' && isWeak(it)) || (f==='due' && status(it)==='due') || (f==='past' && it.past);
  let html = `<div class="chips">${chips.map(([k,v]) => `<button class="chip ${f===k?'on':''}" data-f="${k}">${v}</button>`).join('')}</div>`;
  let any = false;
  SETS.forEach(s => {
    const its = drill().filter(i => i.part===part && i.set===s.id && pass(i));
    if (!its.length) return; any = true;
    const all = drill().filter(i => i.part===part && i.set===s.id);
    const okN = all.filter(i => rec(i.id) && rec(i.id).lastOk).length;
    html += `<div class="setblk"><h3><span>${setLabel(s.id)}${part==='C' ? ` · ${esc(s.texts[0].title)} / ${esc(s.texts[1].title)}` : ''}</span><span>${okN}/${all.length}</span></h3>`;
    its.forEach(it => {
      const st = status(it), r = rec(it.id);
      const dot = !r ? '' : r.lastOk ? 'ok' : 'ng';
      const title = part==='B' ? it.title : it.q;
      html += `<button class="row" data-go="${it.id}"><span class="num">${part}${it.n}</span><span class="tt">${esc(title)}</span>${st==='due'?'<span class="pill due">復習</span>':''}<span class="dot ${dot}"></span></button>`;
    });
    html += '</div>';
  });
  if (!any) html += '<div class="empty">該当する問題はありません</div>';
  html += lockNote() + notYetNote();
  $('#main').innerHTML = html;
  $('#main').querySelectorAll('[data-f]').forEach(b => b.onclick = () => { FILTER[part] = b.dataset.f; render(); });
  $('#main').querySelectorAll('[data-go]').forEach(b => b.onclick = () => openItem(b.dataset.go, part));
}

function highlight(text, ev){
  const i = text.indexOf(ev);
  if (i < 0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(ev) + '</mark>' + esc(text.slice(i + ev.length));
}
function renderItem(it){
  const r = rec(it.id);

  $('#opts').querySelectorAll('.opt').forEach(b => b.onclick = () => reveal(it, b.dataset.c));

function reveal(it, choice){
  const ok = answer(it, choice);
  const isB = it.part === 'B';
  const accepted = [it.key, ...(it.alt || [])];
  $('#opts').querySelectorAll('.opt').forEach((b,i) => {
    const l = L[i]; b.disabled = true;
    if (accepted.includes(l)) b.classList.add('right');
    else if (l === choice) b.classList.add('wrong');
    if (isB) {
      const [oja, why] = it.o[i];
      b.querySelector('.ob').insertAdjacentHTML('beforeend', `<span class="oja">${esc(oja)}</span><span class="why">${esc(why)}</span>`);
    } else if (it.oja && it.oja[i]) {

      b.querySelector('.ob').insertAdjacentHTML('beforeend', `<span class="oja">${esc(it.oja[i])}</span>`);

  const doubt = it.doubt ? `<div class="doubt">${esc(it.doubt)}</div>` : '';
  const voc = (it.voc && it.voc.length)
    ? `<div class="sec"><h4>語彙（${it.voc.length}）</h4><div class="voc">${
        it.voc.map(([w, ja]) => `<div class="vrow"><span class="w">${esc(w)}</span><span class="m">${esc(ja)}</span></div>`).join('')
      }</div></div>` : '';
  const body = isB
    ? `<div class="sec"><h4>解説</h4><div class="body">${esc(it.exp)}</div></div>
       <div class="sec"><h4>ポイント</h4><div class="point">${esc(it.pt)}</div></div>${doubt}${voc}
       <details><summary>本文の和訳</summary><div class="body">${esc(it.ja)}</div></details>`
    : `<div class="sec"><h4>根拠（黄色マーカー）</h4><div class="point">${esc(it.note)}</div></div>${doubt}${voc}`;
  const nextLbl = VIEW.from === 'today' ? `次の${it.part}へ` : '次の問題';

  $('#back').onclick = () => { VIEW = null; render(); window.scrollTo(0,0); };

    let n;
    if (VIEW.from === 'today') n = nextItem(it.part, it.id);

    openItem(n.id, VIEW.from);

    <div class="card"><div class="muted">Part B</div>${cells('B')}
      <div class="legend"><span><i style="background:var(--ok)"></i>正解</span><span><i style="background:#15803d;outline:1px solid var(--bad)"></i>ミス後に正解</span><span><i style="background:var(--bad)"></i>直近不正解</span><span><i style="background:var(--line)"></i>未回答</span></div></div>
    <div class="card"><div class="muted">Part C</div>${cells('C')}</div>
    ${LOCK.state === 'open' ? lockCard : ''}
    <div class="card"><div class="muted">iPhone・iPad間の同期（GitHubの非公開Gist）</div>
      ${SY.token ? `<p class="tiny" id="syncbadge" style="margin:8px 0 0">${esc(syncText())}</p>
        <div class="small-btns"><button id="syncgo">今すぐ同期</button><button id="syncoff">この端末の同期を解除</button></div>`
      : `<ol class="tiny" style="padding-left:18px;margin:8px 0">
          <li><a href="https://github.com/settings/tokens/new?scopes=gist&description=OET%20Reading%20sync" target="_blank" rel="noopener" style="color:var(--C)">GitHubのトークン作成画面</a>を開く（gistにだけチェックが入った状態で開きます）</li>
          <li>Expiration を選び（例：No expiration か 1年）、一番下の「Generate token」を押す</li>
          <li>表示された ghp_… をコピーして下に貼り付け、「接続」を押す</li>
          <li>iPad側でも同じトークンを貼り付ける（1台で作ったトークンを使い回してOK）</li></ol>
        <input id="tok" type="password" autocomplete="off" placeholder="ghp_…" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:16px">
        <div class="small-btns"><button id="syncon">接続</button></div>
        <p class="tiny">トークンはこの端末の中にだけ保存され、GitHub以外には送られません。</p>`}
    </div>
    <div class="card"><div class="muted">データ</div>
      <div class="small-btns"><button id="exp">バックアップをコピー</button><button id="imp">バックアップから復元</button><button id="rst">全記録をリセット</button></div></div>`;
  $('#exp').onclick = async () => { const t = JSON.stringify(S); try { await navigator.clipboard.writeText(t); alert('コピーしました'); } catch(e) { prompt('このテキストを保存してください', t); } };
  $('#imp').onclick = () => { const t = prompt('バックアップのテキストを貼り付け'); if (!t) return; try { const s = JSON.parse(t); if (!s.items) throw 0; const dev = S.dev; S = Object.assign({days:{}, fs:16, others:{}, resetAt:0}, s, {dev}); for (const r of Object.values(S.items)) r.ts = Date.now(); save(); syncSoon(); applyFs(); render(); alert('復元しました'); } catch(e) { alert('形式が正しくありません'); } };
  $('#rst').onclick = () => { if (confirm('すべての回答記録を消去します。' + (SY.token ? '同期中の他の端末からも消えます。' : '') + 'よろしいですか？')) { S.items = {}; S.days = {}; S.others = {}; S.resetAt = Date.now(); save(); render(); syncNow(); } };
  if ($('#syncon')) $('#syncon').onclick = () => { const t = $('#tok').value.trim(); if (!t) return; SY = {token:t}; saveSY(); render(); syncNow(); };
  if ($('#syncgo')) $('#syncgo').onclick = () => syncNow();
  if ($('#unlock')) $('#unlock').onclick = () => { const v = $('#pass').value.trim(); if (v) unlock(v, false); };
  if ($('#lockoff')) $('#lockoff').onclick = () => { if (confirm('この端末で公式問題を閉じます（解答記録は残ります）')) { try { localStorage.removeItem(LOCK_KEY); } catch(e){} location.reload(); } };
  if ($('#syncoff')) $('#syncoff').onclick = () => { if (confirm('この端末の同期を解除します（記録はこの端末に残ります）')) { SY = {}; saveSY(); render(); } };
}

/* font size */
function applyFs(){ document.documentElement.style.setProperty('--fs', S.fs + 'px'); }
$('#fsm').onclick = () => { S.fs = Math.max(13, S.fs - 1); applyFs(); save(); };
$('#fsp').onclick = () => { S.fs = Math.min(22, S.fs + 1); applyFs(); save(); };
document.querySelectorAll('nav button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
applyFs(); render();
(() => { let p = null; try { p = localStorage.getItem(LOCK_KEY); } catch(e){} if (p) unlock(p, true); })();
syncNow();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
window.addEventListener('online', () => syncNow());
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
