o not be lifelong, so you need to seek medical advice before you travel.","note":"免疫は一生続かない→追加接種が必要か確認（D）。","doubt":null,"alt":[],"voc":[["worth remembering","覚えておく価値がある"],["acquire","（病気・免疫を）獲得する"],["lifelong","生涯続く"],["seek medical advice","医療者に相談する"],["rely on","頼る"],["sensible steps","賢明な対策"],["by far","断然"],["immunization","予防接種"]],"oja":["再び接種する必要はない","生涯続く防御を与えるのはマラリアのワクチンだけである","旅行のたびにマラリアの予防接種を受ける必要がある","もう一度接種が必要かどうか確認すべきである"],"past":null},{"n":19,"t":1,"p":5,"q":"Any immunity that a person has against malaria","opts":["is never lost","is effective if they can avoid insect bites","doesn't last a long time if he/she changes locations","is better than immunity offered by tablets"],"key":"C","ev":"People who live permanently in malarial zones have partial protection but they lose this swiftly when they move away.","note":"移住すると急速に失われる＝場所を変えると長続きしない（C）。","doubt":null,"alt":[],"voc":[["permanently","永続的に"],["partial protection","部分的な防御"],["swiftly","速やかに"],["avoidance","回避"],["mosquito bite","蚊に刺されること"],["anti-malarial","抗マラリア（薬）の"],["regime","（薬の）レジメン・方式"],["up-to-date","最新の"]],"oja":["決して失われない","虫刺されを避けられるなら有効である","居住地を変えると長くは続かない","錠剤による防御より優れている"],"past":null},{"n":20,"t":1,"p":6,"q":"If people are visiting their home countries","opts":["they have natural immunities to local diseases","vaccinations may depend on the distance they travel","it is necessary to take precautions","all family members should be immunized"],"key":"C","ev":"When we leave the area for distant shores that protection is rapidly lost","note":"故郷訪問でも免疫は失われている→予防措置が必要（C）。","doubt":null,"alt":[],"voc":[["place of origin","出身地"],["roots","ルーツ・出自"],["one-time resident","かつての居住者"],["that is not the case","実際はそうではない"],["constantly","絶えず"],["distant shores","遠い異国"],["precaution","予防策"]],"oja":["現地の病気に対する自然免疫がある","必要な予防接種は移動距離によって決まることがある","予防策をとる必要がある","家族全員が予防接種を受けるべきである"],"past":null},{"n":21,"t":1,"p":7,"q":"In paragraph eight, what does the expression 'to do so' refer to?","opts":["having treatment against malaria","being amused","living in the country","going back home"],"key":"A","ev":"Even so, it's very important to do so.","note":"do so＝taking anti-malarial medication（A）。代名詞・代動詞は直前の動詞句を指す。","doubt":null,"alt":[],"voc":[["puzzled","けげんに思う"],["amused","おもしろがる"],["even so","それでも"],["to do so","そうすること（＝直前の行為）"],["resident relatives","現地に住む親族"],["short memory","すぐ忘れる性質"]],"oja":["マラリアの予防薬を飲むこと","面白がること","その国に住むこと","故郷に帰ること"],"past":null},{"n":22,"t":1,"p":8,"q":"What does the last paragraph tell us about the cost of vaccinations?","opts":["most vaccinations are free in the UK","most people have to pay for their vaccinations","travel vaccinations are covered by travel insurance","everyone has to pay for vaccinations"],"key":"B","ev":"Remember, vaccinations have to be paid for, although some vaccinations such as hepatitis A are usually free.","note":"原則有料、一部例外のみ無料＝ほとんどの人は支払う（B）。Dの everyone は例外（A型肝炎・医療従事者）を無視。","doubt":null,"alt":[],"voc":[["aid worker","援助従事者"],["occupational risk","職業上のリスク"],["substantial amount","かなりの額"],["relative to","〜と比べると"],["safeguard","守る"],["covered by insurance","保険でまかなわれる"]],"oja":["英国ではほとんどのワクチンが無料である","ほとんどの人は自分でワクチン代を払う必要がある","旅行用の予防接種は旅行保険でまかなわれる","全員がワクチン代を払う必要がある"],"past":null}]},{"id":"05","texts":[{"title":"Fluid Intelligence","paras":["Today, neuroscientists can determine one's intelligence through a brain scan, as sci-fi as that sounds. Not only that, it's only a matter of time before they are able to tell each individual's set of aptitudes and shortcomings, simply from scanning their brain. Researchers at Yale led the study. They interpreted intelligence in this case as abstract reasoning, also known as fluid intelligence. This is the ability to recognize patterns, solve problems, and identify relationships. Fluid intelligence is known to be a consistent predictor of academic performance. Yet, abstract reasoning is difficult to teach, and standardized tests often miss it.","Researchers in this study could accurately predict how a participant would do on a certain test by scanning their brain with an fMRI. 126 participants, all a part of the Human Connectome Project, were recruited. The Human Connectome Project is the mapping of all the connections inside the brain, to get a better understanding of how the wiring works and what it means for things like intellect, the emotions, and more. For this study, researchers at Yale put participants through a series of different tests to assess memory, intelligence, motor skills, and abstract thinking.","They were able to map the connectivity in 268 individual brain regions. Investigators could tell how strong the connections were, how active, and how activity was coordinated between regions. Each person's connectome was as unique as their fingerprint, scientists found. They could identify one participant from another with 99% accuracy, from their brain scan. Yale researchers could also tell whether the person was engaged in the assessment they were taking or if they were aloof about it.","Emily Finn was a grad student and co-author of this study. She said, \"The more certain regions are talking to one another, the better you're able to process information quickly and make inferences.\" Mostly, fluid intelligence had to do with the connections between the frontal and parietal lobes. The stronger and swifter the communication between these two regions, the better one's score in the abstract thinking test. These are some of the latest regions to have evolved in the brain. They house the higher level functions, such as memory and language, which are essentially what make us human.","Yale researchers believe that by learning more about the human connectome, they might find novel treatments for psychiatric disorders. Things like schizophrenia vary widely from one patient to the next. By finding what's unique to a particular patient, a psychiatrist can tailor treatment to suit their needs. Understanding one's connectome could give insight into how the disease progresses, and if and how the patient might respond to certain therapies or medications.","But there are other uses which we may or may not feel comfortable with. For instance, your child could have their brain scanned to track them at school, according to study author Todd Constable. It might be used to say whether or not a candidate is qualified for a job or should pursue a certain career. Brain scans could tell who might be prone to addiction, or what sort of learning environment a student might flourish in. School curriculum could even be changed on a day-to-day basis to fit student's needs. And the dreaded SAT might even be shelved too, in favor of a simple brain scan.","Peter Bandettini is the chief of functional imaging methods at the National Institute of Mental Health (NIMH). He told PBS that barring ethical issues, brain scans could someday be used by employers to tell which potential candidate possesses desirable aptitudes or personality traits, be they diligent, hardworking, or what-have-you. Richard Haier, an intelligence researcher at UC Irvine, foresees prison officials using such scans on inmates to tell who might be prone to violence.","We may even someday learn how to augment human intelligence from studies such as this. It's important to remember that intelligence research is still in its infancy. Yet, according to Yale scientists, we are moving in this direction."]},{"title":"Treating Depression and Anxiety in Cancer Patients","paras":["The largest studies to date, by arguably the most respected institutions up to this point, show that psilocybin, a compound within \"magic mushrooms,\" can be effective in treating depression and anxiety in cancer patients. The studies were carried out on 29 patients by researchers at New York University (NYU) and on 51 patients at Johns Hopkins University.","Notably, up to 40% of all cancer patients are afflicted by psychological issues related to their illness. Around 80% of the cancer patients in the studies got noticeably better after just one dose. And they sustained the psychological gains they made for up to seven months, with few minor side effects. Patients reported improvements in their quality of life, having more energy, going out more and having better relationships with family members. Interestingly, those who had a stronger trip reported the strongest gains in alleviating their depression and anxiety.","A number of authorities in psychiatry and addiction medicine expressed their support for the work. These include Dr. Jeffrey Lieberman, a former president of the American Psychiatric Association and Dr. Daniel Shalev from the New York State Psychiatric Institute, who wrote that the studies are \"a model for revisiting criminalized compounds of interest in a safe, ethical way.\"","The studies were also reviewed by regulators and were described by the New York Times as \"most meticulous\" to date. The lead author of the Johns Hopkins study, psychiatrist Dr. Roland Griffiths, was optimistic on the possibilities of the new treatment, likening it to a groundbreaking surgery rather than the painstaking work to make people feel better used by traditional psychiatric approaches. \"I really don't think we have any models in psychiatry that look like the effects demonstrated in the two trials,\" said Griffiths. \"Something occurs and it's repaired and it's better going forward… very plausibly for more than six months,\" he added. \"In that sense it's a new model\".","One of the participants in the study, Sherry Marcy, described the changes in how she felt this way: \"The cloud of doom seemed to just lift… I got back in touch with my family and kids, and my wonder at life,\" said Marcy, who has been battling cancer since 2010. \"Before, I was sitting alone at home, and I couldn't move … This study made a huge difference, and it persisted\".","The particulars of both studies involved randomly offering patients either psilocybin or a placebo at the first session, and then giving them the opposite treatment seven weeks later. This way all participants eventually took psilocybin. In both studies, the success rate of psilocybin versus the placebo was very clear, with 83% getting better on psilocybin and only 14% on the placebo in the NYU study.","Psilocybin, of course, has been banned in the U.S. for over 40 years. While they were allowed to use it for their studies, the scientists warn against self-medicating depression by taking \"magic mushrooms\". They caution that professionals are needed to control the dosage and provide a supportive environment in which to experience the drug's effects. The psilocybin therapy may also not be appropriate for people with schizophrenia or young adults.","To move forward in this field, Dr. Shalev and Dr. Lieberman see \"a need to loosen research restrictions\", because \"there is much potential for new scientific insights and clinical applications.\" Ideally, the next step would be a trial with a larger sample, perhaps across several centers with hundreds of subjects."]}],"B":[{"n":1,"title":"Testing for nystagmus","paras":["Patients with abnormal hearing on history or physical examination or with tinnitus or vertigo undergo, an audiogram. Patients with nystagmus or altered vestibular function may benefit from computerized electronystagmography (ENG), which quantifies spontaneous, gaze, or positional nystagmus that might not be visually detectable. Computerized ENG caloric testing quantifies the strength of response of the vestibular system to cool and warm irrigations in each ear, enabling the physician to discriminate against unilateral weakness. Different components of the vestibular system can be tested by varying head and body position or by presenting visual stimuli. Posturography uses computerized test equipment to quantitatively assess the patient's control of posture and balance. The patient stands on a platform containing force and motion transducers that detect the presence and amount of body sway while the patient attempts to stand upright. The testing can be done under various conditions, including with the platform stationary or moving, flat or tilted, and with the patient's eyes open or closed, which can help isolate the contribution of the vestibular system to balance."],"q":"What tests are identified in this article that determine if a person has nystagmus in one or both eyes?","opts":["High-frequency tympanometry.","Checking the effect on the person when they are on a special platform.","A Computerized ENG, Putting water of variable temperature into the auditory canals."],"key":"C","qja":"片眼または両眼の眼振の有無を判定する検査として、この記事が挙げているのはどれか？","ja":"【眼振の検査】病歴や診察で聴力の異常がある患者、耳鳴りやめまいがある患者は聴力検査を受ける。眼振や前庭機能の変化がある患者には、コンピューター化電気眼振図（ENG）が有用な場合があり、肉眼では検出できないかもしれない自発・注視・頭位眼振を定量化する。コンピューター化ENGの温度刺激検査（カロリックテスト）は、左右それぞれの耳への冷水・温水の注入に対する前庭系の反応の強さを定量化し、医師が一側性の機能低下を識別できるようにする。頭や体の位置を変えたり視覚刺激を与えたりすることで、前庭系の異なる要素を検査できる。重心動揺検査（ポスチュログラフィ）はコンピューター化装置で姿勢制御とバランスを定量評価する。患者は力・動きのセンサーを内蔵した台の上に立ち、まっすぐ立とうとする間の体の揺れの有無と量を検出する。台を固定または動かす、水平または傾ける、開眼または閉眼など様々な条件で行え、バランスへの前庭系の寄与を切り分けるのに役立つ。","o":[["高周波ティンパノメトリー","❌ 本文に出てこない。"],["特殊な台に乗ったときの反応を調べる","❌ ポスチュログラフィは『姿勢とバランス』の検査。眼振の検査ではない。"],["コンピューター化ENG、外耳道に温度の異なる水を入れる検査","✅ ENGが眼振を定量化し、カロリックテスト（cool and warm irrigations in each ear）で左右差（unilateral weakness）を識別。"]],"exp":"設問の in one or both eyes（片側か両側か）は、本文の discriminate … unilateral weakness（一側性の低下を識別）に対応。irrigations を『水を入れる』と言い換えられるかがカギ。","pt":"→ 型：選択肢の平易な言い換え（putting water into the auditory canals）を本文の専門語（caloric irrigations）に戻して照合する。","doubt":null,"voc":[["nystagmus","眼振"],["tinnitus","耳鳴り"],["vertigo","めまい（回転性）"],["audiogram","聴力検査（オージオグラム）"],["vestibular function","前庭機能"],["quantify","定量化する"],["caloric testing","温度刺激検査（カロリックテスト）"],["irrigation","洗浄・注水"],["discriminate","識別する"],["unilateral weakness","一側の機能低下"],["body sway","身体の揺れ"],["upright","まっすぐ立った"]],"past":null},{"n":2,"title":"Screening for childhood obesity and vascular conditions","paras":["The proposed study includes children aged between 9-10 years from the SCOPE (Screening for Pregnancy Endpoints) study. The SCOPE study was conducted in Adelaide during 2005-2008 and 1164 nulliparous pregnant women, their partners and babies were recruited. Detailed information was collected during pregnancy. Of the 1164 women in the study, 861 had uncomplicated pregnancies, 93 developed preeclampsia, 118 had gestational hypertension, 95 normotensive women delivered SGA babies and 69 delivered preterm.","We will invite all children of women recruited to the SCOPE study to participate at age 9-10 years. Data will be collected on diet, physical activity, height and weight. Haemodynamic measures will be done noninvasively as follows. Central blood pressure and augmentation index (an indicator of arterial stiffness) will be measured using the USCOM BP+. Cardiac output and systemic vascular resistance will be measured using the USCOM 1A. Microvascular function will be assessed by Post Occlusive Reactive Hyperaemia method using Laser Doppler. The results of children born after complicated pregnancies will be compared with those of children born after uncomplicated pregnancies."],"q":"What daily activities of the child subjects in this clinical trial will be observed?","opts":["If they had preeclampsia.","Their eating and exercise habits.","If they have siblings."],"key":"B","qja":"この臨床研究では、対象の子どものどんな日常活動が観察されるか？","ja":"【小児肥満と血管疾患のスクリーニング】本研究はSCOPE（妊娠エンドポイントのスクリーニング）研究から生まれた9〜10歳の子どもを対象とする。SCOPE研究は2005〜2008年にアデレードで行われ、1164人の初産婦とそのパートナー、赤ちゃんが登録された。妊娠中に詳細な情報が収集された。1164人中、861人は合併症のない妊娠、93人は妊娠高血圧腎症、118人は妊娠高血圧、95人の正常血圧女性がSGA児を出産し、69人が早産した。SCOPE研究に登録された女性の子ども全員を9〜10歳時点で招待する。食事、身体活動、身長、体重のデータを収集する。血行動態は非侵襲的に測定する。中心血圧とAugmentation Index（動脈硬化の指標）はUSCOM BP+で、心拍出量と全身血管抵抗はUSCOM 1Aで測定。微小血管機能はレーザードップラーによる阻血後反応性充血法で評価する。合併症妊娠後に生まれた子どもの結果を、合併症のない妊娠後に生まれた子どもと比較する。","o":[["妊娠高血圧腎症があったかどうか","❌ 妊娠高血圧腎症は『母親』の妊娠合併症。子どもの日常活動ではない。"],["食習慣と運動習慣","✅ Data will be collected on diet, physical activity の言い換え。"],["きょうだいがいるかどうか","❌ 本文に出てこない。"]],"exp":"設問の daily activities と本文の diet, physical activity を結びつける。数字が大量に出てくるが、設問に関係するのは1行だけ。","pt":"→ 型：数字の多い本文は設問キーワードで1行に絞り込む。数字は読み飛ばしてよい。","doubt":null,"voc":[["nulliparous","未産（初産）の"],["recruit","（研究に）登録する"],["uncomplicated","合併症のない"],["preeclampsia","妊娠高血圧腎症"],["gestational hypertension","妊娠高血圧"],["normotensive","血圧が正常な"],["preterm","早産（で）"],["haemodynamic","血行動態の"],["noninvasively","非侵襲的に"],["arterial stiffness","動脈の硬さ"],["cardiac output","心拍出量"],["sibling","きょうだい"]],"past":null},{"n":3,"title":"South Australia worst for children's asthma hospitalizations according to new report","paras":["A new report has revealed that more South Australian children are hospitalised because of their asthma than anywhere else in the country. Between 2011 and 2013, 361 children per 100,000 on average presented to South Australian hospitals, above the rates for NSW and Victoria. There were only 157 presentations per 100,000 people in Tasmania, which has the highest prevalence at 12.6 per cent. Asthma Australia chief executive Michele Goldman said the number of hospital cases in South Australia was unusual and finding out why was the \"magic question.\" She said the condition was often overlooked in GP appointments, which could make management of it tricky. \"There's not enough time currently in the system to provide the education that's required so that people with asthma understand the condition, understand the role of preventer medication and have the tools they need to self-manage the condition well,\" Ms Goldman said."],"q":"What reason is given in this article that explains why hospitalisation of children with asthma is worse in South Australia?","opts":["Lack of time to upskill asthma sufferers.","Lack of time to upskill GP practice staff about asthma.","Lack of time to upskill hospital staff about asthma."],"key":"A","qja":"南オーストラリア州で小児喘息の入院が多い理由として、この記事は何を挙げているか？","ja":"【南オーストラリア州、小児喘息の入院で最悪：新報告】新しい報告で、南オーストラリア州は喘息で入院する子どもが国内で最も多いことが明らかになった。2011〜2013年、南豪州の病院には10万人あたり平均361人の子どもが受診し、NSW州やビクトリア州を上回った。有病率が最も高い（12.6%）タスマニア州の受診は10万人あたり157人だけだった。Asthma Australiaの最高経営責任者Michele Goldman氏は、南豪州の入院件数は異例で、その理由を解明することが『核心の問い』だと述べた。喘息はGPの診察で見過ごされがちで、管理が難しくなりうるという。「喘息の人が病気を理解し、予防薬の役割を理解し、自己管理に必要な手段をもてるようにする教育を行う時間が、今の制度には十分にない」とGoldman氏は述べた。","o":[["喘息患者のスキルを高める時間の不足","✅ not enough time … to provide the education … so that people with asthma understand … self-manage。upskill＝教育で能力を高める。"],["GP診療所スタッフに喘息の教育をする時間の不足","❌ GPの受診で見過ごされるとは言うが、『スタッフを教育する時間』の話ではない。教育の対象は患者。"],["病院スタッフに喘息の教育をする時間の不足","❌ 病院スタッフの教育は本文にない。"]],"exp":"3択とも『教育する時間の不足』で、違いは『誰を』教育するか（対象）だけ。本文の so that people with asthma understand が対象を決める。","pt":"→ 型：選択肢が1語だけ違うときは、その1語（対象・主語）を本文で特定する。","doubt":null,"voc":[["hospitalise","入院させる"],["present to","（患者が）受診する"],["prevalence","有病率"],["chief executive","最高経営責任者"],["overlooked","見落とされる"],["tricky","やっかいな"],["preventer medication","予防薬（喘息の長期管理薬）"],["self-manage","自己管理する"],["upskill","能力・知識を高める"]],"past":null},{"n":4,"title":"Risks associated with hepatitis B in pregnancy","paras":["Mother-to-child transmission occurs frequently either in the uterus, through placenta leakage, or through exposure to blood or blood-contaminated fluids at or around the time of birth (Lee et al 2006). Perinatal transmission is believed to account for 35–50% of hepatitis B carriers (Yao 1996). The risk of perinatal transmission is associated with the hepatitis B envelope antigen (HbeAg) status of the mother. If a woman is both hepatitis surface antigen (HbsAg) and HbeAg positive, 70–90% of her children will develop hepatitis B (Stevens et al 1975; Akhter et al 1992). If the mother is HbsAg positive but HbeAg negative, the risk is reduced (Okada et al 1976; Beasley et al 1977; Beasley et al 1983; Nayak et al 1987; Aggarwal Ranjan 2004). In a cohort study of HbsAg-positive, hepatitis B DNA-positive women in Sydney (n=313) (Wiseman et al 2009), transmission rates were 3% among hepatitis B DNA-positive women overall, 7% among HbsAg-positive mothers and 9% among women with very high hepatitis B DNA levels. It has been estimated that people who are chronic carriers of HbsAg are 22 times more likely to die from hepatocellular carcinoma or cirrhosis than noncarriers (95%CI 11.5 to 43.2) (Beasley & Hwang 1984)."],"q":"Most children born will develop hepatitis B if their mother","opts":["has hepatitis B envelop antigen.","is a chronic carrier of hepatitis surface antigen.","has hepatitis B envelop and surface antigen."],"key":"C","qja":"母親がどうであれば、生まれる子どもの大半がB型肝炎を発症するか？","ja":"【妊娠中のB型肝炎に伴うリスク】母子感染は、子宮内での胎盤からの漏出、あるいは出生時前後の血液や血液汚染体液への曝露により頻繁に起こる。周産期感染がB型肝炎キャリアの35〜50%を占めると考えられている。周産期感染のリスクは母親のHBe抗原の状態と関連する。女性がHBs抗原陽性かつHBe抗原陽性なら、子どもの70〜90%がB型肝炎を発症する。HBs抗原陽性でもHBe抗原陰性なら、リスクは低くなる。シドニーのHBs抗原陽性・HBV-DNA陽性女性のコホート研究（n=313）では、感染率はHBV-DNA陽性女性全体で3%、HBs抗原陽性の母親で7%、HBV-DNAが非常に高い女性で9%だった。HBs抗原の慢性キャリアは、非キャリアに比べ肝細胞癌や肝硬変で死亡する確率が22倍高いと推定されている。","o":[["HBe抗原をもっている","❌ HBe抗原『単独』の場合のデータはない。本文の70〜90%は HBs と HBe の『両方』陽性の場合。"],["HBs抗原の慢性キャリアである","❌ 慢性キャリアの22倍は『本人の死亡リスク』の話。子どもへの感染率ではない。"],["HBe抗原とHBs抗原の両方をもっている","✅ If a woman is both HBsAg and HBeAg positive, 70–90% of her children will develop hepatitis B。most children＝70〜90%。"]],"exp":"設問の most children を70〜90%と結びつける。Bの数字（22倍）は別の人（母親本人）のアウトカムで、主語のすり替え。","pt":"→ 型：数値の根拠文は『誰の・何の』数値か（母→子の感染 / 本人の死亡）を確認してから使う。","doubt":null,"voc":[["mother-to-child transmission","母子感染"],["uterus","子宮"],["placenta","胎盤"],["perinatal","周産期の"],["account for","〜を占める"],["carrier","保有者・キャリア"],["envelope antigen","エンベロープ抗原（HBe抗原）"],["surface antigen","表面抗原（HBs抗原）"],["cohort study","コホート研究"],["hepatocellular carcinoma","肝細胞癌"],["cirrhosis","肝硬変"]],"past":null},{"n":5,"title":"Memo: Revised guidelines for managing urethral catheters in adults","paras":["The purpose of this guideline is to provide the best practice principles to be applied when inserting and managing urethral catheters for adult patients in NSW Public Health Organisations (PHOs), to reduce unnecessary catheterisation and the risk of the catheter associated urinary tract infection.","This document is intended to support all trained and credentialed healthcare clinicians who are competent in urinary catheter practice for acute care settings. It is the responsibility of the PHO to ensure clinicians whose role involves the insertion, maintenance or removal of urethral catheters are trained and credentialed.","This guideline addresses the insertion, care and removal of urethral catheters in adults during acute care. This guideline does not address suprapubic catheterisation, acute paediatric catheterisation or care and use of chronic or long term catheters for adult patients. This document provides limited advice for maternity and birth settings however these units should refer to local procedures for further clarification."],"q":"Which health care professionals is this guideline NOT targeted at?","opts":["Medical officers, acute care nurses and gynaecologists.","Emergency department nurses, theatre staff and surgical ward staff.","Aged care sector nurses, midwives and paediatricians."],"key":"C","qja":"このガイドラインの対象に『含まれない』医療者はどれか？","ja":"【メモ：成人の尿道カテーテル管理ガイドライン改訂】本ガイドラインの目的は、NSW州公的医療機関で成人患者に尿道カテーテルを挿入・管理する際のベストプラクティスの原則を示し、不要なカテーテル留置とカテーテル関連尿路感染のリスクを減らすことである。本文書は、急性期医療の場で尿道カテーテルの手技に習熟した、訓練・認定済みのすべての医療者を支援することを目的とする。挿入・維持・抜去に関わる臨床家が訓練・認定を受けていることを保証するのは各医療機関の責任である。本ガイドラインは急性期における成人の尿道カテーテルの挿入・ケア・抜去を扱う。恥骨上カテーテル、急性期の小児カテーテル、成人の慢性・長期カテーテルのケアと使用は扱わない。産科・分娩の場については限られた助言しか示さないため、これらの部署は詳細を各施設の手順で確認すること。","o":[["医師、急性期看護師、婦人科医","❌ いずれも急性期で成人の尿道カテーテルに関わりうる＝対象に含まれる。"],["救急外来看護師、手術室スタッフ、外科病棟スタッフ","❌ いずれも急性期医療の現場＝対象に含まれる。"],["高齢者介護部門の看護師、助産師、小児科医","✅ 高齢者介護（長期カテーテル・非急性期）、助産（産科は限定的・各施設手順へ）、小児（acute paediatric catheterisation は対象外）。"]],"exp":"NOT targeted 型。本文の does not address（対象外）と limited advice（限定的）に該当する職種を並べたのがC。acute care が対象範囲のキーワード。","pt":"→ 型：対象範囲の問題は『対象（intended to support …）』と『対象外（does not address …）』の2文を先に探す。","doubt":null,"voc":[["urethral catheter","尿道カテーテル"],["best practice principles","最良とされる実践原則"],["catheterisation","カテーテル留置"],["credentialed","認定を受けた"],["competent","技能を備えた"],["acute care setting","急性期医療の場"],["maintenance","維持・管理"],["suprapubic","恥骨上の"],["paediatric","小児の"],["maternity","産科・出産"],["clarification","明確化・確認"],["midwives","助産師（midwife の複数）"]],"past":null},{"n":6,"title":"Hearing Loss","paras":["Sensorineural hearing loss is caused by lesions of either the inner ear (sensory) or the auditory (8th) nerve. This distinction is important because sensory hearing loss is sometimes reversible and is seldom life threatening. A neural hearing loss is rarely recoverable and may be due to a potentially life-threatening brain tumor—commonly a cerebellopontine angle tumor. An additional type of sensorineural loss is termed auditory neuropathy spectrum disorder, when sound can be detected but the signal is not sent correctly to the brain, and is thought to be due to an abnormality of the inner hair cells or the neurons that innervate them within the cochlea.","By Lawrence R. Lustig, MD, Howard W. Smith Professor and Chair, Department of Otolaryngology–Head and Neck Surgery, Columbia University Medical Center and New York Presbyterian Hospital."],"q":"Why is it important to diagnose what type of hearing loss they have?","opts":["Sensory hearing loss may improve.","Neural hearing loss does not improve.","Sensory hearing loss is caused by brain tumor."],"key":"A","qja":"難聴の種類を診断することがなぜ重要なのか？","ja":"【難聴】感音難聴は、内耳（感覚性）または聴神経（第8脳神経・神経性）の病変によって起こる。この区別が重要なのは、感覚性難聴は時に回復可能で、生命を脅かすことはまれだからである。神経性難聴は回復することがまれで、生命を脅かしうる脳腫瘍（一般には小脳橋角部腫瘍）が原因のことがある。感音難聴のもう一つの型にauditory neuropathy spectrum disorderがあり、音は検出されるが信号が脳に正しく送られない状態で、蝸牛内の内有毛細胞またはそれを支配する神経の異常によると考えられている。","o":[["感覚性難聴は改善する可能性がある","✅ sensory hearing loss is sometimes reversible（時に回復可能）＝may improve。"],["神経性難聴は改善しない","❌ 本文は rarely recoverable（まれにしか回復しない）。does not improve は断定しすぎ。"],["感覚性難聴は脳腫瘍が原因である","❌ 脳腫瘍が原因になりうるのは『神経性』。感覚性と神経性の取り違え。"]],"exp":"ヘッジの強さの一致が決め手。sometimes reversible ≒ may improve（一致）／ rarely recoverable ≠ does not improve（断定化）。","pt":"→ 型：rarely / sometimes / may を『never / always / does not』に変えた選択肢は誤り。ヘッジの強さをそろえて照合する。","doubt":null,"voc":[["sensorineural hearing loss","感音難聴"],["lesion","病変"],["inner ear","内耳"],["auditory nerve","聴神経"],["distinction","区別"],["reversible","回復しうる・可逆性の"],["seldom","めったに〜ない"],["life threatening","生命を脅かす"],["recoverable","回復可能な"],["innervate","支配する（神経が）"],["cochlea","蝸牛"]],"past":null}],"C":[{"n":7,"t":0,"p":0,"q":"Through a brain scan, neuroscientists today can determine an individual's","opts":["abstract reasoning.","abilities.","weaknesses.","academic performance."],"key":"A","ev":"They interpreted intelligence in this case as abstract reasoning, also known as fluid intelligence.","note":"今日できるのは知能（＝抽象的推論）の判定（A）。長所・短所（B・C）の判定は『時間の問題』＝将来の話。","doubt":null,"alt":[],"voc":[["neuroscientist","神経科学者"],["a matter of time","時間の問題"],["aptitude","適性・能力"],["shortcoming","弱点・短所"],["abstract reasoning","抽象的推論"],["fluid intelligence","流動性知能"],["consistent predictor","一貫した予測因子"],["standardized test","標準化されたテスト"]],"oja":["抽象的推論。","能力（得意なこと）。","弱点。","学業成績。"],"past":"C"},{"n":8,"t":0,"p":1,"q":"Which of the following does the Human Connectome Project NOT involve?","opts":["Mapping networks inside the brain.","Understanding how connections in the brain function.","Understanding intellect and emotions.","Assessing researchers."],"key":"D","ev":"researchers at Yale put participants through a series of different tests","note":"NOT。テストを受けたのは参加者で、研究者を評価してはいない（D）。","doubt":null,"alt":[],"voc":[["accurately","正確に"],["connectome","コネクトーム（脳の結合地図）"],["mapping","地図化すること"],["wiring","配線・つながり方"],["intellect","知性"],["motor skills","運動機能"],["assess","評価する"]],"oja":["脳内のネットワークを地図化すること。","脳の結合がどう働くかを理解すること。","知性と感情を理解すること。","研究者を評価すること。"],"past":null},{"n":9,"t":0,"p":2,"q":"In what way is a connectome similar to a fingerprint?","opts":["In its strength.","In its activity.","In its individuality.","In its accuracy."],"key":"C","ev":"Each person's connectome was as unique as their fingerprint, scientists found The patients were selected according to plan, but by chance.","All the patients were first given psilocybin, and then a placebo."],"key":"C","ev":"randomly offering patients either psilocybin or a placebo at the first session","note":"計画に沿って、ただし割付は無作為（C）。83%は結果の数字で割付ではない。","doubt":null,"alt":[],"voc":[["particulars","詳細"],["randomly","無作為に"],["placebo","プラセボ（偽薬）"],["the opposite treatment","もう一方の治療"],["eventually","最終的に"],["success rate","奏効率・成功率"],["by chance","偶然に・無作為に"]],"oja":["まず83%の患者がシロシビンを受け、次にプラセボを受けた。","まず83%の患者がプラセボを受け、次にシロシビンを受けた。","患者は計画に沿って、しかし無作為に選ばれた。","全員がまずシロシビンを受け、次にプラセボを受けた。"],"past":null},{"n":21,"t":1,"p":6,"q":"Which of the following is not true about psilocybin?","opts":["It's not allowed to be used in the USA.","It's not suitable for those suffering from schizophrenia.","It must be used with caution by the patients.","The dose and provision must be provided by a specialist in the area."],"key":"C","ev":"the scientists warn against self-medicating depression","note":"NOT true。患者自身が注意して使うのではなく、専門家が用量と環境を管理すべき（C）。","doubt":null,"alt":[],"voc":[["banned","禁止された"],["warn against","〜しないよう警告する"],["self-medicate","自己判断で薬を使う"],["caution","注意を促す"],["dosage","投与量"],["supportive environment","支えとなる環境"],["appropriate for","〜に適した"],["provision","提供・支給"]],"oja":["米国では使用が許可されていない。","統合失調症の人には適さない。","患者自身が注意して使わなければならない。","用量と提供は、その分野の専門家が管理しなければならない。"],"past":"A"},{"n":22,"t":1,"p":7,"q":"What does the author imply with the phrase \"a need to loosen research restrictions\"?","opts":["That it is necessary to make the rules surrounding research less strict.","That it is necessary to create a better atmosphere for father research.","That it is necessary to invite more doctors to take part in the research.","That it is necessary to spread the results of the research across several centers."],"key":"A","ev":"\"a need to loosen research restrictions\"","note":"loosen restrictions＝規制を緩める（A）。","doubt":null,"alt":[],"voc":[["move forward","前進する"],["loosen","緩める"],["restriction","規制・制限"],["insight","知見"],["clinical application","臨床への応用"],["ideally","理想を言えば"],["sample","標本・対象者数"],["subject","被験者"]],"oja":["研究を取り巻く規則を緩める必要があるということ。","さらなる研究のためにより良い環境を作る必要があるということ。","より多くの医師に研究へ参加してもらう必要があるということ。","研究結果を複数の施設に広める必要があるということ。"],"past":null}]},{"id":"06","texts":[{"title":"","paras":["One of humankind's great advantages has been that we band together to accomplish more than we can on our own. You might expect that our bodies would have evolved in such a way as to promote social interaction, and you'd be right. Studies are revealing that those outside the pack — the lonely — are 25% more likely to die prematurely, according to writer Veronique de Turenne. The chronically lonely wind up with more heart disease, more metastatic cancer, and with higher risks of stroke and neurodegenerative diseases like Alzheimer's.","Lately scientists have been learning about the biological ramifications of loneliness. Steve Cole is a professor of medicine, psychiatry and biobehavioral sciences at the David Geffen School of Medicine at UCLA, and director of the UCLA Social Genomics Core Laboratory. He's been working on this at the molecular level since the early 2000s, aided by data from the Human Genome Project. His interest had been triggered by a report on the survival rates of gay men with HIV. It appeared that closeted men died much more quickly than those who had come out. The main discernible difference between the groups was that closeted subjects were more worried about ostracization and rejection.","John Caccioppo of the Center for Cognitive and Social Neuroscience at the University of Chicago, is an expert on the physical effects of social disconnection on cellular mechanisms with a book called Loneliness: Human Nature and the Need for Social Connection. He and Cole teamed up for a study of how gene expression varied between people who were lonely and those who weren't. According to Cole, \"We found the key antiviral response driven by so-called Type 1 interferon molecules was deeply suppressed in the lonely people relative to the non-lonely people.\"","In addition — and ominously — Cole and Caccioppo also found \"… that there was another block of genes that was not suppressed — in fact, it was greatly activated — and this block of genes was involved in inflammation.\" Inflammation can be the engine underlying atherosclerosis, Alzheimer's, and cancer.","Are people isolated socially being further undermined by their own biology? There are two plausible evolutionary explanations. Cole says, \"The best theory is that this pattern of altered immunology is a kind of defensive reaction mounted by your body if it thinks you are going to be wounded in the near-future,\" with no one there to protect or help you. Another theory is that if you feel bad, you may be more inclined to seek out others for help. With this notion, the emotional pain of loneliness acts much like a physical pain that tells you something is wrong that needs to be addressed. In any event, both ideas may have made more sense historically than they do now, and the number of people describing themselves as lonely is growing quickly — Cole refers to it as an \"epidemic.\"","Part of it is the aging baby boomers who've seen their children grow up and move out, and whose friends are dying more frequently due to age. Another factor may be the way \"our culture is changing in ways that invite us — in fact, almost require us — to be more lonely and disenfranchised,\" according to Cole. Among those is our migration to online relationships that just aren't individually as powerful due to the lack of personal contact. We text, we don't call, and our families tend to be far-flung, no longer residing in physical communities together."]},{"title":"","paras":["In 1998, Andy Clark and David Chalmers announced that computers can operate together with our brains as an \"extended mind\" potentially offering additional processing capabilities as we work out problems, as well as an annex for our memories containing information, images, and so on. Now a professor of biomedical engineering at the University of Southern California, Theodore Berger, is working to bring to market human memory enhancement in the form of a prosthetic implanted in the brain. He's already testing it attached to humans.","The prosthetic, which Berger has been working on for ten years, can function as an artificial hippocampus, the area in the brain associated with memory and spatial navigation. The plan is for the device to convert short-term memory into long-term memory and potentially store it as the hippocampus does. His research has been encouraging so far.","Berger began by teaching a rabbit to associate an audio tone with a puff of air administered to the rabbit's face, causing it to blink. Electrodes attached to the rabbit allowed Berger to observe patterns of activity firing off in the rabbit's hippocampus. Berger refers to these patterns as a \"space-time code\" representing where the neurons are in the rabbit's brain at a specific moment. Berger watched them evolving as the rabbit learned to associate the tone and puff of air. He told Wired, \"As the space-time code propagates into the different layers of the hippocampus, it's gradually changed into a different space-time code.\" Eventually, the tone alone was enough for the hippocampus to produce a recallable space-time code based on the latest incoming version to make the rabbit blink.","The manner in which the hippocampus was processing the rabbit's memory and producing a recallable space-time code became predictable enough to Berger that he was able to develop a mathematical model representing the process.Berger then built an artificial rat hippocampus—his experimental prosthesis—to test his observations and model. By training rats to press a lever with electrodes monitoring their hippocampuses, Berger was able to acquire the corresponding space-time codes. Running that code through his mathematical model and sending it back to the rats' brains, his system was validated as the rats successfully pressed their levers. \"They recall the correct code as if they've created it themselves. Now we're putting the memory back into the brain,\" Berger reports.","It's maybe this last statement that's so intriguing. Does the brain have some kind of master memory index? Has it somehow integrated the artificial hippocampus's memories into the rats' directory? Will it also happen in humans?","Dustin Tyler, a professor of engineering at Case Western Reserve University, cautioned Wired \"All of these prosthetics interfacing with the brain have one fundamental challenge. There are billions of neurons in the brain and trillions of connections between them that make them all work together. Trying to find technology that will go into that mass of neurons and be able to connect with them on a reasonably high-resolution level is tricky.","Still, Berger himself is optimistic, telling IEEE Spectrum, \"We're testing it in humans now, and getting good initial results. We're going to go forward with the goal of commercializing this prosthesis.","What he envisions bringing to market based on his research is a brain prosthetic for people with memory problems. The tiny device would be implanted in the patient's own hippocampus from where it would stimulate the neurons responsible for turning short-term memories into long-term memories. He hopes it can help patients suffering from Alzheimer's, other forms of dementia, stroke victims and people whose brains have been injured.","Rats and monkeys—the prosthetic improved the memories of rhesus monkeys attached to their prefrontal cortex—are one thing. The greater number of neurons in human brains is a big issue that needs to be grappled before Berger's implant will work well for humans: It's difficult to gain a comprehensive view of what's going on with larger brains due to their greater number of neurons. (Rat brains have about 200 million neurons; humans have 86 billion.) Berger warns, \"Our information will be biased based on the neurons we're able to record from,\" and he looks forward to tools that can capture broader swaths of data going forward. It's anticipated that they'll need to pack a greater number of electrodes into prostheses."]}],"B":[{"n":1,"title":"The shocking abuse in our nursing homes","paras":["According to the most recent 2011-2012 Report On the Operation of the Aged Care Act 1997, there are 187,941 people living in 2725 residential aged care facilities across Australia.","There are many cases—too many—where deaths in nursing homes are hastened by the poor standard of care. In recent years, there have been instances of residents starved, burnt, drowned or even strangled while in care. Part of the problem is the lack of supervision of the residents by caring, capable staff. It stands to reason that a patient could not have fallen into the water fountain at her nursing home if she had been properly supervised. Likewise, it would be more difficult for evil people to prey upon residents if there were plenty of staff on hand, keeping an eye on things. Lynda Saltarelli, of the community-based Aged Care Crisis team, says many people are amazed, when embarking on the frustrating process of trying to find a nursing home bed, to discover there is no mandatory staff-to-resident ratio. All that is required under the Aged Care Act 1997 is that each centre provides what is known as an \"adequate number of appropriately skilled staff\" or \"sufficient\" staff for the number of residents."],"q":"Abuse in nursing homes has several causes but what issue does this article concentrate on?","opts":["Too many people are living in nursing homes rather than staying in their own homes.","Insufficient experienced and considerate staff and no compulsory staffing level requirements.","Too many hazards that allow the residents to be injured, such as water features and heaters."],"key":"B","qja":"介護施設での虐待には複数の原因があるが、この記事が焦点を当てている問題は何か？","ja":"【介護施設における衝撃的な虐待】最新の2011-2012年版『高齢者介護法1997運用報告』によれば、豪州全土の2725の入所型介護施設に187,941人が暮らしている。介護の質の低さによって施設での死が早まる事例は多い——多すぎる。近年、入居者が飢えさせられ、やけどを負い、溺れ、さらには首を絞められた事例もある。問題の一端は、思いやりと能力のあるスタッフによる入居者の見守り不足にある。きちんと見守られていれば、ある入居者が施設の噴水に落ちることはなかったはずだ。同様に、十分なスタッフが目を配っていれば、悪意ある人が入居者を食い物にするのも難しくなる。地域団体Aged Care Crisisのリンダ・サルタレリ氏によれば、施設のベッドを探すという苛立たしい過程で、職員対入居者の義務的な比率が存在しないと知って驚く人が多いという。高齢者介護法1997が求めているのは、各施設が『適切な技能をもつ職員を十分な数』あるいは入居者数に対し『十分な』職員を配置することだけである。","o":[["自宅にとどまらず介護施設で暮らす人が多すぎる","❌ 入居者数は背景情報で、問題として論じていない。"],["経験と思いやりのある職員の不足と、職員配置基準の義務がないこと","✅ lack of supervision … by caring, capable staff ＋ there is no mandatory staff-to-resident ratio の2点。"],["噴水やヒーターなど入居者がけがをする危険が多すぎる","❌ 噴水は『見守っていれば防げた』例として出るだけ。ヒーターは本文にない。"]],"exp":"Part of the problem is … 以降が筆者の焦点。前半の具体例（飢え・やけど・溺水）は問題の『結果』で、焦点は原因（人員不足・基準なし）。","pt":"→ 型：concentrate on / focus 型の設問は『problem is …』『the issue is …』の文を探す。具体例は主旨ではない。","doubt":null,"voc":[["residential aged care facility","入所型高齢者介護施設"],["hasten","早める"],["starved","飢えさせられた"],["strangled","絞められた"],["supervision","見守り・監督"],["it stands to reason","当然のことだ"],["prey upon","食い物にする"],["on hand","その場にいる"],["embark on","（過程に）乗り出す"],["mandatory","義務の"],["staff-to-resident ratio","職員対入居者比"],["adequate","十分な"],["compulsory","義務的な"]],"past":null},{"n":2,"title":"The need to increase indigenous nursing population","paras":["The Congress of Aboriginal and Torres Strait Islander Nurses (CATSIN) was founded in 1997 with the express intention of increasing the representation of indigenous people in the nursing profession. Chaired by Sally Goold, CATSIN challenges the western model of health care and seeks to ensure nursing education in indigenous health settings is culturally appropriate, as well as facilitating indigenous students into nursing. Looking at the broad picture, Alice Springs Hospital nursing director Professor Ged Williams says it is pointless to talk about getting indigenous people into nursing until something is done to address the education of indigenous students in schools. \"There aren't too many Aboriginal nurses in Australia because Aboriginal education is appalling,\" Professor Williams said. He argues it is important to begin by getting a critical mass of Aboriginal people into the health sector in jobs such as ward clerks, cleaners, or patient carers where they can support each other. \"Once we have a large critical mass in the system, then we can hope that this will form a pool of potential employees to go on and do other health work like nursing,\" Professor Williams said. But Professor Williams adds it is crucial to ensure that early education is meeting the needs of indigenous people, and keeping them in the system."],"q":"What two ideas are there about education that could increase the number of nurses from the Aboriginal and Torres Strait Islander populations?","opts":["There need to be apprenticeships for indigenous people to work in different healthcare settings and nursing needs to give extra educational support to Aborigine and Torres Strait islander nursing students.","There need to be special pathways into nursing education for indigenous people and more Aborigine and Torres Strait Islanders working in early education","Nurse education around the health of Aborigines and Torres Strait Islanders needs to be culturally appropriate and early education is needed to increase the educational achievement of indigenous people."],"key":"C","qja":"アボリジニ・トレス海峡諸島民の看護師を増やしうる、教育に関する2つの考えは何か？","ja":"【先住民の看護師を増やす必要性】アボリジニ・トレス海峡諸島民看護師会（CATSIN）は、看護職における先住民の割合を高めることを明確な目的として1997年に設立された。サリー・グールド氏が議長を務めるCATSINは、西洋型医療モデルに異を唱え、先住民の保健医療の場での看護教育が文化的に適切であるよう求めるとともに、先住民の学生が看護の道に進むのを支援している。大局的に見て、アリススプリングス病院の看護部長ゲド・ウィリアムズ教授は、学校での先住民の教育に手を打たない限り、先住民を看護職に就かせる話をしても無意味だと言う。「豪州にアボリジニの看護師が少ないのは、アボリジニの教育がひどいからだ」。まずは病棟クラーク、清掃員、介助者などの職で医療分野に先住民の『臨界量』を確保し、互いに支え合えるようにすることが重要だと主張する。「システム内に十分な人数がいれば、看護など他の医療職に進む人材の母集団になると期待できる」。ただし同教授は、初期教育が先住民のニーズを満たし、彼らを教育システムにとどめることが極めて重要だと付け加える。","o":[["先住民が様々な医療現場で働く徒弟制度が必要で、看護分野は先住民の看護学生に追加の教育支援をすべきだ","❌ apprenticeships（徒弟制度）も『追加の教育支援』も本文にない。病棟クラーク等の職は『雇用』の話で教育ではない。"],["先住民のための看護教育への特別な入口と、幼児教育で働く先住民を増やすこと","❌ 『幼児教育で働く先住民』ではなく『先住民への初期教育の充実』。主語と目的語のすり替え。"],["先住民の健康に関する看護教育を文化的に適切なものにし、先住民の学力向上のために初期教育が必要","✅ CATSIN：nursing education … culturally appropriate ＋ Williams：early education is meeting the needs of indigenous people。"]],"exp":"2人の主張者（CATSINとWilliams教授）から1つずつ『教育』に関する考えを拾う設問。Bの early education は本文語だが、『そこで働く』にずらしている。","pt":"→ 型：複数の人物が出る本文で『2つの考え』を問われたら、人物ごとに1つずつ対応させる。","doubt":null,"voc":[["indigenous","先住の"],["express intention","明確な意図"],["representation","（集団の）割合・代表されていること"],["chaired by","〜が議長を務める"],["culturally appropriate","文化的に適切な"],["facilitate","後押しする・促進する"],["pointless","無意味な"],["address","対処する"],["appalling","ひどい・目を覆うような"],["critical mass","十分な人数・臨界量"],["ward clerk","病棟クラーク"],["apprenticeship","徒弟制度・実習制度"]],"past":null},{"n":3,"title":"Memo re: Outbreak of circulating vaccine-derived poliovirus in Papua New Guinea","paras":["The Government of Papua New Guinea is working with partners, including WHO and UNICEF, to take appropriate outbreak response measures including contact tracing, testing and vaccination. Polio is very unlikely to spread in Australia because of high rates of vaccine coverage, good sanitation, and the quality and ability of the health system to respond to cases.","Australian residents planning to visit PNG for less than 4 weeks should be up to date with their polio vaccination. For adults, this is a 3 dose primary course, with a booster within the last 10 years. For children, a 3 dose primary course with a booster at 4 years old is currently recommended. These recommended vaccines may be given before arrival in PNG.","Australian residents travelling to PNG intending to stay for longer than 4 weeks should have a documented polio booster within 4 weeks to 12 months prior to the date of departure from PNG. The booster may be given before arrival in PNG, as long as it is given within 4 weeks to 12 months prior to leaving PNG."],"q":"This memo outlines the advice for people traveling to PNG about polio boosters and vaccines. What is the risk of a polio outbreak unfurling in Australia?","opts":["The risk is low because Australia has good border control measures in place.","The risk is high because the population is widespread.","The risk is low because Australia has the means to manage cases of polio."],"key":"C","qja":"このメモはPNG渡航者へのポリオ追加接種・ワクチンの助言をまとめたものである。豪州でポリオが流行するリスクはどうか？","ja":"【メモ：パプアニューギニアにおけるワクチン由来ポリオウイルス流行について】PNG政府はWHOやユニセフなどと協力し、接触者追跡、検査、ワクチン接種を含む適切な流行対策を講じている。豪州ではワクチン接種率の高さ、衛生状態の良さ、症例に対応する医療制度の質と能力により、ポリオが広がる可能性は非常に低い。PNGに4週間未満滞在予定の豪州居住者は、ポリオワクチンを最新の状態にしておくこと。成人は3回の初回接種＋過去10年以内の追加接種、小児は3回の初回接種＋4歳での追加接種が現在推奨されている。これらはPNG到着前に接種してよい。4週間以上滞在予定の豪州居住者は、PNG出国日の4週間〜12か月前に記録のあるポリオ追加接種を受けておくこと。PNG到着前の接種でもよいが、出国前4週間〜12か月の範囲に入っている必要がある。","o":[["豪州には優れた国境管理策があるのでリスクは低い","❌ 国境管理は本文にない。理由は接種率・衛生・医療制度。"],["人口が分散しているのでリスクは高い","❌ リスクは very unlikely（非常に低い）。"],["豪州には症例に対応する手段があるのでリスクは低い","✅ the quality and ability of the health system to respond to cases の言い換え（means to manage cases）。"]],"exp":"リスクの高低（低い）でBが消え、理由の照合でAが消える。2段階で判定する設問。","pt":"→ 型：『結論＋理由』の選択肢は、結論が合っていても理由まで本文と一致するか確認する。","doubt":null,"voc":[["outbreak response measures","流行対応策"],["contact tracing","接触者追跡"],["vaccine coverage","ワクチン接種率"],["sanitation","衛生状態"],["up to date with","〜が最新の状態である"],["primary course","初回接種コース"],["booster","追加接種"],["documented","記録のある"],["departure","出発"],["unfurl","広がる・展開する"],["border control","国境での検疫・入国管理"]],"past":null},{"n":4,"title":"The effect of healthy lifestyle changes on stroke risk in adults with cardiovascular disease","paras":["The aims of the study are:","Increase awareness and adoption of healthy lifestyle factors for people with cardiovascular risk factors, to prevent cardiovascular morbidity and mortality.","To conduct a feasibility study in the primary care setting to promote the Life's Simple 7 approach, developed by the American Heart Association, for people at risk of stroke.","To implement a 6 month study to confirm the feasibility, and to provide preliminary data on effectiveness of such an approach.","Our overarching hypothesis is that targeted and individualized, long term support will result in significantly reduced rate of, and risk factors for, morbidity and mortality from stroke and other causes, compared to current practice","The 6 month intervention, based on the Life's Simple 7 (LSS) approach, will result in a reduction in stroke risk, measured using the LSS score","We hypothesize that the intervention will be feasible, acceptable for participants and we will also collect cost data to determine if the approach is cost effective."],"q":"What approach will the research team take to try and reduce the frequency and effects of stroke on a person?","opts":["They will provide personalized and specific assistance to people at risk of stroke.","They will give seven simple medications to people at risk of stroke and monitor the effects.","They will have people at risk trying our different treatments to see which is the most cost effective in the long run."],"key":"A","qja":"脳卒中の頻度と影響を減らすために、研究チームはどんなアプローチをとるか？","ja":"【心血管疾患をもつ成人における健康的な生活習慣の変化が脳卒中リスクに及ぼす影響】研究の目的：心血管リスク因子をもつ人に健康的な生活習慣への認識と実践を広め、心血管疾患の罹患・死亡を防ぐ。プライマリケアで、米国心臓協会が開発した『Life's Simple 7』アプローチを脳卒中リスクのある人に広める実現可能性研究を行う。6か月の研究で実現可能性を確認し、有効性の予備データを得る。全体の仮説は、的を絞った個別的・長期的な支援により、現行の診療と比べて脳卒中などによる罹患・死亡の率とリスク因子が有意に減るというものである。Life's Simple 7に基づく6か月の介入は、LSSスコアで測定した脳卒中リスクを低下させる。介入は実現可能で参加者に受け入れられると仮定し、費用対効果を判断するため費用データも収集する。","o":[["脳卒中リスクのある人に個別的で具体的な支援を提供する","✅ targeted and individualized, long term support の言い換え（personalized＝individualized, specific＝targeted）。"],["脳卒中リスクのある人に7種類の簡単な薬を投与し効果を観察する","❌ Life's Simple 7 は生活習慣の7項目で、薬ではない。数字7を使った罠。"],["リスクのある人に様々な治療を試してもらい、長期的に最も費用対効果の高いものを探す","❌ 費用データは集めるが、複数の治療を比較する研究ではない。"]],"exp":"Bは固有名詞（Life's Simple 7）を内容として誤読させる典型。タイトルに lifestyle changes とあるので薬ではないと分かる。","pt":"→ 型：固有名詞・プログラム名に含まれる数字や単語を、内容と混同しない。タイトルで方向を確認。","doubt":null,"voc":[["adoption","取り入れること"],["morbidity and mortality","罹患率と死亡率"],["feasibility study","実現可能性の検討"],["primary care setting","プライマリケアの現場"],["implement","実施する"],["preliminary data","予備的なデータ"],["overarching hypothesis","全体を貫く仮説"],["targeted","的を絞った"],["individualized","個別化された"],["cost effective","費用対効果の高い"]],"past":null},{"n":5,"title":"Superbug strains resistant to all known antibiotics discovered by Melbourne researchers","paras":["A new superbug that is resistant to all known antibiotics has been discovered by Australian scientists, prompting renewed calls for hospitals to do more to prevent the rise of untreatable infections. The completely resistant strains were found in Europe. \"Often it just colonizes the skin,\" Doherty Institute researcher Ben Howden, who was involved in the discovery, said. \"It doesn't necessarily lead to infection. But in a smaller number of people it can lead to a serious, invasive infection requiring complex treatment.\" Antibiotic resistance is a major and growing global health threat. These recent examples show how dangerous it can be.","The superbug was particularly threatening to those in hospital with a weakened immune system, recovering from surgery or who had implanted medical devices. Researchers identified the superbug after studying examples from 78 institutions in 10 countries around the world, including Victorian hospitals. The inappropriate prescription of antibiotics is a contributing factor to the rise of superbugs. One in four antimicrobial drugs were inappropriately prescribed in Australian hospitals and half the prescriptions given in nursing homes were inappropriate, according to recent research by the Australian Government."],"q":"According to this article, how often are antimicrobial drugs inappropriately prescribed in Australian nursing homes?","opts":["10% of the time","25% of the time","50% of the time"],"key":"C","qja":"この記事によれば、豪州の介護施設で抗菌薬はどれくらいの頻度で不適切に処方されているか？","ja":"【既知の全抗生物質に耐性のスーパーバグ、メルボルンの研究者が発見】既知のすべての抗生物質に耐性をもつ新たなスーパーバグが豪州の科学者によって発見され、治療不能な感染症の増加を防ぐため病院にさらなる対策を求める声が再び高まっている。完全耐性株は欧州で見つかった。発見に関わったドハティ研究所のベン・ハウデン氏は「多くは皮膚に定着するだけで、必ずしも感染症にはならない。しかし少数の人では、複雑な治療を要する重篤な侵襲性感染を起こしうる」と述べた。抗生物質耐性は大きく拡大しつつある世界的な健康上の脅威であり、最近の事例はその危険性を示している。このスーパーバグは、免疫が低下した入院患者、術後の回復期にある人、医療機器を埋め込んだ人に特に脅威となる。研究者らは、豪ビクトリア州の病院を含む10か国78施設の検体を調べて特定した。抗生物質の不適切な処方はスーパーバグ増加の一因である。豪政府の最近の調査によれば、豪州の病院では抗菌薬の4件に1件が不適切に処方され、介護施設では処方の半数が不適切だった。","o":[["10%","❌ 本文に出てこない数字。"],["25%","❌ One in four（25%）は『病院』の数字。"],["50%","✅ half the prescriptions given in nursing homes were inappropriate。"]],"exp":"1文の中に病院（4件に1件）と介護施設（半数）の2つの数字が並ぶ。設問の場所（nursing homes）で絞る。","pt":"→ 型：1文に数字が2つあれば、設問の条件（場所・集団）でどちらかを選ぶ。もう一方は必ず誤答に使われる。","doubt":null,"voc":[["superbug","多剤耐性菌（スーパーバグ）"],["strain","菌株"],["resistant to","〜に耐性のある"],["prompt","引き起こす・促す"],["untreatable","治療できない"],["colonize","定着する"],["invasive infection","侵襲性感染症"],["threat","脅威"],["implanted medical device","体内に埋め込んだ医療機器"],["inappropriate prescription","不適切な処方"],["contributing factor","一因"],["antimicrobial","抗菌薬（の）"]],"past":null},{"n":6,"title":"Testing for Human papilloma virus","paras":["Cervical cancer is one of the most preventable and curable cancers. Cells in the cervix show changes or 'abnormalities' before any progression to cancer, which takes around 15 years. Most low-grade abnormalities regress without treatment. High-grade abnormalities may occur after persistent infection with human papilloma virus (HPV), which is a sexually transmitted infection that generally has no symptoms and resolves within 2 years. In a small number of women, persistent infection with a high-risk type of HPV may eventually lead to cervical cancer (AIHW 2012). HPV 16 and 18 are high-risk types that are detected in 70–80% of cases of cervical cancer in Australia (AIHW 2012). A program of vaccination against HPV types 16 and 18 (as well as types 6 and 11, which have a lower risk of causing cancer but are associated with 90% of genital warts) was introduced in Australia in 2007 (DoHA 2013)."],"q":"The HPV Vaccination programme reduces the incidence of what?","opts":["Sexually transmitted diseases","Genital warts","Herpes"],"key":"B","qja":"HPVワクチン接種プログラムは何の発生を減らすか？","ja":"【ヒトパピローマウイルス（HPV）の検査】子宮頸がんは最も予防・治癒しやすいがんの一つである。子宮頸部の細胞は、がんに進行する前に変化（異常）を示し、進行には約15年かかる。低異型度の異常の多くは治療なしで消退する。高異型度の異常は、HPVの持続感染の後に生じうる。HPVは一般に無症状で2年以内に治まる性感染症である。少数の女性では、高リスク型HPVの持続感染が最終的に子宮頸がんにつながる。HPV16型・18型は高リスク型で、豪州の子宮頸がんの70〜80%で検出される。HPV16・18型（およびがん化リスクは低いが性器いぼの90%に関係する6・11型）に対するワクチン接種プログラムが2007年に豪州で導入された。","o":[["性感染症（全般）","❌ HPV自体は性感染症だが、ワクチンは特定の型のHPVに対するもので、性感染症全般を減らすとは書いていない。"],["性器いぼ","✅ ワクチンの対象の6・11型は associated with 90% of genital warts。対象型を防げばいぼが減る。"],["ヘルペス","❌ 本文に出てこない。"]],"exp":"本来の最大の目的は子宮頸がんだが、選択肢にない。選択肢の中で本文から導けるのは性器いぼだけ。括弧内の補足情報が正解の根拠になっている。","pt":"→ 型：括弧（ ）内の補足は Part B でよく出題される。読み飛ばさない。","doubt":null,"voc":[["cervical cancer","子宮頸がん"],["cervix","子宮頸部"],["abnormality","異常"],["progression","進行"],["low-grade","低異型度の"],["regress","自然に退縮する"],["persistent infection","持続感染"],["sexually transmitted infection","性感染症"],["resolve","自然に治まる"],["genital warts","性器いぼ（尖圭コンジローマ）"]],"past":null}],"C":[{"n":7,"t":0,"p":0,"q":"Which of the following is not attributed to the lack of socialization?","opts":["Evolved bodies","Premature death","Risk of heart disease","Risk of neurodegenerative diseases"],"key":"A","ev":"You might expect that our bodies would have evolved in such a way as to promote social interaction","note":"NOT。『進化した体』は社会的交流を促す方向の話で、孤独のせいとされるもの（早死・心疾患・神経変性疾患）ではない（A）。","doubt":null,"alt":[],"voc":[["band together","力を合わせる・群れる"],["accomplish","成し遂げる"],["promote","促す"],["outside the pack","群れの外にいる"],["prematurely","早すぎる時期に"],["chronically","慢性的に"],["wind up with","結局〜を抱えることになる"],["metastatic","転移性の"],["neurodegenerative","神経変性の"],["attributed to","〜に起因するとされる"]],"oja":["進化した体","早すぎる死","心疾患のリスク","神経変性疾患のリスク"],"past":null},{"n":8,"t":0,"p":1,"q":"What aspect does Professor Steve Cole consider when he investigates the consequences of loneliness?","opts":["Psychological","B
