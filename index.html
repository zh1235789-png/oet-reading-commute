the plausibility of the results."],"key":"D","ev":"\"Something occurs and it's repaired and it's better going forward… very plausibly for more than six months,\"","note":"公式キーD。Bは painstaking（骨の折れる）を手術に付けているが、本文で painstaking なのは従来の精神医学。","doubt":null,"alt":[],"voc":[["regulator","規制当局"],["meticulous","綿密な"],["optimistic","楽観的な"],["likening it to","それを〜になぞらえて"],["painstaking","骨の折れる"],["plausibly","もっともらしく・十分あり得る形で"],["skeptical","懐疑的な"],["convinced","確信した"]],"past":null},{"n":19,"t":1,"p":4,"q":"Which of the following is true about Sherry Marcy's experience with the treatment?","opts":["She felt like being on a cloud.","She stopped being depressed.","She managed to battle cancer temporarily.","She managed to walk."],"key":"B","ev":"\"The cloud of doom seemed to just lift…","note":"破滅の雲が晴れた＝うつが消えた（B）。Aは cloud を字義どおりに取らせる罠。","doubt":null,"alt":[],"voc":[["cloud of doom","暗く重い絶望感"],["lift","（気分・霧が）晴れる"],["got back in touch with","〜とのつながりを取り戻した"],["wonder at life","生きることへの驚きと喜び"],["battle cancer","がんと闘う"],["persist","続く"]],"past":null},{"n":20,"t":1,"p":5,"q":"How were the patients chosen to receive either psilocybin or a placebo?","opts":["First, 83% of the patients received psilocybin, then a placebo.","First, 83% of the patients received placebo, then a psilocybin.","The patients were selected according to plan, but by chance.","All the patients were first given psilocybin, and then a placebo."],"key":"C","ev":"randomly offering patients either psilocybin or a placebo at the first session","note":"計画に沿って、ただし割付は無作為（C）。83%は結果の数字で割付ではない。","doubt":null,"alt":[],"voc":[["particulars","詳細"],["randomly","無作為に"],["placebo","プラセボ（偽薬）"],["the opposite treatment","もう一方の治療"],["eventually","最終的に"],["success rate","奏効率・成功率"],["by chance","偶然に・無作為に"]],"past":null},{"n":21,"t":1,"p":6,"q":"Which of the following is not true about psilocybin?","opts":["It's not allowed to be used in the USA.","It's not suitable for those suffering from schizophrenia.","It must be used with caution by the patients.","The dose and provision must be provided by a specialist in the area."],"key":"C","ev":"the scientists warn against self-medicating depression","note":"NOT true。患者自身が注意して使うのではなく、専門家が用量と環境を管理すべき（C）。","doubt":null,"alt":[],"voc":[["banned","禁止された"],["warn against","〜しないよう警告する"],["self-medicate","自己判断で薬を使う"],["caution","注意を促す"],["dosage","投与量"],["supportive environment","支えとなる環境"],["appropriate for","〜に適した"],["provision","提供・支給"]],"past":"A"},{"n":22,"t":1,"p":7,"q":"What does the author imply with the phrase \"a need to loosen research restrictions\"?","opts":["That it is necessary to make the rules surrounding research less strict.","That it is necessary to create a better atmosphere for father research.","That it is necessary to invite more doctors to take part in the research.","That it is necessary to spread the results of the research across several centers."],"key":"A","ev":"\"a need to loosen research restrictions\"","note":"loosen restrictions＝規制を緩める（A）。","doubt":null,"alt":[],"voc":[["move forward","前進する"],["loosen","緩める"],["restriction","規制・制限"],["insight","知見"],["clinical application","臨床への応用"],["ideally","理想を言えば"],["sample","標本・対象者数"],["subject","被験者"]],"past":null}]},{"id":"06","texts":[{"title":"","paras":["One of humankind's great advantages has been that we band together to accomplish more than we can on our own. You might expect that our bodies would have evolved in such a way as to promote social interaction, and you'd be right. Studies are revealing that those outside the pack — the lonely — are 25% more likely to die prematurely, according to writer Veronique de Turenne. The chronically lonely wind up with more heart disease, more metastatic cancer, and with higher risks of stroke and neurodegenerative diseases like Alzheimer's.","Lately scientists have been learning about the biological ramifications of loneliness. Steve Cole is a professor of medicine, psychiatry and biobehavioral sciences at the David Geffen School of Medicine at UCLA, and director of the UCLA Social Genomics Core Laboratory. He's been working on this at the molecular level since the early 2000s, aided by data from the Human Genome Project. His interest had been triggered by a report on the survival rates of gay men with HIV. It appeared that closeted men died much more quickly than those who had come out. The main discernible difference between the groups was that closeted subjects were more worried about ostracization and rejection.","John Caccioppo of the Center for Cognitive and Social Neuroscience at the University of Chicago, is an expert on the physical effects of social disconnection on cellular mechanisms with a book called Loneliness: Human Nature and the Need for Social Connection. He and Cole teamed up for a study of how gene expression varied between people who were lonely and those who weren't. According to Cole, \"We found the key antiviral response driven by so-called Type 1 interferon molecules was deeply suppressed in the lonely people relative to the non-lonely people.\"","In addition — and ominously — Cole and Caccioppo also found \"… that there was another block of genes that was not suppressed — in fact, it was greatly activated — and this block of genes was involved in inflammation.\" Inflammation can be the engine underlying atherosclerosis, Alzheimer's, and cancer.","Are people isolated socially being further undermined by their own biology? There are two plausible evolutionary explanations. Cole says, \"The best theory is that this pattern of altered immunology is a kind of defensive reaction mounted by your body if it thinks you are going to be wounded in the near-future,\" with no one there to protect or help you. Another theory is that if you feel bad, you may be more inclined to seek out others for help. With this notion, the emotional pain of loneliness acts much like a physical pain that tells you something is wrong that needs to be addressed. In any event, both ideas may have made more sense historically than they do now, and the number of people describing themselves as lonely is growing quickly — Cole refers to it as an \"epidemic.\"","Part of it is the aging baby boomers who've seen their children grow up and move out, and whose friends are dying more frequently due to age. Another factor may be the way \"our culture is changing in ways that invite us — in fact, almost require us — to be more lonely and disenfranchised,\" according to Cole. Among those is our migration to online relationships that just aren't individually as powerful due to the lack of personal contact. We text, we don't call, and our families tend to be far-flung, no longer residing in physical communities together."]},{"title":"","paras":["In 1998, Andy Clark and David Chalmers announced that computers can operate together with our brains as an \"extended mind\" potentially offering additional processing capabilities as we work out problems, as well as an annex for our memories containing information, images, and so on. Now a professor of biomedical engineering at the University of Southern California, Theodore Berger, is working to bring to market human memory enhancement in the form of a prosthetic implanted in the brain. He's already testing it attached to humans.","The prosthetic, which Berger has been working on for ten years, can function as an artificial hippocampus, the area in the brain associated with memory and spatial navigation. The plan is for the device to convert short-term memory into long-term memory and potentially store it as the hippocampus does. His research has been encouraging so far.","Berger began by teaching a rabbit to associate an audio tone with a puff of air administered to the rabbit's face, causing it to blink. Electrodes attached to the rabbit allowed Berger to observe patterns of activity firing off in the rabbit's hippocampus. Berger refers to these patterns as a \"space-time code\" representing where the neurons are in the rabbit's brain at a specific moment. Berger watched them evolving as the rabbit learned to associate the tone and puff of air. He told Wired, \"As the space-time code propagates into the different layers of the hippocampus, it's gradually changed into a different space-time code.\" Eventually, the tone alone was enough for the hippocampus to produce a recallable space-time code based on the latest incoming version to make the rabbit blink.","The manner in which the hippocampus was processing the rabbit's memory and producing a recallable space-time code became predictable enough to Berger that he was able to develop a mathematical model representing the process.Berger then built an artificial rat hippocampus—his experimental prosthesis—to test his observations and model. By training rats to press a lever with electrodes monitoring their hippocampuses, Berger was able to acquire the corresponding space-time codes. Running that code through his mathematical model and sending it back to the rats' brains, his system was validated as the rats successfully pressed their levers. \"They recall the correct code as if they've created it themselves. Now we're putting the memory back into the brain,\" Berger reports.","It's maybe this last statement that's so intriguing. Does the brain have some kind of master memory index? Has it somehow integrated the artificial hippocampus's memories into the rats' directory? Will it also happen in humans?","Dustin Tyler, a professor of engineering at Case Western Reserve University, cautioned Wired \"All of these prosthetics interfacing with the brain have one fundamental challenge. There are billions of neurons in the brain and trillions of connections between them that make them all work together. Trying to find technology that will go into that mass of neurons and be able to connect with them on a reasonably high-resolution level is tricky.","Still, Berger himself is optimistic, telling IEEE Spectrum, \"We're testing it in humans now, and getting good initial results. We're going to go forward with the goal of commercializing this prosthesis.","What he envisions bringing to market based on his research is a brain prosthetic for people with memory problems. The tiny device would be implanted in the patient's own hippocampus from where it would stimulate the neurons responsible for turning short-term memories into long-term memories. He hopes it can help patients suffering from Alzheimer's, other forms of dementia, stroke victims and people whose brains have been injured.","Rats and monkeys—the prosthetic improved the memories of rhesus monkeys attached to their prefrontal cortex—are one thing. The greater number of neurons in human brains is a big issue that needs to be grappled before Berger's implant will work well for humans: It's difficult to gain a comprehensive view of what's going on with larger brains due to their greater number of neurons. (Rat brains have about 200 million neurons; humans have 86 billion.) Berger warns, \"Our information will be biased based on the neurons we're able to record from,\" and he looks forward to tools that can capture broader swaths of data going forward. It's anticipated that they'll need to pack a greater number of electrodes into prostheses."]}],"B":[{"n":1,"title":"The shocking abuse in our nursing homes","paras":["According to the most recent 2011-2012 Report On the Operation of the Aged Care Act 1997, there are 187,941 people living in 2725 residential aged care facilities across Australia.","There are many cases—too many—where deaths in nursing homes are hastened by the poor standard of care. In recent years, there have been instances of residents starved, burnt, drowned or even strangled while in care. Part of the problem is the lack of supervision of the residents by caring, capable staff. It stands to reason that a patient could not have fallen into the water fountain at her nursing home if she had been properly supervised. Likewise, it would be more difficult for evil people to prey upon residents if there were plenty of staff on hand, keeping an eye on things. Lynda Saltarelli, of the community-based Aged Care Crisis team, says many people are amazed, when embarking on the frustrating process of trying to find a nursing home bed, to discover there is no mandatory staff-to-resident ratio. All that is required under the Aged Care Act 1997 is that each centre provides what is known as an \"adequate number of appropriately skilled staff\" or \"sufficient\" staff for the number of residents."],"q":"Abuse in nursing homes has several causes but what issue does this article concentrate on?","opts":["Too many people are living in nursing homes rather than staying in their own homes.","Insufficient experienced and considerate staff and no compulsory staffing level requirements.","Too many hazards that allow the residents to be injured, such as water features and heaters."],"key":"B","qja":"介護施設での虐待には複数の原因があるが、この記事が焦点を当てている問題は何か？","ja":"【介護施設における衝撃的な虐待】最新の2011-2012年版『高齢者介護法1997運用報告』によれば、豪州全土の2725の入所型介護施設に187,941人が暮らしている。介護の質の低さによって施設での死が早まる事例は多い——多すぎる。近年、入居者が飢えさせられ、やけどを負い、溺れ、さらには首を絞められた事例もある。問題の一端は、思いやりと能力のあるスタッフによる入居者の見守り不足にある。きちんと見守られていれば、ある入居者が施設の噴水に落ちることはなかったはずだ。同様に、十分なスタッフが目を配っていれば、悪意ある人が入居者を食い物にするのも難しくなる。地域団体Aged Care Crisisのリンダ・サルタレリ氏によれば、施設のベッドを探すという苛立たしい過程で、職員対入居者の義務的な比率が存在しないと知って驚く人が多いという。高齢者介護法1997が求めているのは、各施設が『適切な技能をもつ職員を十分な数』あるいは入居者数に対し『十分な』職員を配置することだけである。","o":[["自宅にとどまらず介護施設で暮らす人が多すぎる","❌ 入居者数は背景情報で、問題として論じていない。"],["経験と思いやりのある職員の不足と、職員配置基準の義務がないこと","✅ lack of supervision … by caring, capable staff ＋ there is no mandatory staff-to-resident ratio の2点。"],["噴水やヒーターなど入居者がけがをする危険が多すぎる","❌ 噴水は『見守っていれば防げた』例として出るだけ。ヒーターは本文にない。"]],"exp":"Part of the problem is … 以降が筆者の焦点。前半の具体例（飢え・やけど・溺水）は問題の『結果』で、焦点は原因（人員不足・基準なし）。","pt":"→ 型：concentrate on / focus 型の設問は『problem is …』『the issue is …』の文を探す。具体例は主旨ではない。","doubt":null,"voc":[["residential aged care facility","入所型高齢者介護施設"],["hasten","早める"],["starved","飢えさせられた"],["strangled","絞められた"],["supervision","見守り・監督"],["it stands to reason","当然のことだ"],["prey upon","食い物にする"],["on hand","その場にいる"],["embark on","（過程に）乗り出す"],["mandatory","義務の"],["staff-to-resident ratio","職員対入居者比"],["adequate","十分な"],["compulsory","義務的な"]],"past":null},{"n":2,"title":"The need to increase indigenous nursing population","paras":["The Congress of Aboriginal and Torres Strait Islander Nurses (CATSIN) was founded in 1997 with the express intention of increasing the representation of indigenous people in the nursing profession. Chaired by Sally Goold, CATSIN challenges the western model of health care and seeks to ensure nursing education in indigenous health settings is culturally appropriate, as well as facilitating indigenous students into nursing. Looking at the broad picture, Alice Springs Hospital nursing director Professor Ged Williams says it is pointless to talk about getting indigenous people into nursing until something is done to address the education of indigenous students in schools. \"There aren't too many Aboriginal nurses in Australia because Aboriginal education is appalling,\" Professor Williams said. He argues it is important to begin by getting a critical mass of Aboriginal people into the health sector in jobs such as ward clerks, cleaners, or patient carers where they can support each other. \"Once we have a large critical mass in the system, then we can hope that this will form a pool of potential employees to go on and do other health work like nursing,\" Professor Williams said. But Professor Williams adds it is crucial to ensure that early education is meeting the needs of indigenous people, and keeping them in the system."],"q":"What two ideas are there about education that could increase the number of nurses from the Aboriginal and Torres Strait Islander populations?","opts":["There need to be apprenticeships for indigenous people to work in different healthcare settings and nursing needs to give extra educational support to Aborigine and Torres Strait islander nursing students.","There need to be special pathways into nursing education for indigenous people and more Aborigine and Torres Strait Islanders working in early education","Nurse education around the health of Aborigines and Torres Strait Islanders needs to be culturally appropriate and early education is needed to increase the educational achievement of indigenous people."],"key":"C","qja":"アボリジニ・トレス海峡諸島民の看護師を増やしうる、教育に関する2つの考えは何か？","ja":"【先住民の看護師を増やす必要性】アボリジニ・トレス海峡諸島民看護師会（CATSIN）は、看護職における先住民の割合を高めることを明確な目的として1997年に設立された。サリー・グールド氏が議長を務めるCATSINは、西洋型医療モデルに異を唱え、先住民の保健医療の場での看護教育が文化的に適切であるよう求めるとともに、先住民の学生が看護の道に進むのを支援している。大局的に見て、アリススプリングス病院の看護部長ゲド・ウィリアムズ教授は、学校での先住民の教育に手を打たない限り、先住民を看護職に就かせる話をしても無意味だと言う。「豪州にアボリジニの看護師が少ないのは、アボリジニの教育がひどいからだ」。まずは病棟クラーク、清掃員、介助者などの職で医療分野に先住民の『臨界量』を確保し、互いに支え合えるようにすることが重要だと主張する。「システム内に十分な人数がいれば、看護など他の医療職に進む人材の母集団になると期待できる」。ただし同教授は、初期教育が先住民のニーズを満たし、彼らを教育システムにとどめることが極めて重要だと付け加える。","o":[["先住民が様々な医療現場で働く徒弟制度が必要で、看護分野は先住民の看護学生に追加の教育支援をすべきだ","❌ apprenticeships（徒弟制度）も『追加の教育支援』も本文にない。病棟クラーク等の職は『雇用』の話で教育ではない。"],["先住民のための看護教育への特別な入口と、幼児教育で働く先住民を増やすこと","❌ 『幼児教育で働く先住民』ではなく『先住民への初期教育の充実』。主語と目的語のすり替え。"],["先住民の健康に関する看護教育を文化的に適切なものにし、先住民の学力向上のために初期教育が必要","✅ CATSIN：nursing education … culturally appropriate ＋ Williams：early education is meeting the needs of indigenous people。"]],"exp":"2人の主張者（CATSINとWilliams教授）から1つずつ『教育』に関する考えを拾う設問。Bの early education は本文語だが、『そこで働く』にずらしている。","pt":"→ 型：複数の人物が出る本文で『2つの考え』を問われたら、人物ごとに1つずつ対応させる。","doubt":null,"voc":[["indigenous","先住の"],["express intention","明確な意図"],["representation","（集団の）割合・代表されていること"],["chaired by","〜が議長を務める"],["culturally appropriate","文化的に適切な"],["facilitate","後押しする・促進する"],["pointless","無意味な"],["address","対処する"],["appalling","ひどい・目を覆うような"],["critical mass","十分な人数・臨界量"],["ward clerk","病棟クラーク"],["apprenticeship","徒弟制度・実習制度"]],"past":null},{"n":3,"title":"Memo re: Outbreak of circulating vaccine-derived poliovirus in Papua New Guinea","paras":["The Government of Papua New Guinea is working with partners, including WHO and UNICEF, to take appropriate outbreak response measures including contact tracing, testing and vaccination. Polio is very unlikely to spread in Australia because of high rates of vaccine coverage, good sanitation, and the quality and ability of the health system to respond to cases.","Australian residents planning to visit PNG for less than 4 weeks should be up to date with their polio vaccination. For adults, this is a 3 dose primary course, with a booster within the last 10 years. For children, a 3 dose primary course with a booster at 4 years old is currently recommended. These recommended vaccines may be given before arrival in PNG.","Australian residents travelling to PNG intending to stay for longer than 4 weeks should have a documented polio booster within 4 weeks to 12 months prior to the date of departure from PNG. The booster may be given before arrival in PNG, as long as it is given within 4 weeks to 12 months prior to leaving PNG."],"q":"This memo outlines the advice for people traveling to PNG about polio boosters and vaccines. What is the risk of a polio outbreak unfurling in Australia?","opts":["The risk is low because Australia has good border control measures in place.","The risk is high because the population is widespread.","The risk is low because Australia has the means to manage cases of polio."],"key":"C","qja":"このメモはPNG渡航者へのポリオ追加接種・ワクチンの助言をまとめたものである。豪州でポリオが流行するリスクはどうか？","ja":"【メモ：パプアニューギニアにおけるワクチン由来ポリオウイルス流行について】PNG政府はWHOやユニセフなどと協力し、接触者追跡、検査、ワクチン接種を含む適切な流行対策を講じている。豪州ではワクチン接種率の高さ、衛生状態の良さ、症例に対応する医療制度の質と能力により、ポリオが広がる可能性は非常に低い。PNGに4週間未満滞在予定の豪州居住者は、ポリオワクチンを最新の状態にしておくこと。成人は3回の初回接種＋過去10年以内の追加接種、小児は3回の初回接種＋4歳での追加接種が現在推奨されている。これらはPNG到着前に接種してよい。4週間以上滞在予定の豪州居住者は、PNG出国日の4週間〜12か月前に記録のあるポリオ追加接種を受けておくこと。PNG到着前の接種でもよいが、出国前4週間〜12か月の範囲に入っている必要がある。","o":[["豪州には優れた国境管理策があるのでリスクは低い","❌ 国境管理は本文にない。理由は接種率・衛生・医療制度。"],["人口が分散しているのでリスクは高い","❌ リスクは very unlikely（非常に低い）。"],["豪州には症例に対応する手段があるのでリスクは低い","✅ the quality and ability of the health system to respond to cases の言い換え（means to manage cases）。"]],"exp":"リスクの高低（低い）でBが消え、理由の照合でAが消える。2段階で判定する設問。","pt":"→ 型：『結論＋理由』の選択肢は、結論が合っていても理由まで本文と一致するか確認する。","doubt":null,"voc":[["outbreak response measures","流行対応策"],["contact tracing","接触者追跡"],["vaccine coverage","ワクチン接種率"],["sanitation","衛生状態"],["up to date with","〜が最新の状態である"],["primary course","初回接種コース"],["booster","追加接種"],["documented","記録のある"],["departure","出発"],["unfurl","広がる・展開する"],["border control","国境での検疫・入国管理"]],"past":null},{"n":4,"title":"The effect of healthy lifestyle changes on stroke risk in adults with cardiovascular disease","paras":["The aims of the study are:","Increase awareness and adoption of healthy lifestyle factors for people with cardiovascular risk factors, to prevent cardiovascular morbidity and mortality.","To conduct a feasibility study in the primary care setting to promote the Life's Simple 7 approach, developed by the American Heart Association, for people at risk of stroke.","To implement a 6 month study to confirm the feasibility, and to provide preliminary data on effectiveness of such an approach.","Our overarching hypothesis is that targeted and individualized, long term support will result in significantly reduced rate of, and risk factors for, morbidity and mortality from stroke and other causes, compared to current practice","The 6 month intervention, based on the Life's Simple 7 (LSS) approach, will result in a reduction in stroke risk, measured using the LSS score","We hypothesize that the intervention will be feasible, acceptable for participants and we will also collect cost data to determine if the approach is cost effective."],"q":"What approach will the research team take to try and reduce the frequency and effects of stroke on a person?","opts":["They will provide personalized and specific assistance to people at risk of stroke.","They will give seven simple medications to people at risk of stroke and monitor the effects.","They will have people at risk trying our different treatments to see which is the most cost effective in the long run."],"key":"A","qja":"脳卒中の頻度と影響を減らすために、研究チームはどんなアプローチをとるか？","ja":"【心血管疾患をもつ成人における健康的な生活習慣の変化が脳卒中リスクに及ぼす影響】研究の目的：心血管リスク因子をもつ人に健康的な生活習慣への認識と実践を広め、心血管疾患の罹患・死亡を防ぐ。プライマリケアで、米国心臓協会が開発した『Life's Simple 7』アプローチを脳卒中リスクのある人に広める実現可能性研究を行う。6か月の研究で実現可能性を確認し、有効性の予備データを得る。全体の仮説は、的を絞った個別的・長期的な支援により、現行の診療と比べて脳卒中などによる罹患・死亡の率とリスク因子が有意に減るというものである。Life's Simple 7に基づく6か月の介入は、LSSスコアで測定した脳卒中リスクを低下させる。介入は実現可能で参加者に受け入れられると仮定し、費用対効果を判断するため費用データも収集する。","o":[["脳卒中リスクのある人に個別的で具体的な支援を提供する","✅ targeted and individualized, long term support の言い換え（personalized＝individualized, specific＝targeted）。"],["脳卒中リスクのある人に7種類の簡単な薬を投与し効果を観察する","❌ Life's Simple 7 は生活習慣の7項目で、薬ではない。数字7を使った罠。"],["リスクのある人に様々な治療を試してもらい、長期的に最も費用対効果の高いものを探す","❌ 費用データは集めるが、複数の治療を比較する研究ではない。"]],"exp":"Bは固有名詞（Life's Simple 7）を内容として誤読させる典型。タイトルに lifestyle changes とあるので薬ではないと分かる。","pt":"→ 型：固有名詞・プログラム名に含まれる数字や単語を、内容と混同しない。タイトルで方向を確認。","doubt":null,"voc":[["adoption","取り入れること"],["morbidity and mortality","罹患率と死亡率"],["feasibility study","実現可能性の検討"],["primary care setting","プライマリケアの現場"],["implement","実施する"],["preliminary data","予備的なデータ"],["overarching hypothesis","全体を貫く仮説"],["targeted","的を絞った"],["individualized","個別化された"],["cost effective","費用対効果の高い"]],"past":null},{"n":5,"title":"Superbug strains resistant to all known antibiotics discovered by Melbourne researchers","paras":["A new superbug that is resistant to all known antibiotics has been discovered by Australian scientists, prompting renewed calls for hospitals to do more to prevent the rise of untreatable infections. The completely resistant strains were found in Europe. \"Often it just colonizes the skin,\" Doherty Institute researcher Ben Howden, who was involved in the discovery, said. \"It doesn't necessarily lead to infection. But in a smaller number of people it can lead to a serious, invasive infection requiring complex treatment.\" Antibiotic resistance is a major and growing global health threat. These recent examples show how dangerous it can be.","The superbug was particularly threatening to those in hospital with a weakened immune system, recovering from surgery or who had implanted medical devices. Researchers identified the superbug after studying examples from 78 institutions in 10 countries around the world, including Victorian hospitals. The inappropriate prescription of antibiotics is a contributing factor to the rise of superbugs. One in four antimicrobial drugs were inappropriately prescribed in Australian hospitals and half the prescriptions given in nursing homes were inappropriate, according to recent research by the Australian Government."],"q":"According to this article, how often are antimicrobial drugs inappropriately prescribed in Australian nursing homes?","opts":["10% of the time","25% of the time","50% of the time"],"key":"C","qja":"この記事によれば、豪州の介護施設で抗菌薬はどれくらいの頻度で不適切に処方されているか？","ja":"【既知の全抗生物質に耐性のスーパーバグ、メルボルンの研究者が発見】既知のすべての抗生物質に耐性をもつ新たなスーパーバグが豪州の科学者によって発見され、治療不能な感染症の増加を防ぐため病院にさらなる対策を求める声が再び高まっている。完全耐性株は欧州で見つかった。発見に関わったドハティ研究所のベン・ハウデン氏は「多くは皮膚に定着するだけで、必ずしも感染症にはならない。しかし少数の人では、複雑な治療を要する重篤な侵襲性感染を起こしうる」と述べた。抗生物質耐性は大きく拡大しつつある世界的な健康上の脅威であり、最近の事例はその危険性を示している。このスーパーバグは、免疫が低下した入院患者、術後の回復期にある人、医療機器を埋め込んだ人に特に脅威となる。研究者らは、豪ビクトリア州の病院を含む10か国78施設の検体を調べて特定した。抗生物質の不適切な処方はスーパーバグ増加の一因である。豪政府の最近の調査によれば、豪州の病院では抗菌薬の4件に1件が不適切に処方され、介護施設では処方の半数が不適切だった。","o":[["10%","❌ 本文に出てこない数字。"],["25%","❌ One in four（25%）は『病院』の数字。"],["50%","✅ half the prescriptions given in nursing homes were inappropriate。"]],"exp":"1文の中に病院（4件に1件）と介護施設（半数）の2つの数字が並ぶ。設問の場所（nursing homes）で絞る。","pt":"→ 型：1文に数字が2つあれば、設問の条件（場所・集団）でどちらかを選ぶ。もう一方は必ず誤答に使われる。","doubt":null,"voc":[["superbug","多剤耐性菌（スーパーバグ）"],["strain","菌株"],["resistant to","〜に耐性のある"],["prompt","引き起こす・促す"],["untreatable","治療できない"],["colonize","定着する"],["invasive infection","侵襲性感染症"],["threat","脅威"],["implanted medical device","体内に埋め込んだ医療機器"],["inappropriate prescription","不適切な処方"],["contributing factor","一因"],["antimicrobial","抗菌薬（の）"]],"past":null},{"n":6,"title":"Testing for Human papilloma virus","paras":["Cervical cancer is one of the most preventable and curable cancers. Cells in the cervix show changes or 'abnormalities' before any progression to cancer, which takes around 15 years. Most low-grade abnormalities regress without treatment. High-grade abnormalities may occur after persistent infection with human papilloma virus (HPV), which is a sexually transmitted infection that generally has no symptoms and resolves within 2 years. In a small number of women, persistent infection with a high-risk type of HPV may eventually lead to cervical cancer (AIHW 2012). HPV 16 and 18 are high-risk types that are detected in 70–80% of cases of cervical cancer in Australia (AIHW 2012). A program of vaccination against HPV types 16 and 18 (as well as types 6 and 11, which have a lower risk of causing cancer but are associated with 90% of genital warts) was introduced in Australia in 2007 (DoHA 2013)."],"q":"The HPV Vaccination programme reduces the incidence of what?","opts":["Sexually transmitted diseases","Genital warts","Herpes"],"key":"B","qja":"HPVワクチン接種プログラムは何の発生を減らすか？","ja":"【ヒトパピローマウイルス（HPV）の検査】子宮頸がんは最も予防・治癒しやすいがんの一つである。子宮頸部の細胞は、がんに進行する前に変化（異常）を示し、進行には約15年かかる。低異型度の異常の多くは治療なしで消退する。高異型度の異常は、HPVの持続感染の後に生じうる。HPVは一般に無症状で2年以内に治まる性感染症である。少数の女性では、高リスク型HPVの持続感染が最終的に子宮頸がんにつながる。HPV16型・18型は高リスク型で、豪州の子宮頸がんの70〜80%で検出される。HPV16・18型（およびがん化リスクは低いが性器いぼの90%に関係する6・11型）に対するワクチン接種プログラムが2007年に豪州で導入された。","o":[["性感染症（全般）","❌ HPV自体は性感染症だが、ワクチンは特定の型のHPVに対するもので、性感染症全般を減らすとは書いていない。"],["性器いぼ","✅ ワクチンの対象の6・11型は associated with 90% of genital warts。対象型を防げばいぼが減る。"],["ヘルペス","❌ 本文に出てこない。"]],"exp":"本来の最大の目的は子宮頸がんだが、選択肢にない。選択肢の中で本文から導けるのは性器いぼだけ。括弧内の補足情報が正解の根拠になっている。","pt":"→ 型：括弧（ ）内の補足は Part B でよく出題される。読み飛ばさない。","doubt":null,"voc":[["cervical cancer","子宮頸がん"],["cervix","子宮頸部"],["abnormality","異常"],["progression","進行"],["low-grade","低異型度の"],["regress","自然に退縮する"],["persistent infection","持続感染"],["sexually transmitted infection","性感染症"],["resolve","自然に治まる"],["genital warts","性器いぼ（尖圭コンジローマ）"]],"past":null}],"C":[{"n":7,"t":0,"p":0,"q":"Which of the following is not attributed to the lack of socialization?","opts":["Evolved bodies","Premature death","Risk of heart disease","Risk of neurodegenerative diseases"],"key":"A","ev":"You might expect that our bodies would have evolved in such a way as to promote social interaction","note":"NOT。『進化した体』は社会的交流を促す方向の話で、孤独のせいとされるもの（早死・心疾患・神経変性疾患）ではない（A）。","doubt":null,"alt":[],"voc":[["band together","力を合わせる・群れる"],["accomplish","成し遂げる"],["promote","促す"],["outside the pack","群れの外にいる"],["prematurely","早すぎる時期に"],["chronically","慢性的に"],["wind up with","結局〜を抱えることになる"],["metastatic","転移性の"],["neurodegenerative","神経変性の"],["attributed to","〜に起因するとされる"]],"past":null},{"n":8,"t":0,"p":1,"q":"What aspect does Professor Steve Cole consider when he investigates the consequences of loneliness?","opts":["Psychological","Biobehavioural","Molecular","Medical"],"key":"C","ev":"He's been working on this at the molecular level since the early 2000s","note":"molecular level（C）。Biobehavioural は肩書きの学科名の罠。","doubt":null,"alt":[],"voc":[["ramification","（広がる）影響・波及"],["biobehavioral","生物行動学の"],["molecular level","分子レベル"],["aided by","〜に助けられて"],["survival rate","生存率"],["closeted","性的指向を隠している"],["come out","カミングアウトする"],["discernible","識別できる"],["ostracization","排斥・のけ者にされること"],["rejection","拒絶"]],"past":null},{"n":9,"t":0,"p":2,"q":"What did John Caccioppo and Steve Cole work together on?","opts":["Research on the effects of loneliness on a physical and molecular level.","Research on social disconnection.","Research on the variation of gene expression in both lonely and non-lonely people.","Research on the suppression of certain genes in lonely people."],"key":"C","ev":"a study of how gene expression varied between people who were lonely and those who weren't","note":"孤独な人とそうでない人の遺伝子発現の違い（C）。Dは一部（抑制される遺伝子）だけ。","doubt":null,"alt":[],"voc":[["social disconnection","社会的なつながりの断絶"],["cellular mechanism","細胞レベルの仕組み"],["team up","協力 eering","生体医工学"],["bring to market","製品化する"],["memory enhancement","記憶の増強"],["prosthetic","人工（補綴）装置"],["implanted","埋め込まれた"]],"past":null},{"n":16,"t":1,"p":1,"q":"Berger's prosthetic","opts":["has shown unfavorable results.","helps people convert long-term into short-term memory.","has the potential to store memory.","has shown promising results."],"key":"D","ev":"His research has been encouraging so far.","note":"encouraging＝promising（D）。","doubt":"⚠️ Cの『記憶を保存する可能性』も potentially store it とあり本文と矛盾しない。キーは第2段落の結論文を重視してD。","alt":[],"voc":[["artificial hippocampus","人工海馬"],["spatial navigation","空間的な位置把握"],["convert into","〜に変換する"],["short-term memory","短期記憶"],["encouraging","期待の持てる"],["unfavorable","好ましくない"],["promising","有望な"]],"past":null},{"n":17,"t":1,"p":2,"q":"Which of the following is not associated with Berger's experiment?","opts":["Electrodes were attached to the rabbit.","Activity of the rabbit's hippocampus could be observed.","The rabbit learned to associate an audio tone with a puff of air.","In the end, the rabbit produced the desired reaction based on the puff of air."],"key":"D","ev":"Eventually, the tone alone was enough for the hippocampus to produce a recallable space-time code","note":"NOT。最終的に反応を起こしたのは『音だけ』で、空気の吹き付けではない（D）。","doubt":null,"alt":[],"voc":[["associate an audio tone with","音の合図を〜と結びつける"],["audio tone","音の合図"],["a puff of air","ひと吹きの空気"],["blink","まばたきする"],["electrode","電極"],["firing off","発火する（神経が）"],["propagate","伝わっていく"],["recallable","思い出せる・取り出せる"],["desired reaction","狙いどおりの反応"]],"past":null},{"n":18,"t":1,"p":3,"q":"What was the outcome of Berger's experiment?","opts":["He managed to transfer other rats' information from the prosthesis to the rat's brain and they interpreted it as their own memory.","He managed to transfer information from the artificial rat prosthesis to the rat's brain and they interpreted it as their own memory.","He managed to transfer human information from the prosthesis to the rat's brain and they interpreted it as their own memory.","He managed to transfer other rats' information from the prosthesis to the rat's brain and they acquired it as their own memory."],"key":"B","ev":"They recall the correct code as if they've created it themselves.","note":"人工海馬から戻したコードを自分の記憶として扱った（B）。A・Dは『他のラットの情報』にすり替え。","doubt":null,"alt":[],"voc":[["the manner in which","〜のやり方"],["predictable","予測できる"],["mathematical model","数理モデル"],["prosthesis","人工器官"],["lever","レバー"],["corresponding","対応する"],["validated","妥当性が確認された"],["as if","まるで〜のように"]],"past":null},{"n":19,"t":1,"p":5,"q":"How does Dustin Tyler feel about the whole project?","opts":["Enthusiastic","Skeptical","Optimistic","Pessimistic"],"key":"B","ev":"Dustin Tyler, a professor of engineering at Case Western Reserve University, cautioned Wired","note":"cautioned（注意を促した）＝懐疑的（B）。Pessimistic（D）は強すぎる。","doubt":null,"alt":[],"voc":[["caution","警告する・慎重に述べる"],["interface with","〜と接続する"],["fundamental challenge","根本的な難題"],["trillions","何兆もの"],["high-resolution","高解像度の"],["enthusiastic","熱狂的な"],["skeptical","懐疑的な"],["pessimistic","悲観的な"]],"past":null},{"n":20,"t":1,"p":5,"q":"What could pose a problem when the prosthetics interface with the brain?","opts":["The complexity of the neural connections in the brain.","The existence of numerous masses of neurons.","Working out the way the neurons work together.","Lack of technology that would function on the neural level."],"key":"A","ev":"There are billions of neurons in the brain and trillions of connections between them","note":"膨大な神経と結合の複雑さ（A）。","doubt":null,"alt":[],"voc":[["billions","何十億もの"],["mass of neurons","神経細胞の集まり"],["complexity","複雑さ"],["numerous","多数の"],["work out","解明する"]],"past":null},{"n":21,"t":1,"p":7,"q":"Who does Berger envisage would benefit most from this prosthetic?","opts":["Alzheimer's patients","People with memory problems","People with dementia","People who have had strokes"],"key":"B","ev":"a brain prosthetic for people with memory problems","note":"記憶障害のある人全般（B）。A・C・Dはその具体例の一部。","doubt":null,"alt":[],"voc":[["envision","思い描く"],["stimulate","刺激する"],["responsible for","〜を担う"],["dementia","認知症"],["stroke victim","脳卒中を起こした人"],["envisage","想定する"]],"past":null},{"n":22,"t":1,"p":8,"q":"How are human's brains different from those of rats and monkeys?","opts":["They are not yet adapted to accept the prosthetic.","They are far more comprehensive.","They contain a greater number of neurons.","They are able to process different amounts of data."],"key":"C","ev":"Rat brains have about 200 million neurons; humans have 86 billion.","note":"ニューロン数が桁違いに多い（C）。","doubt":null,"alt":[],"voc":[["rhesus monkey","アカゲザル"],["prefrontal cortex","前頭前皮質"],["grapple","取り組む・立ち向かう"],["comprehensive view","全体像"],["biased","偏った"],["broader swaths of data","より広い範囲のデータ"],["anticipated","見込まれる"],["pack into","詰め込む"]],"past":null}]},{"id":"07","texts":[{"title":"","paras":["In an aging world the rampant destruction of families and emotions due to Alzheimer's disease is increasing. Around the planet forty-seven million people are living with the disease at an annual cost of $236 billion (when other forms of dementia are factored in). The estimated 5.4 million Americans suffering from this disease require 18.1 billion hours of unpaid care each year—an especially daunting reality during a time when Medicare and Social Security are under attack, as many other costs exist. By 2050 Alzheimer's treatment and care is expected to top $1 trillion, bumping Medicare costs up by 360 percent.","Eli Lilly's recent attempt at a cure has set the company back hundreds of millions of dollars and may result in thousands of layoffs. High hopes for its drug, solanezumab, were quashed after a recent failed late-stage clinical trial; the company's stock has fallen 11.6 percent in the last two weeks.","Solanezumab targeted beta amyloid deposits in the brain. For the last twenty-five years researchers have speculated that deposits of the amyloid-peptide \"initiates a sequence of events that ultimately lead to AD dementia.\" Thus far companies like Eli Lilly and Biogen have failed to produce potential remedies using this hypothesis. This has not stopped research, however. Earlier this week neuroscience professor Li-Huei Tsai, who is also the director of MIT's Picower Institute for Learning and Memory, announced the results of a potentially game-changing early-stage trial.","In a forthcoming Nature article Tsai and her co-authors report LED lights flickering at a frequency that stimulates gamma oscillations at 40 hertz substantially reduces beta amyloid plaques in mice. Targeting the brain's hippocampus, a critical region in memory formation and retention, researchers temporarily suppressed these proteins. As with all such trials the researchers remain cautiously hopeful. Tsai says, \"It's a big 'if,' because so many things have been shown to work in mice, only to fail in humans. But if humans behave similarly to mice in response to this treatment, I would say the potential is just enormous, because it's so noninvasive, and it's so accessible.\"","Forty hertz is the typical gamma oscillation in human brains; these waves range from twenty-five to a hundred hertz. (Trials in Tsai's lab at other levels were not effective.) Since 2009 researchers have been able to induce gamma waves in mice using optogenetics, a technique first dreamed up by Francis Crick in the late nineties that utilizes light in order to influence cellular activity in living tissues. It is now considered a breakthrough method for changing neuronal behavioral patterns.","Tsai and her team found that an hour of stimulation at forty hertz resulted in a 40-50 percent reduction in plaques while enhancing gamma oscillations. The proteins returned to their original levels within a day, leaving researchers to wonder if longer courses of treatment will more effectively, or even permanently, reduce protein growth. While the rush for a cure continues, preventive measures are becoming increasingly important. Meditation has been shown to influence gamma activity, while listening to binaural beats might yield positive results.","Movement is among the most important facets of memory control and retention. One of exercise's main benefits is neurogenesis, which includes the production of IGF-1 and BDNF, proteins that are protective against dementia. Keeping active significantly increases your brain's hippocampal volume, resulting in improved memory. One of our age's most damaging effects is the outsourcing of memory that instant access to technology offers. Studies have shown using GPS reduces hippocampal volume; checking the internet for every question instead of thinking through ideas and seeking alternate means is another memory-draining habit that has become commonplace.","Perhaps most interestingly is the importance of cognitive variety, flexibility, and cultivating an ability to consider opposing beliefs. As with bones, our brains operate best when met with resistance. Social interactions and daydreaming are essential for memory retention as well. Engaging in creative pursuits and flow states are ways to strengthen your memory system, as are learning new languages and instruments—basically, anything that challenges your current skill set."]},{"title":"","paras":["There is an old saying in education that girls cry tears while boys cry bullets. In other words, females are allowed in our society to express their vulnerability and less pleasant emotions such as sadness. While boys must remain stoic and shoulder the burden quietly or else get angry, and express their pain not through outbursts of emotion, but instead through action. Might there be a biological phenomenon behind these culture-based roles? A study published online in the journal Depression and Anxiety suggests so. It found that boy's brains react differently than girls in the aftermath of a highly stressful event.","Researchers at Stanford University discovered this by scanning the insula, or insular cortex, of boys and girls who had PTSD (Post-traumatic Stress Disorder) and comparing them to those who didn't. This is a region deep within our brain responsible for integrating emotions. Feelings and the sensation of pain are processed here. It is also where empathy emanates from. The insula takes in data from other parts of the body and related areas of the brain, and incorporates it all into emotions and actions.","This is the first study to denote a gender difference in how the brain reacts to PTSD. In girls, the insula developed or aged rapidly. The same process was not observed in boys. Victor Carrion, MD was the study's author. He is a professor of psychiatry and behavioral sciences at the university. Dr. Carrion told the Stanford Medicine News Center that this particular region played a key role in PTSD's development. \"The difference we saw between the brains of boys and girls who have experienced psychological trauma is important because it may help explain differences in trauma symptoms between sexes,\" he said.","This is a substantial breakthrough, as it could help neurologists develop personalized treatment options for PTSD sufferers depending on gender. With children and teens, while some who are exposed to a serious trauma do develop PTSD, others don't. Researchers still aren't sure why that is. They do know that girls are more likely to develop it than boys.","In this study, the brains of 59 participants, each between the ages of 9 and 17, underwent MRI brain scans. 30 of them had PTSD. Another 29 took part as a control group. 16 boys and 14 girls had suffered trauma, while another 14 boys and 15 girls had not. Normal participants showed no differences in insula structure, regardless of gender. Of those who were traumatized, 5 participants experienced one episode of severe trauma, while 25 had been exposed to two or more episodes. Researchers tried to match up participants and controls, comparing those of a similar age and IQ.","The area within the insula that changes due to severe trauma is known as the anterior circular sulcus. Researchers discovered that while in traumatized boys this area grows larger than normal, with girls it shrinks. Another way to look at it is that its development accelerates. These changes in structure are thought to be integral to PTSD's development. The shrinkage seen in female brains may be the reason why girls are more prone to PTSD.","Dr. Megan Klabunde was the study's lead author. She told the BBC, \"Our findings suggest it is possible that boys and girls could exhibit different trauma symptoms and that they might benefit from different approaches to treatment.\" She added that high levels of stress might lead to early puberty in girls, as some previous studies suggest. This breakthrough may also help neuroscientists understand how each gender processes emotions."]}],"B":[{"n":1,"title":"Cost of gastroenteritis in Australia: A healthcare perspective","paras":["Using 2016 prices, the estimated annual direct per capita cost of acute gastroenteritis illness was AUD$14.87 (USD$10.71), equating to AUD$20.27 (USD$14.59) per case. The estimated overall economic burden in Australia was AUD$359 million (USD$258 million; AUD$1.5 million per 100,000 people).","The major contributors to this cost were hospital admissions (57.1%), emergency department visits (17.7%), and general practitioner consultations (14.0%). Children under five years of age have the highest per capita rates of acute gastroenteritis illness; however, service utilisation rates vary by age group and both young children and older adults accounted for a substantial proportion of the overall economic burden attributable to acute gastroenteritis illness.","Conclusions: Although chronic diseases comprise a large cost burden on the healthcare system, acute illnesses, including acute gastroenteritis illness, also impose substantial direct healthcare system costs. Providing data on current cost estimates is useful for prioritizing public health interventions, with our findings suggesting that it would be ideal if targeted interventions to reduce hospitalisation rates among young children and older adults were available."],"q":"In which group of the Australian population is acute gastroenteritis most prevalent?","opts":["It affects all groups equally","Adults aged 57 or over","Children aged 5 years or less"],"key":"C","qja":"豪州人口のどの群で急性胃腸炎が最も多いか？","ja":"【豪州における胃腸炎のコスト：医療の視点から】2016年価格で、急性胃腸炎の年間直接費用は1人あたり14.87豪ドル（10.71米ドル）、1症例あたり20.27豪ドル（14.59米ドル）と推定された。豪州全体の経済的負担は3億5900万豪ドル（2億5800万米ドル、10万人あたり150万豪ドル）と推定された。コストの主な内訳は入院（57.1%）、救急外来受診（17.7%）、GP受診（14.0%）だった。急性胃腸炎の人口あたり罹患率が最も高いのは5歳未満の小児である。ただし医療サービスの利用率は年齢層で異なり、幼い子どもと高齢者の両方が、急性胃腸炎による経済的負担の大部分を占めていた。結論：慢性疾患は医療制度に大きなコスト負担をもたらすが、急性胃腸炎を含む急性疾患も相当な直接医療費を生じさせる。現在のコスト推計を示すことは公衆衛生介入の優先順位付けに有用であり、本結果は、幼い子どもと高齢者の入院率を下げる的を絞った介入があれば理想的であることを示唆している。","o":[["すべての群に等しく影響する","❌ 年齢層で差がある（vary by age group）。"],["57歳以上の成人","❌ 57という数字は入院費の割合（57.1%）の流用。高齢者は『経済的負担』の文脈で出るだけ。"],["5歳以下の子ども","✅ Children under five years of age have the highest per capita rates of acute gastroenteritis illness。prevalent＝罹患率が高い。"]],"exp":"『罹患率（rates of illness）』と『経済的負担（economic burden）』を区別する。高齢者は負担側に出てくるので、設問（prevalent）とは別軸。Bの57は数字の流用。","pt":"→ 型：選択肢の数字が本文の別の数字（57.1%）と一致したら疑う。単位・意味が違えば誤答。","doubt":null,"voc":[["per capita","1人あたりの"],["equating to","〜に相当する"],["economic burden","経済的負担"],["contributor","（費用を）構成する要素"],["hospital admission","入院"],["utilisation rate","利用率"],["account for","占める"],["substantial proportion","かなりの割合"],["attributable to","〜に起因する"],["comprise","構成する・占める"],["impose","課す・もたらす"],["prioritize","優先順位をつける"],["prevalent","多く見られる"]],"past":null},{"n":2,"title":"Millions of Australians suffering from combined physical, mental ill health, new report finds","paras":["A report compiled by the Australian Health Policy Collaboration (AHPC) at Victoria University, found 2.5 million people are living with both mental and physical conditions. It found clear links between the two — people living with chronic physical health issues are at a higher risk of developing mental health conditions, while those suffering ill mental health were also more likely to develop physical illness.","A chart showing that 28 percent of men with back problems, and 27 per cent of women, also suffer mental health issues. It said the combined health conditions affected welfare and education, health services and costs, productivity, employment, and social participation. The research revealed men with mental health conditions were 52 per cent more likely to report having a circulatory system disease than the general population, while women with ill mental health were 41 per cent more likely.","Men with mental health conditions were 28 per more likely to report having back pain, and women were 68 per cent more likely.","\"Improving the physical health of people living with mental health conditions, and conversely, the mental health of people living with physical health conditions, must become a priority to improve the health of all Australians,\" the report said."],"q":"According to this report were women with mental illness more prone to back pain or were men with back pain more prone to mental illness?","opts":["It is more likely that a man with back pain will have a mental illness than it is for a woman with mental illness to develop back pain","It was more likely that a woman with mental illness would develop back pain than it was for a man with back pain to have a mental illness.","It is more likely that a woman with back pain will have a mental illness than it is for a man with mental illness to have back pain"],"key":"B","qja":"この報告によれば、精神疾患のある女性が腰痛になりやすいのと、腰痛のある男性が精神疾患になりやすいのと、どちらがより当てはまるか？","ja":"【数百万人の豪州人が身体・精神の不調を併せもつ：新報告】ビクトリア大学の豪州保健政策共同体（AHPC）がまとめた報告で、250万人が精神と身体の両方の疾患を抱えて生活していることが分かった。両者には明確な関連があり、慢性の身体疾患をもつ人は精神疾患を発症するリスクが高く、精神的不調のある人も身体疾患を発症しやすかった。図によれば、腰の問題を抱える男性の28%、女性の27%が精神的な問題も抱えている。これらの併存疾患は福祉・教育、医療サービスと費用、生産性、雇用、社会参加に影響していた。精神疾患のある男性は循環器疾患を報告する可能性が一般人口より52%高く、女性では41%高かった。精神疾患のある男性は腰痛を報告する可能性が28%高く、女性は68%高かった。報告は「精神疾患のある人の身体的健康、逆に身体疾患のある人の精神的健康を改善することを、全豪州人の健康向上のための優先課題とすべきだ」と述べた。","o":[["腰痛のある男性が精神疾患をもつ可能性は、精神疾患のある女性が腰痛になる可能性より高い","❌ 腰痛男性→精神疾患は28%、精神疾患女性→腰痛は68%高い。女性の方が高い。"],["精神疾患のある女性が腰痛になる可能性は、腰痛のある男性が精神疾患をもつ可能性より高い","✅ women were 68 per cent more likely（精神疾患女性→腰痛）＞ 28 percent of men with back problems（腰痛男性→精神）。"],["腰痛のある女性が精神疾患をもつ可能性は、精神疾患のある男性が腰痛をもつ可能性より高い","❌ 設問と組み合わせが違う（腰痛女性27% vs 精神疾患男性28%）。しかも27＜28で結論も逆。"]],"exp":"『AのうちBの人の割合』と『AはB になりやすい（more likely）』の方向を1つずつ対応させる。28という数字が2回（男性の腰痛→精神／精神→腰痛）出てくるのも罠。","pt":"→ 型：because/with の方向（X with Y と Y with X）を図式化する。『原因→結果』の向きを逆にした選択肢が必ず混ざる。","doubt":null,"voc":[["compile","取りまとめる"],["collaboration","共同事業体・連携組織"],["chronic physical health issue","慢性の身体疾患"],["circulatory system disease","循環器疾患"],["welfare","福祉"],["productivity","生産性"],["social participation","社会参加"],["conversely","逆に"],["prone to","〜になりやすい"]],"past":null},{"n":3,"title":"Incontinence management using an electronic continence pad.","paras":["Urinary incontinence is an embarrassing and disabling problem, and a major determining factor for nursing home placement. It affects 2 million Australians at a cost of $1 billion per annum. In residential aged-care facilities, incontinence detection and documentation and accurate assessment of voiding patterns are necessary to implement effective best practice continence management.","However, current processes are labour and time intensive. Current practices also frequently breach infection control standards for staff and threaten the dignity and privacy of the incontinent person. There is a lack of valid instrumentation to assess incontinence and monitor continence care.","The AEGIS Continence Management System comprises a sensor inserted in a pad liner which detects and monitors wetness. It then transmits the information, via radio link, to a nurse's pager and to a tailored software application that creates continence assessment charts. The project will include AEGIS I which is the existing prototype detecting wetness, the AEGIS II that monitors degree and volume of wetness and the AEGIS III that detects chemical markers of infection or other clinical conditions."],"q":"What is a key problem facing staff trying to assess and manage incontinence?","opts":["There are no effective equipment available to monitor levels of incontinence","Radio links break so nurses do not know a patient has pressed their call bell","Patients always have a urine infection"],"key":"A","qja":"失禁の評価・管理をしようとするスタッフが直面する主な問題は何か？","ja":"【電子式失禁パッドによる失禁管理】尿失禁は恥ずかしく生活に支障をきたす問題で、介護施設入所の主要な決定要因である。豪州で200万人が罹患し、年間10億ドルの費用がかかっている。入所型高齢者介護施設では、効果的なベストプラクティスの失禁管理を行うには、失禁の検出と記録、排尿パターンの正確な評価が必要である。しかし現行の手順は労力と時間がかかる。また現行の方法は、スタッフの感染対策基準に違反することが多く、失禁のある人の尊厳とプライバシーを脅かす。失禁を評価し、失禁ケアをモニターする妥当な機器がない。AEGIS失禁管理システムは、パッドライナーに挿入したセンサーで湿りを検出・監視する。その情報を無線で看護師のポケットベルと専用ソフトに送り、失禁評価表を作成する。本プロジェクトには、湿りを検出する既存の試作機AEGIS I、湿りの程度と量を監視するAEGIS II、感染などの化学マーカーを検出するAEGIS IIIが含まれる。","o":[["失禁の程度をモニターできる有効な機器がない","✅ There is a lack of valid instrumentation to assess incontinence and monitor continence care の言い換え。"],["無線が途切れるため、患者がナースコールを押しても看護師が気づかない","❌ radio link は新システムの仕組みとして出るだけ。ナースコールも途切れる話もない。"],["患者は常に尿路感染症をもっている","❌ 感染は AEGIS III が検出する対象の一つにすぎない。always は根拠なし。"]],"exp":"However 以降が『現状の問題点』。後半の新システムの説明（radio link, infection）から語を借りた選択肢は問題点ではない。","pt":"→ 型：problem を問われたら However / current practices の段落に限定する。解決策の段落の語を使った選択肢は誤り。","doubt":null,"voc":[["urinary incontinence","尿失禁"],["disabling","生活に支障をきたす"],["determining factor","決定的な要因"],["placement","（施設への）入所"],["per annum","1年あたり"],["voiding pattern","排尿のパターン"],["labour intensive","手間のかかる"],["breach","違反する"],["dignity","尊厳"],["instrumentation","計測機器"],["comprise","〜から成る"],["pad liner","パッドの内張り"],["transmit","送信する"],["prototype","試作機"]],"past":null},{"n":4,"title":"Quality of Life in the Elderly - Health related quality of Life: influences","paras":["Some of the factors that influence health-related quality of life (eg, institutionalization, reduced life expectancy, cognitive impairment, disability, chronic pain, social isolation, functional status) may be obvious to health care practitioners. Practitioners may need to ask about others, especially social determinants of health (ie, the social, economic, and political conditions that people experience from birth to death and the systems put in place to prevent illness and treat it when it occurs).","Other important factors include the nature and quality of close relationships, cultural influences, religion, personal values, and previous experiences with health care. However, how factors affect quality of life cannot necessarily be predicted, and some factors that cannot be anticipated may have effects. Also, perspectives on quality of life can change. For example, after a stroke that caused severe disability, patients may choose treatment (eg, life-saving surgery) to sustain a quality of life that they would have considered poor or even unacceptable before the stroke."],"q":"There are many factors that affect a person's quality of life. Which particular features of a person's life are most apparent to a physician?","opts":["Friendship, spirituality and employment history","Changing attitudes to quality of life, effect of a stroke and effects of surgery","Limited life span ongoing pain and loneliness"],"key":"C","qja":"QOLに影響する要因は多い。医師にとって最も明白なのは、その人の生活のどの特徴か？","ja":"【高齢者のQOL：健康関連QOLへの影響因子】健康関連QOLに影響する要因の一部（施設入所、余命の短縮、認知障害、障害、慢性疼痛、社会的孤立、機能状態など）は、医療者にとって明白かもしれない。それ以外、特に健康の社会的決定要因（生まれてから死ぬまでに経験する社会的・経済的・政治的条件と、病気の予防・治療のための仕組み）については尋ねる必要があるかもしれない。その他の重要な要因には、親密な関係の性質と質、文化的影響、宗教、個人の価値観、過去の医療経験がある。ただし、要因がQOLにどう影響するかは必ずしも予測できず、予期しない要因が影響することもある。また、QOLの捉え方は変わりうる。例えば重い障害を残した脳卒中の後、以前なら低い・受け入れがたいと考えたQOLを維持するために、患者が治療（救命手術など）を選ぶことがある。","o":[["友人関係、信仰、職歴","❌ 関係・宗教は『尋ねる必要がある』側の要因で、明白なものではない。"],["QOLに対する態度の変化、脳卒中の影響、手術の影響","❌ 脳卒中・手術は『捉え方が変わる』ことの例。明白な要因のリストではない。"],["限られた余命、続く痛み、孤独","✅ may be obvious to health care practitioners のリスト中の reduced life expectancy / chronic pain / social isolation の言い換え。"]],"exp":"設問の most apparent to a physician ＝ 本文の may be obvious to health care practitioners。この1文の括弧内リストだけが対象。","pt":"→ 型：設問の形容詞（apparent）の同義語（obvious）を本文で探し、その文の括弧内リストと照合する。","doubt":null,"voc":[["institutionalization","施設入所"],["life expectancy","余命"],["cognitive impairment","認知機能障害"],["social isolation","社会的孤立"],["functional status","生活機能の状態"],["social determinants of health","健康の社会的決定要因"],["anticipate","予測する"],["perspective","見方・捉え方"],["sustain","保つ・維持する"],["unacceptable","受け入れがたい"],["apparent","明らかな"],["spirituality","信仰心・精神性"]],"past":null},{"n":5,"title":"Chronic kidney disease","paras":["Chronic kidney disease (CKD) refers to all conditions of the kidney, lasting at least 3 months, where a person has had evidence of kidney damage and/or reduced kidney function, regardless of the specific diagnosis of disease or condition causing the disease. Evidence of kidney damage manifests as either urinary protein or albumin (a type of protein that is a more sensitive and specific marker of kidney disease), blood in the urine, or scarring detected by imaging tests.","CKD is categorised into 5 stages according to the level of reduced kidney function and evidence of kidney damage. Stages of CKD are measured by the glomerular filtration rate, which is the amount of blood the kidneys clear of waste products in one minute. Because this rate cannot easily be measured directly, current practice is to estimate it by applying a formula based on age, gender and creatinine (a breakdown product of a molecule found in muscle that is important for energy storage) in the blood. An individual can move up and down through the first four stages of severity, but once they reach stage 5, their kidney function does not usually improve."],"q":"The severity of kidney disease is diagnosed by checking what?","opts":["The amount of blood that passes through the kidneys","The amount of waste in the blood that is cleared by the kidneys","The amount of urine that passes through the kidneys"],"key":"B","qja":"腎臓病の重症度は何を調べて診断されるか？","ja":"【慢性腎臓病】慢性腎臓病（CKD）とは、原因となる疾患・病態の具体的診断にかかわらず、腎障害の所見や腎機能低下が少なくとも3か月続く腎臓のあらゆる状態を指す。腎障害の所見は、尿蛋白またはアルブミン（腎臓病のより感度・特異度の高い蛋白マーカー）、血尿、画像検査での瘢痕として現れる。CKDは腎機能低下の程度と腎障害の所見により5つのステージに分類される。ステージは糸球体濾過量（1分間に腎臓が老廃物を除去する血液の量）で測定される。この値は直接測るのが難しいため、現在は年齢・性別・血中クレアチニン（エネルギー貯蔵に重要な筋肉中の分子の分解産物）に基づく式で推定する。人は最初の4ステージの間は重症度が上下しうるが、ステージ5に達すると腎機能は通常改善しない。","o":[["腎臓を通過する血液の量","❌ GFRは『通過』ではなく『老廃物を除去（clear of waste products）』した血液の量。"],["腎臓によって除去される血中の老廃物の量","✅ 公式キーB。the amount of blood the kidneys clear of waste products（老廃物を除去する働き）を指す選択肢。"],["腎臓を通過する尿の量","❌ 尿量ではない。"]],"exp":"GFRの定義文（the amount of blood the kidneys clear of waste products in one minute）を読み取る。Aは『血液の量』という語だけ一致させて clear of waste を落としている。","pt":"→ 型：定義文の動詞（clear / pass through）まで一致しているか確認。名詞だけの一致は罠。","doubt":"⚠️ 厳密にはGFRは『老廃物を除去された血液の量』でBの言い方（老廃物の量）とも少しずれる。キーはB。","voc":[["regardless of","〜にかかわらず"],["manifest as","〜として現れる"],["albumin","アルブミン"],["scarring","瘢痕化"],["categorised into","〜に分類される"],["glomerular filtration rate","糸球体濾過量"],["clear of waste products","老廃物を除去する"],["applying a formula","計算式を当てはめること"],["creatinine","クレアチニン"],["breakdown product","分解産物"],["severity","重症度"]],"past":null},{"n":6,"title":"Memo: Caspofungin 70mg powder for concentrate for solution for infusion","paras":["Cadiasun Pharma GmBH has informed us that there is an error on the patient information leaflet for the above product. The error is on the portion of the leaflet which is intended for Healthcare Professionals, in the sections providing instructions for preparation of both 70mg/m2 and 50mg/m2 infusion for paediatric patients >3 months of age.","In the incorrect version of the leaflet, the final concentration of the solution is given as 5.2mg/ml for both dilutions. The correct final concentration is 7.2mg/ml, however in addition to the error on the Patient Information Leaflet, there is also an error on the Summary of Product Characteristics for the product.","The heading for preparation of the 70mg/m2 infusion for paediatric patients > 3 months and the heading for preparation of the 50mg/m2 infusion for paediatric patients > 3 months incorrectly state in brackets 'using a 50-mg vial'. The headings should read as follows:","Preparation of the 70 mg/m2 infusion for paediatric patients > 3months of age (using a 70-mg vial)","Preparation of the 50 mg/m2 infusion for paediatric patients > 3months of age (using a 70-mg vial)","Steps have already been taken to correct the errors on both the patient information leaflet and the Summary of Product Characteristics.","Please note, the patient information leaflet and Summary of Product Characteristics for the 50mg presentation of the product are correct."],"q":"What is the issue being raised in this memo?","opts":["There are errors in one part of the patient information leaflet","There are errors in two parts of the patient information leaflet","There are errors in three parts of the patient information leaflet"],"key":"B","qja":"このメモで提起されている問題は何か？","ja":"【メモ：カスポファンギン70mg 点滴静注用粉末】Cadiasun Pharma社から、上記製品の添付文書（患者向け情報リーフレット）に誤りがあるとの連絡を受けた。誤りはリーフレットの医療者向け部分にあり、3か月超の小児に対する70mg/m2と50mg/m2の両方の点滴調製手順の項である。誤った版では、両方の希釈で最終濃度が5.2mg/mLとされている。正しい最終濃度は7.2mg/mLである。なお添付文書の誤りに加え、製品概要（SmPC）にも誤りがある。3か月超の小児向け70mg/m2点滴調製と50mg/m2点滴調製の見出しに、括弧書きで誤って『50mgバイアル使用』とある。見出しは以下が正しい：『3か月超の小児向け70mg/m2点滴の調製（70mgバイアル使用）』『3か月超の小児向け50mg/m2点滴の調製（70mgバイアル使用）』。添付文書とSmPCの誤りはすでに訂正の措置がとられている。なお50mg製剤の添付文書とSmPCは正しい。","o":[["患者向け情報リーフレットの1か所に誤りがある","❌ 誤りは70mg/m2と50mg/m2の『両方』の項にある。"],["患者向け情報リーフレットの2か所に誤りがある","✅ in the sections providing instructions for preparation of both 70mg/m2 and 50mg/m2 ＝ 2つの項。"],["患者向け情報リーフレットの3か所に誤りがある","❌ 見出しの誤りはSmPC側の話として追加で述べられており、リーフレットの3か所目ではない。"]],"exp":"リーフレット（PIL）とSmPCという2つの文書が出てくるので、どちらの誤りかを分けて数える。both 70 and 50 の both が決め手。","pt":"→ 型：数を問う設問は、本文の both / each / all を拾って数え、別の文書・対象の分を混ぜない。","doubt":null,"voc":[["leaflet","添付文書・説明書"],["intended for","〜向けの"],["preparation","調製"],["infusion","点滴（静注）"],["paediatric","
