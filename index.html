disease is noteworthy.","From now on, patients will stop asking doctors if coffee is safe to drink."],"key":"C","ev":"Coffee didn't have an effect either way on heart disease, but that was significant in itself","note":"影響がないこと自体が重要（C）。Bは事実だけで『意見』になっていない。","doubt":null,"alt":[],"voc":[["buildup of calcium","カルシウムの蓄積"],["supply blood to","〜に血液を送る"],["either way","どちらの方向にも"],["significant in itself","それ自体が重要な"],["coronary artery disease","冠動脈疾患"],["risk factor","危険因子"],["neutral","どちらでもない・中立の"],["noteworthy","注目に値する"]],"past":null},{"n":20,"t":1,"p":5,"q":"What makes coffee and tea beneficial, according to Cimperman?","opts":["A secret ingredient found in coffee and tea.","The relations among the complex ingredients coffee and tea contain","One single compound isolated by some scientists","The fact that they help to fight many different diseases"],"key":"B","ev":"It's more of a dynamic interaction than one single compound","note":"単一成分ではなく成分間の相互作用（B）。","doubt":null,"alt":[],"voc":[["complex beverage","成分が複雑な飲み物"],["a variety of","さまざまな"],["cancer-fighting properties","抗がん作用"],["dietitian","管理栄養士"],["dynamic interaction","動的な相互作用"],["isolated","単離された"],["relations among","〜の間の関係"]],"past":null},{"n":21,"t":1,"p":7,"q":"What does \"linear\" suggest in the seventh paragraph?","opts":["That the more coffee people drank the lower the risk of colon cancer was.","That coffee intake had no significant impact on colon cancer.","That drinking coffee is proportional to the recurrence of colon cancer.","That drinking coffee is proportional to the prevention of the recurrence of colon cancer."],"key":"A","ev":"\"The more coffee they drank, the lower risk of recurrence.\"","note":"linear＝飲むほど再発リスクが下がる（A）。","doubt":null,"alt":[],"voc":[["gastrointestinal","消化管の"],["regular drinking","習慣的に飲むこと"],["linear association","直線的な関連"],["recurrence","再発"],["contribute to","〜に寄与する"],["counsel","助言する"],["obesity","肥満"],["measure","対策"],["proportional to","〜に比例する"]],"past":null},{"n":22,"t":1,"p":8,"q":"Which of the following points is not made in the eighth paragraph?","opts":["Coffee can affect people differently.","People's lifestyles may play a part in whether they drink tea or coffee.","There is no connection between genetics and whether people drink tea or coffee.","Research has shown that there may be a connection between drinking coffee and smoking."],"key":"C","ev":"Other researchers are asking questions about what role genetics and lifestyle play","note":"NOT。遺伝の役割は『問われている』段階で、『関係がない』（C）とは言っていない。","doubt":null,"alt":[],"voc":[["play into","〜に影響する"],["genetics","遺伝（的要因）"],["went together","切り離せないものだった"],["process","（体内で）処理する"],["preference for","〜を好むこと"],["reflect","反映する"],["associated","関連がある"],["maintain weight","体重を保つ"]],"past":null}]},{"id":"10","texts":[{"title":"Déjà vu","paras":["Have you ever experienced déjà vu? If so, you are among the 60-70% of the population who has. The majority of those who report déjà vu are between the ages of 15 and 25.","Though some radical notions have in the past been connected to this strange feeling, such as déjà vu being momentarily aligning with a past life or another you in a parallel universe, scientists now believe it has a neurological basis.","Unfortunately, the feeling is here one minute and gone the next, making it difficult to study. Even so, there are quite a few theories on what causes it. One traditional hypothesis, posited by psychiatrists, is mismatched brain signals. For a second it feels as though we are transported to a moment in the past and we mistake it for the present. This may be why it has been associated with the idea of reincarnation.","Another theory is that déjà vu is our brain trying to piece together a situation on limited information. A third states that it is a misfiring in the parts of the brain that recall memory and decipher sensory input. Sensory information, rather than taking the proper channels, leaks out of the short-term memory and into the long-term one. In this way, current experiences seem to be connected to the past. Some studies even suggest that familiar geometric shapes give us a sense of knowing something about a place that is, in reality, totally unfamiliar to us.","Since we are completely aware of everything that's going on when we experience déjà vu, this suggests that every part of the brain need not participate for the sensation to take place. Psychologist Anne M. Cleary at Colorado State University, in a study in 2008, found that déjà vu followed patterns we associate with memory, specifically \"recognition memory\". This is the kind that gets us to understand that we are confronting something that we have seen or experienced before. If you have ever recognized a landmark, a friend from across the room, or a song on the stereo, you have experienced \"recognition memory.\"","Familiarity-based recognition is associated with recognition memory. Here, we have that feeling of familiarity, but we can't quite place where we've seen this person, place, or thing. For instance, you recognize someone across the street, but can't remember their name or where you know them from. Prof. Cleary conducted several studies which found that déjà vu is a form of familiarity-based recognition. Her work suggests that our memory stores items in fragments. When there is a certain overlap between old and new experiences, we have strong feelings about the connection, which we interpret as déjà vu.","Recent studies looking at epileptic patients made impressive breakthroughs in our understanding of the phenomenon. Epileptics with certain intractable conditions require electrodes to be placed inside their brains in order to locate the source of their seizures. During this procedure, some neurologists have had patients experience déjà vu. They soon discovered that the phenomenon takes place in the medial temporal lobe, which is responsible for memory. The electrodes are usually placed within the rhinal cortex—the most important piece of which is the hippocampus, the structure responsible for long-term memory formation. French scientists have found that firing current into this cortex can trigger an episode of déjà vu.","The French study, published in the journal Clinical Neurophysiology, measured EEG wave patterns from patients with epilepsy who experienced déjà vu through electrical stimulation. The areas of the brain they examined included the amygdala, which is responsible for emotion and the hippocampus. Researchers found that electrical patterns, emanating from rhinal cortices and the amygdala or the hippocampus, caused déjà vu to occur. These neuroscientists believe that some sort of electrical phenomenon in the medial temporal lobe activates the memory in such a way that it causes déjà vu to occur.","Stranger still, scientists in the UK have actually found patients who experience \"chronic déjà vu.\" In this case, experts identified four senior citizens who encounter the feeling on a consistent basis. What is the impact of such a phenomenon? It made them feel as if they were clairvoyant. All four refused to go to the doctor, believing they already knew what the physician would say, and avoided watching the news, thinking they already knew the outcome. That's because each time they took part in either activity, they came to the same result."]},{"title":"Gene Therapy.","paras":["Imagine healing the body without drugs or surgery, each of which can have nasty side effects. Instead, a physician uses the body's own building blocks to heal you. Instead of returning again and again, or having to take medication continually, one shot does it all. These are the promises of gene therapy.","The concept is easy to grasp. Genes control proteins that in turn control all of our body's functions. When a faulty gene, usually due to a mutation, malfunctions and causes disease, all that would have to be done is to \"knock out\" or replace the faulty gene. Once the correct protein enters the system, the disease is finished. It is, however, the replacement process that is complicated.","One problem is exactly how to deliver a gene to a patient's DNA. To do that, scientists create a custom virus that infects a target cell, yet flies under the immune system's radar. By doing so, the virus leaves its own genetic material inside the cell. That cell begins to reproduce, carrying the gene with it, and spreading it throughout the body.","Gene therapies are not currently approved by the FDA. Dozens of clinical trials are ongoing, however. This cutting-edge therapy is approved to treat one particular disorder in Europe—lipoprotein lipase deficiency, where the patient cannot break down fat. Another use will soon be approved, to treat combined immune deficiency, or the \"bubble boy\" disease.","Other conditions it is expected to someday treat include heart disease, diabetes, some forms of cancer, muscular dystrophy, immune disorders, genetic disorders, AIDS, hemophilia, and certain blindness-causing conditions. With AIDS, gene therapy will be used in a different way. The HIV virus camouflages itself from the immune system. Gene therapy can make its presence known, allowing it to be recognized and destroyed.","The things researchers look at when evaluating a new therapy is its safety profile, how effective it is, and what a proper dosage may look like. Just like any therapy, things can go wrong. For instance, altered viruses could change back into their original form, causing infection. Sometimes the wrong cell is approached by the virus. Or the virus places the gene in the wrong place within a cell's DNA. In this last case, healthy cells may become damaged or cause illness, even develop into a tumor.","There have been stumbling blocks along the way. Keep in mind that all clinical trials are monitored by the FDA and the National Institutes of Health (NIH). Even so, gene therapy almost went bust in 1999 when a volunteer, 19-year-old Jesse Gelsinger, died during testing. The Arizona teen's immune system reacted violently as a result of the treatment. Gene therapy lost its innocence and many young, promising scientists decided to put their efforts elsewhere, setting the field back. A year after that, during a French trial, some participants developed leukemia.","After these incidents, dozens of clinical trials ceased and funding was pulled. Researchers learned a lot from these disturbing tragedies, and put stringent safety controls in place. They have since discovered how to deliver genes using viruses in a safe and effective manner that doesn't set off the immune system.","Researchers have also implemented guidelines that help monitor patients and administer to side effects. A few successes then brought gene therapy back from the brink. In 2008, some blind subjects reported improvements in vision. Shortly after, in another experiment, 80% of \"bubble boy\" children regained immune system function.","The efficacy of gene therapy today is not constant throughout, but varies from one condition to the next. A recent study using the therapy to treat muscular dystrophy saw impressive results. A 2013 study was even more dramatic, where a small clutch of patients with leukemia were cured. Other studies on hemophilia and one cause of blindness, retinitis pigmentosa, have also seen remarkable results.","There have been other trials however that have not been so encouraging. One for congestive heart failure ended in \"disappointing\" results, and another for Parkinson's ended in what researchers called a \"mixed bag.\" One problem that must be overcome, the immune system sometimes does recognize and take out the viral messenger."]}],"B":[{"n":1,"title":"Memo to public health workers: A reminder about the safe and correct use of condoms","paras":["A batch of Durex Real Feel condoms was recently recalled internationally because of their tendency to burst before their expiry date. This has prompted a reminder about the safe use of condoms, including making sure you're aware of the expiry date.","As a product ages, it has a higher potential to fail, so it is important to always check the use-by date before using a condom and make sure you know how to use a condom correctly. Taking the right precautions will help manage the spread of disease and reduce the likelihood of unwanted consequences, such as pregnancy.","Durex Real Feel condoms from batch 1000432443 (expiry January 2021) should not be used. No other condoms are affected by this issue."],"q":"What guidance do staff need to give to their patients to limit the chance of condoms failing?","opts":["Open the packaging to see if the condom has burst.","Check the condom expiry date and put one on correctly.","Discard the condom if it is a Durex Real Feel."],"key":"B","qja":"コンドームの破損を減らすため、スタッフは患者にどんな指導をする必要があるか？","ja":"【公衆衛生従事者宛メモ：コンドームの安全で正しい使用についての注意喚起】Durex Real Feelコンドームの一部ロットが、使用期限前に破れやすいとして国際的に回収された。これを受け、使用期限の確認を含むコンドームの安全な使用について改めて注意喚起する。製品は古くなるほど破損しやすくなるため、使用前に必ず使用期限を確認し、正しい使い方を知っておくことが重要である。適切な予防策をとることは、病気の拡大を抑え、妊娠などの望まない結果の可能性を減らす。Durex Real Feelコンドームのロット1000432443（使用期限2021年1月）は使用しないこと。その他のコンドームはこの問題の影響を受けない。","o":[["包装を開けてコンドームが破れていないか確認する","❌ 本文にない指導。"],["使用期限を確認し、正しく装着する","✅ always check the use-by date … and make sure you know how to use a condom correctly。"],["Durex Real Feelなら捨てる","❌ 使用中止は特定のロット（batch 1000432443）だけ。No other condoms are affected。"]],"exp":"Cは範囲の拡大（特定ロット→製品全体）。回収情報の設問では対象範囲（batch, expiry）を必ず確認する。","pt":"→ 型：回収・注意喚起は『どのロット・どの期限』まで限定されているかを確認。製品名全体に広げた選択肢は誤り。","doubt":null,"voc":[["batch","製造ロット"],["recalled","回収された"],["tendency","傾向"],["burst","破れる・破裂する"],["expiry date","使用期限"],["prompt","促す・きっかけとなる"],["use-by date","使用期限"],["precaution","予防策"],["likelihood","可能性"],["consequence","結果"],["discard","廃棄する"]],"past":null},{"n":2,"title":"Directive: compliance is mandatory – Introduction","paras":["SA Health is responsible for ensuring Local Health Networks provide comprehensive, timely and high-quality health services in South Australian (SA) public hospitals. Approximately 46,000 elective surgery procedures are performed each year in South Australian (SA) metropolitan public hospitals and approximately 16,000 elective surgery procedures in country hospitals.","Patients requiring elective surgery have been assessed by a medical practitioner or authorised delegate as needing surgery for a medical condition, but for which admission can be delayed for at least 24 hours. These patients are placed on a booking list and treated according to the clinical urgency category assigned by the treating medical practitioner. SA Health Elective Surgery Policy Framework and Associated Procedural Guidelines (Policy Framework) has been developed to provide a consistent, structured approach to support the provision of elective surgery within SA Health public hospitals."],"q":"What is the purpose of the SA Health Elective Surgery Policy Framework and Associated Procedural Guidelines?","opts":["To ensure all patients have an operation within 24 hours of being referred for publicly funded surgery.","To make sure GPs know the process for referring patients for publicly funded surgery.","To ensure all patients in SA get equal access to the publicly funded operation they need."],"key":"C","qja":"SA Health 待機手術方針枠組みと関連手順ガイドラインの目的は何か？","ja":"【指令：遵守義務あり－序論】SA Healthは、地域保健ネットワークが南オーストラリア州の公立病院で包括的で適時の質の高い医療を提供することに責任を負う。南豪州の都市部の公立病院では年間約46,000件、地方の病院では約16,000件の待機手術が行われている。待機手術を要する患者とは、医師または権限を与えられた者によって病状に対する手術が必要と評価されたが、入院を少なくとも24時間は遅らせられる患者である。こうした患者は予約リストに載せられ、担当医が割り当てた臨床的緊急度区分に従って治療される。SA Health待機手術方針枠組み（Policy Framework）は、SA Healthの公立病院での待機手術の提供を支える一貫した体系的なアプローチを示すために策定された。","o":[["公費手術に紹介されたすべての患者が24時間以内に手術を受けられるようにする","❌ 24時間は『入院を少なくとも24時間遅らせられる』という待機手術の定義。24時間以内に手術する話ではなく逆。"],["GPが公費手術への紹介手順を理解できるようにする","❌ GPや紹介手順の話はない。"],["南豪州のすべての患者が必要な公費手術に公平にアクセスできるようにする","✅ 公式キーC。a consistent, structured approach（一貫した体系的アプローチ）＝どの病院でも同じ基準で＝公平なアクセス。"]],"exp":"目的文は最終文の has been developed to provide … 。consistent を『公平（equal access）』に言い換えられるかが勝負。Aは数字24の意味の逆転。","pt":"→ 型：purpose 問題は developed to / aims to / in order to の後ろを探す。数字の意味（at least 24h delay）を逆にした選択肢に注意。","doubt":null,"voc":[["comprehensive","包括的な"],["timely","適時の"],["elective surgery","待機（予定）手術"],["metropolitan","都市部の"],["medical practitioner","医師"],["authorised delegate","権限を委任された者"],["admission","入院"],["booking list","予約リスト"],["clinical urgency category","臨床的な緊急度区分"],["consistent","一貫した"],["structured approach","体系立てたやり方"],["provision","提供"],["publicly funded","公費による"]],"past":null},{"n":3,"title":"Women at lower risk of cesarean section when they're induced","paras":["For most women, labor naturally starts between weeks 37 and 42 of pregnancy. When a woman is induced, doctors break her waters and make the uterus contract more strongly to bring on labor deliberately. There's a variety of reasons why a woman might be induced in this way including that the baby is overdue, that the baby doesn't seem to be growing well, or that the mother has a health condition that can make labor trickier, like high blood pressure.","But the women in the study didn't have any of those problems, and none had given birth before. The researchers wanted to see whether inducing labor was better than waiting in women who didn't otherwise need to be induced for health reasons. Half of the pregnant women were randomly sorted into a group that would be induced at 39 weeks, while the other half would instead go through \"expectant management\", where they simply waited for labor to come. The researchers found that women who had a labor induction were 15 percent less likely to need a cesarean delivery."],"q":"What was the selection criteria for women to be included in this research project?","opts":["42 weeks pregnant and the baby has stopped growing.","No problems and a first time mum.","A first time mum whose waters had broken."],"key":"B","qja":"この研究に女性が組み入れられた選択基準は何か？","ja":"【誘発分娩の方が帝王切開のリスクが低い】ほとんどの女性では、陣痛は妊娠37〜42週の間に自然に始まる。誘発する場合、医師は破水させ子宮の収縮を強めて意図的に陣痛を起こす。誘発する理由には、予定日超過、赤ちゃんの発育不良、高血圧など分娩を難しくしうる母体の疾患など様々なものがある。しかし研究の女性たちはそのような問題を抱えておらず、全員が出産経験がなかった。研究者は、健康上の理由で誘発する必要のない女性で、誘発が待機より良いかどうかを調べたかった。妊婦の半数を無作為に39週で誘発する群に、残り半数を陣痛が来るのを待つだけの『待機的管理』群に割り付けた。誘発群の女性は帝王切開が必要になる可能性が15%低かった。","o":[["妊娠42週で赤ちゃんの発育が止まっている","❌ 発育不良は『誘発する理由の例』で、研究の女性はそうした問題がなかった。"],["問題がなく初産である","✅ the women in the study didn't have any of those problems, and none had given birth before。"],["破水した初産婦","❌ 破水は誘発の手技（doctors break her waters）であって選択基準ではない。"]],"exp":"But the women in the study … が転換点。前段の一般論（誘発の理由）と、研究対象（問題なし・初産）を区別する。","pt":"→ 型：一般論 → But 研究では… の構造。But 以降の対象集団の説明が選択基準。","doubt":null,"voc":[["cesarean section","帝王切開"],["induce","（陣痛を）誘発する"],["labor","陣痛・分娩"],["break her waters","破水させる"],["contract","収縮する"],["bring on","引き起こす"],["deliberately","意図的に"],["overdue","予定日を過ぎた"],["trickier","より難しい"],["given birth","出産した"],["randomly sorted","無作為に振り分けられた"],["expectant management","待機的管理（経過を見る方針）"],["selection criteria","選択基準"]],"past":null},{"n":4,"title":"Drug categories of concern in the elderly: anticoagulants","paras":["Age may increase sensitivity to the anticoagulant effect of warfarin. Careful dosing and routine monitoring can largely overcome the increased risk of bleeding in elderly patients taking warfarin. Also, because drug interactions with warfarin are common, closer monitoring is necessary when new drugs are added or old ones are stopped; computerized drug interaction programs should be consulted if patients take multiple drugs.","Patients should also be monitored for warfarin interactions with food, alcohol, and OTC drugs and supplements. The newer anticoagulants (dabigatran, rivaroxaban, apixaban) may be easier to dose and have fewer drug-drug interactions and food-drug interactions than warfarin, but still increase the risk of bleeding in elderly patients, particularly those with impaired renal function."],"q":"From this article, what is the most important role of health professionals when they are caring for an elderly person taking anticoagulants?","opts":["Ongoing and regular reviews.","Frequently checking for bleeding.","Prescribing anticoagulants other than warfarin."],"key":"A","qja":"この記事によれば、抗凝固薬を服用する高齢者のケアで医療者の最も重要な役割は何か？","ja":"【高齢者で注意すべき薬剤群：抗凝固薬】加齢はワルファリンの抗凝固作用への感受性を高めうる。慎重な用量設定と定期的なモニタリングにより、ワルファリン服用中の高齢者の出血リスク増加はおおむね克服できる。また、ワルファリンとの薬物相互作用はよくあるため、新しい薬を追加・中止する際はより綿密なモニタリングが必要で、多剤服用の患者ではコンピューターの相互作用チェックを参照すべきである。食物、アルコール、OTC薬、サプリメントとの相互作用についてもモニターすべきである。新しい抗凝固薬（ダビガトラン、リバーロキサバン、アピキサバン）は用量設定が容易で、薬物・食物相互作用もワルファリンより少ない可能性があるが、それでも高齢者、特に腎機能障害のある人の出血リスクを高める。","o":[["継続的で定期的なレビュー（見直し）","✅ careful dosing and routine monitoring / closer monitoring / should also be monitored と、monitoring（継続的チェック）が繰り返される。"],["出血がないか頻繁に確認する","❌ 本文のモニタリング対象は用量・相互作用。『出血の有無を頻繁に確認』とは書いていない。"],["ワルファリン以外の抗凝固薬を処方する","❌ 新しい薬も出血リスクを高めると述べており、推奨はしていない。"]],"exp":"本文で繰り返されるキーワード（monitoring が4回）が主旨。Bは出血（bleeding）という本文の語を使っているが、monitoring の対象を取り違えている。","pt":"→ 型：most important を問われたら、本文で繰り返される語（monitoring）を探す。反復＝筆者の強調。","doubt":null,"voc":[["anticoagulant","抗凝固薬"],["sensitivity","感受性"],["warfarin","ワルファリン"],["dosing","用量設定"],["routine monitoring","定期的な経過観察"],["overcome","克服する"],["bleeding","出血"],["drug interaction","薬物相互作用"],["consulted","参照される"],["OTC drug","市販薬"],["supplement","サプリメント"],["impaired renal function","腎機能障害"],["review","見直し・再評価"]],"past":null},{"n":5,"title":"Musculoskeletal conditions","paras":["There are more than 150 forms of arthritis and musculoskeletal conditions, but the more common conditions include:","Osteoarthritis: a degenerative joint condition affecting the weight-bearing joints such as the hips, knees and ankles and well as the hands and spine.","Rheumatoid arthritis: an autoimmune disease where the body's immune system attacks its own tissues, and thus differs from osteoarthritis which is characterized by wear and tear of joints. It is more severe than osteoarthritis and while not only confined to the joints, the hand joints are the most commonly affected.","Osteoporosis: a largely preventable condition whereby there is a progressive loss of bone density and a decrease in the strength of the skeleton, such that even a minor bump or accident can cause serious fractures. Often people are not aware they have osteoporosis because the condition lacks obvious symptoms. The condition is much more common in females than in males."],"q":"Which of these conditions is most associated with wear and tear?","opts":["The practically avoidably condition","An autoimmune condition","The deteriorating joint condition"],"key":"C","qja":"摩耗（wear and tear）と最も関連が深い疾患はどれか？","ja":"【筋骨格系疾患】関節炎と筋骨格系疾患には150以上の形態があるが、よくあるものは以下のとおり。変形性関節症：股関節・膝・足首といった体重を支える関節や、手・脊椎を侵す変性性の関節疾患。関節リウマチ：体の免疫系が自身の組織を攻撃する自己免疫疾患で、関節の摩耗を特徴とする変形性関節症とは異なる。変形性関節症より重く、関節に限らないが、最も侵されやすいのは手の関節である。骨粗鬆症：骨密度が進行性に失われ骨格の強度が低下し、軽くぶつけたり事故に遭っただけで重い骨折を起こしうる、ほぼ予防可能な疾患。明らかな症状がないため、気づいていないことが多い。男性より女性にはるかに多い。","o":[["ほぼ予防可能な疾患","❌ 骨粗鬆症（largely preventable）の説明。"],["自己免疫疾患","❌ 関節リウマチの説明。"],["関節が悪化していく疾患","✅ 変形性関節症（degenerative joint condition）。osteoarthritis which is characterized by wear and tear of joints と、関節リウマチの項で明記されている。"]],"exp":"wear and tear が出てくるのは関節リウマチの項だが、主語は osteoarthritis（which is characterized by wear and tear）。関係代名詞の先行詞を追えるかが勝負。degenerative＝deteriorating の言い換えも必要。","pt":"→ 型：キーワードが出た段落の見出しで即答しない。which / that の先行詞を確認して、何の説明かを特定する。","doubt":null,"voc":[["musculoskeletal","筋骨格系の"],["arthritis","関節炎"],["osteoarthritis","変形性関節症"],["degenerative","変性の・退行性の"],["weight-bearing joint","体重のかかる関節"],["spine","脊椎"],["rheumatoid arthritis","関節リウマチ"],["autoimmune disease","自己免疫疾患"],["wear and tear","摩耗・使い古し"],["confined to","〜に限られる"],["osteoporosis","骨粗鬆症"],["preventable","予防できる"],["bone density","骨密度"],["skeleton","骨格"],["fracture","骨折"],["deteriorating","悪化していく"]],"past":null},{"n":6,"title":"Pressure injuries are not inevitable","paras":["Some aged care providers suggest anyone can use available risk assessment tools to identify and rate a person's potential for pressure injury and implement treatment. However, while such tools may assist decision making, they cannot be relied on in isolation of knowledge and clinical assessment conclusions.","This is precisely where the importance of having the right skills mix in aged care comes into play. Research commissioned by the ANMF in 2016, in conjunction with Flinders University and the University of South Australia, provides evidence that a skills mix of registered nurses – 30%, enrolled nurse – 20% and personal care workers – 50%, is the minimum requirement \"to ensure safe residential and restorative care\" (Willis et al. 2016).","Registered nurses are equipped with the knowledge, backed by an evidence base, to undertake a comprehensive assessment of the potential for pressure injury and commence appropriate preventative measures, and/or, to institute required wound management systems for established pressure injuries."],"q":"What do the researchers identify as the lowest safe ratio of staff in an aged care setting?","opts":["Approximately 30% RNs, half personal care workers and the rest ENs.","Mostly personal care workers and an equal split of ENs and RNs.","50% personal care workers, 30% ENs and 20% RNs."],"key":"A","qja":"研究者が高齢者介護施設で最低限安全とする職員構成は何か？","ja":"【褥瘡は避けられないものではない】一部の介護事業者は、誰でも既存のリスク評価ツールを使って褥瘡の可能性を判定・評価し、対処できると主張する。しかしこうしたツールは意思決定を助けるものの、知識や臨床評価に基づく結論と切り離して頼ることはできない。まさにここで、高齢者介護における適切なスキルミックスの重要性が出てくる。2016年にANMFがフリンダース大学・南オーストラリア大学と共同で委託した研究は、正看護師30%、准看護師20%、介護職員50%というスキルミックスが『安全な入所ケアと回復期ケアを確保する』ための最低要件であることを示す証拠を提供している。正看護師は、エビデンスに裏づけられた知識を備え、褥瘡の可能性を包括的に評価して適切な予防策を始めたり、既存の褥瘡に必要な創傷管理体制を整えたりできる。","o":[["正看護師（RN）約30%、介護職員半数、残りが准看護師（EN）","✅ RN 30% ＋ PCW 50% ＋ 残り20%＝EN。数字を1つ伏せた言い換え。"],["大半が介護職員で、ENとRNが同数","❌ RN 30%とEN 20%で同数ではない。"],["介護職員50%、EN 30%、RN 20%","❌ RNとENの数字を入れ替えている。"]],"exp":"Cは数字の入れ替え、Aは『残り（the rest）』で1つを伏せた言い換え。3つの数字を役職と1対1で対応させる。","pt":"→ 型：割合の組み合わせ問題は、職種と数字のペアを本文から書き出して照合。入れ替え（swap）が定番の誤答。","doubt":null,"voc":[["pressure injury","褥瘡（床ずれ）"],["inevitable","避けられない"],["risk assessment tool","リスク評価ツール"],["rate","評価する・格付けする"],["implement","実施す const KEY = 'oet-reading-commute-v1';
const INTERVALS = [1, 3, 7, 21];
let S = load();
function load(){
  let s = null;
  try { s = JSON.parse(localStorage.getItem(KEY)); } catch(e){}
  s = Object.assign({items:{}, days:{}, fs:16, others:{}, resetAt:0}, (s && s.items) ? s : {});
  if (!s.dev) s.dev = Math.random().toString(36).slice(2, 10);
  for (const r of Object.values(s.items)) if (!r.ts) r.ts = Date.parse((r.last || '1970-01-01') + 'T12:00:00');
  return s;
}
function save(){ try { localStorage.setItem(KEY, JSON.stringify(S)); } catch(e){} }
/* 1日の解答数＝この端末＋同期した他端末の合計 */
function dayCount(d){ let n = S.days[d] || 0; for (const k in S.others) n += (S.others[k] || {})[d] || 0; return n; }

/* ---------- 端末間同期（GitHub 非公開Gist） ---------- */
const SYNC_KEY = 'oet-reading-commute-sync', GIST_FILE = 'oet-reading-commute.json', GIST_DESC = 'OET Reading commute sync (auto)';
let SY = (() => { try { return JSON.parse(localStorage.getItem(SYNC_KEY)) || {}; } catch(e) { return {}; } })();
const saveSY = () => { try { localStorage.setItem(SYNC_KEY, JSON.stringify(SY)); } catch(e){} };
let syncing = false, syncAgain = false, syncTimer = null;
async function gh(path, opts = {}){
  const res = await fetch('https://api.github.com' + path, Object.assign({cache:'no-store'}, opts, {headers:{
    'Authorization':'Bearer ' + SY.token, 'Accept':'application/vnd.github+json', 'Content-Type':'application/json'}}));
  if (!res.ok) throw new Error(res.status === 401 ? 'トークンが無効か期限切れです' : res.status === 403 || res.status === 404 ? 'トークンにgist権限がありません（' + res.status + '）' : 'GitHubエラー ' + res.status);
  return res.status === 204 ? null : res.json();
}
function syncDoc(){ return {v:1, resetAt:S.resetAt || 0, items:S.items, daysBy:Object.assign({}, S.others, {[S.dev]:S.days})}; }
function mergeRemote(R){
  if (!R || !R.items) return;
  const resetAt = Math.max(S.resetAt || 0, R.resetAt || 0);
  if (resetAt > (S.resetAt || 0)) { S.days = {}; S.others = {}; }
  const items = {};
  for (const src of [S.items, R.items]) for (const [id, r] of Object.entries(src)) {
    if ((r.ts || 0) < resetAt) continue;
    if (!items[id] || (r.ts || 0) > (items[id].ts || 0)) items[id] = r;
  }
  S.items = items; S.resetAt = resetAt;
  if ((R.resetAt || 0) >= resetAt) { const o = Object.assign({}, R.daysBy || {}); delete o[S.dev]; S.others = o; }
}
async function syncNow(){
  if (!SY.token) return;
  if (syncing) { syncAgain = true; return; }
  syncing = true; SY.state = 'syncing'; syncBadge();
  try {
    if (!SY.gistId) {
      const list = await gh('/gists?per_page=100');
      const g = list.find(x => x.files && x.files[GIST_FILE]);
      SY.gistId = g ? g.id : (await gh('/gists', {method:'POST', body:JSON.stringify({description:GIST_DESC, public:false, files:{[GIST_FILE]:{content:JSON.stringify(syncDoc())}}})})).id;
    }
    const g = await gh('/gists/' + SY.gistId);
    const f = g.files[GIST_FILE];
    let remoteText = f ? f.content : '';
    if (f && f.truncated) remoteText = await (await fetch(f.raw_url, {cache:'no-store'})).text();
    let remote = null; try { remote = JSON.parse(remoteText); } catch(e){}
    mergeRemote(remote); save();
    const mine = JSON.stringify(syncDoc());
    if (mine !== remoteText) await gh('/gists/' + SY.gistId, {method:'PATCH', body:JSON.stringify({files:{[GIST_FILE]:{content:mine}}})});
    SY.last = Date.now(); SY.state = 'ok'; SY.err = '';
  } catch(e) {
    SY.state = 'err'; SY.err = navigator.onLine === false ? 'オフライン（次にネットにつながったとき同期します）' : e.message;
  }
  saveSY(); syncing = false;
  if (!VIEW) render(); else syncBadge();
  if (syncAgain) { syncAgain = false; syncNow(); }
}
function syncSoon(){ if (!SY.token) return; clearTimeout(syncTimer); syncTimer = setTimeout(syncNow, 2000); }
function syncText(){
  if (!SY.token) return '';
  if (SY.state === 'syncing') return '☁️ 同期中…';
  if (SY.state === 'err') return '⚠️ 同期エラー：' + SY.err;
  if (SY.last) { const d = new Date(SY.last); return `☁️ 同期済み ${d.getMonth()+1}/${d.getDate()} ${String(d.getHours()).padStart(2,'0')}:${String(d.getMinutes()).padStart(2,'0')}`; }
  return '☁️ 同期待ち';
}
function syncBadge(){ const el = document.getElementById('syncbadge'); if (el) el.textContent = syncText(); }

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
const esc = s => String(s).replace(/[&<>"]/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;'}[c]));
const L = 'ABCD';
function today(d = new Date()){ const z = n => String(n).padStart(2,'0'); return `${d.getFullYear()}-${z(d.getMonth()+1)}-${z(d.getDate())}`; }
function addDays(ds, n){ const d = new Date(ds + 'T00:00:00'); d.setDate(d.getDate() + n); return today(d); }
function pastLabel(it, letter){ return it.past ? `R${+it.set}で誤答` + (letter ? `（${it.past}を選択）` : '') : ''; }

/* flatten items */
const ITEMS = [];
SETS.forEach(s => {
  s.B.forEach(b => ITEMS.push(Object.assign({part:'B', set:s.id, id:`${s.id}-B${b.n}`}, b)));
  s.C.forEach(c => ITEMS.push(Object.assign({part:'C', set:s.id, id:`${s.id}-C${c.n}`, text:s.texts[c.t]}, c)));
});
const BYID = Object.fromEntries(ITEMS.map(i => [i.id, i]));
const rec = id => S.items[id];
function status(it){
  const r = rec(it.id);
  if (!r) return 'new';
  if (r.due && r.due <= today()) return 'due';
  return r.lastOk ? 'ok' : 'ng';
}
function isWeak(it){ const r = rec(it.id); return (r && (!r.lastOk || r.wrong > 0)) || !!it.past; }

/* queue: 復習期限切れ → 未回答（過去誤答を優先）→ 最も古く解いたもの */
function nextItem(part, excludeId){
  const pool = ITEMS.filter(i => i.part === part && i.id !== excludeId);
  const t = today();
  const due = pool.filter(i => { const r = rec(i.id); return r && r.due && r.due <= t; })
                  .sort((a,b) => rec(a.id).due.localeCompare(rec(b.id).due));
  if (due.length) return due[0];
  const fresh = pool.filter(i => !rec(i.id));
  const freshPast = fresh.filter(i => i.past);
  if (freshPast.length) return freshPast[0];
  if (fresh.length) return fresh[0];
  return pool.slice().sort((a,b) => (rec(a.id).last || '').localeCompare(rec(b.id).last || ''))[0];
}

function answer(it, choice){
  const ok = choice === it.key || (it.alt || []).includes(choice);
  const t = today();
  const r = S.items[it.id] || {n:0, wrong:0, box:0, hist:[]};
  r.n++; if (!ok) r.wrong++;
  r.lastOk = ok; r.last = t; r.ts = Date.now(); r.hist.push([t, choice]); if (r.hist.length > 10) r.hist.shift();
  if (ok) {
    if (r.wrong === 0 && !it.past) { r.box = INTERVALS.length; r.due = null; }  // 初見で正解＝習得
    else { r.box = Math.min((r.box || 0) + 1, INTERVALS.length); r.due = r.box >= INTERVALS.length ? null : addDays(t, INTERVALS[r.box]); }
  } else { r.box = 0; r.due = addDays(t, INTERVALS[0]); }
  S.items[it.id] = r;
  S.days[t] = (S.days[t] || 0) + 1;
  save(); syncSoon();
  return ok;
}

function streak(){
  let n = 0, d = today();
  if (!dayCount(d)) d = addDays(d, -1);
  while (dayCount(d)) { n++; d = addDays(d, -1); }
  return n;
}

function openItem(id, from){ VIEW = {id, from}; render(); window.scrollTo(0,0); }

function renderList(part){
  $('#htitle').textContent = part === 'B' ? 'Part B（6問×10セット）' : 'Part C（16問×10セット）';
  const f = FILTER[part];
  const chips = [['all','すべて'],['new','未回答'],['weak','苦手'],['due','復習'],['past','過去の誤答']];
  const pass = it => f==='all' || (f==='new' && !rec(it.id)) || (f==='weak' && isWeak(it)) || (f==='due' && status(it)==='due') || (f==='past' && it.past);
  let html = `<div class="chips">${chips.map(([k,v]) => `<button class="chip ${f===k?'on':''}" data-f="${k}">${v}</button>`).join('')}</div>`;
  let any = false;
  SETS.forEach(s => {
    const its = ITEMS.filter(i => i.part===part && i.set===s.id && pass(i));
    if (!its.length) return; any = true;
    const all = ITEMS.filter(i => i.part===part && i.set===s.id);
    const okN = all.filter(i => rec(i.id) && rec(i.id).lastOk).length;
    html += `<div class="setblk"><h3><span>Set${s.id}${part==='C' ? ` · ${esc(s.texts[0].title)} / ${esc(s.texts[1].title)}` : ''}</span><span>${okN}/${all.length}</span></h3>`;

}

function highlight(text, ev){
  const i = text.indexOf(ev);
  if (i < 0) return esc(text);
  return esc(text.slice(0,i)) + '<mark>' + esc(ev) + '</mark>' + esc(text.slice(i + ev.length));
}

  const body = isB
    ? `<div class="sec"><h4>解説</h4><div class="body">${esc(it.exp)}</div></div>
       <div class="sec"><h4>ポイント</h4><div class="point">${esc(it.pt)}</div></div>${doubt}${voc}
       <details><summary>本文の和訳</summary><div class="body">${esc(it.ja)}</div></details>`
    : `<div class="sec"><h4>根拠（黄色マーカー）</h4><div class="point">${esc(it.note)}</div></div>${doubt}${voc}`;
  const nextLbl = VIEW.from === 'today' ? `次の${it.part}へ` : '次の問題';
  $('#after').innerHTML = `${res}${body}
    <div class="navrow"><button class="bigbtn ghost" id="back">戻る</button><button class="bigbtn ${isB?'b':'c'}" id="next">${nextLbl} →</button></div>`;
  $('#back').onclick = () => { VIEW = null; render(); window.scrollTo(0,0); };
  $('#next').onclick = () => {
    let n;
    if (VIEW.from === 'today') n = nextItem(it.part, it.id);
    else { const list = ITEMS.filter(i => i.part === it.part); n = list[(list.indexOf(it) + 1) % list.length]; }
    openItem(n.id, VIEW.from);
  };
  $('#after').scrollIntoView({behavior:'smooth', block:'start'});
}

function renderLog(){
  $('#htitle').textContent = '記録';
  const acc = part => {
    const rs = ITEMS.filter(i => i.part===part).map(i => rec(i.id)).filter(Boolean);
    const n = rs.reduce((a,r) => a + r.n, 0), w = rs.reduce((a,r) => a + r.wrong, 0);
    return {seen: rs.length, total: ITEMS.filter(i => i.part===part).length, rate: n ? Math.round((n - w) / n * 100) : null, now: rs.filter(r => r.lastOk).length};
  };
  const a = acc('B'), c = acc('C');
  const cells = part => SETS.map(s => {
    const its = ITEMS.filter(i => i.part===part && i.set===s.id);
    return `<div class="tiny" style="margin:6px 0 3px">Set${s.id}</div><div class="grid" style="grid-template-columns:repeat(16,1fr)">` +
      its.map(i => { const r = rec(i.id); const cls = !r ? '' : r.lastOk ? (r.wrong ? 'fix' : 'ok') : 'ng'; return `<div class="cell ${cls}" title="${i.id}"></div>`; }).join('') + '</div>';
  }).join('');
  let heat = '';
  for (let k = 27; k >= 0; k--) { const d = addDays(today(), -k), n = dayCount(d); heat += `<div class="${n>=6?'l3':n>=3?'l2':n>=1?'l1':''}" title="${d}: ${n}問"></div>`; }
  const weakC = ITEMS.filter(i => rec(i.id) && !rec(i.id).lastOk).length;
  $('#main').innerHTML = `
    <div class="card"><div class="stats">
      <div class="stat"><b>${a.rate ?? '–'}${a.rate!=null?'%':''}</b><span>B 正答率（${a.seen}/${a.total}問）</span></div>
      <div class="stat"><b>${c.rate ?? '–'}${c.rate!=null?'%':''}</b><span>C 正答率（${c.seen}/${c.total}問）</span></div>
      <div class="stat"><b>${weakC}</b><span>現在の苦手</span></div>
    </div></div>
    <div class="card"><div class="muted">直近4週間（連続 ${streak()} 日）</div><div class="heat">${heat}</div></div>
    <div class="card"><div class="muted">Part B</div>${cells('B')}
      <div class="legend"><span><i style="background:var(--ok)"></i>正解</span><span><i style="background:#15803d;outline:1px solid var(--bad)"></i>ミス後に正解</span><span><i style="background:var(--bad)"></i>直近不正解</span><span><i style="background:var(--line)"></i>未回答</span></div></div>
    <div class="card"><div class="muted">Part C</div>${cells('C')}</div>
    <div class="card"><div class="muted">iPhone・iPad間の同期（GitHubの非公開Gist）</div>
      ${SY.token ? `<p class="tiny" id="syncbadge" style="margin:8px 0 0">${esc(syncText())}</p>
        <div class="small-btns"><button id="syncgo">今すぐ同期</button><button id="syncoff">この端末の同期を解除</button></div>`
      : `<ol class="tiny" style="padding-left:18px;margin:8px 0">
          <li><a href="https://github.com/settings/tokens/new?scopes=gist&description=OET%20Reading%20sync" target="_blank" rel="noopener" style="color:var(--C)">GitHubのトークン作成画面</a>を開く（gistにだけチェックが入った状態で開きます）</li>
          <li>Expiration を選び（例：No expiration か 1年）、一番下の「Generate token」を押す</li>
          <li>表示された ghp_… をコピーして下に貼り付け、「接続」を押す</li>
          <li>iPad側でも同じトークンを貼り付ける（1台で作ったトークンを使い回してOK）</li></ol>
        <input id="tok" type="password" autocomplete="off" placeholder="ghp_…" style="width:100%;padding:10px;border-radius:10px;border:1px solid var(--line);background:var(--card2);color:var(--txt);font-size:16px">
        <div class="small-btns"><button id="syncon">接続</button></div>
        <p class="tiny">トークンはこの端末の中にだけ保存され、GitHub以外には送られません。</p>`}
    </div>
    <div class="card"><div class="muted">データ</div>
      <div class="small-btns"><button id="exp">バックアップをコピー</button><button id="imp">バックアップから復元</button><button id="rst">全記録をリセット</button></div></div>`;
  $('#exp').onclick = async () => { const t = JSON.stringify(S); try { await navigator.clipboard.writeText(t); alert('コピーしました'); } catch(e) { prompt('このテキストを保存してください', t); } };
  $('#imp').onclick = () => { const t = prompt('バックアップのテキストを貼り付け'); if (!t) return; try { const s = JSON.parse(t); if (!s.items) throw 0; const dev = S.dev; S = Object.assign({days:{}, fs:16, others:{}, resetAt:0}, s, {dev}); for (const r of Object.values(S.items)) r.ts = Date.now(); save(); syncSoon(); applyFs(); render(); alert('復元しました'); } catch(e) { alert('形式が正しくありません'); } };
  $('#rst').onclick = () => { if (confirm('すべての回答記録を消去します。' + (SY.token ? '同期中の他の端末からも消えます。' : '') + 'よろしいですか？')) { S.items = {}; S.days = {}; S.others = {}; S.resetAt = Date.now(); save(); render(); syncNow(); } };
  if ($('#syncon')) $('#syncon').onclick = () => { const t = $('#tok').value.trim(); if (!t) return; SY = {token:t}; saveSY(); render(); syncNow(); };
  if ($('#syncgo')) $('#syncgo').onclick = () => syncNow();
  if ($('#syncoff')) $('#syncoff').onclick = () => { if (confirm('この端末の同期を解除します（記録はこの端末に残ります）')) { SY = {}; saveSY(); render(); } };
}

/* font size */
function applyFs(){ document.documentElement.style.setProperty('--fs', S.fs + 'px'); }
$('#fsm').onclick = () => { S.fs = Math.max(13, S.fs - 1); applyFs(); save(); };
$('#fsp').onclick = () => { S.fs = Math.min(22, S.fs + 1); applyFs(); save(); };
document.querySelectorAll('nav button').forEach(b => b.onclick = () => setTab(b.dataset.tab));
applyFs(); render();
syncNow();
document.addEventListener('visibilitychange', () => { if (document.visibilityState === 'visible') syncNow(); });
window.addEventListener('online', () => syncNow());
if ('serviceWorker' in navigator && location.protocol === 'https:') navigator.serviceWorker.register('sw.js').catch(() => {});
</script>
</body>
</html>
