n tested on animals.","A promising new drug that treats heart failure has a bright future ahead."],"key":"B","ev":"researchers say an experimental drug used for the first time in humans may repair heart cells","note":"初めてヒトに使われた＝first human trial（B）。A・Dは『治療する』と断定しすぎ。","doubt":null,"alt":[],"voc":[["suitable title","ふさわしい見出し"],["promising","有望な"],["show promise","見込みを示す"],["for the first time in humans","ヒトで初めて"],["a bright future ahead","明るい前途"]],"oja":["有望な新薬が心不全を治療する。","心不全の新薬、ヒトでの初試験で有望性を示す。","心不全の新薬、動物実験で有望性を示す。","心不全を治療する有望な新薬に明るい未来。"],"past":null},{"n":15,"t":1,"p":0,"q":"What did past studies suggest about coffee and tea?","opts":["They produced clear evidence that they were harmful.","They produced clear evidence that they were beneficial.","They produced evidence that they could be either harmful or useful.","They didn't produce clear evidence on whether they are harmful or useful."],"key":"C","ev":"studies that seemed to swing between dire warnings and cheery promises","note":"悲観的警告と楽観的約束の間で揺れた＝有害にも有益にもなりうる（C）。","doubt":null,"alt":[],"voc":[["swing between","〜の間で揺れ動く"],["dire warning","深刻な警告"],["cheery promise","明るい期待・約束"],["caffeinated beverage","カフェイン入り飲料"],["regarding","〜に関して"],["beneficial","有益な"],["harmful","有害な"]],"oja":["有害だという明確な証拠を出していた。","有益だという明確な証拠を出していた。","有害にも有益にもなりうるという証拠を出していた。","有害か有益かについて明確な証拠を出していなかった。"],"past":null},{"n":16,"t":1,"p":1,"q":"According to some research","opts":["Coffee can be used as an effective treatment for Alzheimer's and Parkinson's diseases.","Alzheimer's and Parkinson's diseases can be caused by coffee.","Alzheimer's and Parkinson's diseases can effectively be prevented by coffee.","Drinking coffee may help with the prevention of Alzheimer's and Parkinson's diseases."],"key":"D","ev":"Other studies suggest drinking coffee might stave off Alzheimer's and Parkinson's diseases.","note":"might stave off＝予防に役立つ可能性（D）。Cの effectively は断定しすぎ。","doubt":null,"alt":[],"voc":[["suspected carcinogen","発がん性が疑われる物質"],["took coffee off its list","コーヒーをリストから外した"],["colon cancer","大腸がん"],["coming back","再発すること"],["stave off","食い止める・遠ざける"],["odds","可能性・見込み"],["prostate cancer","前立腺がん"],["prevention","予防"]],"oja":["コーヒーはアルツハイマー病やパーキンソン病の有効な治療に使える。","アルツハイマー病やパーキンソン病はコーヒーが原因で起こりうる。","アルツハイマー病やパーキンソン病はコーヒーで効果的に予防できる。","コーヒーを飲むことはアルツハイマー病やパーキンソン病の予防に役立つ可能性がある。"],"past":null},{"n":17,"t":1,"p":2,"q":"Which of these effects is not attributed to drinking tea?","opts":["Decreasing the risk of breast cancer.","Increasing blood pressure.","Strengthening the immune system.","Decreasing the risk of developing Alzheimer's disease."],"key":"B","ev":"polyphenols, which have been shown to lower blood pressure and cholesterol","note":"NOT。お茶は血圧を『下げる』。上げる（B）は逆。","doubt":null,"alt":[],"voc":[["pinpoint","正確に突き止める"],["compound","化合物・成分"],["antioxidant","抗酸化物質"],["boost the immune system","免疫を高める"],["polyphenol","ポリフェノール"],["cholesterol","コレステロール"],["formation of plaques","プラークの形成"],["brain-damaging","脳を損なう"],["attributed to","〜によるものとされる"]],"oja":["乳がんのリスクを下げること。","血圧を上げること。","免疫を強めること。","アルツハイマー病の発症リスクを下げること。"],"past":null},{"n":18,"t":1,"p":3,"q":"What does the fourth paragraph suggest?","opts":["That it's easy to determine the positive effects of coffee and tea.","That it's not easy to determine the positive effects of coffee and tea.","That it's not easy to determine which one is healthier: coffee or tea.","That the positive effects of coffee and tea are determined by their role in our diet."],"key":"C","ev":"Is one better for you than the other? Experts say that's hard to say.","note":"どちらが健康に良いか判断が難しい（C）。","doubt":null,"alt":[],"voc":[["separate out","切り分ける"],["ingredient","成分"],["body system","体の各系統"],["GI disease","消化器疾患"],["critical care medicine","集中治療医学"],["determine","見極める・判断する"]],"oja":["コーヒーと紅茶の良い効果は簡単に見極められるということ。","コーヒーと紅茶の良い効果は簡単には見極められないということ。","コーヒーと紅茶のどちらが健康に良いかは簡単には決められないということ。","コーヒーと紅茶の良い効果は、食事の中での役割で決まるということ。"],"past":null},{"n":19,"t":1,"p":4,"q":"What is Dr. Miller's opinion on the findings?","opts":["Coffee increases the risk of heart disease in 75% of the people who took part in the research.","Coffee has no effect on heart disease.","The fact that coffee has no effect on heart disease is noteworthy.","From now on, patients will stop asking doctors if coffee is safe to drink."],"key":"C","ev":"Coffee didn't have an effect either way on heart disease, but that was significant in itself","note":"影響がないこと自体が重要（C）。Bは事実だけで『意見』になっていない。","doubt":null,"alt":[],"voc":[["buildup of calcium","カルシウムの蓄積"],["supply blood to","〜に血液を送る"],["either way","どちらの方向にも"],["significant in itself","それ自体が重要な"],["coronary artery disease","冠動脈疾患"],["risk factor","危険因子"],["neutral","どちらでもない・中立の"],["noteworthy","注目に値する"]],"oja":["コーヒーは研究参加者の75%で心疾患のリスクを上げる。","コーヒーは心疾患に影響しない。","コーヒーが心疾患に影響しないという事実こそ注目に値する。","今後、患者は医師にコーヒーの安全性を尋ねなくなるだろう。"],"past":null},{"n":20,"t":1,"p":5,"q":"What makes coffee and tea beneficial, according to Cimperman?","opts":["A secret ingredient found in coffee and tea.","The relations among the complex ingredients coffee and tea contain","One single compound isolated by some scientists","The fact that they help to fight many different diseases"],"key":"B","ev":"It's more of a dynamic interaction than one single compound","note":"単一成分ではなく成分間の相互作用（B）。","doubt":null,"alt":[],"voc":[["complex beverage","成分が複雑な飲み物"],["a variety of","さまざまな"],["cancer-fighting properties","抗がん作用"],["dietitian","管理栄養士"],["dynamic interaction","動的な相互作用"],["isolated","単離された"],["relations among","〜の間の関係"]],"oja":["コーヒーと紅茶にある秘密の成分。","コーヒーと紅茶が含む複雑な成分どうしの関係。","一部の科学者が単離した単一の化合物。","多くの異なる病気と闘う助けになるという事実。"],"past":null},{"n":21,"t":1,"p":7,"q":"What does \"linear\" suggest in the seventh paragraph?","opts":["That the more coffee people drank the lower the risk of colon cancer was.","That coffee intake had no significant impact on colon cancer.","That drinking coffee is proportional to the recurrence of colon cancer.","That drinking coffee is proportional to the prevention of the recurrence of colon cancer."],"key":"A","ev":"\"The more coffee they drank, the lower risk of recurrence.\"","note":"linear＝飲むほど再発リスクが下がる（A）。","doubt":null,"alt":[],"voc":[["gastrointestinal","消化管の"],["regular drinking","習慣的に飲むこと"],["linear association","直線的な関連"],["recurrence","再発"],["contribute to","〜に寄与する"],["counsel","助言する"],["obesity","肥満"],["measure","対策"],["proportional to","〜に比例する"]],"oja":["コーヒーを多く飲むほど大腸がんのリスクが低かったということ。","コーヒー摂取は大腸がんに大きな影響を与えなかったということ。","コーヒーを飲むことは大腸がんの再発に比例するということ。","コーヒーを飲むことは大腸がん再発の予防に比例するということ。"],"past":null},{"n":22,"t":1,"p":8,"q":"Which of the following points is not made in the eighth paragraph?","opts":["Coffee can affect people differently.","People's lifestyles may play a part in whether they drink tea or coffee.","There is no connection between genetics and whether people drink tea or coffee.","Research has shown that there may be a connection between drinking coffee and smoking."],"key":"C","ev":"Other researchers are asking questions about what role genetics and lifestyle play","note":"NOT。遺伝の役割は『問われている』段階で、『関係がない』（C）とは言っていない。","doubt":null,"alt":[],"voc":[["play into","〜に影響する"],["genetics","遺伝（的要因）"],["went together","切り離せないものだった"],["process","（体内で）処理する"],["preference for","〜を好むこと"],["reflect","反映する"],["associated","関連がある"],["maintain weight","体重を保つ"]],"oja":["コーヒーは人によって影響が異なりうる。","生活習慣が、紅茶とコーヒーのどちらを飲むかに関係しているかもしれない。","遺伝と、紅茶・コーヒーのどちらを飲むかの間に関連はない。","コーヒーと喫煙に関連がありうることを研究が示している。"],"past":null}]},{"id":"10","texts":[{"title":"Déjà vu","paras":["Have you ever experienced déjà vu? If so, you are among the 60-70% of the population who has. The majority of those who report déjà vu are between the ages of 15 and 25.","Though some radical notions have in the past been connected to this strange feeling, such as déjà vu being momentarily aligning with a past life or another you in a parallel universe, scientists now believe it has a neurological basis.","Unfortunately, the feeling is here one minute and gone the next, making it difficult to study. Even so, there are quite a few theories on what causes it. One traditional hypothesis, posited by psychiatrists, is mismatched brain signals. For a second it feels as though we are transported to a moment in the past and we mistake it for the present. This may be why it has been associated with the idea of reincarnation.","Another theory is that déjà vu is our brain trying to piece together a situation on limited information. A third states that it is a misfiring in the parts of the brain that recall memory and decipher sensory input. Sensory information, rather than taking the proper channels, leaks out of the short-term memory and into the long-term one. In this way, current experiences seem to be connected to the past. Some studies even suggest that familiar geometric shapes give us a sense of knowing something about a place that is, in reality, totally unfamiliar to us.","Since we are completely aware of everything that's going on when we experience déjà vu, this suggests that every part of the brain need not participate for the sensation to take place. Psychologist Anne M. Cleary at Colorado State University, in a study in 2008, found that déjà vu followed patterns we associate with memory, specifically \"recognition memory\". This is the kind that gets us to understand that we are confronting something that we have seen or experienced before. If you have ever recognized a landmark, a friend from across the room, or a song on the stereo, you have experienced \"recognition memory.\"","Familiarity-based recognition is associated with recognition memory. Here, we have that feeling of familiarity, but we can't quite place where we've seen this person, place, or thing. For instance, you recognize someone across the street, but can't remember their name or where you know them from. Prof. Cleary conducted several studies which found that déjà vu is a form of familiarity-based recognition. Her work suggests that our memory stores items in fragments. When there is a certain overlap between old and new experiences, we have strong feelings about the connection, which we interpret as déjà vu.","Recent studies looking at epileptic patients made impressive breakthroughs in our understanding of the phenomenon. Epileptics with certain intractable conditions require electrodes to be placed inside their brains in order to locate the source of their seizures. During this procedure, some neurologists have had patients experience déjà vu. They soon discovered that the phenomenon takes place in the medial temporal lobe, which is responsible for memory. The electrodes are usually placed within the rhinal cortex—the most important piece of which is the hippocampus, the structure responsible for long-term memory formation. French scientists have found that firing current into this cortex can trigger an episode of déjà vu.","The French study, published in the journal Clinical Neurophysiology, measured EEG wave patterns from patients with epilepsy who experienced déjà vu through electrical stimulation. The areas of the brain they examined included the amygdala, which is responsible for emotion and the hippocampus. Researchers found that electrical patterns, emanating from rhinal cortices and the amygdala or the hippocampus, caused déjà vu to occur. These neuroscientists believe that some sort of electrical phenomenon in the medial temporal lobe activates the memory in such a way that it causes déjà vu to occur.","Stranger still, scientists in the UK have actually found patients who experience \"chronic déjà vu.\" In this case, experts identified four senior citizens who encounter the feeling on a consistent basis. What is the impact of such a phenomenon? It made them feel as if they were clairvoyant. All four refused to go to the doctor, believing they already knew what the physician would say, and avoided watching the news, thinking they already knew the outcome. That's because each time they took part in either activity, they came to the same result."]},{"title":"Gene Therapy.","paras":["Imagine healing the body without drugs or surgery, each of which can have nasty side effects. Instead, a physician uses the body's own building blocks to heal you. Instead of returning again and again, or having to take medication continually, one shot does it all. These are the promises of gene therapy.","The concept is easy to grasp. Genes control proteins that in turn control all of our body's functions. When a faulty gene, usually due to a mutation, malfunctions and causes disease, all that would have to be done is to \"knock out\" or replace the faulty gene. Once the correct protein enters the system, the disease is finished. It is, however, the replacement process that is complicated.","One problem is exactly how to deliver a gene to a patient's DNA. To do that, scientists create a custom virus that infects a target cell, yet flies under the immune system's radar. By doing so, the virus leaves its own genetic material inside the cell. That cell begins to reproduce, carrying the gene with it, and spreading it throughout the body.","Gene therapies are not currently approved by the FDA. Dozens of clinical trials are ongoing, however. This cutting-edge therapy is approved to treat one particular disorder in Europe—lipoprotein lipase deficiency, where the patient cannot break down fat. Another use will soon be approved, to treat combined immune deficiency, or the \"bubble boy\" disease.","Other conditions it is expected to someday treat include heart disease, diabetes, some forms of cancer, muscular dystrophy, immune disorders, genetic disorders, AIDS, hemophilia, and certain blindness-causing conditions. With AIDS, gene therapy will be used in a different way. The HIV virus camouflages itself from the immune system. Gene therapy can make its presence known, allowing it to be recognized and destroyed.","The things researchers look at when evaluating a new therapy is its safety profile, how effective it is, and what a proper dosage may look like. Just like any therapy, things can go wrong. For instance, altered viruses could change back into their original form, causing infection. Sometimes the wrong cell is approached by the virus. Or the virus places the gene in the wrong place within a cell's DNA. In this last case, healthy cells may become damaged or cause illness, even develop into a tumor.","There have been stumbling blocks along the way. Keep in mind that all clinical trials are monitored by the FDA and the National Institutes of Health (NIH). Even so, gene therapy almost went bust in 1999 when a volunteer, 19-year-old Jesse Gelsinger, died during testing. The Arizona teen's immune system reacted violently as a result of the treatment. Gene therapy lost its innocence and many young, promising scientists decided to put their efforts elsewhere, setting the field back. A year after that, during a French trial, some participants developed leukemia.","After these incidents, dozens of clinical trials ceased and funding was pulled. Researchers learned a lot from these disturbing tragedies, and put stringent safety controls in place. They have since discovered how to deliver genes using viruses in a safe and effective manner that doesn't set off the immune system.","Researchers have also implemented guidelines that help monitor patients and administer to side effects. A few successes then brought gene therapy back from the brink. In 2008, some blind subjects reported improvements in vision. Shortly after, in another experiment, 80% of \"bubble boy\" children regained immune system function.","The efficacy of gene therapy today is not constant throughout, but varies from one condition to the next. A recent study using the therapy to treat muscular dystrophy saw impressive results. A 2013 study was even more dramatic, where a small clutch of patients with leukemia were cured. Other studies on hemophilia and one cause of blindness, retinitis pigmentosa, have also seen remarkable results.","There have been other trials however that have not been so encouraging. One for congestive heart failure ended in \"disappointing\" results, and another for Parkinson's ended in what researchers called a \"mixed bag.\" One problem that must be overcome, the immune system sometimes does recognize and take out the viral messenger."]}],"B":[{"n":1,"title":"Memo to public health workers: A reminder about the safe and correct use of condoms","paras":["A batch of Durex Real Feel condoms was recently recalled internationally because of their tendency to burst before their expiry date. This has prompted a reminder about the safe use of condoms, including making sure you're aware of the expiry date.","As a product ages, it has a higher potential to fail, so it is important to always check the use-by date before using a condom and make sure you know how to use a condom correctly. Taking the right precautions will help manage the spread of disease and reduce the likelihood of unwanted consequences, such as pregnancy.","Durex Real Feel condoms from batch 1000432443 (expiry January 2021) should not be used. No other condoms are affected by this issue."],"q":"What guidance do staff need to give to their patients to limit the chance of condoms failing?","opts":["Open the packaging to see if the condom has burst.","Check the condom expiry date and put one on correctly.","Discard the condom if it is a Durex Real Feel."],"key":"B","qja":"コンドームの破損を減らすため、スタッフは患者にどんな指導をする必要があるか？","ja":"【公衆衛生従事者宛メモ：コンドームの安全で正しい使用についての注意喚起】Durex Real Feelコンドームの一部ロットが、使用期限前に破れやすいとして国際的に回収された。これを受け、使用期限の確認を含むコンドームの安全な使用について改めて注意喚起する。製品は古くなるほど破損しやすくなるため、使用前に必ず使用期限を確認し、正しい使い方を知っておくことが重要である。適切な予防策をとることは、病気の拡大を抑え、妊娠などの望まない結果の可能性を減らす。Durex Real Feelコンドームのロット1000432443（使用期限2021年1月）は使用しないこと。その他のコンドームはこの問題の影響を受けない。","o":[["包装を開けてコンドームが破れていないか確認する","❌ 本文にない指導。"],["使用期限を確認し、正しく装着する","✅ always check the use-by date … and make sure you know how to use a condom correctly。"],["Durex Real Feelなら捨てる","❌ 使用中止は特定のロット（batch 1000432443）だけ。No other condoms are affected。"]],"exp":"Cは範囲の拡大（特定ロット→製品全体）。回収情報の設問では対象範囲（batch, expiry）を必ず確認する。","pt":"→ 型：回収・注意喚起は『どのロット・どの期限』まで限定されているかを確認。製品名全体に広げた選択肢は誤り。","doubt":null,"voc":[["batch","製造ロット"],["recalled","回収された"],["tendency","傾向"],["burst","破れる・破裂する"],["expiry date","使用期限"],["prompt","促す・きっかけとなる"],["use-by date","使用期限"],["precaution","予防策"],["likelihood","可能性"],["consequence","結果"],["discard","廃棄する"]],"past":null},{"n":2,"title":"Directive: compliance is mandatory – Introduction","paras":["SA Health is responsible for ensuring Local Health Networks provide comprehensive, timely and high-quality health services in South Australian (SA) public hospitals. Approximately 46,000 elective surgery procedures are performed each year in South Australian (SA) metropolitan public hospitals and approximately 16,000 elective surgery procedures in country hospitals.","Patients requiring elective surgery have been assessed by a medical practitioner or authorised delegate as needing surgery for a medical condition, but for which admission can be delayed for at least 24 hours. These patients are placed on a booking list and treated according to the clinical urgency category assigned by the treating medical practitioner. SA Health Elective Surgery Policy Framework and Associated Procedural Guidelines (Policy Framework) has been developed to provide a consistent, structured approach to support the provision of elective surgery within SA Health public hospitals."],"q":"What is the purpose of the SA Health Elective Surgery Policy Framework and Associated Procedural Guidelines?","opts":["To ensure all patients have an operation within 24 hours of being referred for publicly funded surgery.","To make sure GPs know the process for referring patients for publicly funded surgery.","To ensure all patients in SA get equal access to the publicly funded operation they need."],"key":"C","qja":"SA Health 待機手術方針枠組みと関連手順ガイドラインの目的は何か？","ja":"【指令：遵守義務あり－序論】SA Healthは、地域保健ネットワークが南オーストラリア州の公立病院で包括的で適時の質の高い医療を提供することに責任を負う。南豪州の都市部の公立病院では年間約46,000件、地方の病院では約16,000件の待機手術が行われている。待機手術を要する患者とは、医師または権限を与えられた者によって病状に対する手術が必要と評価されたが、入院を少なくとも24時間は遅らせられる患者である。こうした患者は予約リストに載せられ、担当医が割り当てた臨床的緊急度区分に従って治療される。SA Health待機手術方針枠組み（Policy Framework）は、SA Healthの公立病院での待機手術の提供を支える一貫した体系的なアプローチを示すために策定された。","o":[["公費手術に紹介されたすべての患者が24時間以内に手術を受けられるようにする","❌ 24時間は『入院を少なくとも24時間遅らせられる』という待機手術の定義。24時間以内に手術する話ではなく逆。"],["GPが公費手術への紹介手順を理解できるようにする","❌ GPや紹介手順の話はない。"],["南豪州のすべての患者が必要な公費手術に公平にアクセスできるようにする","✅ 公式キーC。a consistent, structured approach（一貫した体系的アプローチ）＝どの病院でも同じ基準で＝公平なアクセス。"]],"exp":"目的文は最終文の has been developed to provide … 。consistent を『公平（equal access）』に言い換えられるかが勝負。Aは数字24の意味の逆転。","pt":"→ 型：purpose 問題は developed to / aims to / in order to の後ろを探す。数字の意味（at least 24h delay）を逆にした選択肢に注意。","doubt":null,"voc":[["comprehensive","包括的な"],["timely","適時の"],["elective surgery","待機（予定）手術"],["metropolitan","都市部の"],["medical practitioner","医師"],["authorised delegate","権限を委任された者"],["admission","入院"],["booking list","予約リスト"],["clinical urgency category","臨床的な緊急度区分"],["consistent","一貫した"],["structured approach","体系立てたやり方"],["provision","提供"],["publicly funded","公費による"]],"past":null},{"n":3,"title":"Women at lower risk of cesarean section when they're induced","paras":["For most women, labor naturally starts between weeks 37 and 42 of pregnancy. When a woman is induced, doctors break her waters and make the uterus contract more strongly to bring on labor deliberately. There's a variety of reasons why a woman might be induced in this way including that the baby is overdue, that the baby doesn't seem to be growing well, or that the mother has a health condition that can make labor trickier, like high blood pressure.","But the women in the study didn't have any of those problems, and none had given birth before. The researchers wanted to see whether inducing labor was better than waiting in women who didn't otherwise need to be induced for health reasons. Half of the pregnant women were randomly sorted into a group that would be induced at 39 weeks, while the other half would instead go through \"expectant management\", where they simply waited for labor to come. The researchers found that women who had a labor induction were 15 percent less likely to need a cesarean delivery."],"q":"What was the selection criteria for women to be included in this research project?","opts":["42 weeks pregnant and the baby has stopped growing.","No problems and a first time mum.","A first time mum whose waters had broken."],"key":"B","qja":"この研究に女性が組み入れられた選択基準は何か？","ja":"【誘発分娩の方が帝王切開のリスクが低い】ほとんどの女性では、陣痛は妊娠37〜42週の間に自然に始まる。誘発する場合、医師は破水させ子宮の収縮を強めて意図的に陣痛を起こす。誘発する理由には、予定日超過、赤ちゃんの発育不良、高血圧など分娩を難しくしうる母体の疾患など様々なものがある。しかし研究の女性たちはそのような問題を抱えておらず、全員が出産経験がなかった。研究者は、健康上の理由で誘発する必要のない女性で、誘発が待機より良いかどうかを調べたかった。妊婦の半数を無作為に39週で誘発する群に、残り半数を陣痛が来るのを待つだけの『待機的管理』群に割り付けた。誘発群の女性は帝王切開が必要になる可能性が15%低かった。","o":[["妊娠42週で赤ちゃんの発育が止まっている","❌ 発育不良は『誘発する理由の例』で、研究の女性はそうした問題がなかった。"],["問題がなく初産である","✅ the women in the study didn't have any of those problems, and none had given birth before。"],["破水した初産婦","❌ 破水は誘発の手技（doctors break her waters）であって選択基準ではない。"]],"exp":"But the women in the study … が転換点。前段の一般論（誘発の理由）と、研究対象（問題なし・初産）を区別する。","pt":"→ 型：一般論 → But 研究では… の構造。But 以降の対象集団の説明が選択基準。","doubt":null,"voc":[["cesarean section","帝王切開"],["induce","（陣痛を）誘発する"],["labor","陣痛・分娩"],["break her waters","破水させる"],["contract","収縮する"],["bring on","引き起こす"],["deliberately","意図的に"],["overdue","予定日を過ぎた"],["trickier","より難しい"],["given birth","出産した"],["randomly sorted","無作為に振り分けられた"],["expectant management","待機的管理（経過を見る方針）"],["selection criteria","選択基準"]],"past":null},{"n":4,"title":"Drug categories of concern in the elderly: anticoagulants","paras":["Age may increase sensitivity to the anticoagulant effect of warfarin. Careful dosing and routine monitoring can largely overcome the increased risk of bleeding in elderly patients taking warfarin. Also, because drug interactions with warfarin are common, closer monitoring is necessary when new drugs are added or old ones are stopped; computerized drug interaction programs should be consulted if patients take multiple drugs.","Patients should also be monitored for warfarin interactions with food, alcohol, and OTC drugs and supplements. The newer anticoagulants (dabigatran, rivaroxaban, apixaban) may be easier to dose and have fewer drug-drug interactions and food-drug interactions than warfarin, but still increase the risk of bleeding in elderly patients, particularly those with impaired renal function."],"q":"From this article, what is the most important role of health professionals when they are caring for an elderly person taking anticoagulants?","opts":["Ongoing and regular reviews.","Frequently checking for bleeding.","Prescribing anticoagulants other than warfarin."],"key":"A","qja":"この記事によれば、抗凝固薬を服用する高齢者のケアで医療者の最も重要な役割は何か？","ja":"【高齢者で注意すべき薬剤群：抗凝固薬】加齢はワルファリンの抗凝固作用への感受性を高めうる。慎重な用量設定と定期的なモニタリングにより、ワルファリン服用中の高齢者の出血リスク増加はおおむね克服できる。また、ワルファリンとの薬物相互作用はよくあるため、新しい薬を追加・中止する際はより綿密なモニタリングが必要で、多剤服用の患者ではコンピューターの相互作用チェックを参照すべきである。食物、アルコール、OTC薬、サプリメントとの相互作用についてもモニターすべきである。新しい抗凝固薬（ダビガトラン、リバーロキサバン、アピキサバン）は用量設定が容易で、薬物・食物相互作用もワルファリンより少ない可能性があるが、それでも高齢者、特に腎機能障害のある人の出血リスクを高める。","o":[["継続的で定期的なレビュー（見直し）","✅ careful dosing and routine monitoring / closer monitoring / should also be monitored と、monitoring（継続的チェック）が繰り返される。"],["出血がないか頻繁に確認する","❌ 本文のモニタリング対象は用量・相互作用。『出血の有無を頻繁に確認』とは書いていない。"],["ワルファリン以外の抗凝固薬を処方する","❌ 新しい薬も出血リスクを高めると述べており、推奨はしていない。"]],"exp":"本文で繰り返されるキーワード（monitoring が4回）が主旨。Bは出血（bleeding）という本文の語を使っているが、monitoring の対象を取り違えている。","pt":"→ 型：most important を問われたら、本文で繰り返される語（monitoring）を探す。反復＝筆者の強調。","doubt":null,"voc":[["anticoagulant","抗凝固薬"],["sensitivity","感受性"],["warfarin","ワルファリン"],["dosing","用量設定"],["routine monitoring","定期的な経過観察"],["overcome","克服する"],["bleeding","出血"],["drug interaction","薬物相互作用"],["consulted","参照される"],["OTC drug","市販薬"],["supplement","サプリメント"],["impaired renal function","腎機能障害"],["review","見直し・再評価"]],"past":null},{"n":5,"title":"Musculoskeletal conditions","paras":["There are more than 150 forms of arthritis and musculoskeletal conditions, but the more common conditions include:","Osteoarthritis: a degenerative joint condition affecting the weight-bearing joints such as the hips, knees and ankles and well as the hands and spine.","Rheumatoid arthritis: an autoimmune disease where the body's immune system attacks its own tissues, and thus differs from osteoarthritis which is characterized by wear and tear of joints. It is more severe than osteoarthritis and while not only confined to the joints, the hand joints are the most commonly affected.","Osteoporosis: a largely preventable condition whereby there is a progressive loss of bone density and a decrease in the strength of the skeleton, such that even a minor bump or accident can cause serious fractures. Often people are not aware they have osteoporosis because the condition lacks obvious symptoms. The condition is much more common in females than in males."],"q":"Which of these conditions is most associated with wear and tear?","opts":["The practically avoidably condition","An autoimmune condition","The deteriorating joint condition"],"key":"C","qja":"摩耗（wear and tear）と最も関連が深い疾患はどれか？","ja":"【筋骨格系疾患】関節炎と筋骨格系疾患には150以上の形態があるが、よくあるものは以下のとおり。変形性関節症：股関節・膝・足首といった体重を支える関節や、手・脊椎を侵す変性性の関節疾患。関節リウマチ：体の免疫系が自身の組織を攻撃する自己免疫疾患で、関節の摩耗を特徴とする変形性関節症とは異なる。変形性関節症より重く、関節に限らないが、最も侵されやすいのは手の関節である。骨粗鬆症：骨密度が進行性に失われ骨格の強度が低下し、軽くぶつけたり事故に遭っただけで重い骨折を起こしうる、ほぼ予防可能な疾患。明らかな症状がないため、気づいていないことが多い。男性より女性にはるかに多い。","o":[["ほぼ予防可能な疾患","❌ 骨粗鬆症（largely preventable）の説明。"],["自己免疫疾患","❌ 関節リウマチの説明。"],["関節が悪化していく疾患","✅ 変形性関節症（degenerative joint condition）。osteoarthritis which is characterized by wear and tear of joints と、関節リウマチの項で明記されている。"]],"exp":"wear and tear が出てくるのは関節リウマチの項だが、主語は osteoarthritis（which is characterized by wear and tear）。関係代名詞の先行詞を追えるかが勝負。degenerative＝deteriorating の言い換えも必要。","pt":"→ 型：キーワードが出た段落の見出しで即答しない。which / that の先行詞を確認して、何の説明かを特定する。","doubt":null,"voc":[["musculoskeletal","筋骨格系の"],["arthritis","関節炎"],["osteoarthritis","変形性関節症"],["degenerative","変性の・退行性の"],["weight-bearing joint","体重のかかる関節"],["spine","脊椎"],["rheumatoid arthritis","関節リウマチ"],["autoimmune disease","自己免疫疾患"],["wear and tear","摩耗・使い古し"],["confined to","〜に限られる"],["osteoporosis","骨粗鬆症"],["preventable","予防できる"],["bone density","骨密度"],["skeleton","骨格"],["fracture","骨折"],["deteriorating","悪化していく"]],"past":null},{"n":6,"title":"Pressure injuries are not inevitable","paras":["Some aged care providers suggest anyone can use available risk assessment tools to identify and rate a person's potential for pressure injury and implement treatment. However, while such tools may assist decision making, they cannot be relied on in isolation of knowledge and clinical assessment conclusions.","This is precisely where the importance of having the right skills mix in aged care comes into play. Research commissioned by the ANMF in 2016, in conjunction with Flinders University and the University of South Australia, provides evidence that a skills mix of registered nurses – 30%, enrolled nurse – 20% and personal care workers – 50%, is the minimum requirement \"to ensure safe residential and restorative care\" (Willis et al. 2016).","Registered nurses are equipped with the knowledge, backed by an evidence base, to undertake a comprehensive assessment of the potential for pressure injury and commence appropriate preventative measures, and/or, to institute required wound management systems for established pressure injuries."],"q":"What do the researchers identify as the lowest safe ratio of staff in an aged care setting?","opts":["Approximately 30% RNs, half personal care workers and the rest ENs.","Mostly personal care workers and an equal split of ENs and RNs.","50% personal care workers, 30% ENs and 20% RNs."],"key":"A","qja":"研究者が高齢者介護施設で最低限安全とする職員構成は何か？","ja":"【褥瘡は避けられないものではない】一部の介護事業者は、誰でも既存のリスク評価ツールを使って褥瘡の可能性を判定・評価し、対処できると主張する。しかしこうしたツールは意思決定を助けるものの、知識や臨床評価に基づく結論と切り離して頼ることはできない。まさにここで、高齢者介護における適切なスキルミックスの重要性が出てくる。2016年にANMFがフリンダース大学・南オーストラリア大学と共同で委託した研究は、正看護師30%、准看護師20%、介護職員50%というスキルミックスが『安全な入所ケアと回復期ケアを確保する』ための最低要件であることを示す証拠を提供している。正看護師は、エビデンスに裏づけられた知識を備え、褥瘡の可能性を包括的に評価して適切な予防策を始めたり、既存の褥瘡に必要な創傷管理体制を整えたりできる。","o":[["正看護師（RN）約30%、介護職員半数、残りが准看護師（EN）","✅ RN 30% ＋ PCW 50% ＋ 残り20%＝EN。数字を1つ伏せた言い換え。"],["大半が介護職員で、ENとRNが同数","❌ RN 30%とEN 20%で同数ではない。"],["介護職員50%、EN 30%、RN 20%","❌ RNとENの数字を入れ替えている。"]],"exp":"Cは数字の入れ替え、Aは『残り（the rest）』で1つを伏せた言い換え。3つの数字を役職と1対1で対応させる。","pt":"→ 型：割合の組み合わせ問題は、職種と数字のペアを本文から書き出して照合。入れ替え（swap）が定番の誤答。","doubt":null,"voc":[["pressure injury","褥瘡（床ずれ）"],["inevitable","避けられない"],["risk assessment tool","リスク評価ツール"],["rate","評価する・格付けする"],["implement","実施する"],["in isolation of","〜から切り離して"],["skills mix","職種・技能の構成"],["come into play","効いてくる・関わってくる"],["commissioned","委託された"],["in conjunction with","〜と共同で"],["registered nurse","正看護師"],["enrolled nurse","准看護師"],["restorative care","回復期のケア"],["equipped with","〜を備えた"],["undertake","引き受ける・実施する"],["commence","開始する"],["institute","（制度などを）設ける"]],"past":null}],"C":[{"n":7,"t":0,"p":0,"q":"What does the first paragraph infer about déjà vu?","opts":["Only young people get déjà vu","As the people get older, their déjà vu episodes will stop","Some people may never get déjà vu","None of the above"],"key":"C","ev":"If so, you are among the 60-70% of the population who has.","note":"60〜70%が経験＝経験しない人もいる（C）。Aは majority（大半）を only に強めた誤答。","doubt":null,"alt":[],"voc":[["déjà vu","既視感（デジャヴ）"],["the majority of","〜の大多数"],["population","人口・集団"],["infer","推測させる"]],"oja":["デジャヴを経験するのは若い人だけである","年をとるとデジャヴは起こらなくなる","一度も経験しない人もいるかもしれない","上記のいずれでもない"],"past":null},{"n":8,"t":0,"p":1,"q":"In the second paragraph, which of the following is new information about déjà vu?","opts":["It is a demonstration of a parallel existence of some experience from the past in the present","It demonstrates the existence of a being in another parallel world","Neuroscientists may be able to offer an explanation","It has given rise to some extreme interpretations"],"key":"C","ev":"scientists now believe it has a neurological basis","note":"新情報＝神経学的基盤がある（C）。前世・並行宇宙は過去の説。","doubt":null,"alt":[],"voc":[["radical notion","極端な考え"],["momentarily","一瞬の間"],["align with","〜と重なる・一致する"],["past life","前世"],["parallel universe","並行宇宙"],["neurological basis","神経学的な基盤"],["given rise to","生じさせた"],["interpretation","解釈"]],"oja":["過去の経験が現在に並行して存在することの表れである","別の並行世界に存在があることを示している","神経科学者が説明を示せるかもしれない","いくつかの極端な解釈を生んできた"],"past":null},{"n":9,"t":0,"p":2,"q":"In the third paragraph, the feeling of déjà vu is described as:","opts":["Fleeting","Quick","Difficult","Unreal"],"key":"A","ev":"the feeling is here one minute and gone the next","note":"来たと思えば消える＝つかの間（A）。","doubt":null,"alt":[],"voc":[["here one minute and gone the next","現れたかと思えばすぐ消える"],["even so","それでも"],["hypothesis","仮説"],["posited","提唱された"],["mismatched","かみ合わない"],["transported","運ばれる（感覚になる）"],["mistake it for","それを〜と取り違える"],["reincarnation","輪廻転生"],["fleeting","つかの間の"]],"oja":["つかの間の","素早い","難しい","現実味のない"],"past":null},{"n":10,"t":0,"p":3,"q":"What aspect of déjà vu are the described theories primarily attempting to explain in the fourth paragraph?","opts":["The parapsychological origins of déjà vu.","The specific brain mechanisms involved in déjà vu.","The scientific basis for the experience of déjà vu.","The sensory triggers that lead to déjà vu."],"key":"C","ev":"Another theory is that déjà vu is our brain trying to piece together a situation on limited information.","note":"公式キーC：科学的基盤の説明。","doubt":"⚠️ 第4段落の説は脳の仕組みの説明が中心で、Bも有力。段落末の幾何学的形状の研究は脳機構ではないため、より広いCがキー。","alt":[],"voc":[["piece together","つなぎ合わせる"],["misfiring","誤作動・誤発火"],["recall memory","記憶を呼び起こす"],["decipher","読み解く"],["sensory input","感覚入力"],["proper channel","本来の経路"],["leak out of","〜から漏れ出す"],["geometric shape","幾何学的な形"],["unfamiliar","なじみのない"],["parapsychological","超心理学的な"],["mechanism","仕組み"]],"oja":["デジャヴの超心理学的な起源。","デジャヴに関わる具体的な脳の仕組み。","デジャヴという体験の科学的な基盤。","デジャヴを引き起こす感覚的な誘因。"],"past":null},{"n":11,"t":0," ginal form, causing infection","note":"ウイルスが害なく正しく働くか（C）。A・Bは評価項目で、リスクではない。","doubt":null,"alt":[],"voc":[["evaluate","評価する"],["safety profile","安全性の特徴"],["proper dosage","適切な用量"],["go wrong","うまくいかない"],["altered","改変された"],["original form","元の形"],["approached","近づかれる・取り込まれる"],["tumor","腫瘍"],["ensure","確実にする"],["costly","費用のかかる"]],"oja":["適切な投与量を決めること。","治療全体の有効性を評価すること。","使うウイルスが害を与えずに正しく働くようにすること。","治療費が高くなりすぎないようにすること。"],"past":null},{"n":19,"t":1,"p":6,"q":"What is the author referring to when he says that \"there have been stumbling blocks along the way\"?","opts":["The obstacles the researchers faced during clinical trials","The obstacles created by the FDA and the National Institutes of Health (NIH).","The fact that some patients died during the clinical trial.","The fact that some patients developed leukemia during the clinical trial."],"key":"A","ev":"There have been stumbling blocks along the way.","note":"stumbling blocks＝臨床試験中に直面した障害（A）。死亡・白血病はその具体例。","doubt":null,"alt":[],"voc":[["stumbling block","つまずきの石・障害"],["keep in mind","心に留めておく"],["monitored","監視される"],["went bust","頓挫しかけた"],["react violently","激しい反応を起こす"],["lost its innocence","純真さを失った（幻想が崩れた）"],["setting the field back","その分野を後退させること"],["leukemia","白血病"],["obstacle","障害"]],"oja":["研究者が臨床試験で直面した障害","FDAと国立衛生研究所（NIH）が作り出した障害","臨床試験中に亡くなった患者がいたという事実","臨床試験中に白血病を発症した参加者がいたという事実"],"past":null},{"n":20,"t":1,"p":7,"q":"What did these incidents contribute to?","opts":["Discovering how to use viruses to deliver genes.","Finding safer methods and following protocols for monitoring patients","Finding a way to improve sight in blind people.","Finding a way to treat \"bubble boy\" disease."],"key":"B","ev":"put stringent safety controls in place","note":"より安全な方法とモニタリングの指針（B）。","doubt":null,"alt":[],"voc":[["incident","出来事・事故"],["cease","中止する"],["funding was pulled","資金が引き揚げられた"],["disturbing","衝撃的な・心を乱す"],["tragedy","悲劇"],["stringent","厳格な"],["in place","整備された状態で"],["set off","（反応を）引き起こす"],["protocol","手順"]],"oja":["ウイルスを使って遺伝子を届ける方法の発見。","より安全な方法の確立と、患者を見守る手順の整備。","目の見えない人の視力を改善する方法の発見。","「バブルボーイ病」の治療法の発見。"],"past":null},{"n":21,"t":1,"p":9,"q":"What does the author imply about gene therapy in the tenth paragraph?","opts":["That all diseases can be treated with equal success.","That not all diseases can be treated with equal success.","That the leukemia treatment is more successful than the treatment for hemophilia.","Some diseases can be completely cured."],"key":"B","ev":"The efficacy of gene therapy today is not constant throughout, but varies from one condition to the next.","note":"疾患によって効果が異なる（B）。","doubt":null,"alt":[],"voc":[["efficacy","有効性"],["constant","一定の"],["varies from one condition to the next","疾患ごとに異なる"],["impressive","目を見張る"],["a small clutch of","ごく少数の"],["cured","治癒した"],["hemophilia","血友病"],["retinitis pigmentosa","網膜色素変性症"],["remarkable","注目に値する"]],"oja":["すべての病気が同じように治せるということ。","すべての病気が同じように治せるわけではないということ。","白血病の治療は血友病の治療より成功しているということ。","完全に治せる病気もあるということ。"],"past":null},{"n":22,"t":1,"p":10,"q":"What is the author describing in the final paragraph?","opts":["Failures of gene therapy.","Disappointing results that gene therapy produced for Parkinson's disease.","The mixed results that gene therapy has produced.","The gene therapy trials that have not produced promising results."],"key":"C","ev":"There have been other trials however that have not been so encouraging.","note":"公式キーC：まちまちな結果。","doubt":"⚠️ 段落は『期待外れの試験』の説明で、Dの方が素直に見える。キーは mixed bag を含む段落全体を『まちまち』と捉えてC。","alt":[],"voc":[["encouraging","期待の持てる"],["congestive heart failure","うっ血性心不全"],["disappointing","期待外れの"],["a mixed bag","良し悪しが入り混じったもの"],["overcome","克服する"],["take out","排除する"],["viral messenger","遺伝子を運ぶウイルス"],["failure","失敗"]],"oja":["遺伝子治療の失敗。","パーキンソン病に対して遺伝子治療が出した期待外れの結果。","遺伝子治療が出してきた、良し悪しの入り混じった結果。","有望な結果が出なかった遺伝子治療の試験。"],"past":null}]},{"id":"O1","texts":[{"title":"Asbestosis","paras":["Asbestos is a naturally occurring mineral that has been linked to human lung disease. It has been used in a huge number of products due to its high tensile strength, relative resistance to acid and temperature, and its varying textures and degrees of flexibility. It does not evaporate, dissolve, burn or undergo significant reactions with other chemicals. Because of the widespread use of asbestos, its fibres are ubiquitous in the environment. Building insulation materials manufactured since 1975 should no longer contain asbestos; however, products made or stockpiled before this time remain in many homes. Indoor air may become contaminated with fibres released from building materials, especially if they are damaged or crumbling.","One of the three types of asbestos-related diseases is asbestosis, a process of lung tissue scarring caused by asbestos fibres. The symptoms of asbestosis usually include slowly progressing shortness of breath and cough, often 20 to 40 years after exposure. Breathlessness advances throughout the disease, even without further asbestos inhalation. This fact is highlighted in the case of a 67-year-old retired plumber. He was on ramipril to treat his hypertension and developed a persistent dry cough, which his doctor presumed to be an ACE inhibitor induced cough. The ramipril was changed to losartan. The patient had never smoked and did not have a history of asthma or COPD. His cough worsened and he complained of breathlessness on exertion. In view of this history and the fact that he was a non-smoker, he was referred for a chest X-ray and to the local respiratory physician. His doctor was surprised to learn that the patient had asbestosis, diagnosed by a high-resolution CT scan. The patient then began legal proceedings to claim compensation as he had worked in a dockyard 25 years previously, during which time he was exposed to asbestos.","There are two major groups of asbestos fibres, the amphibole and chrysotile fibres. The amphiboles are much more likely to cause cancer of the lining of the lung (mesothelioma) and scarring of the lining of the lung (pleural fibrosis). Either group of fibres can cause disease of the lung, such as asbestosis. The risk of developing asbestos-related lung cancer varies between fibre types. Studies of groups of patients exposed to chrysotile fibres show only a moderate increase in risk. On the other hand, exposure to amphibole fibres or to both types of fibres increases the risk of lung cancer two-fold. Although the Occupational Safety and Health Administration (OSHA) has a standard for workplace exposure to asbestos (0.2 fibres/ millilitre of air), there is debate over what constitutes a safe level of exposure. While some believe asbestos-related disease is a 'threshold phenomenon', which requires a certain level of exposure for disease to occur, others believe there is no safe level of asbestos.","Depending on their shape and size, asbestos fibres deposit in different areas of the lung. Fibres less than 3mm easily move into the lung tissue and the lining surrounding the lung. Long fibres, greater than 5mm cannot be completely broken down by scavenger cells (macrophages) and become lodged in the lung tissue, causing inflammation. Substances damaging to the lungs are then released by cells that are responding to the foreign asbestos material. The persistence of these long fibres in the lung tissue and the resulting inflammation seem to initiate the process of cancer formation. As inflammation and damage to tissue around the asbestos fibres continues, the resulting scarring can extend from the small airways to the larger airways and the tiny air sacs (alveoli) at the end of the airways.","There is no cure for asbestosis. Treatments focus on a patient's ability to breathe. Medications like bronchodilators, aspirin and antibiotics are often prescribed and such treatments as oxygen therapy and postural drainage may be recommended. If symptoms are so severe that medications don't work, surgery may be recommended to remove scar tissue. Patients with asbestosis, like others with chronic lung disease, are at a higher risk of serious infections that take advantage of diseased or scarred lung tissue, so prevention and rapid treatment is vital. Flu and pneumococcal vaccinations are a part of routine care for these patients. Patients with progressive disease may be given corticosteroids and cyclophosphamide with limited improvement.","Chrysotile is the only form of asbestos that is currently in production today. Despite their association with lung cancer, chrysotile products are still used in 60 countries, according to the industry-sponsored Asbestos Institute. Although the asbestos industry proclaims the 'safety' of chrysotile fibres, which are now imbedded in less friable and 'dusty' products, little is known about the long term effects of these products because of the long delay in the development of disease. In spite of their potential health risks, the durability and cheapness of these products continue to attract commercial applications. Asbestosis remains a significant clinical problem even after marked reductions in on the-job exposure to asbestos. Again, this is due to the long period of time between exposure and the onset of disease."]},{"title":"Medication non-compliance","paras":["A US doctor gives his views on a new program","An important component of a patient's history and physical examination is the question of 'medication compliance,' the term used by physicians to designate whether, or not, a patient is taking his or her medications. Many a hospital chart bears the notorious comment 'Patient has a history of non-compliance.' Now, under a new experimental program in Philadelphia, USA, patients are being paid to take their medications. The concept makes sense in theory - failure to comply is one of the most common reasons that patients are readmitted to hospital shortly after being discharged.","Compliant patients take their medications because they want to live as long as possible; some simply do so because they're responsible, conscientious individuals by nature. But the hustle and bustle of daily life and employment often get in the way of taking medications, especially those that are timed inconveniently or in frequent doses, even for such well-intentioned patients. For the elderly and the mentally or physically impaired, US insurance companies will often pay for a daily visit by a nurse, to ensure a patient gets at least one set of the most vital pills. But other patients are left to fend for themselves, and it is not uncommon these days for patients to be taking a considerable number of vital pills daily.","Some patients have not been properly educated about the importance of their medications in layman's terms. They have told me, for instance, that they don't have high blood pressure because they were once prescribed a high blood pressure pill – in essence, they view an antihypertensive as an antibiotic that can be used as short-term treatment for a short-term problem. Others have told me that they never had a heart attack because they were taken to the cardiac catheterization lab and 'fixed.' As physicians we are responsible for making sure patients understand their own medical history and their own medications.","Not uncommonly patients will say, 'I googled it the other day, and there was a long list of side effects.' But a simple conversation with the patient at this juncture can easily change their perspective. As with many things in medicine, it's all about risks versus benefits – that's what we as physicians are trained to analyse. And patients can rest assured that we'll monitor them closely for side effects and address any that are unpleasant, either by treating them or by trying a different medication.","But to return to the program in Philadelphia, my firm belief is that if patients don't have strong enough incentives to take their medications so they can live longer, healthier lives, then the long term benefits of providing a financial incentive are likely to be minimal. At the outset, the rewards may be substantial enough to elicit a response. But one isolated system or patient study is not an accurate depiction of the real-life scenario: patients will have to be taking these medications for decades.","Although a simple financial incentives program has its appeal, its complications abound. What's worse, it seems to be saying to society: as physicians, we tell our patients that not only do we work to care for them, but we'll now pay them to take better care of themselves. And by the way, for all you medication-compliant patients out there, you can have the inherent reward of a longer, healthier life, but we're not going to bother sending you money. This seems like some sort of implied punishment.","But more generally, what advice can be given to doctors with non-compliant patients? Dr John Steiner has written a paper on the matter: 'Be compassionate,' he urges doctors. 'Understand what a complicated balancing act it is for patients.' He's surely right on that score. Doctors and patients need to work together to figure out what is reasonable and realistic, prioritizing which measures are most important. For one patient, taking the diabetes pills might be more crucial than trying to quit smoking. For another, treating depression is more critical than treating cholesterol. 'Improving compliance is a team sport,' Dr Steiner adds. 'Input from nurses, care managers, social workers and pharmacists is critical.'","When discussing the complicated nuances of compliance with my students, I give the example of my grandmother. A thrifty, no-nonsense woman, she routinely sliced all the cholesterol and heart disease pills her doctor prescribed in half, taking only half the dose. If I questioned this, she'd wave me off with, 'What do those doctors know, anyway?' Sadly, she died suddenly, aged 87, most likely of a massive heart attack. Had she taken her medicines at the appropriate doses, she might have survived it. But then maybe she'd have died a more painful death from some other ailment. Her biggest fear had always been ending up dependent in a nursing home, and by luck or design, she was able to avoid that. Perhaps there was some wisdom in her 'non-compliance.'"]}],"B":[{"n":1,"title":"Manual extract: effective cold chain","paras":["The cold chain is the system of transporting and storing vaccines within the temperature range of +2°C to +8°C from the place of manufacture to the point of administration. Maintenance of the cold chain is essential for maintaining vaccine potency and, in turn, vaccine effectiveness.","Purpose-built vaccine refrigerators (PBVR) are the preferred means of storage for vaccines. Domestic refrigerators are not designed for the special temperature needs of vaccine storage.","Despite best practices, cold chain breaches sometimes occur. Do not discard or use any vaccines exposed to temperatures below +2°C or above +8°C without obtaining further advice. Isolate vaccines and contact the state or territory public health bodies for advice on the National Immunisation Program vaccines and the manufacturer for privately purchased vaccines."],"q":"If vaccines have been stored incorrectly,","opts":["this should be reported.","staff should dispose of them securely.","they should be sent back to the supplier."],"key":"A","qja":"ワクチンが不適切に保管されていた場合、","ja":"【マニュアル抜粋：効果的なコールドチェーン】コールドチェーンとは、ワクチンを製造場所から接種の場所まで +2°C〜+8°C の温度範囲で輸送・保管する仕組みである。コールドチェーンを維持することは、ワクチンの力価、ひいてはワクチンの有効性を保つために不可欠である。ワクチンの保管には専用のワクチン冷蔵庫（PBVR）が望ましい。家庭用冷蔵庫はワクチン保管に必要な特別な温度管理を想定して作られていない。最善の手順を守っていても、コールドチェーンの逸脱は時に起こる。+2°C未満または+8°Cを超える温度にさらされたワクチンは、さらなる助言を得ずに廃棄も使用もしてはならない。ワクチンを隔離し、国の予防接種プログラムのワクチンについては州・準州の公衆衛生当局に、自費購入のワクチンについては製造元に連絡して助言を求めること。","o":[["そのことを報告すべきである","✅ Isolate vaccines and contact the state or territory public health bodies … and the manufacturer … for advice＝当局・製造元に連絡する＝報告する、の言い換え。"],["職員は安全に廃棄すべきである","❌ 本文は Do not discard … without obtaining further advice＝『助言なしに廃棄するな』。廃棄は逆の行動。"],["供給元に送り返すべきである","❌ 製造元（manufacturer）には『連絡して助言を求める』だけ。送り返すとはどこにも書いていない。manufacturer＝supplier の連想につられる罠。"]],"exp":"正解の根拠は第3段落の命令文2つ（Do not discard or use … ／ Isolate … and contact …）。B・Cはどちらも本文の語（discard／manufacturer）を借りて、本文と違う行動を作った誤答。","pt":"→ 型：手順・指示の文書では、命令文（Do not ～ / Isolate / contact）が答えになる。選択肢の行動が本文の命令と『同じ行動』かを照合し、語が似ているだけの選択肢は切る。","doubt":null,"voc":[["potency","（薬の）力価・効力"],["purpose-built","専用に作られた"],["breach","逸脱・違反"],["discard","廃棄する"],["isolate","隔離する・分けておく"],["privately purchased","自費で購入した"]],"past":null},{"n":2,"title":"Nurse home visit guidelines","paras":["When the nurse is ready to depart, he/she must advise a minimum of two staff members that he/she is commencing home visits, with one staff member responsible for logging the nurse's movements. More than one person must be made aware of the nurse's movements; failure to do so could result in the breakdown of communication and increased risk to the nurse and/or practice.","On return to the practice, the nurse will immediately advise staff members of his/ her return. This time will be documented on the patient visit list, and then scanned and filed by administration staff. The nurse will then attend to any specimens, cold chain requirements, restocking of the nurse kit and biohazardous waste."],"q":"According to the extract, prior to making a home visit, nurses must","opts":["record the time they leave the practice.","refill their bag with necessary items.","communicate their intentions to others."],"key":"C","qja":"抜粋によると、訪問看護に出る前に看護師がしなければならないのは","ja":"【訪問看護のガイドライン】看護師は出発の準備ができたら、訪問看護を開始することを少なくとも2人の職員に伝えなければならず、そのうち1人が看護師の動きを記録する責任を負う。看護師の動きは複数の人が把握していなければならない。これを怠ると連絡体制が崩れ、看護師や診療所へのリスクが高まるおそれがある。診療所に戻ったら、看護師は直ちに職員に帰着を伝える。この時刻は訪問患者リストに記録され、事務職員がスキャンして保管する。その後、看護師は検体・コールドチェーンの要件・看護バッグの補充・感染性廃棄物の処理に対応する。","o":[["診療所を出る時刻を記録する","❌ 記録するのは『帰着の時刻』で、しかも記録するのは看護師ではない（This time will be documented … by administration staff の流れ）。出発時に動きを記録するのも別の職員（one staff member responsible for logging）。"],["必要な物品をバッグに補充する","❌ restocking of the nurse kit は『戻ってから』の作業（On return … The nurse will then attend to …）。before/after の入れ替え。"],["自分の予定を他の人に伝える","✅ he/she must advise a minimum of two staff members that he/she is commencing home visits＝少なくとも2人に訪問開始を伝える、の言い換え。advise ≒ communicate、intentions ≒ commencing home visits。"]],"exp":"設問の prior to（～の前に）が鍵。本文は『出発時』と『帰着後』の2段落に分かれていて、誤答AとBはどちらも『帰着後』の段落の内容を出発前に置き換えたもの。","pt":"→ 型：設問に時点（prior to / after / on return）があれば、まず本文のどの段落がその時点かを決めてから選択肢を見る。時系列の入れ替えは Part B の定番の誤答。","doubt":null,"voc":[["depart","出発する"],["commence","開始する"],["log","記録する"],["breakdown","崩壊・途絶"],["documented","記録された"],["restocking","補充"],["biohazardous waste","感染性廃棄物"]],"past":null},{"n":3,"title":"Guidelines for dealing with hospital waste","paras":["All biological waste must be carefully stored and disposed of safely. Contaminated materials such as blood bags, dirty dressings and disposable needles are also potentially hazardous and must be treated accordingly. If biological waste and contaminated materials are not disposed of properly, staff and members of the community could be exposed to infectious material and become infected. It is essential for the hospital to have protocols for dealing with biological waste and contaminated materials. All staff must be familiar with them and follow them.","The disposal of biohazardous materials is time-consuming and expensive, so it is important to separate out non-contaminated waste such as paper, packaging and non-sterile materials. Make separate disposal containers available where waste is created so that staff can sort the waste as it is being discarded."],"q":"What is being described in this section of the guidelines?","opts":["changes in procedures","best practice procedures","exceptions to the procedures"],"key":"B","qja":"ガイドラインのこの部分で述べられているのは何か？","ja":"【病院廃棄物の取り扱いガイドライン】すべての生物学的廃棄物は慎重に保管し、安全に廃棄しなければならない。輸血バッグ、汚れた包帯、使い捨ての注射針などの汚染物も潜在的に危険であり、それに応じて扱わなければならない。生物学的廃棄物や汚染物が適切に廃棄されないと、職員や地域の人々が感染性物質にさらされ、感染するおそれがある。病院には生物学的廃棄物と汚染物を扱うための手順書を備えることが不可欠であり、全職員がそれを熟知し、従わなければならない。感染性物質の廃棄は手間も費用もかかるため、紙・包装材・非滅菌物などの汚染されていない廃棄物を分別することが重要である。廃棄物が出る場所に別々の廃棄容器を用意し、捨てる時点で職員が分別できるようにする。","o":[["手順の変更","❌ 『新しく』『今後は』『変更』を示す語が本文に一つもない。"],["望ましい（最善の）実践手順","✅ must be carefully stored／must be treated accordingly／It is essential … ／Make separate disposal containers available＝あるべき標準のやり方を一般論として述べている。"],["手順の例外","❌ except / unless / in some cases のような例外の記述はない。"]],"exp":"文書全体の性格を問う問題。must / essential / it is important to と命令文が並ぶだけで、時期（変更）や条件（例外）の語がない＝標準のやり方の説明。","pt":"→ 型：文書の性格を問われたら、『変更（new / now / from ～）』『例外（except / unless）』の合図語が本文にあるかを先に探す。なければ『標準・推奨のやり方』が答え。","doubt":null,"voc":[["dispose of","廃棄する・処分する"],["contaminated","汚染された"],["potentially hazardous","潜在的に危険な"],["infectious","感染性の"],["protocols","手順書・規定"],["time-consuming","手間のかかる"],["discarded","捨てられる"]],"past":null},{"n":4,"title":"Extract from guidelines: Patient Confidentiality","paras":["Where a patient objects to information being shared with other health professionals involved in their care, you should explain how disclosure would benefit the continuity and quality of care. If their decision has implications for the proposed treatment, it will be necessary to inform the patient of this. Ultimately if they refuse, you must respect their decision, even if it means that for reasons of safety you must limit your treatment options. You should record their decision within their clinical notes.","It may be in the public interest to disclose information received in confidence without consent, for example, information about a serious crime. It is important that confidentiality may only be broken in this way in exceptional circumstances and then only after careful consideration. This means you can justify your actions and point out the possible harm to the patient or other interested parties if you hadn't disclosed the information. Theft, fraud or damage to property would generally not warrant a breach of confidence."],"q":"When is it acceptable for a health professional to pass on confidential information given by a patient?","opts":["if non-disclosure could adversely affect those involved","if the patient's treatment might otherwise be compromised","if the health professional would otherwise be breaking the law"],"key":"A","qja":"患者から打ち明けられた秘密の情報を、医療者が他人に伝えてよいのはどんなときか？","ja":"【ガイドライン抜粋：患者の守秘義務】患者が、自分の治療に関わる他の医療者と情報を共有することに反対する場合は、開示することで治療の継続性と質がどう向上するかを説明すべきである。その判断が予定している治療に影響する場合は、患者にそのことを伝える必要がある。それでも患者が拒否するなら、安全上の理由で治療の選択肢を狭めることになっても、その判断を尊重しなければならない。患者の判断は診療記録に記載する。秘密として受け取った情報を同意なしに開示することが公益にかなう場合もある。たとえば重大な犯罪についての情報である。このように守秘義務を破ってよいのは例外的な状況に限られ、それも慎重に検討したうえでなければならない。つまり、自分の行為を正当化でき、もし開示していなかったら患者や他の関係者にどんな害が及んだかを示せる、ということである。窃盗・詐欺・器物損壊は、一般に守秘義務を破る理由にはならない。","o":[["開示しないことが関係者に悪影響を与えうる場合","✅ point out the possible harm to the patient or other interested parties if you hadn't disclosed the information の言い換え。if you hadn't disclosed＝non-disclosure、harm＝adversely affect、the patient or other interested parties＝those involved。"],["そうしなければ患者の治療が損なわれるかもしれない場合","❌ 第1段落は逆で、治療に影響が出ても患者が拒めば you must respect their decision（判断を尊重する）。治療への影響は開示の理由にならない。"],["そうしなければ医療者が法律違反になる場合","❌ 本文の serious crime（重大な犯罪）から『法律』を連想させる罠。本文は『犯罪についての情報なら開示が公益になりうる』と言うだけで、黙っていると医療者が違法になるとは書いていない。直後の Theft, fraud … would generally not warrant a breach of confidence もこの読みを否定している。"]],"exp":"条件を問う設問（When is it acceptable…?）。答えは第2段落の『例外的な状況に限る』の直後、This means … if you hadn't disclosed the information の文。Cは本文の語（crime）と連想でつながっているだけ。","pt":"→ 型：選択肢の語が本文の語と『連想』でつながっているだけなら切る（crime → law）。条件を問う設問は、本文の if / only / in exceptional circumstances の直後に答えがある。","doubt":null,"voc":[["object to","～に反対する"],["disclosure","開示"],["continuity","継続性"],["implications","影響・波及"],["in confidence","秘密として"],["warrant","正当化する・理由になる"],["breach of confidence","守秘義務違反"]],"past":"C"},{"n":5,"title":"Email from Dental Board of Australia","paras":["Dear Practitioner,","You may be aware of the recent media and public interest in standards of infection control in dental practice. As regulators of the profession, we are concerned that there has been doubt among registered dental practitioners about these essential standards.","Registered dental practitioners must comply with the National Board's Guidelines on infection control. The guidelines list the reference material that you must have access to and comply with, including the National Health and Medical Research Council's (NHMRC) Guidelines for the prevention and control of infection in healthcare.","We believe that most dental practitioners consistently comply with these guidelines and implement appropriate infection control protocols. However, the consequences for non-compliance with appropriate infection control measures will be significant for you and also for your patients and the community."],"q":"The purpose of the email to practitioners about infection control obligations is to","opts":["act as a reminder of their obligations.","respond to a specific query they have raised.","announce a change in regulations affecting them."],"key":"A","qja":"感染管理の義務について開業歯科医に送られたこのメールの目的は","ja":"【オーストラリア歯科委員会からのメール】開業歯科医各位。歯科診療における感染管理の基準について、最近メディアや世間の関心が高まっていることはご存じかもしれません。専門職の規制当局として、私たちは、登録歯科医の間でこれらの重要な基準について疑念（迷い）が生じていることを懸念しています。登録歯科医は、国家委員会の感染管理ガイドラインを遵守しなければなりません。ガイドラインには、参照し遵守しなければならない資料が列挙されており、その中には国立保健医療研究評議会（NHMRC）の『医療における感染予防・管理ガイドライン』も含まれます。私たちは、ほとんどの歯科医が常にこれらのガイドラインを守り、適切な感染管理手順を実施していると信じています。しかし、適切な感染管理措置を守らなかった場合の影響は、皆さんにとっても、患者や地域社会にとっても重大なものとなります。","o":[["義務を改めて思い出させる","✅ must comply with the National Board's Guidelines … と既存の義務を確認し、However, the consequences for non-compliance … will be significant で締めている＝リマインダー。"],["彼らが寄せた個別の質問に答える","❌ 宛先は Dear Practitioner（全員）で、特定の質問への言及はない。きっかけは『メディアの関心』と『疑念』。"],["彼らに関わる規則の変更を告知する","❌ new / change / from（日付）など変更の語がない。ガイドラインは既存のもの（must comply with … guidelines）。"]],"exp":"purpose 問題は最後の文（着地点）と However の後ろで決める。『ほとんどは守っていると信じている。しかし守らなければ重大な結果になる』＝既存の義務の念押し。","pt":"→ 型：purpose は最終文と However / but の後ろで決める。『変更の告知』を選ぶには本文に new / change / from 〇月 の合図が必要。","doubt":null,"voc":[["regulators","規制当局"],["comply with","～を遵守する"],["consistently","一貫して・常に"],["implement","実施する"],["non-compliance","不遵守"],["obligations","義務"]],"past":null},{"n":6,"title":"Memo to staff: Women and Dementia","paras":["Please read this extract from a recent research paper Women's superior verbal skills could work against them when it comes to recognizing Alzheimer's disease. A new study looked at more than 1300 men and women divided into three groups: one group comprised patients with amnestic mild cognitive impairment; the second group included patients with Alzheimer's dementia; and the final group included healthy controls. The researchers measured glucose metabolic rates with PET scans. Participants were then given immediate and delayed verbal recall tests.","Women with either no, mild or moderate problems performed better than men on the verbal memory tests. There was no difference in those with advanced Alzheimer's.","Because verbal memory scores are used for diagnosing Alzheimer's, some women may be further along in their disease before they are diagnosed. This suggests the need to have an increased index of suspicion when evaluating women with memory problems."],"q":"The results of the study described in the memo may explain why","opts":["superior communication skills may protect women from dementia.","female dementia sufferers have better verbal skills.","mild dementia in women can remain undiagnosed."],"key":"C","qja":"このメモで紹介されている研究の結果は、次のどれの理由を説明しうるか？","ja":"【職員向けメモ：女性と認知症】最近の研究論文の抜粋を読んでください。女性の優れた言語能力が、アルツハイマー病を見つけるうえでは不利に働くかもしれない。新しい研究では1300人以上の男女を3群に分けて調べた。1群目は健忘型軽度認知障害の患者、2群目はアルツハイマー型認知症の患者、3群目は健康な対照群である。研究者はPETでブドウ糖の代謝率を測定し、その後、参加者に即時・遅延の言語記憶テストを行った。問題なし・軽度・中等度のいずれの段階でも、女性は言語記憶テストで男性より成績が良かった。進行したアルツハイマー病の人では差がなかった。言語記憶の得点はアルツハイマー病の診断に使われるため、一部の女性は診断される時点で病気がすでに進んでいる可能性がある。このことは、記憶の問題を抱える女性を評価する際には、疑いの度合いを高める必要があることを示している。","o":[["優れたコミュニケーション能力が女性を認知症から守るかもしれない","❌ 本文は『言語能力が高いと診断が遅れる』であって、『発症を防ぐ』という因果は書いていない。"],["認知症の女性は言語能力が高い","❌ 言い過ぎ。進行例では There was no difference in those with advanced Alzheimer's＝差がない。mild / moderate までの話。"],["女性の軽度の認知症は診断されないままになりうる","✅ some women may be further along in their disease before they are diagnosed（診断される前にすでに進んでいる）＝軽い段階では見逃される、の言い換え。"]],"exp":"may explain why（～の理由を説明しうる）は、研究結果から導かれる結論文を探す問題。根拠は Because verbal memory scores are used for diagnosing … の1文。Bは限定（mild/moderate）を外した言い過ぎ。","pt":"→ 型：研究の結論問題は Because … / This suggests … の文が答え。選択肢の主語の範囲（全員か、一部か、どの段階か）を本文の限定語（some / mild / advanced）と照合する。","doubt":null,"voc":[["superior","優れた"],["amnestic","健忘型の"],["cognitive impairment","認知障害"],["metabolic rates","代謝率"],["recall","想起・記憶の呼び出し"],["index of suspicion","疑いの度合い"],["undiagnosed","診断されていない"]],"past":null}],"C":[{"n":7,"t":0,"p":0,"q":"The writer suggests that the potential for harm from asbestos is increased by","opts":["a change in the method of manufacture.","the way it reacts with other substances.","the fact that it is used so extensively.","its presence in recently constructed buildings."],"key":"C","ev":"Because of the widespread use of asbestos, its fibres are ubiquitous in the environment.","note":"Because of the widespread use＝『非常に広く使われている』（C）が害の広がりの原因。Dは1975年以降の建材には含まれないはずと本文が否定。Bは『他の化学物質とほぼ反応しない』と逆。","doubt":null,"alt":[],"voc":[["evaporate","蒸発する"],["tensile strength","引っ張り強度"],["widespread","広範囲の"],["ubiquitous","至る所にある"],["stockpiled","備蓄された"],["crumbling","ぼろぼろに崩れかけた"]],"oja":["製造方法の変化","他の物質との反応の仕方","非常に広範囲に使われているという事実","最近建てられた建物に含まれていること"],"past":null},{"n":8,"t":0,"p":0,"q":"The word 'ubiquitous' in paragraph one suggests that asbestos fibres","opts":["can be found everywhere.","may last for a long time.","have an unchanging nature.","are a natural substance."],"key":"A","ev":"its fibres are ubiquitous in the environment","note":"ubiquitous＝どこにでもある（A）。直前の widespread use から『あちこちにある』とつながる。Bの『長持ちする』は前文の『蒸発・溶解しない』に引かれた誤答。","doubt":null,"alt":[],"voc":[["ubiquitous","至る所にある"],["undergo","（変化などを）受ける"],["naturally occurring","天然に存在する"],["unchanging","変わらない"]],"oja":["どこ
